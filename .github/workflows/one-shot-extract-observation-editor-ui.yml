name: One-shot extract observation editor UI

on:
  push:
    paths:
      - '.github/workflows/one-shot-extract-observation-editor-ui.yml'

permissions:
  contents: write

jobs:
  extract:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Extract observation editor UI and styles
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import json

          index = Path('index.html')
          text = index.read_text(encoding='utf-8')

          required = [
              '<link rel="stylesheet" href="kinder-feedback.css">',
              '<script src="kinder-feedback.js"></script>',
              '<script src="elementary-analysis.js"></script>',
              '<script src="observation-memo-core.js"></script>',
          ]
          missing = [item for item in required if item not in text]
          if missing:
              raise SystemExit('required prior modules missing: ' + ', '.join(missing))

          def extract_block(source, start_marker, end_marker, replacement):
              start = source.find(start_marker)
              if start < 0:
                  raise SystemExit(f'start marker not found: {start_marker}')
              end = source.find(end_marker, start)
              if end < 0:
                  raise SystemExit(f'end marker not found: {end_marker}')
              block = source[start:end]
              return source[:start] + replacement + source[end:], block

          # 1) Static observation/editor DOM -> synchronous external UI template module.
          text, student_memo_html = extract_block(
              text,
              '<!-- PAGE: 초등부 노트 -->',
              '<!-- PAGE: 유치부 관찰노트 -->',
              '<script src="observation-editor-ui.js" data-olli-observation-ui="student-memo"></script>\n'
          )

          text, analysis_modal_html = extract_block(
              text,
              '<!-- PAGE: 실패 성장 페이지 -->',
              '<div class="modalOverlay" id="saveModal">',
              '<script src="observation-editor-ui.js" data-olli-observation-ui="analysis-modal"></script>\n'
          )

          text, analysis_detail_html = extract_block(
              text,
              '<div aria-hidden="true" class="analysisResultSheetOverlay" id="elementaryAnalysisDetailModal"',
              '<div aria-label="학생 피드백 보기" class="attendanceFeedbackSheetOverlay"',
              '<script src="observation-editor-ui.js" data-olli-observation-ui="analysis-detail"></script>\n'
          )

          blocks = {
              'student-memo': student_memo_html,
              'analysis-modal': analysis_modal_html,
              'analysis-detail': analysis_detail_html,
          }
          ui_js = """(function () {\n  'use strict';\n  const script = document.currentScript;\n  if (!script) return;\n  const key = script.dataset.olliObservationUi || '';\n  const blocks = BLOCKS;\n  const html = blocks[key];\n  if (!html) return;\n  const requiredId = {\n    'student-memo': 'studentMemoScreen',\n    'analysis-modal': 'elementaryAnalysisModal',\n    'analysis-detail': 'elementaryAnalysisDetailModal'\n  }[key];\n  if (requiredId && document.getElementById(requiredId)) return;\n  script.insertAdjacentHTML('beforebegin', html);\n})();\n"""
          ui_js = ui_js.replace('BLOCKS', json.dumps(blocks, ensure_ascii=False))
          Path('observation-editor-ui.js').write_text(ui_js, encoding='utf-8')

          # 2) Elementary analysis bottom sheets + summary card CSS.
          style_split_analysis = '</style>\n<link rel="stylesheet" href="elementary-analysis-ui.css">\n<style>\n'
          text, analysis_sheet_css = extract_block(
              text,
              '.analysisSheetOverlay {',
              '\n\n.modalTitle {',
              style_split_analysis
          )

          summary_start = '/* 2026-04-24: 초등부 분석 자동저장 요약 카드 */'
          summary_end = '/* 2026-04-24: 초등부 분석 상세 카드/모달 */'
          text, analysis_summary_css = extract_block(text, summary_start, summary_end, '')
          analysis_css = analysis_sheet_css.rstrip() + '\n\n' + analysis_summary_css.strip() + '\n'
          Path('elementary-analysis-ui.css').write_text(analysis_css, encoding='utf-8')

          # 3) Primary elementary observation editor toolbar / picker / archive CSS.
          style_split_observation = '</style>\n<link rel="stylesheet" href="observation-editor.css">\n<style>\n'
          text, observation_css = extract_block(
              text,
              '/* 학생 메모장 상단: 오른쪽에 [기록실][학생정보] */',
              '/* 2026-04-23 추가 수정: PUSH 버튼 */',
              style_split_observation
          )
          Path('observation-editor.css').write_text(observation_css.strip() + '\n', encoding='utf-8')

          index.write_text(text, encoding='utf-8')
          PY

      - name: Verify extraction
        shell: bash
        run: |
          test -s observation-editor-ui.js
          test -s observation-editor.css
          test -s elementary-analysis-ui.css
          node --check observation-editor-ui.js
          grep -q '<script src="observation-editor-ui.js" data-olli-observation-ui="student-memo"></script>' index.html
          grep -q '<script src="observation-editor-ui.js" data-olli-observation-ui="analysis-modal"></script>' index.html
          grep -q '<script src="observation-editor-ui.js" data-olli-observation-ui="analysis-detail"></script>' index.html
          grep -q '<link rel="stylesheet" href="observation-editor.css">' index.html
          grep -q '<link rel="stylesheet" href="elementary-analysis-ui.css">' index.html
          ! grep -q 'id="studentMemoScreen"' index.html
          ! grep -q 'id="elementaryAnalysisModal"' index.html
          ! grep -q 'id="elementaryAnalysisDetailModal"' index.html
          grep -q 'studentMemoScreen' observation-editor-ui.js
          grep -q 'elementaryAnalysisModal' observation-editor-ui.js
          grep -q 'elementaryAnalysisDetailModal' observation-editor-ui.js
          grep -q '#studentMemoScreen' observation-editor.css
          grep -q '.analysisSheetOverlay' elementary-analysis-ui.css
          grep -q '.elementaryAnalysisSummaryCard' elementary-analysis-ui.css

      - name: Commit extraction
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html observation-editor-ui.js observation-editor.css elementary-analysis-ui.css
          git commit -m 'Extract observation editor UI modules'
          git push
