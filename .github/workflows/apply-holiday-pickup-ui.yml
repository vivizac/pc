name: Apply holiday and pickup UI patch

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/apply-holiday-pickup-ui.yml'
      - '.github/tmp/apply_holiday_pickup_ui.py'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Patch original timetable files
        run: python3 .github/tmp/apply_holiday_pickup_ui.py
      - name: Remove temporary patch files and commit
        run: |
          rm -f .github/tmp/apply_holiday_pickup_ui.py .github/workflows/apply-holiday-pickup-ui.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add pc-timetable.js pc-timetable.css .github/tmp/apply_holiday_pickup_ui.py .github/workflows/apply-holiday-pickup-ui.yml
          git commit -m "픽업 시간 수정·예약과 공휴일 시간표 UI 연동"
          git push origin main
