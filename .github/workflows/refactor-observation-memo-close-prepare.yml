name: Refactor observation memo close prepare

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/refactor-observation-memo-close-prepare.yml'

permissions:
  contents: write

jobs:
  refactor:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Commonize PC observation memo close save preparation
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          common_path = Path('observation-memo-common.js')
          common = common_path.read_text(encoding='utf-8')
          anchor = "function handleMemoPauseAutoSaveBlur(target) {"
          helper = "\n".join([
            "function prepareObservationMemoPageClose() {",
            "  flushMemoAutoSave();",
            "  saveCurrentMemo({ silent: true });",
            "}",
            "",
          ])
          if 'function prepareObservationMemoPageClose()' in common:
            raise SystemExit('close prepare helper already exists unexpectedly')
          if anchor not in common:
            raise SystemExit('common close helper anchor missing')
          common = common.replace(anchor, helper + anchor, 1)
          common_path.write_text(common, encoding='utf-8')

          runtime_path = Path('observation-memo-core.js')
          runtime = runtime_path.read_text(encoding='utf-8')
          old = "\n".join([
            "function closeMemoPage() {",
            "  flushMemoAutoSave();",
            "  saveCurrentMemo({ silent: true });",
          ])
          new = "\n".join([
            "function closeMemoPage() {",
            "  prepareObservationMemoPageClose();",
          ])
          if runtime.count(old) != 1:
            raise SystemExit('PC close save preparation block changed unexpectedly')
          runtime = runtime.replace(old, new, 1)
          if runtime.count('prepareObservationMemoPageClose();') != 1:
            raise SystemExit('PC common close prepare call count invalid')
          if "if (currentMemoType === 'kinder')" not in runtime:
            raise SystemExit('PC kinder save branch missing')
          runtime_path.write_text(runtime, encoding='utf-8')
          PY
          node --check observation-memo-common.js
          node --check observation-memo-core.js
          rm -f .github/workflows/refactor-observation-memo-close-prepare.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add observation-memo-common.js observation-memo-core.js .github/workflows/refactor-observation-memo-close-prepare.yml
          git commit -m 'refactor: PC 관찰노트 닫기 저장 준비 공통화'
          git push
