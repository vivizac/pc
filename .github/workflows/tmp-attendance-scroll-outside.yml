name: Temporary attendance scroll outside
on:
  push:
    branches:
      - fix/pc-attendance-scroll-outside-20260914
jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Patch attendance register layout
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('pc-timetable.css')
          s = p.read_text(encoding='utf-8')
          old_outer = "#recordRoomScreen .olliTtAttendanceRegister{min-height:0;border:1px solid #e4e7eb;border-radius:21px;display:flex;flex:1;flex-direction:column;overflow:hidden;background:#fff;box-shadow:0 7px 20px rgba(27,39,58,.045)}"
          new_outer = "#recordRoomScreen .olliTtAttendanceRegister{min-height:0;display:flex;flex:1;flex-direction:column;overflow:visible;background:transparent}"
          old_scroll_base = "#recordRoomScreen .olliTtAttendanceRegisterScroll{min-height:0;padding:14px;flex:1;overflow:auto}"
          new_scroll_base = "#recordRoomScreen .olliTtAttendanceRegisterScroll{min-height:0;padding:0;flex:1;overflow:auto}"
          old_screen = '''#recordRoomScreen .olliTtAttendanceRegisterScroll {
  border: 1px solid #e4e7eb;
  border-radius: 21px;
  overflow: auto;
  background: #fff;
  box-shadow: 0 7px 20px rgba(27,39,58,.045);
}
#recordRoomScreen .olliTtAttendanceSheet { min-width: 100%; width: 100%; }'''
          new_screen = '''#recordRoomScreen .olliTtAttendanceRegisterScroll {
  min-width: 0;
  padding: 0 10px 10px 0;
  overflow: auto;
  background: transparent;
  box-shadow: none;
  scrollbar-gutter: stable;
  box-sizing: border-box;
}
#recordRoomScreen .olliTtAttendanceSheet {
  width: 100%;
  min-width: 900px;
  border: 1px solid #e4e7eb;
  border-radius: 21px;
  overflow: hidden;
  background: #fff;
  box-shadow: 0 7px 20px rgba(27,39,58,.045);
  box-sizing: border-box;
}'''
          for old, new, label in [
              (old_outer, new_outer, 'attendance outer'),
              (old_scroll_base, new_scroll_base, 'attendance base scroll'),
              (old_screen, new_screen, 'attendance screen scroll')
          ]:
              if old not in s:
                  raise SystemExit(f'expected block not found: {label}')
              s = s.replace(old, new, 1)
          p.write_text(s, encoding='utf-8')
          PY
      - name: Remove temporary workflow and commit source
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/tmp-attendance-scroll-outside.yml
          git add pc-timetable.css
          git commit -m "style: move attendance scroll outside table"
          git push
