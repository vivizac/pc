name: Cleanup PC student schedule source

on:
  push:
    branches:
      - cleanup/student-schedule-source
    paths:
      - .github/workflows/cleanup-pc-student-schedule-source.yml
      - .github/tmp/cleanup_pc_student_schedule.py

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: cleanup/student-schedule-source
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Refactor PC student schedule source
        run: python .github/tmp/cleanup_pc_student_schedule.py
      - name: Validate canonical source
        run: |
          node --check pc-student-info-card-runtime.js
          git diff --check
          ! grep -A2 "const rows = Array.isArray(student && student.__olli_authoritative_enrollments)" pc-student-info-card-runtime.js | grep -q "pairsFromLessonFields"
          grep -q "학생 시간표 편집기가 준비되지 않았습니다" pc-student-info-card-runtime.js
      - name: Commit cleanup and remove temporary files
        run: |
          rm -f .github/workflows/cleanup-pc-student-schedule-source.yml .github/tmp/cleanup_pc_student_schedule.py
          git config user.name "OpenAI"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "PC 학생정보 요일·시간을 시간표 원본으로 단일화"
          git push origin HEAD:cleanup/student-schedule-source
