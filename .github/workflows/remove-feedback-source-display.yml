name: Remove feedback source display
on:
  push:
    paths:
      - '.github/workflows/remove-feedback-source-display.yml'
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Remove original teacher text display
        run: python scripts/remove_feedback_source_display.py
      - name: Commit patched feedback display
        run: |
          if git diff --quiet -- index.html; then
            echo "index.html already patched"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Hide teacher source text below AI feedback"
          git push
