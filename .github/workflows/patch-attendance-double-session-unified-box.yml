name: Patch attendance double-session unified box

on:
  push:
    branches:
      - fix/attendance-double-session-unified-box-20260915
    paths:
      - '.github/workflows/patch-attendance-double-session-unified-box.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply focused attendance split-box CSS patch
        run: python3 .github/tmp/patch_attendance_double_session_unified_box.py
      - name: Validate JavaScript syntax
        run: node --check pc-timetable-attendance-register.js
      - name: Validate intended split-box styles
        run: |
          python3 - <<'PY'
          from pathlib import Path
          js = Path('pc-timetable-attendance-register.js').read_text(encoding='utf-8')
          assert 'attendanceRegisterSessionCell.isSplit .attendanceRegisterCellInner{gap:0;border-radius:5px;overflow:hidden' in js
          assert 'attendanceRegisterSessionCell.isSplit .attendanceRegisterSegment{border-radius:0!important}' in js
          assert 'attendanceRegisterSessionCell.isSplit .attendanceRegisterSegment+.attendanceRegisterSegment{border-left:1px solid rgba(255,255,255,.82)}' in js
          PY
      - name: Clean temporary patch files and commit
        run: |
          rm -f .github/tmp/patch_attendance_double_session_unified_box.py
          rm -f .github/workflows/patch-attendance-double-session-unified-box.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "fix: unify double-session attendance status box"
          git push origin HEAD:${GITHUB_REF_NAME}
