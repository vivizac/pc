name: Source-own authoritative editor once v4

on:
  push:
    branches:
      - refactor/source-owned-no-overrides-20260912
    paths:
      - .github/workflows/source-own-authoritative-editor-once-v4.yml

permissions:
  contents: write

jobs:
  refactor:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refactor/source-owned-no-overrides-20260912
          fetch-depth: 0

      - name: Apply source ownership refactor
        run: python tmp_source_own_authoritative_schedule_editor.py

      - name: Validate deterministic ownership twice
        shell: bash
        run: |
          node --check olli-record-sort-student-ui.js
          node --check pc-student-info-card-runtime.js
          node --check pc-student-class-routing.js
          git diff --check
          python - <<'PY'
          from pathlib import Path
          import re

          canonical=Path('olli-record-sort-student-ui.js').read_text()
          card=Path('pc-student-info-card-runtime.js').read_text()
          routing=Path('pc-student-class-routing.js').read_text()
          memo=Path('olli-record-memo-storage.js').read_text()

          # PASS 1: global ownership count across the repository.
          files=[p for p in Path('.').rglob('*') if p.is_file() and p.suffix in {'.js','.html'} and '.git' not in p.parts]
          names=['olliPrepareStudentAddExtra','olliGetStudentAddExtra','olliPrepareInfoExtra','olliGetInfoExtra','olliGetStudentAddSchedulePairs','olliGetInfoSchedulePairs']
          counts={name:0 for name in names}
          locations={name:[] for name in names}
          for p in files:
            for i,line in enumerate(p.read_text(errors='ignore').splitlines(),1):
              for name in names:
                if re.search(rf'(?:window|global)\.{re.escape(name)}\s*=(?!=)',line):
                  counts[name]+=1
                  locations[name].append(f'{p}:{i}')
          expected={name:1 for name in names}
          print('PASS1 ownership counts:',counts)
          print('PASS1 ownership locations:',locations)
          if counts != expected:
            raise SystemExit(f'ownership mismatch: {counts}')
          for name in ['olliPrepareStudentAddExtra','olliGetStudentAddExtra','olliPrepareInfoExtra','olliGetInfoExtra']:
            if not all(loc.startswith('olli-record-sort-student-ui.js:') for loc in locations[name]):
              raise SystemExit(f'canonical owner mismatch for {name}: {locations[name]}')
          if not all(loc.startswith('pc-student-info-card-runtime.js:') for loc in locations['olliGetStudentAddSchedulePairs'] + locations['olliGetInfoSchedulePairs']):
            raise SystemExit('schedule pair getter owner mismatch')

          # PASS 2: semantic order inside canonical source.
          pa0=canonical.index('window.olliPrepareStudentAddExtra =')
          pa1=canonical.index('window.olliGetStudentAddExtra =',pa0)
          ga1=canonical.index('window.olliPrepareInfoExtra =',pa1)
          pi1=canonical.index('window.olliGetInfoExtra =',ga1)
          gi1=canonical.index("document.addEventListener('DOMContentLoaded'",pi1)
          prepare_add=canonical[pa0:pa1]
          get_add=canonical[pa1:ga1]
          prepare_info=canonical[ga1:pi1]
          get_info=canonical[pi1:gi1]

          prepare_order=[
            prepare_add.index('window.olliStudentScheduleAfterPrepareStudentAdd(targetView)'),
            prepare_add.index('window.olliPcAuthoritativeScheduleAfterPrepareStudentAdd(targetView)'),
            prepare_add.index('window.olliPcClassRoutingAfterPrepareStudentAdd(targetView)')]
          if prepare_order != sorted(prepare_order):
            raise SystemExit(f'new-student prepare hook order mismatch: {prepare_order}')
          add_order=[
            get_add.index('window.olliStudentScheduleAugmentStudentAddExtra(type, result)'),
            get_add.index('window.olliPcAuthoritativeScheduleAugmentStudentAddExtra(type, result)'),
            get_add.index('window.olliPcClassRoutingFinalizeStudentAddExtra(type, result)')]
          if add_order != sorted(add_order):
            raise SystemExit(f'new-student extra hook order mismatch: {add_order}')

          auth_calls=len(re.findall(r'window\.olliPcAuthoritativeScheduleAfterPrepareInfo\(type, student\)',prepare_info))
          timetable_calls=len(re.findall(r'window\.olliTimetableAfterPrepareStudentInfo\(type, student\)',prepare_info))
          if (auth_calls,timetable_calls)!=(2,2):
            raise SystemExit(f'existing prepare hook call mismatch: {(auth_calls,timetable_calls)}')
          for marker in ["if (type === 'kinder')","if (type === 'elementary')"]:
            start=prepare_info.index(marker)
            nxt=prepare_info.find("if (type === '",start+len(marker))
            branch=prepare_info[start:nxt if nxt>=0 else len(prepare_info)]
            positions=[
              branch.index('window.olliStudentScheduleAfterPrepareInfo(type, student)'),
              branch.index('window.olliPcAuthoritativeScheduleAfterPrepareInfo(type, student)'),
              branch.index('window.olliTimetableAfterPrepareStudentInfo(type, student)')]
            if positions != sorted(positions):
              raise SystemExit(f'{marker} prepare order mismatch: {positions}')
          info_order=[
            get_info.index('window.olliStudentScheduleAugmentInfoExtra(type, result)'),
            get_info.index('window.olliPcAuthoritativeScheduleAugmentInfoExtra(type, result)')]
          if info_order != sorted(info_order):
            raise SystemExit(f'existing info augment order mismatch: {info_order}')

          # Wrapper removal checks use assignment regex only; === comparisons are allowed.
          for name in ['olliPrepareStudentAddExtra','olliGetStudentAddExtra','olliPrepareInfoExtra','olliGetInfoExtra']:
            if re.search(rf'global\.{name}\s*=(?!=)',card):
              raise SystemExit(f'authoritative wrapper assignment remains: {name}')
          for name in ['olliPrepareStudentAddExtra','olliGetStudentAddExtra','olliGetStudentAddSchedulePairs']:
            if re.search(rf'global\.{name}\s*=(?!=)',routing):
              raise SystemExit(f'class-routing wrapper assignment remains: {name}')
          for required in ['olliPcAuthoritativeScheduleAfterPrepareStudentAdd','olliPcAuthoritativeScheduleAugmentStudentAddExtra','olliPcAuthoritativeScheduleAfterPrepareInfo','olliPcAuthoritativeScheduleAugmentInfoExtra','olliGetStudentAddSchedulePairs','olliGetInfoSchedulePairs']:
            if required not in card:
              raise SystemExit(f'authoritative hook missing: {required}')
          for required in ['olliPcClassRoutingAfterPrepareStudentAdd','olliPcClassRoutingFinalizeStudentAddExtra','olliPrepareStudentRegistrationRouting','olliCommitStudentRegistrationRouting','olliReleaseStudentRegistrationRouting','olli_schedule_set_student_weekly_schedule']:
            if required not in routing:
              raise SystemExit(f'class-routing behavior missing: {required}')

          # Save-order invariants.
          new_save=memo.index('const savedStudent = await ensureStudentSavedToSupabase(newStudent);')
          routed=memo.index('if (registrationRouting?.handled === true',new_save)
          fallback=memo.index("else if (typeof window.saveOlliStudentScheduleFromInfo === 'function')",routed)
          if not(new_save < routed < fallback):
            raise SystemExit('new-student save order changed')
          existing_save=card.index('const savedStudent = await global.ensureStudentSavedToSupabase(profile);')
          existing_schedule=card.index('await setAuthoritativeSchedule(savedStudent.id, pairs);',existing_save)
          if existing_save >= existing_schedule:
            raise SystemExit('existing-student save order changed')

          # Class routing still wins only through handled routing, not fallback schedule pairs.
          if "return { handled: true, effectiveDate, pairs }" not in routing:
            raise SystemExit('class-routing handled result changed')
          print('PASS2 semantic/save-order checks: passed')
          PY

      - name: Commit and cleanup temporary tooling
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          rm -f tmp_source_own_authoritative_schedule_editor.py
          rm -f .github/workflows/source-own-authoritative-editor-once.yml
          rm -f .github/workflows/source-own-authoritative-editor-once-v4.yml
          git add -A
          git commit -m "refactor: source-own authoritative student schedule editor"
          git push origin HEAD:refactor/source-owned-no-overrides-20260912
