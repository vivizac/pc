name: One-shot split record room core
on:
  push:
    paths:
      - '.github/workflows/one-shot-split-record-room-core.yml'
permissions:
  contents: write
jobs:
  split:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Split record room core
        run: |
          python3 - <<'PY'
          from pathlib import Path

          src = Path('olli-record-room-core.js')
          text = src.read_text(encoding='utf-8')
          lines = text.splitlines(keepends=True)
          if len(lines) != 2810:
              raise SystemExit(f'unexpected olli-record-room-core.js line count: {len(lines)}')

          segments = [
              ('olli-record-list-view.js', 1, 504),
              ('olli-consultation-runtime.js', 505, 1653),
              ('olli-student-info-runtime.js', 1654, 1860),
              ('olli-app-startup.js', 1861, 2054),
              ('olli-feedback-runtime.js', 2055, 2810),
          ]

          rebuilt = ''
          for name, start, end in segments:
              part = ''.join(lines[start-1:end])
              Path(name).write_text(part, encoding='utf-8')
              rebuilt += part
              print(name, start, end, len(part.encode('utf-8')))

          if rebuilt != text:
              raise SystemExit('split content does not reconstruct original file exactly')

          idx_path = Path('index.html')
          idx = idx_path.read_text(encoding='utf-8')
          marker = '<script src="olli-record-room-core.js"></script>'
          if idx.count(marker) != 1:
              raise SystemExit(f'unexpected record-room script count: {idx.count(marker)}')
          replacement = '\n'.join(f'<script src="{name}"></script>' for name, _, _ in segments)
          idx = idx.replace(marker, replacement, 1)
          idx_path.write_text(idx, encoding='utf-8')
          src.unlink()
          PY
      - name: Update module guide
        run: |
          python3 - <<'PY'
          from pathlib import Path

          p = Path('OLLI_PC_MODULES.md')
          doc = p.read_text(encoding='utf-8')

          old_table = '| 기록실·출석·학생 기록 목록 공용 동작 | `olli-record-room-core.js` | 현재 공통 스타일 |'
          new_table = '''| 성향기록부 학생 목록·당일 출석 상태·기록 삭제 | `olli-record-list-view.js` | 현재 공통 스타일 |
          | 상담 기준·상담 진행 상태·학생관리 대시보드·기록 목록 로드 | `olli-consultation-runtime.js` | 현재 공통 스타일 |
          | 초등/유치 학생 정보 모달 열기·저장 | `olli-student-info-runtime.js` | 현재 공통 스타일 |
          | 앱 부팅·초기화·공용 함수 전역 연결 | `olli-app-startup.js` | 현재 공통 스타일 |
          | 장면카드 피드백·입력 방어·내부 피드백 작업 큐 | `olli-feedback-runtime.js` | 현재 공통 스타일 |'''.replace('          ', '')
          if doc.count(old_table) != 1:
              raise SystemExit('record-room table marker mismatch')
          doc = doc.replace(old_table, new_table, 1)

          old_rule = '- 데이터 공통 흐름은 역할에 따라 `olli-data-foundation.js`, `olli-data-feedback.js`, `olli-data-consultation-summary.js`, `olli-data-students.js`, `olli-data-record-list.js`, `olli-data-attendance-feedback.js`, `olli-data-student-operations.js`, `olli-data-ui-utils.js`로 나뉜다. 기록 에디터 공용 동작은 `olli-record-editor-core.js`, 기록실/출석 공용 동작은 `olli-record-room-core.js`에서 수정하며 이 코드를 다시 `index.html`로 복사하지 않는다.'
          new_rule = '- 데이터 공통 흐름은 역할에 따라 `olli-data-foundation.js`, `olli-data-feedback.js`, `olli-data-consultation-summary.js`, `olli-data-students.js`, `olli-data-record-list.js`, `olli-data-attendance-feedback.js`, `olli-data-student-operations.js`, `olli-data-ui-utils.js`로 나뉜다. 기록 에디터 공용 동작은 `olli-record-editor-core.js`, 기록실 런타임은 `olli-record-list-view.js`, `olli-consultation-runtime.js`, `olli-student-info-runtime.js`, `olli-app-startup.js`, `olli-feedback-runtime.js`에서 수정하며 이 코드를 다시 `index.html`로 복사하지 않는다.'
          if doc.count(old_rule) != 1:
              raise SystemExit('record-room rule marker mismatch')
          doc = doc.replace(old_rule, new_rule, 1)

          heading = '## 관찰기록·피드백 모듈 경계'
          section = '''## 기록실 런타임 모듈 경계

          - `olli-record-list-view.js`: 성향기록부의 초등/유치 학생 목록 렌더링, 당일 출석/보강 표시, 기록 목록 선택과 삭제 흐름.
          - `olli-consultation-runtime.js`: 상담 기준, 공통 설정 동기화, 상담 진행 상태, 상담예정 계산, 학생관리 대시보드와 `loadRecords` 흐름.
          - `olli-student-info-runtime.js`: 초등/유치 학생 정보 모달의 열기, 입력 동기화, 저장과 목록 갱신.
          - `olli-app-startup.js`: 부팅 화면, 로그인/학원 접근 확인, 초기 학생 동기화, DOMContentLoaded 초기화와 공용 함수의 `window` 연결.
          - `olli-feedback-runtime.js`: 장면카드 선택/메모 상호작용, 1분 피드백 초기화, 입력값 방어, 내부 피드백 작업 큐와 AI 요청 연결.

          이 5개 파일은 이전 기록실 통합 파일의 기능 경계를 따라 분리했다. 특히 `olli-app-startup.js`는 DOMContentLoaded에서 뒤쪽 런타임 함수를 연결하므로 현재 로드 위치와 순서를 유지하고 `defer`로 바꾸지 않는다. `olli-feedback-runtime.js` 안의 장면카드 입력 방어와 작업 큐는 같은 파일에 유지해 기존 함수 호이스팅 동작을 보존한다.

          '''.replace('          ', '')
          if doc.count(heading) != 1:
              raise SystemExit('observation heading marker mismatch')
          doc = doc.replace(heading, section + heading, 1)

          old_load_intro = '공통 코어는 `index.html`에서 원래 실행되던 위치를 그대로 유지한다. 데이터 모듈 묶음, `olli-record-editor-core.js`, `olli-record-room-core.js`, 설정 모듈 묶음, `olli-auth-core.js`, `olli-storage-core.js`를 임의로 문서 맨 아래로 이동하거나 `defer` 처리하지 않는다.'
          new_load_intro = '공통 코어는 `index.html`에서 원래 실행되던 위치를 그대로 유지한다. 데이터 모듈 묶음, `olli-record-editor-core.js`, 기록실 런타임 모듈 묶음, 설정 모듈 묶음, `olli-auth-core.js`, `olli-storage-core.js`를 임의로 문서 맨 아래로 이동하거나 `defer` 처리하지 않는다.'
          if doc.count(old_load_intro) != 1:
              raise SystemExit('load intro marker mismatch')
          doc = doc.replace(old_load_intro, new_load_intro, 1)

          old_order = '이 순서 뒤에 `elementary-analysis.js`, `olli-record-editor-core.js`, `observation-memo-core.js`, `olli-record-room-core.js`가 이어진다. 데이터 모듈은 기존 한 파일의 실행 순서를 보존한 것이므로 중간 순서를 바꾸지 않는다.'
          new_order = '이 순서 뒤에 `elementary-analysis.js`, `olli-record-editor-core.js`, `observation-memo-core.js`, `olli-record-list-view.js`, `olli-consultation-runtime.js`, `olli-student-info-runtime.js`, `olli-app-startup.js`, `olli-feedback-runtime.js`가 이어진다. 데이터 모듈과 기록실 런타임 모듈은 기존 실행 순서를 보존한 것이므로 중간 순서를 바꾸지 않는다.'
          if doc.count(old_order) != 1:
              raise SystemExit('load order marker mismatch')
          doc = doc.replace(old_order, new_order, 1)

          old_check = '- 기록실·출석 공용 동작은 `olli-record-room-core.js`, 기록 편집/학생 선택 공용 동작은 `olli-record-editor-core.js`에서 먼저 확인한다.'
          new_check = '- 기록실은 학생 목록/출석/삭제=`olli-record-list-view.js`, 상담 기준/진행/목록 로드=`olli-consultation-runtime.js`, 학생 정보 모달=`olli-student-info-runtime.js`, 앱 초기화=`olli-app-startup.js`, 장면카드/피드백 큐=`olli-feedback-runtime.js`에서 먼저 확인한다. 기록 편집/학생 선택 공용 동작은 `olli-record-editor-core.js`에서 확인한다.'
          if doc.count(old_check) != 1:
              raise SystemExit('precheck marker mismatch')
          doc = doc.replace(old_check, new_check, 1)

          if 'olli-record-room-core.js' in doc:
              raise SystemExit('stale olli-record-room-core.js reference remains in guide')
          p.write_text(doc, encoding='utf-8')
          PY
      - name: Verify split and syntax
        run: |
          set -e
          files=(
            olli-record-list-view.js
            olli-consultation-runtime.js
            olli-student-info-runtime.js
            olli-app-startup.js
            olli-feedback-runtime.js
          )
          for f in "${files[@]}"; do node --check "$f"; done
          test ! -f olli-record-room-core.js
          python3 - <<'PY'
          from pathlib import Path
          idx = Path('index.html').read_text(encoding='utf-8')
          expected = [
              'olli-record-list-view.js',
              'olli-consultation-runtime.js',
              'olli-student-info-runtime.js',
              'olli-app-startup.js',
              'olli-feedback-runtime.js',
          ]
          positions = []
          for name in expected:
              marker = f'<script src="{name}"></script>'
              if idx.count(marker) != 1:
                  raise SystemExit(f'bad script count for {name}: {idx.count(marker)}')
              positions.append(idx.index(marker))
          if positions != sorted(positions):
              raise SystemExit('record-room module load order changed')
          if 'olli-record-room-core.js' in idx:
              raise SystemExit('old record-room reference remains in index')
          doc = Path('OLLI_PC_MODULES.md').read_text(encoding='utf-8')
          if 'olli-record-room-core.js' in doc:
              raise SystemExit('old record-room reference remains in guide')
          print('INDEX_BYTES', len(idx.encode('utf-8')))
          for name in expected:
              print(name, Path(name).stat().st_size)
          PY
      - name: Commit split modules
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/audit-record-room-core.yml .github/workflows/one-shot-split-record-room-core.yml
          git add index.html OLLI_PC_MODULES.md olli-record-*.js olli-consultation-runtime.js olli-student-info-runtime.js olli-app-startup.js olli-feedback-runtime.js
          git commit -m 'Split record room core into runtime modules'
          git push