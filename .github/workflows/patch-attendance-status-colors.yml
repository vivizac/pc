name: Patch attendance status colors

on:
  push:
    branches:
      - chore/attendance-status-colors-20260915
    paths:
      - '.github/workflows/patch-attendance-status-colors.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply focused UI patch
        run: python3 .github/tmp/patch_attendance_status_colors.py
      - name: Validate JavaScript
        run: node --check pc-timetable-attendance-register.js
      - name: Verify intended UI changes
        run: |
          grep -F 'attendanceLinkedMark{color:#249e58;background:#dcf4e5!important' pc-timetable-attendance-register.js
          grep -F 'attendanceAbsentMark{color:#d9464d;background:#fbe0e4!important' pc-timetable-attendance-register.js
          grep -F 'attendanceMakeupMark{color:#8b5e00;background:#ffefb8!important' pc-timetable-attendance-register.js
          grep -F 'attendanceLinkedMark span{font-size:16px;font-weight:700}' pc-timetable-attendance-register.js
          grep -F 'attendanceBlankMark span{font-weight:650}' pc-timetable-attendance-register.js
          ! grep -F 'background:#e7f7ed!important' pc-timetable-attendance-register.js
          ! grep -F 'background:#fdebed!important' pc-timetable-attendance-register.js
          ! grep -F 'background:#fff6cf!important' pc-timetable-attendance-register.js
      - name: Clean temporary patch files and commit
        run: |
          rm -f .github/tmp/patch_attendance_status_colors.py
          rm -f .github/workflows/patch-attendance-status-colors.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "style: refine PC attendance status colors"
          git push origin HEAD:${GITHUB_REF_NAME}
