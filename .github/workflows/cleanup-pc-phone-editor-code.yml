name: Cleanup PC phone editor code
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/cleanup-pc-phone-editor-code.yml'
permissions:
  contents: write
jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Remove phone editor leftovers and harden PC editor switching
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          editor_path = Path('pc-record-editor.js')
          editor = editor_path.read_text(encoding='utf-8')
          old_input = """    const input = state.division === 'kinder'\n      ? document.getElementById('pcKinderFeedbackInput')\n      : document.getElementById('memoEditor');"""
          new_input = """    const inputSelector = state.division === 'kinder' ? '#pcKinderFeedbackInput' : '#memoEditor';\n    const input = state.host?.querySelector(inputSelector) || document.querySelector(inputSelector);"""
          if old_input not in editor:
              raise SystemExit('saveDraftNow input block not found')
          editor = editor.replace(old_input, new_input, 1)

          old_mount = """  async function mount(host, student) {\n    if (!host || !student) return false;\n    if (sameStudent(student) && state.host === host && host.firstElementChild) return true;\n    await unmount({ save: true });"""
          new_mount = """  async function mount(host, student) {\n    if (!host || !student) return false;\n    if (sameStudent(student) && state.host === host && host.firstElementChild) return true;\n    unmount({ save: true });"""
          if old_mount not in editor:
              raise SystemExit('mount unmount block not found')
          editor = editor.replace(old_mount, new_mount, 1)

          old_kinder_after_load = """      await loadKinderDraft(state.student, token);\n      renderKinderQueue(false);"""
          new_kinder_after_load = """      await loadKinderDraft(state.student, token);\n      if (token !== state.sessionToken || !state.student || clean(state.student.id) !== clean(student.id)) return false;\n      renderKinderQueue(false);"""
          if old_kinder_after_load not in editor:
              raise SystemExit('kinder load block not found')
          editor = editor.replace(old_kinder_after_load, new_kinder_after_load, 1)

          start = editor.find('  async function unmount(options = {}) {')
          end = editor.find('\n\n  function getSelectedKinderStudent()', start)
          if start < 0 or end < 0:
              raise SystemExit('unmount block not found')
          unmount = """  function unmount(options = {}) {\n    const shouldSave = options.save !== false;\n    const previousHost = state.host;\n    const previousStudent = state.student;\n    const previousDivision = state.division;\n    const inputSelector = previousDivision === 'kinder' ? '#pcKinderFeedbackInput' : '#memoEditor';\n    const previousInput = previousHost?.querySelector(inputSelector);\n    const capturedText = previousInput ? String(previousInput.value || '') : '';\n    const noteType = previousDivision === 'kinder' ? 'kinder_risk' : 'elementary_observation';\n\n    clearSaveTimer();\n    clearQueueTimer();\n    if (previousHost) {\n      previousHost.innerHTML = '';\n      delete previousHost.dataset.pcRecordDivision;\n      delete previousHost.dataset.pcRecordStudentId;\n    }\n    state.host = null;\n    state.student = null;\n    state.division = '';\n    state.activeKeyword = '';\n    state.sessionToken += 1;\n\n    if (shouldSave && previousStudent && typeof global.persistObservationMemoDraft === 'function') {\n      Promise.resolve(global.persistObservationMemoDraft(previousStudent, capturedText, { noteType }))\n        .catch((error) => console.warn('PC 기록 초안 종료 저장 실패:', error && (error.message || error)));\n    }\n    return true;\n  }"""
          editor = editor[:start] + unmount + editor[end:]
          editor_path.write_text(editor, encoding='utf-8')

          css_path = Path('pc-record-editor.css')
          css = css_path.read_text(encoding='utf-8')
          css = css.replace('.pcKinderQueue:not(.show){display:block;}\n', '')
          css_path.write_text(css, encoding='utf-8')

          ui_path = Path('observation-editor-ui.js')
          ui = ui_path.read_text(encoding='utf-8')
          block_start = ui.find('  const blocks = {"student-memo":')
          analysis_marker = ', "analysis-modal":'
          analysis_pos = ui.find(analysis_marker, block_start)
          if block_start < 0 or analysis_pos < 0:
              raise SystemExit('student-memo UI block not found')
          ui = ui[:block_start] + '  const blocks = {"analysis-modal":' + ui[analysis_pos + len(analysis_marker):]
          ui = ui.replace("    'student-memo': 'studentMemoScreen',\n", '')
          if 'studentMemoScreen' in ui or '"student-memo"' in ui:
              raise SystemExit('student memo phone DOM remains in observation-editor-ui.js')
          ui_path.write_text(ui, encoding='utf-8')

          html_path = Path('index.html')
          html = html_path.read_text(encoding='utf-8')
          remove_ids = [
              ('script', 'vivizac-ipad-student-memo-controls-fix-js'),
              ('style', 'kcfElementaryRosterAndComposerFixStyle'),
              ('script', 'kcfElementaryRosterAndComposerFixScript'),
              ('script', 'kcfGuideAndInputRestoreScript'),
              ('script', 'kcfStudentRosterSortPersistPatch'),
              ('style', 'kcfRosterFeedbackDotAndSortPatchStyle'),
              ('script', 'kcfRosterFeedbackDotAndSortPatchScript'),
              ('style', 'olliStudentPickerDividerDotsTransparentFixStyle')
          ]
          for tag, ident in remove_ids:
              pattern = re.compile(rf'<{tag}\s+id="{re.escape(ident)}"[^>]*>.*?</{tag}>\s*', re.S)
              html, count = pattern.subn('', html, count=1)
              if count != 1:
                  raise SystemExit(f'legacy block not found: {ident}')
          html_path.write_text(html, encoding='utf-8')

          modules_path = Path('OLLI_PC_MODULES.md')
          modules = modules_path.read_text(encoding='utf-8')
          modules = modules.replace('| 유치부 1분 피드백 공용 UI·기능 | `kinder-feedback-ui.js`, `kinder-feedback.js` | `kinder-feedback.css` |\n', '')
          note = '- PC 저장소에서는 과거 Phone 전용 `kinder-feedback-ui.js`, `kinder-feedback.js`, `kinder-feedback.css`를 보관하지 않는다. 유치부 작성 화면은 `pc-record-editor.js`가 담당한다.\n'
          anchor = '- PC 성향기록부의 작성 화면은 `pc-record-editor.js`가 PC 전용 DOM으로 렌더링한다. 초등 `studentMemoScreen`과 유치부 `kinderChatFeedbackScreen` 같은 Phone 화면 DOM은 PC 카드에 이동하거나 재사용하지 않는다.\n'
          if note not in modules:
              if anchor not in modules:
                  raise SystemExit('module documentation anchor not found')
              modules = modules.replace(anchor, anchor + note, 1)
          modules_path.write_text(modules, encoding='utf-8')

          for dead in ['kinder-feedback-ui.js', 'kinder-feedback.js', 'kinder-feedback.css']:
              path = Path(dead)
              if not path.exists():
                  raise SystemExit(f'expected phone UI file missing before cleanup: {dead}')
              path.unlink()

          index_after = html_path.read_text(encoding='utf-8')
          for dead in ['kinder-feedback-ui.js', 'kinder-feedback.js', 'kinder-feedback.css']:
              if dead in index_after:
                  raise SystemExit(f'deleted phone UI file still referenced: {dead}')
          print('PC_PHONE_EDITOR_CLEANUP_OK')
          PY

          node --check pc-record-editor.js
          node --check pc-attendance.js
          node --check observation-editor-ui.js
          git diff --check
      - name: Commit cleanup and remove temporary workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          rm -f .github/workflows/cleanup-pc-phone-editor-code.yml
          git add -A
          if ! git diff --cached --quiet; then
            git commit -m "PC 기록 화면의 Phone UI 잔여 코드를 제거"
            git push
          fi
