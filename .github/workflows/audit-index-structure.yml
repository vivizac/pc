name: Audit index structure
on:
  push:
    paths:
      - '.github/workflows/audit-index-structure.yml'
permissions:
  contents: write
jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build audit report
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re, collections

          text=Path('index.html').read_text(encoding='utf-8')
          out=[]
          def emit(s=''): out.append(str(s))
          def line_of(pos): return text.count('\n',0,pos)+1
          def attr(attrs,name):
              m=re.search(rf'\b{name}\s*=\s*["\']([^"\']+)["\']',attrs,re.I)
              return m.group(1) if m else ''

          domains={
            'settings':re.compile(r'settings|Setting|설정'),
            'student':re.compile(r'student|Student|학생'),
            'record':re.compile(r'record|Record|기록'),
            'attendance':re.compile(r'attendance|Attendance|출석'),
            'timetable':re.compile(r'timetable|schedule|Schedule|시간표'),
            'feedback':re.compile(r'feedback|Feedback|피드백'),
            'consultation':re.compile(r'consult|Consult|상담'),
            'auth':re.compile(r'login|logout|account|session|role|teacher|owner|로그인|계정|권한'),
            'storage':re.compile(r'supabase|storage|Storage|cache|backup|저장|백업'),
            'ui':re.compile(r'modal|sheet|overlay|screen|toast|drawer|popup|dialog',re.I),
          }

          emit('# Temporary index.html structure audit')
          emit(f'bytes: {len(text.encode("utf-8"))}')
          emit(f'lines: {text.count(chr(10))+1}')

          emit('\n## Largest inline scripts')
          scripts=[]; function_locations=collections.defaultdict(list)
          pat=re.compile(r'<script\b([^>]*)>([\s\S]*?)</script\s*>',re.I)
          for i,m in enumerate(pat.finditer(text),1):
              attrs,body=m.group(1),m.group(2)
              if re.search(r'\bsrc\s*=',attrs,re.I): continue
              sid=attr(attrs,'id') or f'inline-{i}'
              funcs=re.findall(r'\b(?:async\s+)?function\s+([A-Za-z_$][\w$]*)\s*\(',body)
              start=line_of(m.start())
              for fn in funcs:function_locations[fn].append(start)
              counts={k:len(rx.findall(body)) for k,rx in domains.items()}
              scripts.append((len(body),body.count('\n')+1,start,sid,funcs,counts))
          for chars,nlines,start,sid,funcs,counts in sorted(scripts,reverse=True)[:30]:
              hot=', '.join(f'{k}:{v}' for k,v in sorted(counts.items(),key=lambda x:x[1],reverse=True)[:5])
              emit(f'- line {start} | `{sid}` | {chars} chars / {nlines} lines | {hot} | funcs: {", ".join(funcs[:18])}')

          emit('\n## Largest inline styles')
          styles=[]
          pat2=re.compile(r'<style\b([^>]*)>([\s\S]*?)</style\s*>',re.I)
          for i,m in enumerate(pat2.finditer(text),1):
              attrs,body=m.group(1),m.group(2)
              sid=attr(attrs,'id') or f'style-{i}'
              start=line_of(m.start())
              counts={k:len(rx.findall(body)) for k,rx in domains.items()}
              styles.append((len(body),body.count('\n')+1,start,sid,counts))
          for chars,nlines,start,sid,counts in sorted(styles,reverse=True)[:30]:
              hot=', '.join(f'{k}:{v}' for k,v in sorted(counts.items(),key=lambda x:x[1],reverse=True)[:5])
              emit(f'- line {start} | `{sid}` | {chars} chars / {nlines} lines | {hot}')

          emit('\n## Duplicate named functions')
          dups=[(fn,locs) for fn,locs in function_locations.items() if len(locs)>1]
          for fn,locs in sorted(dups,key=lambda x:(-len(x[1]),x[0]))[:120]: emit(f'- `{fn}`: {locs}')
          emit(f'- total duplicate function names: {len(dups)}')

          emit('\n## Screen-like DOM ids')
          seen=set()
          for m in re.finditer(r'\bid\s*=\s*["\']([^"\']*(?:Screen|Page|Modal|Overlay|Sheet)[^"\']*)["\']',text,re.I):
              ident=m.group(1)
              if ident in seen:continue
              seen.add(ident); emit(f'- line {line_of(m.start())}: `{ident}`')
          emit(f'- total: {len(seen)}')

          emit('\n## External JS load order')
          for m in re.finditer(r'<script\b[^>]*\bsrc=["\']([^"\']+)["\'][^>]*>',text,re.I): emit(f'- line {line_of(m.start())}: `{m.group(1)}`')
          emit('\n## External CSS load order')
          for m in re.finditer(r'<link\b[^>]*\bhref=["\']([^"\']+\.css(?:\?[^"\']*)?)["\'][^>]*>',text,re.I): emit(f'- line {line_of(m.start())}: `{m.group(1)}`')

          Path('INDEX_AUDIT_TMP.md').write_text('\n'.join(out)+'\n',encoding='utf-8')
          PY
      - name: Commit report
        shell: bash
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add INDEX_AUDIT_TMP.md
          git commit -m 'Add temporary index audit report'
          git push
