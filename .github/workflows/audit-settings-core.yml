name: Audit settings core
on:
  push:
    paths:
      - '.github/workflows/audit-settings-core.yml'
jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Analyze settings core
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          p=Path('olli-settings-core.js')
          t=p.read_text(encoding='utf-8')
          lines=t.splitlines()
          print('BYTES',len(t.encode()))
          print('LINES',len(lines))
          print('\n=== COMMENTS ===')
          for i,line in enumerate(lines,1):
            s=line.strip()
            if s.startswith('/*') or s.startswith('//'):
              if any(k in s.lower() for k in ['설정','권한','학원','백업','내보내기','알림','선생','관리자','계정','role','backup','export','academy','teacher','permission','notification']):
                print(i,s[:180])
          print('\n=== TOP LEVEL FUNCTIONS/CONSTS ===')
          for i,line in enumerate(lines,1):
            s=line.strip()
            m=re.match(r'(?:async\s+)?function\s+([A-Za-z_$][\w$]*)\s*\(',s)
            if m: print(f'{i}: function {m.group(1)}')
            m=re.match(r'(?:const|let|var)\s+([A-Za-z_$][\w$]*)\s*=\s*(?:async\s*)?\(',s)
            if m: print(f'{i}: varfn {m.group(1)}')
          print('\n=== WINDOW EXPORTS ===')
          for i,line in enumerate(lines,1):
            if 'window.' in line and '=' in line:
              print(i,line.strip()[:180])
          PY
