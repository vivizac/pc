name: Validate trial update Agent

on:
  pull_request:
    paths:
      - 'apps/mobile/api/_lib/olli-agent/trial-guest-privacy.cjs'
      - 'apps/mobile/api/_lib/olli-agent/tools/trial-update-prepare-tools.cjs'
      - 'apps/mobile/api/_lib/olli-agent/runtime.cjs'
      - 'apps/mobile/api/olli-agent.js'
      - 'apps/mobile/tests/olli-agent-trial-update-prepare-tool.test.cjs'
      - 'apps/mobile/tests/olli-agent-trial-update-production-contract.test.cjs'
      - '.github/workflows/validate-trial-update-agent.yml'

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Check trial Agent syntax
        run: |
          node --check apps/mobile/api/_lib/olli-agent/trial-guest-privacy.cjs
          node --check apps/mobile/api/_lib/olli-agent/tools/trial-update-prepare-tools.cjs
          node --check apps/mobile/api/_lib/olli-agent/runtime.cjs
      - name: Run trial update contracts
        working-directory: apps/mobile
        run: |
          node --test tests/olli-agent-trial-update-prepare-tool.test.cjs
          node --test tests/olli-agent-trial-update-production-contract.test.cjs
