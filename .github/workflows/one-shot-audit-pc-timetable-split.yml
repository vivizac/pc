name: Audit PC timetable module boundaries

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/one-shot-audit-pc-timetable-split.yml'

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Print timetable function map
        shell: bash
        run: |
          set -e
          echo '=== FILE ==='
          wc -lc pc-timetable.js
          echo '=== FUNCTIONS ==='
          grep -nE '^  (async )?function [A-Za-z0-9_]+' pc-timetable.js || true
          echo '=== KEY MARKERS ==='
          grep -nE 'function (monthLabel|shiftAttendanceMonth|loadAttendanceRegister|renderAttendanceRegister|renderTimetable|renderWorkspaceHeader|renderSidebar|openMove|historyActionLabel|historyPoint|historyDialogHtml|openHistory|renderDialog|bindDialog|saveDialog|onTimetableClick|studentInfoPanelHtml|install)\b' pc-timetable.js || true
          echo '=== INDEX LOAD ==='
          grep -n -B4 -A4 'pc-timetable.js' index.html || true
