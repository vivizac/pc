name: Patch iPad sticky restore rounded
on:
  push:
    branches:
      - fix/ipad-sticky-restore-rounded-20260915
jobs:
  patch:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/ipad-sticky-restore-rounded-20260915
      - name: Apply focused iPad sticky fix
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('pc-timetable.css')
          s = p.read_text()
          old = '''  #recordRoomScreen .olliTtAttendanceSheet {\n    width: 1600px !important;\n    min-width: 1600px !important;\n    max-width: none !important;\n    overflow: hidden;\n  }'''
          new = '''  #recordRoomScreen .olliTtAttendanceSheet {\n    width: 1600px !important;\n    min-width: 1600px !important;\n    max-width: none !important;\n    overflow: visible;\n  }'''
          if old not in s:
              raise SystemExit('target iPad attendance sheet block not found')
          s = s.replace(old, new, 1)
          marker = '''  #recordRoomScreen .olliTtAttendanceTable col.personalityCol { width: 56px !important; }\n'''
          insert = '''  #recordRoomScreen .olliTtAttendanceTable col.personalityCol { width: 56px !important; }\n  #recordRoomScreen .olliTtAttendanceTable thead tr:first-child > th:first-child { border-top-left-radius: 20px; }\n  #recordRoomScreen .olliTtAttendanceTable thead tr:first-child > th:last-child { border-top-right-radius: 20px; }\n  #recordRoomScreen .olliTtAttendanceTable tbody tr.attendanceTableFooterRow > td { border-bottom-left-radius: 20px; border-bottom-right-radius: 20px; }\n'''
          if marker not in s:
              raise SystemExit('target col marker not found')
          s = s.replace(marker, insert, 1)
          p.write_text(s)
          PY
      - name: Validate intended CSS
        run: |
          grep -F 'overflow: visible;' pc-timetable.css
          grep -F 'border-top-left-radius: 20px' pc-timetable.css
          grep -F 'border-top-right-radius: 20px' pc-timetable.css
          grep -F 'border-bottom-left-radius: 20px' pc-timetable.css
          grep -F 'position: sticky !important' pc-timetable.css
          git diff --check
      - name: Clean temporary workflow and commit
        run: |
          rm .github/workflows/patch-ipad-sticky-restore-rounded.yml
          git config user.name 'vivizac'
          git config user.email 'ipro721@gmail.com'
          git add pc-timetable.css .github/workflows/patch-ipad-sticky-restore-rounded.yml
          git commit -m 'fix: restore iPad attendance sticky columns with rounded corners'
          git push origin HEAD:fix/ipad-sticky-restore-rounded-20260915
