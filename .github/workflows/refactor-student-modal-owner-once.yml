name: refactor-student-modal-owner-once

on:
  push:
    branches:
      - refactor/source-owned-no-overrides-20260912

permissions:
  contents: write

jobs:
  refactor:
    if: ${{ github.actor != 'github-actions[bot]' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Move modal wrapper behavior into source owners
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import re

          def one(path, old, new, label):
              p = Path(path)
              text = p.read_text(encoding='utf-8')
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'{label} count={count}')
              p.write_text(text.replace(old, new, 1), encoding='utf-8')

          one(
              'olli-record-memo-storage.js',
              "  if (typeof window.olliPrepareStudentAddExtra === 'function') window.olliPrepareStudentAddExtra(targetView);\n\n  setTimeout(() => nameInput.focus(), 50);\n",
              "  if (typeof window.olliPrepareStudentAddExtra === 'function') window.olliPrepareStudentAddExtra(targetView);\n  if (typeof window.pcSyncStudentAddDivisionTabs === 'function') {\n    setTimeout(() => window.pcSyncStudentAddDivisionTabs(targetView), 0);\n  }\n  if (typeof window.olliTuneStudentModalGuideText === 'function') {\n    setTimeout(window.olliTuneStudentModalGuideText, 0);\n  }\n\n  setTimeout(() => nameInput.focus(), 50);\n",
              'openStudentModal source hooks'
          )

          one(
              'olli-record-sort-student-ui.js',
              "    }\n  }\n\n  window.olliPatchStudentModalMarkup = patchStudentModalMarkup;\n",
              "    }\n    if (typeof window.olliTuneStudentModalGuideText === 'function') window.olliTuneStudentModalGuideText();\n  }\n\n  window.olliPatchStudentModalMarkup = patchStudentModalMarkup;\n",
              'patchStudentModalMarkup guide hook'
          )

          shell = Path('pc-shell.js')
          text = shell.read_text(encoding='utf-8')
          old = """  function installStudentAddDivisionTabs() {\n    const original = global.openStudentModal;\n    if (typeof original === 'function' && !original.__olliPcStudentAddTabsWrapped) {\n      const wrapped = function(...args) {\n        const result = original.apply(this, args);\n        setTimeout(() => syncStudentAddDivisionTabs(getStudentAddDivision()), 0);\n        return result;\n      };\n      wrapped.__olliPcStudentAddTabsWrapped = true;\n      global.openStudentModal = wrapped;\n    }\n    global.pcSetStudentAddDivision = setStudentAddDivision;\n    setTimeout(() => syncStudentAddDivisionTabs(getStudentAddDivision()), 0);\n  }\n"""
          new = """  function installStudentAddDivisionTabs() {\n    global.pcSetStudentAddDivision = setStudentAddDivision;\n    global.pcSyncStudentAddDivisionTabs = syncStudentAddDivisionTabs;\n    setTimeout(() => syncStudentAddDivisionTabs(getStudentAddDivision()), 0);\n  }\n"""
          if text.count(old) != 1:
              raise SystemExit(f'pc-shell modal wrapper count={text.count(old)}')
          shell.write_text(text.replace(old, new, 1), encoding='utf-8')

          index = Path('index.html')
          text = index.read_text(encoding='utf-8')
          guide_end = """    agePlaceholders.forEach(function(id){\n      var input = document.getElementById(id);\n      if (input) input.setAttribute('placeholder', '예: 5(나이)');\n    });\n  }\n\n"""
          guide_export = guide_end + "  window.olliTuneStudentModalGuideText = tuneStudentModalGuideText;\n\n"
          if text.count(guide_end) != 1:
              raise SystemExit(f'guide export anchor count={text.count(guide_end)}')
          text = text.replace(guide_end, guide_export, 1)
          wrappers = re.compile(r"  var previousPatchStudentModalMarkup = window\.olliPatchStudentModalMarkup;.*?  }\n\n  window\.openKinderChatFeedbackStudentAddFromManage", re.S)
          text, count = wrappers.subn("  window.openKinderChatFeedbackStudentAddFromManage", text, count=1)
          if count != 1:
              raise SystemExit(f'index modal wrappers block count={count}')
          duplicate_tune = "    if (typeof window.openStudentModal === 'function') window.openStudentModal();\n    setTimeout(tuneStudentModalGuideText, 0);\n"
          if text.count(duplicate_tune) != 1:
              raise SystemExit(f'kcf duplicate modal guide count={text.count(duplicate_tune)}')
          text = text.replace(duplicate_tune, "    if (typeof window.openStudentModal === 'function') window.openStudentModal();\n", 1)
          index.write_text(text, encoding='utf-8')
          PY

          node --check olli-record-memo-storage.js
          node --check olli-record-sort-student-ui.js
          node --check pc-shell.js
          git diff --check
          ! grep -Fq "previousOpenStudentModal" index.html
          ! grep -Fq "previousPatchStudentModalMarkup" index.html
          ! grep -Fq "__olliPcStudentAddTabsWrapped" pc-shell.js
          grep -Fq "pcSyncStudentAddDivisionTabs" olli-record-memo-storage.js
          grep -Fq "olliTuneStudentModalGuideText" olli-record-sort-student-ui.js
          grep -Fq "window.olliTuneStudentModalGuideText = tuneStudentModalGuideText" index.html

      - name: Commit and remove one-time workflow
        shell: bash
        run: |
          set -euo pipefail
          git rm -f .github/workflows/refactor-student-modal-owner-once.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add olli-record-memo-storage.js olli-record-sort-student-ui.js pc-shell.js index.html
          git diff --cached --check
          git commit -m 'refactor: source-own student modal behavior'
          git push origin HEAD:refactor/source-owned-no-overrides-20260912
