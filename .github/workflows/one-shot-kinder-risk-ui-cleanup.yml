name: One-shot kinder risk UI cleanup
on:
  push:
    paths:
      - '.github/workflows/one-shot-kinder-risk-ui-cleanup.yml'
permissions:
  contents: write
jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Extract active risk UI and remove standalone observation routing
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import re, json

          def extract_balanced_tag(text, start, tag):
              token_re = re.compile(rf'<{tag}\b[^>]*>|</{tag}\s*>', re.I)
              depth = 0
              for m in token_re.finditer(text, start):
                  token = m.group(0)
                  if token.lower().startswith(f'</{tag}'):
                      depth -= 1
                      if depth == 0:
                          return text[start:m.end()], m.end()
                  else:
                      depth += 1
              raise RuntimeError(f'unbalanced <{tag}> from {start}')

          def remove_button_by_id(text, button_id):
              m = re.search(rf'<button\b[^>]*\bid=["\']{re.escape(button_id)}["\'][^>]*>', text, re.I)
              if not m:
                  raise RuntimeError(f'button not found: {button_id}')
              block, end = extract_balanced_tag(text, m.start(), 'button')
              return text[:m.start()] + text[end:]

          def remove_js_function(text, name):
              marker = f'function {name}('
              start = text.find(marker)
              if start < 0:
                  raise RuntimeError(f'function not found: {name}')
              brace = text.find('{', start)
              if brace < 0:
                  raise RuntimeError(f'function brace not found: {name}')
              i = brace
              depth = 0
              quote = None
              escape = False
              line_comment = False
              block_comment = False
              template = False
              while i < len(text):
                  c = text[i]
                  n = text[i+1] if i + 1 < len(text) else ''
                  if line_comment:
                      if c == '\n': line_comment = False
                  elif block_comment:
                      if c == '*' and n == '/':
                          block_comment = False; i += 1
                  elif quote:
                      if escape: escape = False
                      elif c == '\\': escape = True
                      elif c == quote: quote = None
                  elif template:
                      if escape: escape = False
                      elif c == '\\': escape = True
                      elif c == '`': template = False
                  else:
                      if c == '/' and n == '/': line_comment = True; i += 1
                      elif c == '/' and n == '*': block_comment = True; i += 1
                      elif c in ('"', "'"): quote = c
                      elif c == '`': template = True
                      elif c == '{': depth += 1
                      elif c == '}':
                          depth -= 1
                          if depth == 0:
                              end = i + 1
                              while end < len(text) and text[end] in ' \t': end += 1
                              if end < len(text) and text[end] == '\n': end += 1
                              return text[:start] + text[end:]
                  i += 1
              raise RuntimeError(f'unbalanced function: {name}')

          index_path = Path('index.html')
          index = index_path.read_text(encoding='utf-8')

          # 1) Active kinder risk screen is NOT mobile-only. Move its static DOM out of index instead of deleting it.
          m = re.search(r'<div\b[^>]*\bid=["\']kinderRiskMemoScreen["\'][^>]*>', index, re.I)
          if not m:
              raise RuntimeError('kinderRiskMemoScreen DOM not found')
          risk_html, risk_end = extract_balanced_tag(index, m.start(), 'div')
          ui_js = """(function(){\n  'use strict';\n  const script = document.currentScript;\n  if (!script || document.getElementById('kinderRiskMemoScreen')) return;\n  const html = %s;\n  script.insertAdjacentHTML('beforebegin', html);\n})();\n""" % json.dumps(risk_html, ensure_ascii=False)
          Path('kinder-risk-ui.js').write_text(ui_js, encoding='utf-8')
          index = index[:m.start()] + '<script src="kinder-risk-ui.js"></script>\n' + index[risk_end:]

          # 2) PC no longer has a standalone elementary observation-note entry button/route.
          index = remove_button_by_id(index, 'recordModeToggleBtn')
          index = remove_js_function(index, 'openObservationNoteFromRecord')
          index = index.replace('  window.openObservationNoteFromRecord = openObservationNoteFromRecord;\n', '')
          index = index.replace('window.openObservationNoteFromRecord = openObservationNoteFromRecord;\n', '')
          index_path.write_text(index, encoding='utf-8')

          # 3) Remove the old cross-navigation option from the kinder feedback mode menu.
          ui_path = Path('kinder-feedback-ui.js')
          ui_src = ui_path.read_text(encoding='utf-8')
          mm = re.search(r'const html = ("(?:\\.|[^"\\])*");', ui_src, re.S)
          if not mm:
              raise RuntimeError('kinder-feedback-ui html literal not found')
          html = json.loads(mm.group(1))
          bm = re.search(r'<button class="kcfModeOption" onclick="switchKinderChatFeedbackMode\(\'elementaryMemo\', event\)" type="button">.*?</button>\n?', html, re.S)
          if not bm:
              raise RuntimeError('elementaryMemo mode option not found')
          html = html[:bm.start()] + html[bm.end():]
          ui_src = ui_src[:mm.start(1)] + json.dumps(html, ensure_ascii=False) + ui_src[mm.end(1):]
          ui_path.write_text(ui_src, encoding='utf-8')

          kcf_path = Path('kinder-feedback.js')
          kcf = kcf_path.read_text(encoding='utf-8')
          marker = "  if (mode === 'elementaryMemo') {"
          start = kcf.find(marker)
          if start < 0:
              raise RuntimeError('elementaryMemo branch not found')
          brace = kcf.find('{', start)
          depth = 0
          i = brace
          quote = None
          escape = False
          while i < len(kcf):
              c = kcf[i]
              if quote:
                  if escape: escape = False
                  elif c == '\\': escape = True
                  elif c == quote: quote = None
              else:
                  if c in ('"', "'"): quote = c
                  elif c == '{': depth += 1
                  elif c == '}':
                      depth -= 1
                      if depth == 0:
                          end = i + 1
                          while end < len(kcf) and kcf[end] in ' \t': end += 1
                          if end < len(kcf) and kcf[end] == '\n': end += 1
                          kcf = kcf[:start] + kcf[end:]
                          break
              i += 1
          else:
              raise RuntimeError('elementaryMemo branch unbalanced')
          kcf_path.write_text(kcf, encoding='utf-8')

          # 4) PC shell no longer needs to intercept the removed standalone observation route.
          shell_path = Path('pc-shell.js')
          shell = shell_path.read_text(encoding='utf-8')
          a = shell.find('    const originalObservationOpen = global.openObservationNoteFromRecord;')
          b = shell.find('    const originalKinderOpen = global.openKinderChatFeedbackPage;', a)
          if a < 0 or b < 0:
              raise RuntimeError('pc-shell observation wrapper block not found')
          shell = shell[:a] + shell[b:]
          shell_path.write_text(shell, encoding='utf-8')

          # 5) Document that risk UI remains an active PC feature and is now modularized.
          doc_path = Path('OLLI_PC_MODULES.md')
          doc = doc_path.read_text(encoding='utf-8')
          needle = '| 유치부 1분 피드백 공용 UI·기능 | `kinder-feedback-ui.js`, `kinder-feedback.js` | `kinder-feedback.css` |\n'
          if needle in doc and 'kinder-risk-ui.js' not in doc:
              doc = doc.replace(needle, needle + '| 유치부 위험신호 화면 | `kinder-risk-ui.js`, `observation-memo-core.js` | 현재 레거시 CSS는 `index.html`에 남아 있음 |\n')
          doc = doc.replace('- 기존 `observation`, `feedback` PC route 호출은 `pc-shell.js`에서 `attendance`(성향기록부)로 흡수한다.\n', '- 기존 `observation`, `feedback` PC route 호출은 `pc-shell.js`에서 `attendance`(성향기록부)로 흡수한다. 별도 초등 관찰노트 진입 버튼은 제거한다.\n')
          marker_doc = '### 유치부 1분 피드백\n'
          if marker_doc in doc and '### 유치부 위험신호' not in doc:
              insert = "### 유치부 위험신호\n\n- `kinder-risk-ui.js`: 위험신호 화면의 정적 DOM 템플릿.\n- 위험신호 데이터 저장·알림·확인 처리 로직은 현재 `observation-memo-core.js`가 담당한다.\n- `kinderRiskMemoScreen`은 위험신호 보기/알림이 아직 사용하므로 삭제 대상이 아니다. 모바일 전용 코드로 분류하지 않는다.\n- 위험신호 전용 CSS는 다음 정리 단계에서 `index.html`에서 별도 CSS 모듈로 이동한다.\n\n"
              doc = doc.replace(marker_doc, insert + marker_doc)
          doc_path.write_text(doc, encoding='utf-8')
          PY
      - name: Verify cleanup
        shell: bash
        run: |
          set -euo pipefail
          node --check kinder-risk-ui.js
          node --check kinder-feedback-ui.js
          node --check kinder-feedback.js
          node --check pc-shell.js
          test "$(grep -c '<div[^>]*id="kinderRiskMemoScreen"' index.html || true)" -eq 0
          grep -q 'kinder-risk-ui.js' index.html
          grep -q "id=\\\"kinderRiskMemoScreen\\\"" kinder-risk-ui.js
          ! grep -q 'openObservationNoteFromRecord' index.html
          ! grep -q 'openObservationNoteFromRecord' pc-shell.js
          ! grep -q "elementaryMemo" kinder-feedback.js
          ! grep -q "elementaryMemo" kinder-feedback-ui.js
          grep -q 'function openRiskMemoPageById' index.html
          grep -q 'risk_signals' observation-memo-core.js
          echo "index bytes: $(wc -c < index.html)"
      - name: Commit cleanup
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html kinder-risk-ui.js kinder-feedback-ui.js kinder-feedback.js pc-shell.js OLLI_PC_MODULES.md
          git commit -m 'Modularize kinder risk UI and remove standalone observation route'
          git push
