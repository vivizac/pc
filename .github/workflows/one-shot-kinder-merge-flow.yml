name: Patch kindergarten merge flow
on:
  push:
    paths:
      - '.github/workflows/one-shot-kinder-merge-flow.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Apply patch
        run: python scripts/patch-kinder-merge-flow.py
      - name: Validate
        run: |
          node --check pc-timetable.js
          git diff --check
      - name: Commit patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add pc-timetable.js pc-timetable.css index.html
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "Refine kindergarten merged class flow"
          git push origin main
