name: Convert PC student info to Realtime
on:
  push:
    paths:
      - '.github/workflows/convert-student-info-realtime-pc.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Patch PC student info Realtime
        run: python scripts/patch_student_info_realtime_pc.py
      - name: Syntax check
        run: node --check pc-student-info-card-runtime.js
      - name: Static Realtime checks
        shell: bash
        run: |
          node - <<'NODE'
          const fs = require('fs');
          const s = fs.readFileSync('pc-student-info-card-runtime.js','utf8');
          for (const token of ["watchDomain('schedule'",'refreshOpenStudentInfoFromRealtime','skipLifecycleSync: true','__olli_authoritative_pickups','kinderInfoPickupReadonly','cardState.dirty']) {
            if (!s.includes(token)) throw new Error('missing: ' + token);
          }
          NODE
      - name: Existing Realtime regression tests
        run: node --test tests/schedule-realtime.test.cjs
      - name: Commit PC student info Realtime
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add pc-student-info-card-runtime.js
          git diff --cached --quiet && exit 0
          git commit -m 'Connect PC student info to Realtime server context'
          git push origin HEAD:main
