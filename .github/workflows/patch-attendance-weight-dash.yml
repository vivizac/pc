name: Patch attendance weight dash
on:
  push:
    branches:
      - tweak/attendance-weight-dash-20260915
    paths:
      - '.github/tmp/patch_attendance_weights_dash.py'
      - '.github/workflows/patch-attendance-weight-dash.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: tweak/attendance-weight-dash-20260915
      - name: Apply focused attendance weight and dash patch
        run: python .github/tmp/patch_attendance_weights_dash.py
      - name: Validate intended changes
        run: |
          grep -F 'font-weight: 500;' pc-timetable.css
          grep -F 'font-weight: 300;' pc-timetable.css
          grep -F 'color: #a5acb5' pc-timetable.css
          grep -F 'attendanceBlankMark{color:#a5acb5;background:#f4f5f7' pc-timetable-attendance-register.js
          node --check pc-timetable-attendance-register.js
          git diff --check
      - name: Clean temporary files and commit
        run: |
          rm .github/tmp/patch_attendance_weights_dash.py
          rm .github/workflows/patch-attendance-weight-dash.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add pc-timetable.css pc-timetable-attendance-register.js .github/tmp/patch_attendance_weights_dash.py .github/workflows/patch-attendance-weight-dash.yml
          git commit -m 'style: refine attendance left text weights and dash color'
          git push origin HEAD:tweak/attendance-weight-dash-20260915
