name: Finalize schedule Realtime

on:
  push:
    paths:
      - '.github/workflows/finalize-schedule-realtime.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Remove timetable polling and temporary debug logs
        run: |
          python - <<'PY'
          from pathlib import Path

          def replace_once(path, old, new, label):
              p = Path(path)
              text = p.read_text(encoding='utf-8')
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'{label}: expected exactly 1 match, found {count}')
              p.write_text(text.replace(old, new, 1), encoding='utf-8')

          replace_once(
              'pc-timetable.js',
              """  const LIVE_SYNC_INTERVAL_MS = 3000;\n\n  function logScheduleSyncDebug(source, stage, details) {\n    try {\n      console.info(`[OLLI SYNC][${source}] ${stage}`, details || {});\n    } catch (_) {}\n  }""",
              """  const ATTENDANCE_POLL_INTERVAL_MS = 3000;""",
              'remove timetable debug logger'
          )

          replace_once(
              'pc-timetable.js',
              '  async function checkLiveScheduleSync(forceRefresh, realtimeContext, debugSource) {',
              '  async function checkLiveScheduleSync(forceRefresh, realtimeContext) {',
              'remove debug source parameter'
          )

          replace_once(
              'pc-timetable.js',
              """      if (shouldRefresh) {\n        if (debugSource) logScheduleSyncDebug(debugSource, '변경 감지 → 시간표 재조회', { previous, version, academyId, week, pane });\n        if (await refreshActiveSchedulePane({ isCurrent }) === false) return false;\n        if (debugSource) logScheduleSyncDebug(debugSource, '시간표 화면 반영 완료', { version, academyId, week, pane });\n      }""",
              """      if (shouldRefresh) {\n        if (await refreshActiveSchedulePane({ isCurrent }) === false) return false;\n      }""",
              'remove refresh debug logs'
          )

          replace_once(
              'pc-timetable.js',
              """    global.setInterval(() => { checkLiveScheduleSync(false, null, 'POLLING'); }, LIVE_SYNC_INTERVAL_MS);""",
              """    global.setInterval(() => {\n      // 시간표는 Supabase Realtime으로만 갱신합니다.\n      // 기존 3초 확인은 출석부 안전망으로만 유지합니다.\n      if (state.pane === 'attendance') checkLiveScheduleSync(false);\n    }, ATTENDANCE_POLL_INTERVAL_MS);""",
              'make 3s poll attendance-only'
          )

          replace_once(
              'pc-timetable.js',
              """  if (typeof global.OlliRealtime?.watchDomain === 'function') {\n    global.OlliRealtime.watchDomain('schedule', (context) => {\n      const isActualSignal = context?.trigger === 'change';\n      if (isActualSignal) {\n        const realtimeStatus = typeof global.OlliRealtime?.getStatus === 'function' ? global.OlliRealtime.getStatus() : null;\n        logScheduleSyncDebug('REALTIME', 'schedule 신호 수신', {\n          connected: !!realtimeStatus?.connected,\n          status: realtimeStatus?.status || '',\n          lastSignalAt: realtimeStatus?.lastSignalAt || 0,\n          academyId: currentSyncAcademyId()\n        });\n      }\n      // Stage 2 covers the timetable. The attendance register keeps its existing polling.\n      if (!state.active || state.view !== 'schedule' || state.pane !== 'schedule') return false;\n      return checkLiveScheduleSync(true, context, isActualSignal ? 'REALTIME' : null);\n    });\n  }""",
              """  if (typeof global.OlliRealtime?.watchDomain === 'function') {\n    global.OlliRealtime.watchDomain('schedule', (context) => {\n      // 시간표는 Realtime 신호를 기준으로 최신 revision과 서버 원본을 다시 읽습니다.\n      if (!state.active || state.view !== 'schedule' || state.pane !== 'schedule') return false;\n      return checkLiveScheduleSync(true, context);\n    });\n  }""",
              'remove temporary realtime console logging'
          )

          test = Path('tests/schedule-realtime.test.cjs')
          t = test.read_text(encoding='utf-8')
          t = t.replace(
              "const env=sandbox();let revision=10,weekReads=0,readWeek=async()=>({enrollments:[{student_id:'fixture',time_slot:5}]});",
              "const env=sandbox();let revision=10,revisionReads=0,weekReads=0,readWeek=async()=>({enrollments:[{student_id:'fixture',time_slot:5}]});",
              1
          )
          t = t.replace(
              "loadSyncRevision:async()=>({ok:true,version:revision}),loadWeek:()=>{weekReads++;return readWeek();}",
              "loadSyncRevision:async()=>{revisionReads++;return {ok:true,version:revision};},loadWeek:()=>{weekReads++;return readWeek();}",
              1
          )
          t = t.replace(
              "return {...env,state,get reads(){return weekReads;},setRevision:v=>revision=v,setRead:fn=>readWeek=fn,check:()=>watcher({academyId:'academy-a',isCurrent:()=>env.values.get('olli_current_academy_id')==='academy-a'})};",
              "return {...env,state,get reads(){return weekReads;},get revisionReads(){return revisionReads;},setRevision:v=>revision=v,setRead:fn=>readWeek=fn,check:()=>watcher({academyId:'academy-a',isCurrent:()=>env.values.get('olli_current_academy_id')==='academy-a'})};",
              1
          )

          marker = "test('PC first signal refreshes even without a baseline revision',async()=>{"
          addition = """test('PC 3s timer skips timetable pane and is reserved for attendance',async()=>{\n  const env=pc();const interval=env.intervals.find(x=>x.delay===3000);assert.ok(interval);\n  const before=env.revisionReads;interval.fn();await settle();assert.equal(env.revisionReads,before);\n  env.state.pane='attendance';env.state.syncRevision=10;interval.fn();await settle();assert.equal(env.revisionReads,before+1);\n});\n"""
          if addition not in t:
              if marker not in t:
                  raise SystemExit('test insertion marker not found')
              t = t.replace(marker, addition + marker, 1)
          test.write_text(t, encoding='utf-8')

          tt = Path('pc-timetable.js').read_text(encoding='utf-8')
          assert 'ATTENDANCE_POLL_INTERVAL_MS = 3000' in tt
          assert "if (state.pane === 'attendance') checkLiveScheduleSync(false);" in tt
          assert 'logScheduleSyncDebug' not in tt
          assert '[OLLI SYNC]' not in tt
          assert "'POLLING'" not in tt
          PY

      - name: Syntax checks
        run: |
          node --check pc-timetable.js
          node --check olli-realtime-common.js

      - name: Realtime regression tests
        run: node --test tests/schedule-realtime.test.cjs

      - name: Commit final Realtime cleanup
        run: |
          rm -f \
            .github/workflows/add-timetable-sync-debug.yml \
            .github/workflows/fix-schedule-student-readonly-sync.yml \
            .github/workflows/fix-realtime-retry-loop.yml \
            .github/scripts/fix-realtime-retry-loop.py \
            .github/workflows/finalize-schedule-realtime.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          if git diff --cached --quiet; then
            echo 'No changes to commit'
            exit 0
          fi
          git commit -m 'Finalize timetable Realtime and keep attendance polling only'
          git push origin HEAD:main
