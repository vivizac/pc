name: Unify PC login DOM
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/unify-pc-login-dom.yml'
jobs:
  unify:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Replace inline login screens with shared canonical component
        run: |
          python - <<'PY'
          from pathlib import Path
          import re, json, subprocess
          p=Path('index.html')
          text=p.read_text(encoding='utf-8')
          start_marker='<!-- LOGIN: 계정 기반 첫 진입 -->'
          last_id='olliApprovalWaitingScreen'
          def div_block_end(source, element_id):
            marker=f'id="{element_id}"'
            pos=source.index(marker)
            start=source.rfind('<div',0,pos)
            token=re.compile(r'<div\b|</div\s*>',re.I)
            depth=0
            for m in token.finditer(source,start):
              if m.group(0).lower().startswith('<div'): depth+=1
              else:
                depth-=1
                if depth==0: return m.end()
            raise SystemExit('div end not found '+element_id)
          s=text.index(start_marker); e=div_block_end(text,last_id)
          region=text[s:e]
          js='''// PC·폰 공통 로그인 화면 DOM. PC index.html을 기준 원본으로 사용합니다.\n(function mountOlliLoginUi(){\n  const html = %s;\n  const current = document.currentScript;\n  if (current && current.parentNode) {\n    current.insertAdjacentHTML('beforebegin', html);\n    return;\n  }\n  document.body.insertAdjacentHTML('beforeend', html);\n})();\n''' % json.dumps(region, ensure_ascii=False)
          Path('olli-login-ui.js').write_text(js,encoding='utf-8')
          text=text[:s]+'<script src="olli-login-ui.js"></script>'+text[e:]
          p.write_text(text,encoding='utf-8')
          guide_path=Path('OLLI_PC_MODULES.md')
          guide=guide_path.read_text(encoding='utf-8')
          note='\n### 로그인 공통 UI\n- `olli-login-ui.js`: PC·폰 공통 로그인 화면 DOM. PC 기준 로그인 화면을 공통 컴포넌트로 사용한다.\n- `olli-auth-entry-ui.js` 및 인증 계층은 폰과 공통 기준을 유지하고, 로그인 이후 시작 페이지/쉘 전환은 플랫폼 어댑터가 담당한다.\n'
          if '### 로그인 공통 UI' not in guide:
            guide=guide.rstrip()+note+'\n'
          guide_path.write_text(guide,encoding='utf-8')
          updated=p.read_text(encoding='utf-8')
          if updated.count('<script src="olli-login-ui.js"></script>') != 1: raise SystemExit('login ui loader invalid')
          for element_id in ['olliLoginEntryScreen','olliStartPageSetupScreen','olliOwnerLoginScreen','olliAccountCreateScreen','olliAcademyConnectChoiceScreen','olliAcademyCreateScreen','olliOwnerExistingConnectScreen','olliTeacherRequestScreen','olliApprovalWaitingScreen']:
            if f'id="{element_id}"' in updated: raise SystemExit('inline login DOM remained '+element_id)
          subprocess.run(['node','--check','olli-login-ui.js'],check=True)
          print('component bytes',Path('olli-login-ui.js').stat().st_size)
          print('index bytes',len(updated.encode()))
          PY
      - name: Commit login DOM unification
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add index.html OLLI_PC_MODULES.md olli-login-ui.js
          git commit -m "refactor: PC 로그인 화면을 공통 로그인 컴포넌트로 전환" || exit 0
          git push
