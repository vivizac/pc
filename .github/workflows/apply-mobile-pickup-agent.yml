name: Cleanup temporary mobile patch files

on:
  push:
    branches:
      - work/pickup-teamchat-20261001
    paths:
      - '.github/mobile-pickup-agent-cleanup'

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
      - name: Remove temporary patch tooling
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/mobile-pickup-agent.patch
          git rm .github/mobile-pickup-agent-cleanup
          git rm .github/workflows/apply-mobile-pickup-agent.yml
          git commit -m "Remove temporary mobile patch tooling"
          git push origin "HEAD:${GITHUB_REF_NAME}"
