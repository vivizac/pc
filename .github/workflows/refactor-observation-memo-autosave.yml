name: Refactor observation memo autosave

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/refactor-observation-memo-autosave.yml'

permissions:
  contents: write

jobs:
  refactor:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Move PC memo autosave controller to common helper
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          core_path = Path('observation-memo-core.js')
          core = core_path.read_text(encoding='utf-8')
          start = core.index('let memoAutoSaveTimer = null;')
          end = core.index('function closeMemoPage()', start)
          region = core[start:end]

          required = [
              'function scheduleMemoAutoSave()',
              'function getMemoInputTypeFromTarget',
              'handleMemoPauseAutoSaveInput'
          ]
          missing = [token for token in required if token not in region]
          if missing:
              raise SystemExit('PC autosave region changed unexpectedly: ' + ', '.join(missing))

          core = core[:start] + '\n\n' + core[end:]
          core_path.write_text(core, encoding='utf-8')

          common = Path('observation-memo-common.js').read_text(encoding='utf-8')
          common_required = [
              'let memoAutoSaveTimer = null;',
              'function scheduleMemoAutoSave()',
              'function getMemoInputTypeFromTarget',
              'function handleMemoPauseAutoSaveInput',
              'isObservationMemoAutoSaveBlocked'
          ]
          missing_common = [token for token in common_required if token not in common]
          if missing_common:
              raise SystemExit('PC common autosave helpers missing: ' + ', '.join(missing_common))

          updated = core_path.read_text(encoding='utf-8')
          forbidden = [
              'let memoAutoSaveTimer = null;',
              'function scheduleMemoAutoSave()',
              'function getMemoInputTypeFromTarget',
              'function handleMemoPauseAutoSaveInput'
          ]
          leftovers = [token for token in forbidden if token in updated]
          if leftovers:
              raise SystemExit('PC autosave duplicates remain in core: ' + ', '.join(leftovers))

          if 'function closeMemoPage()' not in updated:
              raise SystemExit('PC closeMemoPage must stay platform-specific')
          PY

          node --check observation-memo-common.js
          node --check observation-memo-core.js

          rm -f .github/workflows/refactor-observation-memo-autosave.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add observation-memo-core.js .github/workflows/refactor-observation-memo-autosave.yml
          git commit -m 'refactor: PC 관찰노트 자동저장 제어 공통화'
          git push
