name: Validate Olli Monorepo

on:
  push:
    branches:
      - main
    paths:
      - 'apps/mobile/**'
      - 'supabase/migrations/*_schedule_availability_rules_and_read_rpc.sql'
      - 'packages/common/**'
      - 'deploy/vercel-projects.json'
      - 'MONOREPO_TRANSITION.md'
      - 'tests/mobile-self-contained-build.test.cjs'
      - 'tests/pc-self-contained-build.test.cjs'
      - 'tests/pc-build-closure.test.cjs'
      - 'tests/app-root-deploy-boundary.test.cjs'
      - 'tests/mobile-entry-integrity.test.cjs'
      - 'tests/mobile-startup-boot-contract.test.cjs'
      - 'tests/pc-startup-boot-contract.test.cjs'
      - 'tests/monorepo-structure-contract.test.cjs'
      - 'tests/vercel-monorepo-separation-contract.test.cjs'
      - '.github/workflows/validate-olli-monorepo-transition.yml'
  pull_request:
    paths:
      - 'apps/pc/olli-app-startup.js'
      - 'apps/mobile/**'
      - 'supabase/migrations/*_schedule_availability_rules_and_read_rpc.sql'
      - 'packages/common/**'
      - 'deploy/vercel-projects.json'
      - 'MONOREPO_TRANSITION.md'
      - 'tests/mobile-self-contained-build.test.cjs'
      - 'tests/mobile-entry-integrity.test.cjs'
      - 'tests/mobile-startup-boot-contract.test.cjs'
      - 'tests/monorepo-structure-contract.test.cjs'
      - 'tests/vercel-monorepo-separation-contract.test.cjs'
      - '.github/workflows/validate-olli-monorepo-transition.yml'

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: false
      - name: Validate monorepo structure and Mobile build contract
        run: |
          node --check apps/mobile/scripts/stage-common.cjs
          node --check apps/pc/scripts/stage-common.cjs
          node --test \
            tests/mobile-self-contained-build.test.cjs \
            tests/pc-self-contained-build.test.cjs \
            tests/pc-build-closure.test.cjs \
            tests/app-root-deploy-boundary.test.cjs \
            tests/mobile-entry-integrity.test.cjs \
            tests/mobile-startup-boot-contract.test.cjs \
            tests/pc-startup-boot-contract.test.cjs \
            tests/monorepo-structure-contract.test.cjs \
            tests/vercel-monorepo-separation-contract.test.cjs
      - name: Validate PC schedule Realtime
        run: node --test tests/schedule-realtime.test.cjs
      - name: Validate Mobile schedule and security contracts
        working-directory: apps/mobile
        run: |
          node --check olli-talk-beta.js
          node --check olli-talk-attachment-cache-phone.js
          node --check api/_lib/olli-agent/supabase-rpc.cjs
          node --check api/_lib/olli-agent/request-context.cjs
          node --check api/_lib/olli-agent/runtime.cjs
          node --check api/_lib/olli-agent/student-reference-resolver.cjs
          node --check api/_lib/olli-agent/privacy.cjs
          node --check api/_lib/olli-agent/tools/schedule-tools.cjs
          node --check api/_lib/olli-agent/tools/record-tools.cjs
          node --check api/_lib/olli-agent/tools/availability-tools.cjs
          node --check api/_lib/olli-agent/tools/attendance-tools.cjs
          node --test \
            tests/schedule-realtime.test.cjs \
            tests/phone-schedule-class-layout-date-contract.test.cjs \
            tests/mobile-secure-auth-source-contract.test.cjs \
            tests/photo-private-storage-contract.test.cjs \
            tests/storage-secure-transport-contract.test.cjs \
            tests/phone-feedback-archive-saved-date.test.cjs \
            tests/phone-teamchat-local-first.test.cjs \
            tests/team-chat-thumbnail-viewport.test.cjs \
            tests/olli-agent-foundation-contract.test.cjs \
            tests/olli-agent-student-privacy.test.cjs \
            tests/olli-agent-student-schedule-tool.test.cjs \
            tests/olli-agent-recent-records-tool.test.cjs \
            tests/olli-agent-schedule-availability-tool.test.cjs \
            tests/olli-agent-schedule-availability-db-contract.test.cjs \
            tests/olli-agent-attendance-tool.test.cjs
