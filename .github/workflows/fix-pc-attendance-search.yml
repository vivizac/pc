name: Fix PC attendance search behavior

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/fix-pc-attendance-search.yml'
      - '.github/tmp/fix_pc_attendance_search.py'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch attendance search
        run: python3 .github/tmp/fix_pc_attendance_search.py
      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add pc-attendance.js pc-shell.js olli-record-search-controls.js
          git commit -m "fix: PC 출석부 검색 즉시반영 및 키보드 위치 안정화"
          git push
