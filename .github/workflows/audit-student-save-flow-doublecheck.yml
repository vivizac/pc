name: Audit student save flow doublecheck

on:
  push:
    branches:
      - refactor/source-owned-no-overrides-20260912
    paths:
      - .github/workflows/audit-student-save-flow-doublecheck.yml

permissions:
  contents: write

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refactor/source-owned-no-overrides-20260912
          fetch-depth: 0

      - name: Reverse trace save and schedule ownership
        shell: bash
        run: |
          set -euo pipefail
          echo '=== A. PROFILE SAVE CALLERS ==='
          rg -n --glob '!node_modules/**' --glob '!dist/**' --glob '!build/**' 'ensureStudentSavedToSupabase|saveStudentInfoCard|saveElementaryInfo|saveKinderInfo' . || true
          echo
          echo '=== B. AUTHORITATIVE SCHEDULE WRITE CALLERS ==='
          rg -n --glob '!node_modules/**' --glob '!dist/**' --glob '!build/**' 'setAuthoritativeSchedule|setOlliStudentAuthoritativeSchedule|saveOlliStudentScheduleFromInfo|olli_schedule_set_student_weekly_schedule' . || true
          echo
          echo '=== C. SCHEDULE PAIR PRODUCERS / EXTRA HOOKS ==='
          rg -n --glob '!node_modules/**' --glob '!dist/**' --glob '!build/**' 'olliGetInfoSchedulePairs|olliGetStudentAddSchedulePairs|olliPrepareInfoExtra|olliGetInfoExtra|installAuthoritativeScheduleEditor|olliStudentScheduleAugmentInfoExtra|olliStudentScheduleAugmentStudentAddExtra' . || true
          echo
          echo '=== D. NEW STUDENT REGISTRATION ROUTING ==='
          rg -n --glob '!node_modules/**' --glob '!dist/**' --glob '!build/**' 'confirmStudent|olliPrepareStudentRegistrationRouting|olliCommitStudentRegistrationRouting|olliReleaseStudentRegistrationRouting|saveOlliStudentScheduleFromInfo' . || true
          echo
          echo '=== E. RPC SQL DEFINITIONS / MIGRATIONS ==='
          rg -n --glob '*.sql' 'olli_schedule_set_student_weekly_schedule|student_weekly_schedule|schedule_student_enrollments' . || true
          echo
          echo '=== F. GLOBAL REASSIGNMENTS OF CRITICAL FUNCTIONS ==='
          rg -n --glob '*.js' '(^|[^A-Za-z0-9_])(window\.|global\.)?(saveElementaryInfo|saveKinderInfo|olliPrepareInfoExtra|olliGetInfoExtra|olliPrepareStudentAddExtra|olliGetStudentAddExtra)\s*=' . || true

      - name: Cleanup one-shot audit workflow
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          rm -f .github/workflows/audit-student-save-flow-doublecheck.yml
          git add -A
          git commit -m "chore: remove one-shot student save flow audit" || true
          git push origin HEAD:refactor/source-owned-no-overrides-20260912
