name: Refactor observation memo screen chrome

'on':
  push:
    branches: [main]
    paths:
      - '.github/workflows/refactor-observation-memo-screen-chrome.yml'

permissions:
  contents: write

jobs:
  refactor:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Move PC observation memo screen chrome to common helper
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path('observation-memo-core.js')
          text = path.read_text(encoding='utf-8')
          old = '\n'.join([
            '  forceStudentMemoControlsVisible();',
            '  requestAnimationFrame(forceStudentMemoControlsVisible);',
            '  setTimeout(forceStudentMemoControlsVisible, 120);',
            '',
            "  setMemoModePillLabel(student.name || '학생 이름');",
            '  updateMemoStudentMetaDisplay(student);',
            "  const memoNameBtn = document.getElementById('memoStudentNameBtn');",
            '  if (memoNameBtn) {',
            '    memoNameBtn.onclick = toggleMemoModeMenu;',
            "    memoNameBtn.title = '메모 유형 선택';",
            "    memoNameBtn.setAttribute('aria-label', '메모 유형 선택');",
            '  }',
            '',
            "  const feedbackBtn = document.getElementById('memoFeedbackBtn');",
            "  const analysisBtn = document.getElementById('memoBottomAnalysisBtn') || document.getElementById('memoAnalysisBtn');",
            "  const elementaryWrap = document.getElementById('elementaryMemoWrap');",
            '',
            '  if (feedbackBtn) {',
            "    feedbackBtn.style.display = 'inline-flex';",
            "    feedbackBtn.innerHTML = '<svg viewBox=\"0 0 24 24\" aria-hidden=\"true\"><path d=\"M12 19V5\"></path><path d=\"M5 12l7-7 7 7\"></path></svg>피드백 생성';",
            '  }',
            "  if (analysisBtn) analysisBtn.style.display = 'inline-flex';",
            "  if (elementaryWrap) elementaryWrap.style.display = 'block';",
            '  forceStudentMemoControlsVisible();',
            '',
            '  renderObservationMemoInitialView(session);'
          ])
          new = '  renderObservationMemoScreenChrome(session);\n  renderObservationMemoInitialView(session);'
          if old not in text:
            raise SystemExit('PC screen chrome block changed unexpectedly')
          if text.count(old) != 1:
            raise SystemExit('PC screen chrome block is not unique')
          text = text.replace(old, new, 1)
          if "if (session.type === 'kinder')" not in text:
            raise SystemExit('PC kinder branch missing after refactor')
          path.write_text(text, encoding='utf-8')
          common = Path('observation-memo-common.js').read_text(encoding='utf-8')
          if 'function renderObservationMemoScreenChrome(session)' not in common:
            raise SystemExit('common screen chrome helper missing')
          forbidden = [
            "setMemoModePillLabel(student.name || '학생 이름');",
            "const memoNameBtn = document.getElementById('memoStudentNameBtn');",
            "const feedbackBtn = document.getElementById('memoFeedbackBtn');"
          ]
          for token in forbidden:
            if token in path.read_text(encoding='utf-8'):
              raise SystemExit('PC duplicate screen chrome token remains: ' + token)
          PY
          node --check observation-memo-common.js
          node --check observation-memo-core.js
          rm -f .github/workflows/refactor-observation-memo-screen-chrome.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add observation-memo-common.js observation-memo-core.js .github/workflows/refactor-observation-memo-screen-chrome.yml
          git commit -m 'refactor: PC 관찰노트 화면 공통 UI 준비 분리'
          git push
