name: Fix PC record editor docs
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/fix-pc-record-editor-docs.yml'
permissions:
  contents: write
jobs:
  docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Align module documentation with PC-only editor
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('OLLI_PC_MODULES.md')
          text = p.read_text(encoding='utf-8')
          text = text.replace(
            '| 초등 관찰기록 공용 DOM | `observation-editor-ui.js` | `observation-editor.css` |',
            '| 초등 분석 설문·분석 상세 공용 DOM | `observation-editor-ui.js` | `observation-editor.css` |'
          )
          old1 = '- `studentMemoScreen`과 초등 분석 모달의 정적 DOM은 더 이상 `index.html` 본문에 직접 두지 않고 `observation-editor-ui.js`가 원래 위치에서 동기적으로 주입한다.\n'
          new1 = '- `observation-editor-ui.js`는 이제 초등 분석 설문·분석 상세 오버레이만 주입한다. `studentMemoScreen` Phone 작성 화면은 PC 저장소에서 제거했다.\n'
          old2 = '- 유치부 `kinderChatFeedbackScreen`과 관련 오버레이의 정적 DOM은 `kinder-feedback-ui.js`가 `kinder-feedback.js`보다 먼저 원래 위치에 주입한다.\n'
          new2 = '- PC 유치부 작성 화면은 `pc-record-editor.js`가 직접 렌더링하며 Phone용 `kinderChatFeedbackScreen`과 관련 UI 번들은 PC 저장소에 두지 않는다.\n'
          if old1 not in text or old2 not in text:
              raise SystemExit('legacy documentation lines not found')
          text = text.replace(old1, new1, 1).replace(old2, new2, 1)
          p.write_text(text, encoding='utf-8')
          PY
          git diff --check
      - name: Commit docs and remove workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          rm -f .github/workflows/fix-pc-record-editor-docs.yml
          git add OLLI_PC_MODULES.md .github/workflows/fix-pc-record-editor-docs.yml
          if ! git diff --cached --quiet; then
            git commit -m "PC 전용 기록 에디터 구조 문서를 현재 코드와 일치시킴"
            git push
          fi
