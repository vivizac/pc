name: Validate schedule Realtime
on:
  pull_request:
    paths:
      - 'packages/common/olli-realtime-common.js'
      - 'apps/pc/pc-timetable.js'
      - 'apps/pc/pc-timetable-service.js'
      - 'tests/schedule-realtime.test.cjs'
      - 'tests/team-talk-action-capabilities.test.cjs'
      - 'supabase/migrations/20260930160000_expand_team_talk_schedule_action_capabilities.sql'
      - '.github/workflows/validate-schedule-realtime.yml'
  push:
    branches: [main]
    paths:
      - 'packages/common/olli-realtime-common.js'
      - 'apps/pc/pc-timetable.js'
      - 'apps/pc/pc-timetable-service.js'
      - 'tests/schedule-realtime.test.cjs'
      - 'tests/team-talk-action-capabilities.test.cjs'
      - 'supabase/migrations/20260930160000_expand_team_talk_schedule_action_capabilities.sql'
      - '.github/workflows/validate-schedule-realtime.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Check JavaScript syntax
        run: |
          node --check packages/common/olli-realtime-common.js
          node --check apps/pc/pc-timetable.js
          node --check apps/pc/pc-timetable-service.js
      - name: Test schedule and Team Talk action contracts
        run: node --test tests/schedule-realtime.test.cjs tests/team-talk-action-capabilities.test.cjs
