name: Refactor observation memo return navigation

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/refactor-observation-memo-return-navigation.yml'

permissions:
  contents: write

jobs:
  refactor:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Move PC observation memo return navigation to common helper
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path('observation-memo-core.js')
          text = path.read_text(encoding='utf-8')
          old = '\n'.join([
            'function closeMemoPage() {',
            '  prepareObservationMemoPageClose();',
            '',
            "  const current = vivizacGetVisibleNotePage();",
            "  if (current && current.id === 'studentMemoScreen') {",
            '    vivizacSlideOutPageToRecord(current, () => {',
            "      loadRecords('');",
            '    });',
            '    return;',
            '  }',
            '',
            "  const studentMemoScreen = document.getElementById('studentMemoScreen');",
            "if (studentMemoScreen) studentMemoScreen.style.display = 'none';",
            "document.getElementById('recordRoomScreen').style.display = 'flex';",
            "  loadRecords('');",
            '}'
          ])
          new = '\n'.join([
            'function closeMemoPage() {',
            '  prepareObservationMemoPageClose();',
            "  returnFromObservationMemoScreen(() => loadRecords(''));",
            '}'
          ])
          if old not in text:
            raise SystemExit('PC closeMemoPage navigation block changed unexpectedly')
          if text.count(old) != 1:
            raise SystemExit('PC closeMemoPage navigation block is not unique')
          text = text.replace(old, new, 1)
          if 'function returnFromObservationMemoScreen(onReturned)' not in Path('observation-memo-common.js').read_text(encoding='utf-8'):
            raise SystemExit('common return navigation helper missing')
          if "if (currentMemoType === 'kinder')" not in text:
            raise SystemExit('PC kinder save branch missing after refactor')
          path.write_text(text, encoding='utf-8')
          PY
          node --check observation-memo-common.js
          node --check observation-memo-core.js
          rm -f .github/workflows/refactor-observation-memo-return-navigation.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add observation-memo-common.js observation-memo-core.js .github/workflows/refactor-observation-memo-return-navigation.yml
          git commit -m 'refactor: PC 관찰노트 복귀 네비게이션 공통화'
          git push
