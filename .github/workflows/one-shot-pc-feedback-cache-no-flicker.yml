name: Fix PC feedback record flicker

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/one-shot-pc-feedback-cache-no-flicker.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply patch
        run: python3 .github/scripts/fix_pc_feedback_cache.py
      - name: Verify
        shell: bash
        run: |
          set -e
          node --check pc-attendance.js
          grep -F "recordCache: new Map()" pc-attendance.js
          grep -F "PC_RECORD_CACHE_MAX_STUDENTS = 12" pc-attendance.js
          grep -F "function ensureRecordWorkspace" pc-attendance.js
          grep -F "const cached = readRecordCache(student);" pc-attendance.js
          grep -F "서버 내용이 캐시와 같으면 DOM을 다시 그리지 않아 깜박임을 만들지 않습니다." pc-attendance.js
          if grep -F "if (body) body.innerHTML = recordLoadingHtml();" pc-attendance.js; then
            echo 'old flashing skeleton path remains'
            exit 1
          fi
      - name: Commit fix
        shell: bash
        run: |
          set -e
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm -f .github/scripts/fix_pc_feedback_cache.py .github/workflows/one-shot-pc-feedback-cache-no-flicker.yml
          git add pc-attendance.js
          git commit -m 'Cache PC feedback records to prevent flicker'
          git push
