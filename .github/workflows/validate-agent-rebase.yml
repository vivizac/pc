name: Validate Agent rebase

on:
  pull_request:
    paths:
      - 'apps/mobile/api/_lib/olli-agent/**'
      - 'apps/mobile/api/olli-agent.js'
      - 'apps/pc/api/olli-agent.js'
      - 'apps/mobile/package.json'
      - 'apps/mobile/tests/olli-agent-waitlist-update-prepare-tool.test.cjs'
      - '.github/workflows/validate-agent-rebase.yml'

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Check Agent server syntax
        run: |
          node --check apps/mobile/api/_lib/olli-agent/runtime.cjs
          node --check apps/mobile/api/_lib/olli-agent/tools/waitlist-update-prepare-tools.cjs
          node --check apps/mobile/api/_lib/olli-agent/tools/waitlist-cancel-prepare-tools.cjs
          node --check apps/pc/api/olli-agent.js
      - name: Validate waitlist update probe
        working-directory: apps/mobile
        run: node --test tests/olli-agent-waitlist-update-prepare-tool.test.cjs
