    }));
  }

  async function updateCellMemo(memoId, note) {
    return rpc('olli_schedule_update_cell_memo_v3', contextPayload({
      p_memo_id: clean(memoId),
      p_note: note || ''
    }));
  }

  async function deleteCellMemo(memoId) {
    return rpc('olli_schedule_delete_cell_memo_v3', contextPayload({
      p_memo_id: clean(memoId)
    }));
  }

"""
          service = replace_once(service, old, new, 'service memo methods')
          service = replace_once(service,
              "    setClassTeacher,\n    saveCellMemo\n",
              "    setClassTeacher,\n    saveCellMemo,\n    addCellMemo,\n    updateCellMemo,\n    deleteCellMemo\n",
