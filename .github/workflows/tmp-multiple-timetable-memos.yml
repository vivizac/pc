          PY
      - name: Verify source changes
        shell: bash
        run: |
          node --check pc-timetable.js
          node --check pc-timetable-service.js
          grep -q "function addCellMemo" pc-timetable-service.js
          grep -q "data-memo-id" pc-timetable.js
          grep -q "cellMemoItems" pc-timetable.js
