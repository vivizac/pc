name: Final premerge wrapper audit once v2

on:
  push:
    branches:
      - refactor/source-owned-no-overrides-20260912
    paths:
      - .github/workflows/final-premerge-wrapper-audit-once-v2.yml

permissions:
  contents: write

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refactor/source-owned-no-overrides-20260912
          fetch-depth: 0

      - name: Fetch main
        run: git fetch origin main

      - name: Final static premerge gate
        shell: bash
        run: |
          set -euo pipefail
          git diff --check origin/main...HEAD
          python - <<'PY'
          from pathlib import Path
          import re, subprocess

          audit = '.github/workflows/final-premerge-wrapper-audit-once-v2.yml'
          expected = {
            'index.html','olli-attendance-policy-runtime.js','olli-auth-entry-ui.js',
            'olli-data-record-list.js','olli-data-students.js','olli-data-ui-utils.js',
            'olli-feedback-registration-runtime.js','olli-feedback-runtime.js','olli-operations-feedback-policy.js',
            'olli-record-list-view.js','olli-record-memo-storage.js','olli-record-room-navigation.js',
            'olli-record-sort-student-ui.js','olli-record-student-picker.js','olli-settings-account-runtime.js',
            'olli-settings-base.js','olli-settings-detail.js','olli-student-info-runtime.js',
            'olli-student-schedule-runtime.js','pc-settings-layout.js','pc-shell.js',
            'pc-student-class-routing.js','pc-student-info-card-runtime.js','pc-timetable.js',
          }
          changed=set(subprocess.check_output(['git','diff','--name-only','origin/main...HEAD'], text=True).splitlines())
          actual_app=changed-{audit}
          if actual_app != expected:
            raise SystemExit(f'changed-file set mismatch\nmissing={sorted(expected-actual_app)}\nunexpected={sorted(actual_app-expected)}')
          print('CHANGED_FILE_SET_PASS',len(actual_app))

          main_sha=subprocess.check_output(['git','rev-parse','origin/main'],text=True).strip()
          merge_base=subprocess.check_output(['git','merge-base','HEAD','origin/main'],text=True).strip()
          if merge_base != main_sha:
            raise SystemExit(f'branch base mismatch: main={main_sha} merge_base={merge_base}')
          print('MAIN_BASE_PASS',main_sha)

          jshtml=[p for p in Path('.').rglob('*') if p.is_file() and p.suffix.lower() in {'.js','.html'} and '.git' not in p.parts]
          decl_owners={
            'showOlliLoginEntry':'olli-auth-entry-ui.js','showOlliOwnerLogin':'olli-auth-entry-ui.js','showOlliAccountCreate':'olli-auth-entry-ui.js',
            'openSettingsPage':'olli-settings-base.js','closeSettingsPage':'olli-settings-base.js',
            'openSettingsDetail':'olli-settings-detail.js','closeSettingsDetail':'olli-settings-detail.js',
            'openStudentModal':'olli-record-memo-storage.js','confirmStudent':'olli-record-memo-storage.js',
            'renderElementaryStudentRows':'olli-record-list-view.js','renderKinderStudentRows':'olli-record-list-view.js',
            'updateRecordHeaderUI':'olli-record-room-navigation.js',
          }
          for name,owner in decl_owners.items():
            decl=[]; assigns=[]
            dpat=re.compile(rf'\b(?:async\s+)?function\s+{re.escape(name)}\s*\(')
            apat=re.compile(rf'(?:window|global)\.{re.escape(name)}\s*=(?!=)')
            for p in jshtml:
              for i,line in enumerate(p.read_text(errors='ignore').splitlines(),1):
                if dpat.search(line): decl.append(f'{p}:{i}')
                if apat.search(line): assigns.append(f'{p}:{i}')
            if len(decl)!=1 or not decl[0].startswith(owner+':'):
              raise SystemExit(f'canonical declaration mismatch {name}: {decl}')
            foreign=[loc for loc in assigns if not loc.startswith(owner+':')]
            if foreign:
              raise SystemExit(f'canonical function overwritten outside owner {name}: {foreign}')
          print('CANONICAL_DECLARATION_OWNERS_PASS')

          assignment_owners={
            'olliPrepareStudentAddExtra':'olli-record-sort-student-ui.js','olliGetStudentAddExtra':'olli-record-sort-student-ui.js',
            'olliPrepareInfoExtra':'olli-record-sort-student-ui.js','olliGetInfoExtra':'olli-record-sort-student-ui.js',
            'olliGetStudentAddSchedulePairs':'pc-student-info-card-runtime.js','olliGetInfoSchedulePairs':'pc-student-info-card-runtime.js',
            'olliStudentScheduleAfterPatchStudentModalMarkup':'olli-student-schedule-runtime.js',
            'olliStudentScheduleAfterPrepareStudentAdd':'olli-student-schedule-runtime.js','olliStudentScheduleAugmentStudentAddExtra':'olli-student-schedule-runtime.js',
            'olliStudentScheduleAfterPrepareInfo':'olli-student-schedule-runtime.js','olliStudentScheduleAugmentInfoExtra':'olli-student-schedule-runtime.js',
            'olliPcAuthoritativeScheduleAfterPrepareStudentAdd':'pc-student-info-card-runtime.js',
            'olliPcAuthoritativeScheduleAugmentStudentAddExtra':'pc-student-info-card-runtime.js',
            'olliPcAuthoritativeScheduleAfterPrepareInfo':'pc-student-info-card-runtime.js','olliPcAuthoritativeScheduleAugmentInfoExtra':'pc-student-info-card-runtime.js',
            'olliPcClassRoutingAfterPrepareStudentAdd':'pc-student-class-routing.js','olliPcClassRoutingFinalizeStudentAddExtra':'pc-student-class-routing.js',
            'olliTimetableAfterPrepareStudentInfo':'pc-timetable.js',
            'olliPcSettingsLayoutBeforeOpenPage':'pc-settings-layout.js','olliPcSettingsLayoutAfterOpenPage':'pc-settings-layout.js',
            'olliPcSettingsLayoutAfterClosePage':'pc-settings-layout.js','olliPcSettingsLayoutBeforeOpenDetail':'pc-settings-layout.js',
            'olliPcSettingsLayoutAfterOpenDetail':'pc-settings-layout.js','olliPcSettingsLayoutAfterCloseDetail':'pc-settings-layout.js',
            'olliPcSettingsLayoutBeforeOpenSection':'pc-settings-layout.js',
          }
          for name,owner in assignment_owners.items():
            locs=[]; pat=re.compile(rf'(?:window|global)\.{re.escape(name)}\s*=(?!=)')
            for p in jshtml:
              for i,line in enumerate(p.read_text(errors='ignore').splitlines(),1):
                if pat.search(line): locs.append(f'{p}:{i}')
            if len(locs)!=1 or not locs[0].startswith(owner+':'):
              raise SystemExit(f'extension owner mismatch {name}: {locs}')
          print('EXTENSION_POINT_OWNERS_PASS')

          banned=[
            'oldPatchStudentModalMarkup','oldPrepareStudentAddExtra','oldGetStudentAddExtra','oldPrepareInfoExtra','oldGetInfoExtra',
            'const basePrepareAdd = global.olliPrepareStudentAddExtra','const baseGetAdd = global.olliGetStudentAddExtra',
            'const basePrepareInfo = global.olliPrepareInfoExtra','const baseGetInfo = global.olliGetInfoExtra',
            'previousElementaryRenderer','previousKinderRenderer','previousPcSection = global.pcOpenSection',
          ]
          whole='\n'.join(p.read_text(errors='ignore') for p in jshtml)
          hits=[token for token in banned if token in whole]
          if hits: raise SystemExit(f'legacy wrapper signatures remain: {hits}')
          print('LEGACY_WRAPPER_SIGNATURES_PASS')

          memo=Path('olli-record-memo-storage.js').read_text()
          card=Path('pc-student-info-card-runtime.js').read_text()
          student_info=Path('olli-student-info-runtime.js').read_text()
          p=memo.index('const savedStudent = await ensureStudentSavedToSupabase(newStudent);')
          c=memo.index("if (registrationRouting?.handled === true && typeof window.olliCommitStudentRegistrationRouting === 'function')",p)
          f=memo.index("else if (typeof window.saveOlliStudentScheduleFromInfo === 'function')",c)
          r=memo.index("if (registrationRouting?.handled === true && typeof window.olliReleaseStudentRegistrationRouting === 'function')",f)
          if not p<c<f<r: raise SystemExit('new student save/routing/release order changed')
          ep=card.index('const savedStudent = await global.ensureStudentSavedToSupabase(profile);')
          es=card.index('await setAuthoritativeSchedule(savedStudent.id, pairs);',ep)
          if not ep<es: raise SystemExit('existing student profile/schedule order changed')
          save_start=card.index('async function saveStudentInfoCard'); save_end=card.index('function isStudentInfoEditEvent',save_start)
          if "className: ''" in card[save_start:save_end]: raise SystemExit('existing student card can erase className')
          if "className: ''" in student_info: raise SystemExit('student info runtime can erase className')
          print('DATA_PRESERVATION_ORDER_PASS')

          rpc='olli_schedule_set_student_weekly_schedule'; rpc_files=set()
          for pth in jshtml:
            if rpc in pth.read_text(errors='ignore'): rpc_files.add(str(pth))
          if rpc_files != {'pc-student-class-routing.js','pc-student-info-card-runtime.js'}:
            raise SystemExit(f'unexpected weekly schedule RPC owners: {sorted(rpc_files)}')
          print('SCHEDULE_RPC_OWNERS_PASS')

          if any(name.endswith('.sql') or name.startswith('supabase/') for name in actual_app): raise SystemExit('unexpected DB/schema file changed')
          print('DB_SCHEMA_UNTOUCHED_PASS')
          PY

          for f in $(git diff --name-only origin/main...HEAD | grep -E '\.js$'); do node --check "$f"; done
          echo JS_SYNTAX_PASS

      - name: Combined browser load smoke
        shell: bash
        run: |
          set -euo pipefail
          cat > final-premerge-smoke.js <<'JS'
          (function(){
            const required=[
              'showOlliLoginEntry','showOlliOwnerLogin','showOlliAccountCreate','openSettingsPage','closeSettingsPage','openSettingsDetail','closeSettingsDetail',
              'openStudentModal','confirmStudent','renderElementaryStudentRows','renderKinderStudentRows','updateRecordHeaderUI','getOlliAttendancePolicyCounts',
              'olliPrepareStudentAddExtra','olliGetStudentAddExtra','olliPrepareInfoExtra','olliGetInfoExtra','olliGetStudentAddSchedulePairs','olliGetInfoSchedulePairs',
              'saveOlliPcStudentInfoCard','olliPrepareStudentRegistrationRouting','olliCommitStudentRegistrationRouting','installFeedbackInputGuards','submitKinderChatFeedback'
            ];
            function finish(){
              const missing=required.filter(name=>typeof window[name]!=='function');
              const pre=document.createElement('pre'); pre.id='finalPremergeSmokeResult';
              pre.textContent=missing.length?'FINAL_SMOKE_FAIL '+JSON.stringify(missing):'FINAL_SMOKE_PASS'; document.body.appendChild(pre);
            }
            if(document.readyState==='complete')setTimeout(finish,500);else window.addEventListener('load',()=>setTimeout(finish,500),{once:true});
          })();
          JS
          python - <<'PY'
          from pathlib import Path
          src=Path('index.html').read_text(); marker='</body>'
          if marker not in src: raise SystemExit('body end missing')
          Path('final-premerge-smoke.html').write_text(src.replace(marker,'\n<script src="final-premerge-smoke.js"></script>\n'+marker,1))
          PY
          CHROME="$(command -v google-chrome-stable || command -v google-chrome || command -v chromium || true)"; test -n "$CHROME"
          python3 -m http.server 8766 >/tmp/final-premerge-server.log 2>&1 & SERVER_PID=$!; trap 'kill $SERVER_PID 2>/dev/null || true' EXIT; sleep 1
          "$CHROME" --headless=new --no-sandbox --disable-gpu --disable-dev-shm-usage --user-data-dir=/tmp/final-premerge-profile --virtual-time-budget=30000 --dump-dom http://127.0.0.1:8766/final-premerge-smoke.html >/tmp/final-premerge-dom.txt 2>/tmp/final-premerge-chrome.err || true
          grep -n 'FINAL_SMOKE_' /tmp/final-premerge-dom.txt || true
          if ! grep -q 'FINAL_SMOKE_PASS' /tmp/final-premerge-dom.txt; then tail -100 /tmp/final-premerge-chrome.err || true; exit 1; fi
          echo COMBINED_BROWSER_SMOKE_PASS

      - name: Cleanup audit workflow
        if: always()
        shell: bash
        run: |
          rm -f final-premerge-smoke.js final-premerge-smoke.html
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          rm -f .github/workflows/final-premerge-wrapper-audit-once-v2.yml
          git add -A
          git commit -m "chore: remove final premerge wrapper audit v2" || true
          git push origin HEAD:refactor/source-owned-no-overrides-20260912