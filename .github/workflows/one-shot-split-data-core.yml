name: Finalize data module split
on:
  push:
    paths:
      - '.github/workflows/one-shot-split-data-core.yml'
permissions:
  contents: write
jobs:
  finalize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Update module guide and verify data split
        run: |
          python3 - <<'PY'
          from pathlib import Path

          doc_path = Path('OLLI_PC_MODULES.md')
          doc = doc_path.read_text(encoding='utf-8')

          old_table = '| Supabase 호출·학생/피드백 공통 저장·저장 큐 | `olli-data-core.js` | - |'
          new_table = '''| Supabase REST·공통 피드백 저장 기반·저장 오류 기록 | `olli-data-foundation.js` | - |
          | 일반/성장/종합 피드백 저장·자동저장 연결 | `olli-data-feedback.js` | - |
          | 상담용 종합 피드백 생성·자동확인·대시보드 상태 | `olli-data-consultation-summary.js` | - |
          | 학생 로컬 모델·그룹 피드백 월·학년/나이 생명주기 | `olli-data-students.js` | - |
          | 기록 목록 정렬·그룹 아이콘·학생 선택/롱프레스 | `olli-data-record-list.js` | - |
          | 성향기록부 학생 피드백 시트·복사·삭제·재생성 | `olli-data-attendance-feedback.js` | - |
          | 학생 이관·상태/삭제·Supabase 학생 저장·백그라운드 동기화 | `olli-data-student-operations.js` | - |
          | 등록일/메타 표시·복사/공유·저장 모달·API 응답 유틸 | `olli-data-ui-utils.js` | - |'''.replace('          ', '')
          if doc.count(old_table) != 1:
              raise SystemExit('data table marker mismatch')
          doc = doc.replace(old_table, new_table, 1)

          old_rule = '- Supabase 직접 호출과 학생/피드백 공통 저장 흐름은 `olli-data-core.js`, 기록 에디터 공용 동작은 `olli-record-editor-core.js`, 기록실/출석 공용 동작은 `olli-record-room-core.js`에서 수정한다. 이 코드를 다시 `index.html`로 복사하지 않는다.'
          new_rule = '- 데이터 공통 흐름은 역할에 따라 `olli-data-foundation.js`, `olli-data-feedback.js`, `olli-data-consultation-summary.js`, `olli-data-students.js`, `olli-data-record-list.js`, `olli-data-attendance-feedback.js`, `olli-data-student-operations.js`, `olli-data-ui-utils.js`로 나뉜다. 기록 에디터 공용 동작은 `olli-record-editor-core.js`, 기록실/출석 공용 동작은 `olli-record-room-core.js`에서 수정하며 이 코드를 다시 `index.html`로 복사하지 않는다.'
          if doc.count(old_rule) != 1:
              raise SystemExit('data rule marker mismatch')
          doc = doc.replace(old_rule, new_rule, 1)

          observation_heading = '## 관찰기록·피드백 모듈 경계'
          data_section = '''## 데이터 모듈 경계

          - `olli-data-foundation.js`: Supabase REST 호출, 공통 피드백 저장 브리지, 저장 오류 기록과 데이터 계층의 공통 기반.
          - `olli-data-feedback.js`: 일반·성장·종합 피드백 저장, 저장 대상 학생 확인/생성, 피드백 저장 후 화면 갱신.
          - `olli-data-consultation-summary.js`: 상담 자료 범위 계산, 종합 피드백 생성, 상담 예정 학생 자동 확인과 대시보드 상태.
          - `olli-data-students.js`: 학생 로컬 저장/마이그레이션, 초등 그룹 피드백 월, 학년·나이 자동 갱신과 학생 생명주기.
          - `olli-data-record-list.js`: 성향기록부/기록 목록 정렬, 그룹 아이콘, 학생 선택과 롱프레스 동작.
          - `olli-data-attendance-feedback.js`: 학생별 피드백 시트 조회·렌더링·복사·삭제·종합 피드백 재생성.
          - `olli-data-student-operations.js`: 유치→초등 이관, 학생 상태/삭제, 학원 범위 헬퍼, 학생 Supabase 저장·상태 동기화·백그라운드 동기화.
          - `olli-data-ui-utils.js`: 등록일/학생 메타 표시, 복사·공유·저장 모달, API 응답/오류 유틸과 실패 설문 상수.

          이 8개 파일은 기존 `olli-data-core.js`를 실행 순서 그대로 기능 경계에서 분리한 것이다. 같은 전역 함수/상태를 순차적으로 공유하므로 ES module처럼 독립 로딩하거나 순서를 바꾸지 않는다.

          '''.replace('          ', '')
          if doc.count(observation_heading) != 1:
              raise SystemExit('observation heading marker mismatch')
          doc = doc.replace(observation_heading, data_section + observation_heading, 1)

          old_load = '공통 코어는 `index.html`에서 원래 실행되던 위치를 그대로 유지한다. `olli-data-core.js`, `olli-record-editor-core.js`, `olli-record-room-core.js`, 설정 모듈 묶음, `olli-auth-core.js`, `olli-storage-core.js`를 임의로 문서 맨 아래로 이동하거나 `defer` 처리하지 않는다.\n\n설정 모듈은 다음 순서를 유지한다.'
          new_load = '''공통 코어는 `index.html`에서 원래 실행되던 위치를 그대로 유지한다. 데이터 모듈 묶음, `olli-record-editor-core.js`, `olli-record-room-core.js`, 설정 모듈 묶음, `olli-auth-core.js`, `olli-storage-core.js`를 임의로 문서 맨 아래로 이동하거나 `defer` 처리하지 않는다.

          데이터 모듈은 다음 순서를 유지한다.

          1. `olli-data-foundation.js`
          2. `olli-data-feedback.js`
          3. `olli-data-consultation-summary.js`
          4. `olli-data-students.js`
          5. `olli-data-record-list.js`
          6. `olli-data-attendance-feedback.js`
          7. `olli-data-student-operations.js`
          8. `olli-data-ui-utils.js`

          이 순서 뒤에 `elementary-analysis.js`, `olli-record-editor-core.js`, `observation-memo-core.js`, `olli-record-room-core.js`가 이어진다. 데이터 모듈은 기존 한 파일의 실행 순서를 보존한 것이므로 중간 순서를 바꾸지 않는다.

          설정 모듈은 다음 순서를 유지한다.'''.replace('          ', '')
          if doc.count(old_load) != 1:
              raise SystemExit('load-order marker mismatch')
          doc = doc.replace(old_load, new_load, 1)

          old_check = '- 기록실·출석 공용 동작은 `olli-record-room-core.js`, 기록 편집/학생 선택 공용 동작은 `olli-record-editor-core.js`에서 먼저 확인한다.'
          new_check = '- 데이터 수정은 공통 Supabase/저장 기반=`olli-data-foundation.js`, 피드백 저장=`olli-data-feedback.js`, 상담 종합분석=`olli-data-consultation-summary.js`, 학생 모델/생명주기=`olli-data-students.js`, 기록 목록=`olli-data-record-list.js`, 학생 피드백 시트=`olli-data-attendance-feedback.js`, 학생 저장/상태/동기화=`olli-data-student-operations.js`, 공통 표시/복사 유틸=`olli-data-ui-utils.js`부터 확인한다.\n' + old_check
          if doc.count(old_check) != 1:
              raise SystemExit('precheck marker mismatch')
          doc = doc.replace(old_check, new_check, 1)

          if 'olli-data-core.js' in doc:
              raise SystemExit('stale olli-data-core.js reference remains in guide')
          doc_path.write_text(doc, encoding='utf-8')

          expected = [
              'olli-data-foundation.js', 'olli-data-feedback.js', 'olli-data-consultation-summary.js',
              'olli-data-students.js', 'olli-data-record-list.js', 'olli-data-attendance-feedback.js',
              'olli-data-student-operations.js', 'olli-data-ui-utils.js'
          ]
          idx = Path('index.html').read_text(encoding='utf-8')
          positions = []
          for name in expected:
              if not Path(name).exists():
                  raise SystemExit(f'missing {name}')
              marker = f'<script src="{name}"></script>'
              if idx.count(marker) != 1:
                  raise SystemExit(f'bad index reference for {name}')
              positions.append(idx.index(marker))
          if positions != sorted(positions):
              raise SystemExit('data module order changed')
          if Path('olli-data-core.js').exists() or 'olli-data-core.js' in idx:
              raise SystemExit('obsolete data core remains')
          PY
      - name: Syntax check data modules
        run: |
          set -e
          for f in olli-data-foundation.js olli-data-feedback.js olli-data-consultation-summary.js olli-data-students.js olli-data-record-list.js olli-data-attendance-feedback.js olli-data-student-operations.js olli-data-ui-utils.js; do
            node --check "$f"
          done
      - name: Remove temporary workflows and commit
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/audit-data-core.yml .github/workflows/one-shot-split-data-core.yml
          git add OLLI_PC_MODULES.md
          git commit -m 'Document finalized data modules'
          git push