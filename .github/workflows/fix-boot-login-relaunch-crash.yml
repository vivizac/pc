name: Fix boot login relaunch crash

on:
  push:
    branches:
      - fix/boot-login-relaunch-crash-20260915
    paths:
      - '.github/workflows/fix-boot-login-relaunch-crash.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply focused boot patch
        run: python3 .github/tmp/revert_boot_inline_style.py
      - name: Verify boot screen uses stylesheet as single source
        run: |
          grep -F '<div aria-hidden="true" class="olliBootScreen" id="olliBootScreen">' index.html
          ! grep -F 'id="olliBootScreen" style=' index.html
          grep -F '.olliBootScreen {' index.html
          grep -F 'display: flex;' index.html
          grep -F 'align-items: center;' index.html
          grep -F 'justify-content: center;' index.html
      - name: Clean temporary patch files and commit
        run: |
          rm -f .github/tmp/revert_boot_inline_style.py
          rm -f .github/workflows/fix-boot-login-relaunch-crash.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "fix: restore boot screen startup source"
          git push origin HEAD:${GITHUB_REF_NAME}
