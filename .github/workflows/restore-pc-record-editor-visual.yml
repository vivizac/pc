name: Restore PC record editor visual
on:
  push:
    paths:
      - '.github/workflows/restore-pc-record-editor-visual.yml'
      - '.github/tmp/restore_pc_record_editor_visual.py'
permissions:
  contents: write
jobs:
  restore:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Restore exact pre-split PC editor UI
        run: python3 .github/tmp/restore_pc_record_editor_visual.py
      - name: Validate
        run: |
          node --check pc-kinder-feedback.js
          node --check pc-record-editor.js
          node --check pc-attendance.js
          git diff --check
          test ! -e kinder-feedback.js
          test ! -e kinder-feedback-ui.js
          test ! -e kinder-feedback.css
          if grep -q "moveScreenIntoHost" pc-attendance.js; then exit 1; fi
      - name: Commit and clean temporary files
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/restore-pc-record-editor-visual.yml .github/tmp/restore_pc_record_editor_visual.py
          git add pc-record-editor.js pc-record-editor.css pc-kinder-feedback.js index.html
          git commit -m 'PC 관찰노트·1분피드백을 분리 직전 화면 그대로 복원'
          git push
