name: One-shot extract index feature cores
on:
  push:
    paths:
      - '.github/workflows/one-shot-extract-index-feature-cores.yml'
permissions:
  contents: write
jobs:
  extract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Extract remaining large cohesive inline scripts
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import re

          p=Path('index.html')
          text=p.read_text(encoding='utf-8')
          original=len(text.encode('utf-8'))
          pat=re.compile(r'<script\b([^>]*)>([\s\S]*?)</script\s*>',re.I)
          matches=list(pat.finditer(text))

          targets=[
            {
              'file':'olli-data-core.js',
              'markers':['function supabase(', 'function getFeedbackCommonStorageFeature('],
              'min_size':150000,
              'replacement':'<script src="olli-data-core.js"></script>'
            },
            {
              'file':'olli-record-editor-core.js',
              'markers':['function cleanMemoStudentPickerText(', 'function getMemoStudentsForPicker('],
              'min_size':90000,
              'replacement':'<script src="olli-record-editor-core.js"></script>'
            },
            {
              'file':'olli-record-room-core.js',
              'markers':['function isWithdrawnVisibleInAttendance(', 'function getRecordDailyAttendanceStorageKey('],
              'min_size':100000,
              'replacement':'<script src="olli-record-room-core.js"></script>'
            }
          ]

          chosen=[]
          for target in targets:
              found=[]
              for m in matches:
                  attrs,body=m.group(1),m.group(2)
                  if re.search(r'\bsrc\s*=',attrs,re.I):continue
                  if all(marker in body for marker in target['markers']):found.append(m)
              if len(found)!=1:
                  raise RuntimeError(f"{target['file']}: expected 1 matching script, found {len(found)}")
              m=found[0]; body=m.group(2)
              if len(body)<target['min_size']:
                  raise RuntimeError(f"{target['file']}: body unexpectedly small {len(body)}")
              chosen.append((m.start(),m.end(),target,body))

          if len({(s,e) for s,e,_,_ in chosen})!=len(chosen):raise RuntimeError('overlapping target blocks')

          for _,_,target,body in chosen:
              Path(target['file']).write_text(body.strip('\n')+'\n',encoding='utf-8')
              print(target['file'],len(body),'chars')
          for s,e,target,_ in sorted(chosen,key=lambda x:x[0],reverse=True):
              text=text[:s]+target['replacement']+text[e:]
          p.write_text(text,encoding='utf-8')
          now=len(text.encode('utf-8'))
          print('index bytes',original,'->',now,'saved',original-now)
          PY
      - name: Verify extraction and syntax
        shell: bash
        run: |
          set -euo pipefail
          node --check olli-data-core.js
          node --check olli-record-editor-core.js
          node --check olli-record-room-core.js
          grep -q '<script src="olli-data-core.js"></script>' index.html
          grep -q '<script src="olli-record-editor-core.js"></script>' index.html
          grep -q '<script src="olli-record-room-core.js"></script>' index.html
          ! grep -q 'function getFeedbackCommonStorageFeature(' index.html
          ! grep -q 'function cleanMemoStudentPickerText(' index.html
          ! grep -q 'function getRecordDailyAttendanceStorageKey(' index.html
          grep -q 'function getFeedbackCommonStorageFeature(' olli-data-core.js
          grep -q 'function cleanMemoStudentPickerText(' olli-record-editor-core.js
          grep -q 'function getRecordDailyAttendanceStorageKey(' olli-record-room-core.js
          node <<'NODE'
          const fs=require('fs'),vm=require('vm');
          const html=fs.readFileSync('index.html','utf8');
          const re=/<script\b([^>]*)>([\s\S]*?)<\/script\s*>/gi;
          let m,n=0;
          while((m=re.exec(html))){
            const attrs=m[1]||'',body=m[2]||'';
            if(/\bsrc\s*=/.test(attrs)||/type\s*=\s*["'](?:application\/json|application\/ld\+json)["']/.test(attrs)) continue;
            n++;
            try{new vm.Script(body,{filename:`inline-${n}.js`});}
            catch(e){console.error(e.stack||e.message);process.exit(1)}
          }
          console.log('remaining inline scripts checked',n);
          NODE
          echo "index bytes: $(wc -c < index.html)"
      - name: Commit extracted modules
        shell: bash
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add index.html olli-data-core.js olli-record-editor-core.js olli-record-room-core.js
          git commit -m 'Extract data and record cores from index'
          git push
