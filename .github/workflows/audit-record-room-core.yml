name: Audit record room core
on:
  push:
    paths:
      - '.github/workflows/audit-record-room-core.yml'
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Audit structure
        run: |
          set -e
          node --check olli-record-room-core.js
          python3 - <<'PY'
          from pathlib import Path
          import re
          p=Path('olli-record-room-core.js')
          text=p.read_text(encoding='utf-8')
          lines=text.splitlines()
          print('LINE_COUNT', len(lines))
          print('BYTE_COUNT', len(text.encode('utf-8')))
          print('TOP_LEVEL_DECLARATIONS')
          for i,line in enumerate(lines,1):
              if re.match(r'^(?:async\s+)?function\s+[A-Za-z_$][\w$]*\s*\(', line) or re.match(r'^(?:const|let|var)\s+[A-Za-z_$][\w$]*\s*=', line):
                  print(f'{i}: {line[:180]}')
          PY
      - name: Audit external references
        run: |
          set -e
          symbols=(
            renderElementaryRecords renderKinderRecords confirmDeleteRecordBoardSelected
            getOlliConsultationRules getOlliConsultationProgress getConsultationDueTasksForStudent toggleAcademyConsultationCompleted
            renderRecordAcademyManagementDashboard loadRecords openElementaryInfoModal openKinderInfoModal
            showOlliBootScreen hideOlliBootScreen
            handleKinderSceneCardTap openKinderSceneInfo resetOneMinuteFeedback insertTemplate requestSceneCardFeedback
            getTodayFeedbackItems createTodayFeedbackItem addCompletedTodayFeedback saveTodayFeedbackItem startTodayFeedbackRequest
          )
          for symbol in "${symbols[@]}"; do
            echo "===== $symbol ====="
            grep -RInF --exclude='olli-record-room-core.js' --exclude='audit-record-room-core.yml' --exclude-dir='.git' "$symbol" . || true
          done
          echo '===== DOM / legacy markers ====='
          for marker in kinderSceneInfo sceneMemoInput oneMinuteFeedbackScreen todayFeedbackPage recordList elementaryInfoModal kinderInfoModal olliBootScreen; do
            echo "--- $marker ---"
            grep -RInF --exclude='olli-record-room-core.js' --exclude='audit-record-room-core.yml' --exclude-dir='.git' "$marker" . || true
          done