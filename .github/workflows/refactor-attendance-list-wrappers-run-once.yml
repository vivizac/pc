name: Run attendance list wrapper refactor once

on:
  push:
    branches:
      - refactor/source-owned-no-overrides-20260912
    paths:
      - .github/workflows/refactor-attendance-list-wrappers-run-once.yml

permissions:
  contents: write

jobs:
  refactor:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refactor/source-owned-no-overrides-20260912
          fetch-depth: 0
      - name: Apply refactor
        run: python .github/tmp/refactor_attendance_list_wrappers.py
      - name: Validate
        run: |
          node --check olli-record-list-view.js
          node --check olli-attendance-policy-runtime.js
          node --check olli-record-room-navigation.js
          git diff --check
          ! grep -q "previousElementaryRenderer\|previousKinderRenderer" olli-attendance-policy-runtime.js
          ! grep -q "originalRenderElementaryStudentRows\|originalRenderKinderStudentRows" index.html
          ! grep -q "__olliAttendanceAlignWrapped" index.html
          grep -q "isRecordAttendanceGuideModeActive" index.html
          grep -q "getOlliAttendancePolicyCounts" olli-record-list-view.js
          grep -q "olliEnsureRecordAttendanceGuideButton" olli-record-room-navigation.js
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          rm -f .github/workflows/refactor-attendance-list-wrappers-once.yml
          rm -f .github/workflows/refactor-attendance-list-wrappers-run-once.yml
          rm -f .github/tmp/refactor_attendance_list_wrappers.py
          git add -A
          git commit -m "refactor: source-own PC attendance student list rendering"
          git push origin HEAD:refactor/source-owned-no-overrides-20260912
