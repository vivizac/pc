name: Apply remove attendance title

on:
  push:
    branches:
      - fix/remove-attendance-title-20260914
    paths:
      - .github/workflows/apply-remove-attendance-title.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply patch
        run: python .github/tmp/remove_attendance_title.py
      - name: Commit source change
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "style: remove attendance register title"
          git push
