name: One-shot extract kinder feedback UI and analysis detail

on:
  push:
    paths:
      - '.github/workflows/one-shot-extract-kinder-feedback-ui-and-analysis-detail.yml'

permissions:
  contents: write

jobs:
  extract:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Extract remaining shared observation UI
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import json

          index = Path('index.html')
          text = index.read_text(encoding='utf-8')

          def extract_block(source, start_marker, end_marker, replacement):
              start = source.find(start_marker)
              if start < 0:
                  raise SystemExit(f'start marker not found: {start_marker}')
              end = source.find(end_marker, start)
              if end < 0:
                  raise SystemExit(f'end marker not found: {end_marker}')
              block = source[start:end]
              return source[:start] + replacement + source[end:], block

          # 1) 유치부 1분 피드백의 정적 DOM을 기능/스타일과 같은 모듈 묶음으로 분리.
          text, kcf_html = extract_block(
              text,
              '<!-- PAGE: 유치부 대화형 1분 피드백 -->',
              '<script src="kinder-feedback.js"></script>',
              '<script src="kinder-feedback-ui.js"></script>\n'
          )
          kcf_ui = """(function () {\n  'use strict';\n  const script = document.currentScript;\n  if (!script || document.getElementById('kinderChatFeedbackScreen')) return;\n  const html = KCF_HTML;\n  script.insertAdjacentHTML('beforebegin', html);\n})();\n"""
          kcf_ui = kcf_ui.replace('KCF_HTML', json.dumps(kcf_html, ensure_ascii=False))
          Path('kinder-feedback-ui.js').write_text(kcf_ui, encoding='utf-8')

          # 2) 초등 분석 상세보기 함수가 index.html의 DOMContentLoaded 블록에 남아 있어
          #    분석 공용 모듈로 이동한다. window export는 기존 위치에 유지한다.
          detail_start = 'function buildElementaryAnalysisDetailSections(state) {'
          detail_end = 'window.applyElementaryAnalysisToMemo = applyElementaryAnalysisToMemo;'
          text, detail_js = extract_block(text, detail_start, detail_end, '')

          analysis_path = Path('elementary-analysis.js')
          analysis_js = analysis_path.read_text(encoding='utf-8')
          if 'function buildElementaryAnalysisDetailSections(state)' in analysis_js:
              raise SystemExit('elementary analysis detail functions already extracted')
          analysis_js = analysis_js.rstrip() + '\n\n/* 초등 분석 상세보기 공용 UI 로직 */\n' + detail_js.strip() + '\n'
          analysis_path.write_text(analysis_js, encoding='utf-8')

          index.write_text(text, encoding='utf-8')
          PY

      - name: Verify extraction
        shell: bash
        run: |
          test -s kinder-feedback-ui.js
          node --check kinder-feedback-ui.js
          node --check elementary-analysis.js
          grep -q '<script src="kinder-feedback-ui.js"></script>' index.html
          grep -q '<script src="kinder-feedback.js"></script>' index.html
          ! grep -q 'id="kinderChatFeedbackScreen"' index.html
          grep -q 'kinderChatFeedbackScreen' kinder-feedback-ui.js
          ! grep -q '^function buildElementaryAnalysisDetailSections(state)' index.html
          grep -q 'function buildElementaryAnalysisDetailSections(state)' elementary-analysis.js
          grep -q 'function openElementaryAnalysisDetailModal(state, options = {})' elementary-analysis.js
          grep -q 'window.applyElementaryAnalysisToMemo = applyElementaryAnalysisToMemo;' index.html

      - name: Commit extraction
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html kinder-feedback-ui.js elementary-analysis.js
          git commit -m 'Extract kinder feedback UI and analysis detail logic'
          git push
