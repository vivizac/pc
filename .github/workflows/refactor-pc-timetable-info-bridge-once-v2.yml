name: Refactor PC timetable info bridge once v2

on:
  push:
    branches:
      - refactor/source-owned-no-overrides-20260912
    paths:
      - .github/workflows/refactor-pc-timetable-info-bridge-once-v2.yml

permissions:
  contents: write

jobs:
  refactor:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refactor/source-owned-no-overrides-20260912
          fetch-depth: 0
      - name: Apply refactor
        run: python tmp_refactor_pc_timetable_info_bridge.py
      - name: Validate
        run: |
          node --check olli-record-sort-student-ui.js
          node --check pc-timetable.js
          git diff --check
          grep -q "olliTimetableAfterPrepareStudentInfo" olli-record-sort-student-ui.js
          grep -q "global.olliTimetableAfterPrepareStudentInfo = handlePreparedStudentInfo" pc-timetable.js
          ! grep -q "global.olliPrepareInfoExtra = wrapped" pc-timetable.js
          ! grep -q "const original = global.olliPrepareInfoExtra" pc-timetable.js
      - name: Commit and cleanup
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          rm -f tmp_refactor_pc_timetable_info_bridge.py
          rm -f .github/workflows/refactor-pc-timetable-info-bridge-once-v2.yml
          git add -A
          git commit -m "refactor: source-own PC timetable student-info bridge"
          git push origin HEAD:refactor/source-owned-no-overrides-20260912
