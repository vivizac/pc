name: Validate OLLI common source

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'packages/common/**'
      - 'tests/timetable-memo-half-hour.test.cjs'
      - 'tests/pickup-half-hour.test.cjs'
      - 'tests/olli-structured-command-router.test.cjs'
      - 'tests/olli-structured-query-route.test.cjs'
      - 'tests/team-talk-makeup-group-choice.test.cjs'
      - 'tests/team-talk-structured-date-choice.test.cjs'
      - 'supabase/migrations/20261003141000_team_chat_structured_date_choice.sql'
      - 'tests/team-talk-structured-time-choice.test.cjs'
      - 'supabase/migrations/20261004073600_team_chat_structured_time_choice.sql'
      - 'tests/olli-structured-student-name.test.cjs'
      - 'tests/team-talk-structured-student-choice.test.cjs'
      - 'supabase/migrations/20261004081500_team_chat_structured_student_choice.sql'
      - 'supabase/migrations/20261003022400_team_chat_makeup_group_choice.sql'
      - 'supabase/migrations/20261003024500_team_chat_trial_group_choice.sql'
      - 'supabase/migrations/20261003030000_team_chat_waitlist_group_choice.sql'
      - 'supabase/migrations/20261003031500_team_chat_move_group_choice.sql'
      - 'apps/pc/pc-team-talk.js'
      - 'apps/mobile/olli-talk-beta.js'
      - 'apps/mobile/api/olli-agent.js'
      - 'apps/mobile/api/_lib/olli-agent/context-route.cjs'
      - 'apps/pc/scripts/stage-common.cjs'
      - 'apps/mobile/scripts/stage-common.cjs'
      - 'apps/pc/index.html'
      - 'apps/mobile/index.html'
      - 'tests/pc-self-contained-build.test.cjs'
      - 'tests/mobile-self-contained-build.test.cjs'
      - 'tests/pc-build-closure.test.cjs'
      - 'tests/mobile-entry-integrity.test.cjs'
      - '.github/workflows/validate-common-source.yml'
  push:
    branches: [main]
    paths:
      - 'packages/common/**'
      - 'tests/timetable-memo-half-hour.test.cjs'
      - 'tests/pickup-half-hour.test.cjs'
      - 'apps/pc/scripts/stage-common.cjs'
      - 'apps/mobile/scripts/stage-common.cjs'
      - 'apps/pc/index.html'
      - 'apps/mobile/index.html'
      - 'tests/pc-self-contained-build.test.cjs'
      - 'tests/mobile-self-contained-build.test.cjs'
      - 'tests/pc-build-closure.test.cjs'
      - 'tests/mobile-entry-integrity.test.cjs'
      - '.github/workflows/validate-common-source.yml'

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Validate staging scripts
        run: |
          node --check apps/pc/scripts/stage-common.cjs
          node --check apps/mobile/scripts/stage-common.cjs

      - name: Validate common package and app build closure
        run: |
          node --test \
            tests/pc-self-contained-build.test.cjs \
            tests/mobile-self-contained-build.test.cjs \
            tests/pc-build-closure.test.cjs \
            tests/mobile-entry-integrity.test.cjs \
            tests/timetable-memo-half-hour.test.cjs \
            tests/pickup-half-hour.test.cjs \
            tests/olli-structured-command-router.test.cjs \
            tests/olli-structured-query-route.test.cjs \
            tests/team-talk-makeup-group-choice.test.cjs \
            tests/team-talk-structured-date-choice.test.cjs \
            tests/team-talk-structured-time-choice.test.cjs \
            tests/olli-structured-student-name.test.cjs \
            tests/team-talk-structured-student-choice.test.cjs

      - name: Reject platform adapters from common runtime manifests
        run: |
          node - <<'NODE'
          const fs = require('node:fs');
          for (const name of ['pc-runtime-manifest.json','mobile-runtime-manifest.json']) {
            const manifest = JSON.parse(fs.readFileSync('packages/common/' + name, 'utf8'));
            if (!Array.isArray(manifest.files) || !manifest.files.length) throw new Error(name + ' is empty');
            for (const file of manifest.files) {
              if (/(phone|pc)-adapter|attendance-export|risk|notification/i.test(file)) {
                throw new Error('platform-specific file in ' + name + ': ' + file);
              }
              if (!fs.existsSync('packages/common/' + file)) throw new Error('missing common source: ' + file);
            }
          }
          NODE
