name: One-shot extract index core modules
on:
  push:
    paths:
      - '.github/workflows/one-shot-extract-index-core-modules.yml'
permissions:
  contents: write
jobs:
  extract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Extract cohesive inline core modules
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import re

          p=Path('index.html')
          text=p.read_text(encoding='utf-8')
          original_bytes=len(text.encode('utf-8'))
          pat=re.compile(r'<script\b([^>]*)>([\s\S]*?)</script\s*>',re.I)

          targets=[
            {
              'file':'olli-settings-core.js',
              'markers':['function getOlliSettingsLocalKey(', 'function applySettingsPermissionUI('],
              'min_size':250000,
              'replacement':'<script src="olli-settings-core.js"></script>'
            },
            {
              'file':'olli-auth-core.js',
              'markers':['function getOlliAuthAccessToken(', 'function showOlliLoginEntry('],
              'min_size':70000,
              'replacement':'<script src="olli-auth-core.js"></script>'
            },
            {
              'file':'olli-storage-core.js',
              'markers':['function initializeOlliStorageFoundation(', 'function createAcademyContextModule('],
              'min_size':60000,
              'replacement':'<script id="olli-common-storage-foundation-v1" src="olli-storage-core.js"></script>'
            }
          ]

          matches=list(pat.finditer(text))
          chosen=[]
          for target in targets:
              found=[]
              for m in matches:
                  attrs,body=m.group(1),m.group(2)
                  if re.search(r'\bsrc\s*=',attrs,re.I):
                      continue
                  if all(marker in body for marker in target['markers']):
                      found.append(m)
              if len(found)!=1:
                  raise RuntimeError(f"{target['file']}: expected 1 matching script, found {len(found)}")
              m=found[0]
              body=m.group(2)
              if len(body)<target['min_size']:
                  raise RuntimeError(f"{target['file']}: body unexpectedly small: {len(body)}")
              chosen.append((m.start(),m.end(),target,body))

          # Ensure distinct source blocks.
          spans={(s,e) for s,e,_,_ in chosen}
          if len(spans)!=len(chosen):
              raise RuntimeError('target scripts overlap or matched same block')

          # Write modules exactly from original bodies.
          for _,_,target,body in chosen:
              Path(target['file']).write_text(body.strip('\n')+'\n',encoding='utf-8')
              print(target['file'],len(body),'chars')

          # Replace from end to start so positions remain valid.
          for s,e,target,_ in sorted(chosen,key=lambda x:x[0],reverse=True):
              text=text[:s]+target['replacement']+text[e:]

          p.write_text(text,encoding='utf-8')
          new_bytes=len(text.encode('utf-8'))
          print('index bytes',original_bytes,'->',new_bytes,'saved',original_bytes-new_bytes)
          PY
      - name: Verify extraction and syntax
        shell: bash
        run: |
          set -euo pipefail
          node --check olli-settings-core.js
          node --check olli-auth-core.js
          node --check olli-storage-core.js
          grep -q '<script src="olli-settings-core.js"></script>' index.html
          grep -q '<script src="olli-auth-core.js"></script>' index.html
          grep -q '<script id="olli-common-storage-foundation-v1" src="olli-storage-core.js"></script>' index.html
          ! grep -q 'function getOlliSettingsLocalKey(' index.html
          ! grep -q 'function getOlliAuthAccessToken(' index.html
          ! grep -q 'function initializeOlliStorageFoundation(' index.html
          grep -q 'function getOlliSettingsLocalKey(' olli-settings-core.js
          grep -q 'function getOlliAuthAccessToken(' olli-auth-core.js
          grep -q 'function initializeOlliStorageFoundation(' olli-storage-core.js
          node <<'NODE'
          const fs=require('fs'),vm=require('vm');
          const html=fs.readFileSync('index.html','utf8');
          const re=/<script\b([^>]*)>([\s\S]*?)<\/script\s*>/gi;
          let m,n=0;
          while((m=re.exec(html))){
            const attrs=m[1]||'',body=m[2]||'';
            if(/\bsrc\s*=/.test(attrs)||/type\s*=\s*["'](?:application\/json|application\/ld\+json)["']/.test(attrs)) continue;
            n++;
            try{new vm.Script(body,{filename:`inline-${n}.js`});}
            catch(e){console.error(e.stack||e.message);process.exit(1)}
          }
          console.log('remaining inline scripts checked',n);
          NODE
          echo "index bytes: $(wc -c < index.html)"
      - name: Commit extracted modules
        shell: bash
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add index.html olli-settings-core.js olli-auth-core.js olli-storage-core.js
          git commit -m 'Extract settings auth and storage core from index'
          git push
