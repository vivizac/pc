name: Refactor scene card UI integration
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/refactor-scene-card-ui-integration.yml'
permissions:
  contents: write
jobs:
  refactor:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Split scene UI and kinder integration
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          scene_path = Path('olli-record-scene-tools.js')
          index_path = Path('index.html')
          workflow_path = Path('.github/workflows/refactor-scene-card-ui-integration.yml')
          text = scene_path.read_text(encoding='utf-8')

          ui_marker = 'function renderSceneInput()'
          kinder_marker = 'function renderKinderFeedbackSceneGrid()'
          remain_marker = 'function setFeedbackPageBackgroundActive(active)'
          for marker in (ui_marker, kinder_marker, remain_marker):
              if text.count(marker) != 1:
                  raise SystemExit(f'expected exactly one marker: {marker}')

          ui_start = text.index(ui_marker)
          kinder_start = text.index(kinder_marker)
          remain_start = text.index(remain_marker)
          if not (ui_start < kinder_start < remain_start):
              raise SystemExit('unexpected scene function ordering')

          ui_body = text[ui_start:kinder_start].rstrip() + '\n'
          kinder_body = text[kinder_start:remain_start].rstrip() + '\n'
          remaining = (text[:ui_start] + text[remain_start:]).lstrip('\n')

          Path('scene-card-ui-common.js').write_text(
              '/* PC/Phone common scene-card DOM UI and memo interaction. */\n\n' + ui_body,
              encoding='utf-8'
          )
          Path('scene-card-kinder-feedback-common.js').write_text(
              '/* PC/Phone common scene-card bridge for the kinder feedback screen. */\n\n' + kinder_body,
              encoding='utf-8'
          )
          scene_path.write_text(remaining, encoding='utf-8')

          index = index_path.read_text(encoding='utf-8')
          old = '<script src="scene-card-model-common.js"></script>\n<script src="olli-record-scene-tools.js"></script>'
          new = '<script src="scene-card-model-common.js"></script>\n<script src="scene-card-ui-common.js"></script>\n<script src="scene-card-kinder-feedback-common.js"></script>\n<script src="olli-record-scene-tools.js"></script>'
          if index.count(old) != 1:
              raise SystemExit('scene script load block mismatch')
          index = index.replace(old, new, 1)
          index_path.write_text(index, encoding='utf-8')

          scene_after = scene_path.read_text(encoding='utf-8')
          for forbidden in (
              'function renderSceneInput()',
              'function buildSceneCardGridHtml()',
              'function renderKinderFeedbackSceneGrid()',
              'function updateSelectedSceneUI()'
          ):
              if forbidden in scene_after:
                  raise SystemExit(f'scene-tools still contains: {forbidden}')
          for required in (
              'function setFeedbackPageBackgroundActive(active)',
              'function vivizacSlideInPage(pageOrId)',
              'function closeModalById(modalId)'
          ):
              if required not in scene_after:
                  raise SystemExit(f'scene-tools lost required function: {required}')

          ui = Path('scene-card-ui-common.js').read_text(encoding='utf-8')
          kinder = Path('scene-card-kinder-feedback-common.js').read_text(encoding='utf-8')
          for required in ('function renderSceneInput()', 'function buildSceneCardGridHtml()', 'function openSceneCardsFromAnyPage()'):
              if required not in ui:
                  raise SystemExit(f'UI common missing: {required}')
          for required in ('function renderKinderFeedbackSceneGrid()', 'function updateSelectedSceneUI()'):
              if required not in kinder:
                  raise SystemExit(f'kinder common missing: {required}')

          workflow_path.unlink()
          PY
          node --check scene-card-model-common.js
          node --check scene-card-ui-common.js
          node --check scene-card-kinder-feedback-common.js
          node --check olli-record-scene-tools.js
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html olli-record-scene-tools.js scene-card-ui-common.js scene-card-kinder-feedback-common.js .github/workflows/refactor-scene-card-ui-integration.yml
          git commit -m 'refactor: PC 장면카드 UI와 유치부 연동 분리'
          git push origin main
