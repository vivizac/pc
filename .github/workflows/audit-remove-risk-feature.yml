name: Audit remove risk feature
on:
  push:
    paths:
      - '.github/workflows/audit-remove-risk-feature.yml'
jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply v5 cleanup in workspace only
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          wf=Path('.github/workflows/one-shot-remove-risk-feature-v5.yml').read_text(encoding='utf-8')
          sm="          python3 - <<'PY'\n"; em="          PY\n"; pos=0; blocks=[]
          while True:
              s=wf.find(sm,pos)
              if s<0: break
              s+=len(sm); e=wf.find(em,s)
              if e<0: raise RuntimeError('python block end missing')
              block=wf[s:e]
              script='\n'.join(line[10:] if line.startswith('          ') else line for line in block.splitlines())+'\n'
              blocks.append(script); pos=e+len(em)
          if len(blocks)<2: raise RuntimeError('expected at least two python blocks')
          exec(compile(blocks[0],'v5_base.py','exec'),{'__name__':'__main__'})
          exec(compile(blocks[1],'v5_residual.py','exec'),{'__name__':'__main__'})
          PY
      - name: Locate failing inline script
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE'
          const fs=require('fs'),vm=require('vm');
          const html=fs.readFileSync('index.html','utf8');
          const re=/<script\b([^>]*)>([\s\S]*?)<\/script\s*>/gi;
          let m,n=0;
          while((m=re.exec(html))){
            const attrs=m[1]||'', body=m[2]||'';
            if(/\bsrc\s*=/.test(attrs)||/type\s*=\s*["'](?:application\/json|application\/ld\+json)["']/.test(attrs)) continue;
            n++;
            const htmlStartLine=html.slice(0,m.index).split('\n').length;
            try{new vm.Script(body,{filename:`inline-${n}.js`});}
            catch(e){
              console.log('FAILED SCRIPT',n,'HTML START LINE',htmlStartLine);
              console.log(e.stack||e.message);
              const mm=String(e.stack||'').match(new RegExp(`inline-${n}\\.js:(\\d+)`));
              const lineNo=mm?Number(mm[1]):1;
              const lines=body.split('\n');
              const lo=Math.max(0,lineNo-8), hi=Math.min(lines.length,lineNo+8);
              for(let i=lo;i<hi;i++) console.log(`${i+1}: ${lines[i]}`);
              process.exit(0);
            }
          }
          console.log('NO INLINE SYNTAX FAILURE');
          NODE
