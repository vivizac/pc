name: Resume timetable class teacher
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/resume-timetable-class-teacher.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Fix existing timetable service syntax
        shell: bash
        run: |
          python - <<'PYFIX'
          from pathlib import Path
          path = Path('pc-timetable-service.js')
          text = path.read_text()
          old = "days.forEach((day) => times.forEach((time) => pairs.push({ weekday: DAYS.indexOf(day) + 1, time_slot: time }));"
          new = "days.forEach((day) => times.forEach((time) => pairs.push({ weekday: DAYS.indexOf(day) + 1, time_slot: time })));"
          if old not in text:
              raise SystemExit('existing service syntax anchor not found')
          path.write_text(text.replace(old, new, 1))
          PYFIX
      - name: Run prepared class teacher patch
        shell: bash
        run: |
          sed -n "/^          python - <<'PY'$/,/^          PY$/p" .github/workflows/add-timetable-class-teacher.yml | sed '1d;$d;s/^          //' > /tmp/class_teacher_patch.py
          test -s /tmp/class_teacher_patch.py
          python /tmp/class_teacher_patch.py
          node --check pc-timetable-service.js
          node --check pc-timetable.js
          grep -q "olli_schedule_class_teacher_context" pc-timetable-service.js
          grep -q "data-tt-class-teacher" pc-timetable.js
          grep -q "classTeacherLabel" pc-timetable.js
      - name: Commit changes and remove temporary workflows
        shell: bash
        run: |
          rm -f .github/workflows/add-timetable-class-teacher.yml .github/workflows/resume-timetable-class-teacher.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add pc-timetable-service.js pc-timetable.js pc-timetable.css .github/workflows/add-timetable-class-teacher.yml .github/workflows/resume-timetable-class-teacher.yml
          git commit -m "시간표 반 담임과 학생정보 담임을 연동" || exit 0
          git push origin main
