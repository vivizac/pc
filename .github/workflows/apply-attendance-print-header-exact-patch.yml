name: Apply attendance print header exact patch
on:
  push:
    paths:
      - '.github/workflows/apply-attendance-print-header-exact-patch.yml'
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply exact attendance header patch
        run: python scripts/apply_attendance_print_header_exact_patch.py
      - name: Commit exact attendance patch
        run: |
          if git diff --quiet -- index.html; then
            echo "index.html already patched"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Ensure attendance print header spacing"
          git push
