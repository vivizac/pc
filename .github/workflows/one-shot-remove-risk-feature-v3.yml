name: One-shot remove risk feature v3
on:
  push:
    paths:
      - '.github/workflows/one-shot-remove-risk-feature-v3.yml'
permissions:
  contents: write
jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Remove risk feature
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import re

          def balanced_end(text,pos,op='{',cl='}'):
              d=0; q=None; esc=False; line=False; block=False; template=False; i=pos
              while i<len(text):
                  c=text[i]; n=text[i+1] if i+1<len(text) else ''
                  if line:
                      if c=='\n': line=False
                  elif block:
                      if c=='*' and n=='/': block=False; i+=1
                  elif q:
                      if esc: esc=False
                      elif c=='\\': esc=True
                      elif c==q: q=None
                  elif template:
                      if esc: esc=False
                      elif c=='\\': esc=True
                      elif c=='`': template=False
                  else:
                      if c=='/' and n=='/': line=True; i+=1
                      elif c=='/' and n=='*': block=True; i+=1
                      elif c in ('"',"'"): q=c
                      elif c=='`': template=True
                      elif c==op: d+=1
                      elif c==cl:
                          d-=1
                          if d==0:return i+1
                  i+=1
              raise RuntimeError('unbalanced block')

          def remove_function(text,name):
              marker=f'function {name}('
              while marker in text:
                  s=text.find(marker); b=text.find('{',s); e=balanced_end(text,b)
                  while e<len(text) and text[e] in ' \t':e+=1
                  if e<len(text) and text[e]==';':e+=1
                  if e<len(text) and text[e]=='\n':e+=1
                  text=text[:s]+text[e:]
              return text

          def remove_if(text,marker):
              while marker in text:
                  s=text.find(marker); b=text.find('{',s); e=balanced_end(text,b)
                  while e<len(text) and text[e] in ' \t':e+=1
                  if e<len(text) and text[e]=='\n':e+=1
                  text=text[:s]+text[e:]
              return text

          def unwrap_else(text,marker):
              s=text.find(marker)
              if s<0:return text
              b=text.find('{',s); e1=balanced_end(text,b); j=e1
              while j<len(text) and text[j].isspace():j+=1
              if not text.startswith('else',j): raise RuntimeError('expected else for '+marker)
              b2=text.find('{',j); e2=balanced_end(text,b2)
              body=text[b2+1:e2-1]
              return text[:s]+body+text[e2:]

          def tag_end(text,start,tag):
              pat=re.compile(rf'<{tag}\b[^>]*>|</{tag}\s*>',re.I); d=0
              for m in pat.finditer(text,start):
                  d += -1 if m.group(0).lower().startswith(f'</{tag}') else 1
                  if d==0:return m.end()
              raise RuntimeError('unbalanced html')

          def remove_div(text,pattern):
              while True:
                  m=re.search(pattern,text,re.I|re.S)
                  if not m:return text
                  text=text[:m.start()]+text[tag_end(text,m.start(),'div'):]

          def remove_button_class(text,cls):
              pat=rf'<button\b(?=[^>]*class=["\'][^"\']*\b{re.escape(cls)}\b)[^>]*>'
              while True:
                  m=re.search(pat,text,re.I)
                  if not m:return text
                  text=text[:m.start()]+text[tag_end(text,m.start(),'button'):]

          def remove_container_label(text,label,cls):
              while label in text:
                  p=text.find(label); starts=[m.start() for m in re.finditer(rf'<div\b[^>]*class=["\'][^"\']*\b{re.escape(cls)}\b[^"\']*["\'][^>]*>',text[:p],re.I)]
                  if not starts:break
                  s=starts[-1]; text=text[:s]+text[tag_end(text,s,'div'):]
              return text

          def remove_scripts(text,markers):
              pat=re.compile(r'<script\b(?![^>]*src=)[^>]*>([\s\S]*?)</script\s*>',re.I); out=[]; last=0
              for m in pat.finditer(text):
                  if any(x in m.group(1) for x in markers):out.append(text[last:m.start()]);last=m.end()
              out.append(text[last:]);return ''.join(out)

          def remove_registry(text,feature):
              needle=f"feature: '{feature}'"
              while needle in text:
                  p=text.find(needle); s=text.rfind('FeatureRegistry.register({',0,p)
                  if s<0:raise RuntimeError('registry missing '+feature)
                  b=text.find('(',s); e=balanced_end(text,b,'(',')')
                  while e<len(text) and text[e] in ' \t':e+=1
                  if e<len(text) and text[e]==';':e+=1
                  if e<len(text) and text[e]=='\n':e+=1
                  text=text[:s]+text[e:]
              return text

          RISK_CSS=('#kinderRiskMemoScreen','.kinderRisk','.recordNotifyBtn','.recordDoorDot','.hasRiskNotifications','.notificationInbox','.kinderMemoBox')
          def clean_css(css):
              css=re.sub(r'/\*[\s\S]*?\*/',lambda m:'' if ('위험신호' in m.group(0) or 'kinderRisk' in m.group(0)) else m.group(0),css)
              rule=re.compile(r'([^{}]+)\{([^{}]*)\}')
              for _ in range(4):
                  def repl(m):
                      pre=m.group(1); body=m.group(2)
                      if pre.strip().startswith('@') or not any(x in pre for x in RISK_CSS):return m.group(0)
                      sels=[s for s in pre.split(',') if s.strip() and not any(x in s for x in RISK_CSS)]
                      return (','.join(sels)+'{'+body+'}') if sels else ''
                  css=rule.sub(repl,css)
              for x in RISK_CSS:css=re.sub(r'[^{}]*'+re.escape(x)+r'[^{}]*\{[^{}]*\}','',css)
              return css
          def clean_styles(text):
              text=re.sub(r'<style\b[^>]*id=["\']olliKinderRiskUnifiedStyle["\'][^>]*>[\s\S]*?</style\s*>','',text,flags=re.I)
              pat=re.compile(r'(<style\b[^>]*>)([\s\S]*?)(</style\s*>)',re.I)
              return pat.sub(lambda m:m.group(1)+clean_css(m.group(2))+m.group(3),text)

          # index.html
          p=Path('index.html'); t=p.read_text(encoding='utf-8')
          t=re.sub(r'\s*<!-- PAGE: 유치부 관찰노트 -->\s*<script src="kinder-risk-ui\.js"></script>\s*','\n',t)
          t=re.sub(r'\s*<script src="kinder-risk-ui\.js"></script>\s*','\n',t)
          t=remove_button_class(t,'recordNotifyBtn')
          t=remove_container_label(t,'<div class="recordUtilityLabel">관찰노트</div>','recordUtilityBtn')
          t=remove_div(t,r'<div\b(?=[^>]*class=["\'][^"\']*\bkinderRiskInfoPanel\b)[^>]*>')
          t=remove_div(t,r'<div\b(?=[^>]*id=["\']notificationInboxOverlay["\'])[^>]*>')
          for fn in ['getRiskNotificationsStorageKey','hasAnyKinderRiskMemo','updateKinderInfoRiskPanel','updateElementaryInfoRiskPanel','openRiskMemoPageById','openElementaryRiskFromInfoModal','openKinderRiskFromInfoModal','getKinderFilledMemoCount','getSignalLevelByCount','getKinderRiskStageLabel','formatSignalRecordDate','getFocusedKinderSignalIndex','updateKinderRiskStageUI','buildKinderSignalSourceStudent','updateMemoSignalCircle','updateNotificationButtons','openNotificationInbox','closeNotificationInbox','normalizeRiskNotificationMessage','markRiskNotificationHandled','openRiskNotificationTarget']:
              t=remove_function(t,fn)
          t=remove_scripts(t,['function updateDirectorMemoBlockState','function setupKinderDirectorAccordion','const kinderCombinedSelectedSceneIds','function safeRenderKinderCards','function renderKinderRiskModeMenu','function syncKinderRiskButtonLabel','function getKinderKeyboardOffset'])
          t=remove_registry(t,'risk_signal');t=remove_registry(t,'risk_signal_handled')
          t=re.sub(r'^.*elementaryRiskInfoPanel.*\n?','',t,flags=re.M)
          t=re.sub(r'^.*kinderRiskInfoPanel.*openKinderRiskFromInfoModal.*\n?','',t,flags=re.M)
          t=re.sub(r'^\s*window\.(?:sendKinderRiskPush|openNotificationInbox|closeNotificationInbox|openRiskNotificationTarget)\s*=.*\n?','',t,flags=re.M)
          t=re.sub(r'try\s*\{\s*(?:if\s*\(typeof updateNotificationButtons[^\)]*\)\s*)?updateNotificationButtons\(\);?\s*\}\s*catch\s*\([^\)]*\)\s*\{\s*\}','',t)
          t=re.sub(r'if\s*\(typeof updateNotificationButtons[^\)]*\)\s*updateNotificationButtons\(\);?','',t)
          t=t.replace('updateNotificationButtons();','').replace('scheduleNotificationSync();','')
          t=t.replace("'openKinderRiskMemo','openKinderRiskMemoScreen',",'').replace("'openKinderRiskMemo','openKinderRiskMemoScreen'",'')
          for x in ["'kinderRiskMemoScreen',",", 'kinderRiskMemoScreen'","'kinderRiskStudentName',",", 'kinderRiskStudentName'","'kinderObservationNoteTitle',",", 'kinderObservationNoteTitle'"]:t=t.replace(x,'')
          t=t.replace("const fromBottom = page.id === 'kinderRiskMemoScreen';",'const fromBottom = false;')
          t=re.sub(r'^\s*const kinderRiskMemo = document\.getElementById\(["\']kinderRiskMemoScreen["\']\);\s*\n?','',t,flags=re.M)
          t=re.sub(r'^\s*const kinderRiskMemoVisible = .*?;\s*\n?','',t,flags=re.M)
          t=re.sub(r"previousScreenBeforeRecordRoom\s*=\s*kinderRiskMemoVisible\s*\?\s*'kinderRiskMemo'\s*:\s*\(memoVisible\s*\?\s*'studentMemo'\s*:\s*\(cardVisible\s*\?\s*'mainPage'\s*:\s*'recordRoom'\)\);","previousScreenBeforeRecordRoom = memoVisible ? 'studentMemo' : (cardVisible ? 'mainPage' : 'recordRoom');",t)
          t=re.sub(r'^\s*if \(kinderRiskMemo\) kinderRiskMemo\.style\.display = ["\']none["\'];\s*\n?','',t,flags=re.M)
          t=re.sub(r"\s*\}\s*else if \(previousScreenBeforeRecordRoom === 'kinderRiskMemo'\) \{[\s\S]*?\n\s*\} else \{",'\n  } else {',t,count=1)
          t=t.replace('[students, feedbacks, summaries, risks, members]','[students, feedbacks, summaries, members]')
          t=re.sub(r'^\s*supabase\(["\']GET["\'], `risk_signals\?[^\n]*\n?','',t,flags=re.M)
          t=re.sub(r'^\s*risk_signals:\s*risks,?\s*\n?','',t,flags=re.M)
          t=t.replace('<div class="settingsRow"><div class="settingsRowLeft"><span class="settingsRowTitle">위험신호 기록</span></div><span class="settingsBadge">JSON</span></div>','')
          t=t.replace('<div class="settingsInfoItem">위험신호 기록과 원장 확인 메모</div>','')
          t=re.sub(r"\s*async function setManagerPermission\(roleKey,value\)\{[^\n]*\}\n?","\n  async function setManagerPermission(roleKey,value){if(roleKey!=='backup')return;const cached=settingsGetCachedState();const managerPermissions={...(cached.managerPermissions||{}),backup:!!value};settingsSaveCachePatch({managerPermissions});const academyId=settingsGetAcademyId();if(academyId&&isSupabaseConfigured()){try{await supabase('PATCH',`academies?id=eq.${encodeURIComponent(academyId)}`,{manager_can_backup:!!value});if(olliSettingsState&&olliSettingsState.academy)olliSettingsState.academy.manager_can_backup=!!value;}catch(err){console.warn('manager permission save failed:',err);alert('관리자 권한 저장 중 오류가 발생했습니다.\\n'+(err.message||err));}}openSettingsDetail('roles');}\n",t)
          # Replace late role override that exposed director-note permission.
          clean_roles="  if(typeof settingsDetailData !== 'undefined' && settingsDetailData.roles){settingsDetailData.roles.html=function(){const backupOn=getManagerPermission('backup')||!!(olliSettingsState.academy&&olliSettingsState.academy.manager_can_backup);return '<div class=\"settingsDetailIntro\"><div class=\"settingsDetailTitle\">관리자 기본 권한 위에<br>필요한 권한만 추가합니다.</div></div><div class=\"settingsRoleCard\"><div class=\"settingsRoleTop\"><div class=\"settingsRoleName\">원장</div><span class=\"settingsStatusBadge\">전체 권한</span></div><div class=\"settingsRoleList\"><div class=\"settingsRoleItem\">전체 설정, 선생님 관리, 학원 삭제/양도</div><div class=\"settingsRoleItem\">백업 / 내보내기 사용 가능</div></div></div><div class=\"settingsRoleCard\"><div class=\"settingsRoleTop\"><div class=\"settingsRoleName\">관리자 기본 권한</div><span class=\"settingsStatusBadge\">기본 권한</span></div><div class=\"settingsRoleList\"><div class=\"settingsRoleItem\">학생 기록과 피드백 흐름 점검 가능</div><div class=\"settingsRoleItem\">선생님 기록 상태 확인 가능</div><div class=\"settingsRoleItem\">학원 삭제, 원장 양도, 권한 부여는 제한</div></div></div><div class=\"settingsRoleCard\"><div class=\"settingsRoleTop\"><div class=\"settingsRoleName\">관리자 추가 권한 부여</div><span class=\"settingsStatusBadge\">선택 권한</span></div><div class=\"settingsPermissionRow\"><div><div class=\"settingsPermissionText\">백업 / 내보내기 사용 가능</div><div class=\"settingsPermissionDesc\">관리자에게 데이터 내보내기 권한을 추가로 부여합니다.</div></div><button class=\"settingsMiniSwitch '+(backupOn?'on':'')+'\" type=\"button\" onclick=\"toggleManagerPermission(\\'backup\\')\"></button></div></div><div class=\"settingsRoleCard\"><div class=\"settingsRoleTop\"><div class=\"settingsRoleName\">선생님</div><span class=\"settingsStatusBadge\">기록 권한</span></div><div class=\"settingsRoleList\"><div class=\"settingsRoleItem\">담당 학생 기록 작성</div><div class=\"settingsRoleItem\">피드백 작성과 성장 피드백 입력</div><div class=\"settingsRoleItem\">권한 변경과 데이터 내보내기는 제한</div></div></div>';};}"
          t=re.sub(r"^\s*if\(typeof settingsDetailData !== 'undefined' && settingsDetailData\.roles\)\{settingsDetailData\.roles\.html=function\(\)\{[^\n]*$",clean_roles,t,flags=re.M)
          t=t.replace('위험신호 확인 및 원장 메모 작성','학생 기록과 피드백 흐름 점검').replace('위험신호 알림 확인','학생 기록 상태 확인').replace('위험신호 관련 정리','학생 기록 정리')
          t=re.sub(r'^.*manager_can_director_note.*\n?','',t,flags=re.M)
          t=re.sub(r'^.*directorNote.*\n?','',t,flags=re.M)
          t=t.replace(", memo1: '', memo2: '', memo3: '', memo4: ''",'')
          t=re.sub(r'^\s*memo[1-5]:[^\n]*\n?','',t,flags=re.M)
          t=re.sub(r'^\s*(?:sceneMemo|kinderSceneMemo):\s*(?:item\?\.|row\.|student\.|remote\.)[^\n]*\n?','',t,flags=re.M)
          t=re.sub(r"(?:,\s*)?'memo1'\s*,\s*'memo2'\s*,\s*'memo3'",'',t)
          t=re.sub(r"\s*memo1:\s*'',\s*memo2:\s*'',\s*memo3:\s*'',\s*memo4:\s*'',?",'',t)
          t=re.sub(r'^.*(?:kinderRiskMemoScreen|recordDoorDot|hasRiskNotifications).*\n?','',t,flags=re.M)
          t=clean_styles(t)
          p.write_text(t,encoding='utf-8')

          # observation-memo-core.js
          p=Path('observation-memo-core.js'); c=p.read_text(encoding='utf-8')
          marker="function openStudentMemoPageById(studentId) {\n  const student = findStudentById(studentId);\n  if (!student) return;"
          if marker in c:
              c=c.replace(marker,marker+"\n  if (student.type === 'kinder') {\n    currentMemoStudent = student;\n    currentMemoType = 'kinder';\n    if (typeof openKinderChatFeedbackPage === 'function') openKinderChatFeedbackPage();\n    return;\n  }",1)
          c=c.replace("currentMemoType = student.type === 'kinder' ? 'kinder' : 'elementary';","currentMemoType = 'elementary';")
          c=remove_if(c,"  if (currentMemoType === 'kinder') {")
          c=re.sub(r'^\s*const kinderRiskMemoScreenEl = document\.getElementById\(["\']kinderRiskMemoScreen["\']\);\s*\n?','',c,flags=re.M)
          c=re.sub(r'^\s*if \(kinderRiskMemoScreenEl\) kinderRiskMemoScreenEl\.style\.display = ["\']none["\'];\s*\n?','',c,flags=re.M)
          c=re.sub(r'^\s*updateMemoSignalCircle\(student\);\s*\n?','',c,flags=re.M)
          c=remove_function(c,'autoResizeKinderMemoBoxes')
          c=re.sub(r"^\s*if \(\['kinderMemoBox1'[^\n]*return 'kinder';\s*\n?",'',c,flags=re.M)
          c=remove_if(c,"  if (inputType === 'kinder') {")
          c=re.sub(r"\n\s*document\.addEventListener\('focus', event => \{[\s\S]*?\n\s*\}, true\);",'',c,count=1)
          c=c.replace("if (current && (current.id === 'studentMemoScreen' || current.id === 'kinderRiskMemoScreen')) {","if (current && current.id === 'studentMemoScreen') {")
          c=re.sub(r'^\s*const kinderRiskMemoScreen = document\.getElementById\(["\']kinderRiskMemoScreen["\']\);\s*\n?','',c,flags=re.M)
          c=re.sub(r'^\s*if \(kinderRiskMemoScreen\) kinderRiskMemoScreen\.style\.display = ["\']none["\'];\s*\n?','',c,flags=re.M)
          c=unwrap_else(c,"  if (savingType === 'kinder') {")
          save_marker="async function saveCurrentMemo(options = {}) {\n  if (!currentMemoStudent) return;"
          if save_marker in c:
              c=c.replace(save_marker,save_marker+"\n  if (currentMemoType === 'kinder') {\n    if (typeof saveKinderChatFeedbackDraft === 'function') saveKinderChatFeedbackDraft();\n    return;\n  }",1)
          # Header action is elementary-only now.
          hs=c.find('function handleMemoHeaderAction() {')
          if hs>=0:
              hb=c.find('{',hs); he=balanced_end(c,hb); c=c[:hs]+"function handleMemoHeaderAction() {\n  requestElementaryFeedback();\n}\n"+c[he:]
          for fn in ['getRiskNotifications','setRiskNotifications','normalizeRiskSignalRow','loadRiskNotificationsFromSupabase','saveRiskNotificationToSupabase','saveRiskNotification','updateNotificationButtons','scheduleNotificationSync','normalizeRiskNotificationMessage','openNotificationInbox','closeNotificationInbox','formatNotificationDate','markRiskNotificationHandled','openRiskNotificationTarget','sendKinderRiskPush']:
              c=remove_function(c,fn)
          c=re.sub(r'^.*loadRiskNotificationsFromSupabase\([^\n]*\n?','',c,flags=re.M)
          c=c.replace("tag: 'olli-risk-signal'","tag: 'olli-notification'")
          p.write_text(c,encoding='utf-8')

          # kinder feedback / shell / start page
          p=Path('kinder-feedback.js'); s=p.read_text(encoding='utf-8'); s=re.sub(r'^\s*try \{ updateNotificationButtons\(\); \} catch\(e\) \{\}\s*\n?','',s,flags=re.M); s=re.sub(r'^\s*if \(typeof updateNotificationButtons[^\n]*\n?','',s,flags=re.M); p.write_text(s,encoding='utf-8')
          p=Path('pc-shell.js'); s=p.read_text(encoding='utf-8'); s=re.sub(r'^\s*if \(typeof global\.updateNotificationButtons[^\n]*\n?','',s,flags=re.M); s=s.replace("'kinderRiskMemoScreen', ",'').replace(", 'kinderRiskMemoScreen'",'').replace(" || page === 'kinderRiskMemoScreen'",'').replace(" || pageId === 'kinderRiskMemoScreen'",'').replace("pageId === 'kinderRiskMemoScreen' ? 'kinder' : 'elementary'","'elementary'").replace("pageId === 'kinderChatFeedbackScreen' || pageId === 'kinderRiskMemoScreen'","pageId === 'kinderChatFeedbackScreen'"); p.write_text(s,encoding='utf-8')
          p=Path('pc-start-page.js'); s=p.read_text(encoding='utf-8').replace("'kinderRiskMemoScreen',",'').replace(",'kinderRiskMemoScreen'",''); p.write_text(s,encoding='utf-8')
          p=Path('OLLI_PC_MODULES.md'); d=p.read_text(encoding='utf-8'); d=re.sub(r'^\| 유치부 위험신호 화면 \|.*\n?','',d,flags=re.M); d=re.sub(r'### 유치부 위험신호\n[\s\S]*?(?=### |\Z)','',d); d=d.replace('기존 `observation`, `feedback` PC route 호출은 `pc-shell.js`에서 `attendance`(성향기록부)로 흡수한다. 별도 초등 관찰노트 진입 버튼은 제거한다.','기존 `observation`, `feedback` PC route 호출은 `pc-shell.js`에서 `attendance`(성향기록부)로 흡수한다. 별도 초등 관찰노트 진입 버튼은 제거한다. 유치부 위험신호 기능도 제거되어 유치부 기록은 1분 피드백을 사용한다.'); p.write_text(d,encoding='utf-8')
          Path('kinder-risk-ui.js').unlink(missing_ok=True)
          PY
      - name: Verify removal
        shell: bash
        run: |
          set -euo pipefail
          node --check observation-memo-core.js
          node --check kinder-feedback.js
          node --check pc-shell.js
          node --check pc-start-page.js
          test ! -f kinder-risk-ui.js
          echo '=== remaining retired-feature refs (must be empty) ==='
          if grep -RInE --exclude-dir=.git --exclude='audit-remove-risk-feature.yml' --exclude='one-shot-remove-risk-feature.yml' --exclude='one-shot-remove-risk-feature-v2.yml' --exclude='one-shot-remove-risk-feature-v3.yml' 'kinderRisk|RiskMemo|risk_signal|risk_signals|위험신호|recordNotifyBtn|notificationInbox|hasRiskNotifications|sendKinderRiskPush|manager_can_director_note|directorNote|recordDoorDot|kinderMemoBox[1-5]|kinderSceneMemoInput|setKinderCombinedMode|autoResizeKinderMemoBoxes' .; then exit 1; fi
          echo '=== remaining memo1..memo5 refs (must be empty) ==='
          if grep -nE '\bmemo[1-5]\b' index.html observation-memo-core.js; then exit 1; fi
          grep -q 'function openStudentMemoPageById' observation-memo-core.js
          grep -q 'function saveCurrentMemo' observation-memo-core.js
          grep -q 'function openKinderChatFeedbackPage' kinder-feedback.js
          grep -q 'studentMemoScreen' observation-editor-ui.js
          grep -q 'kinderChatFeedbackScreen' kinder-feedback-ui.js
          grep -q 'function showBrowserNotification' observation-memo-core.js
          grep -q 'function showPushToast' observation-memo-core.js
          ! grep -q 'kinder-risk-ui.js' index.html
          node <<'NODE'
          const fs=require('fs'),vm=require('vm');const html=fs.readFileSync('index.html','utf8');const re=/<script\b([^>]*)>([\s\S]*?)<\/script\s*>/gi;let m,n=0;while((m=re.exec(html))){const a=m[1]||'',b=m[2]||'';if(/\bsrc\s*=/.test(a)||/type\s*=\s*["'](?:application\/json|application\/ld\+json)["']/.test(a))continue;try{new vm.Script(b);n++;}catch(e){console.error('inline script syntax failure',n+1,e.message);process.exit(1)}}console.log('inline scripts checked',n)
          NODE
          echo "index bytes: $(wc -c < index.html)"
      - name: Commit removal
        shell: bash
