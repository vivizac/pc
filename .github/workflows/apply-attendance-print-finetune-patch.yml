name: Apply attendance print fine-tune patch
on:
  push:
    paths:
      - '.github/workflows/apply-attendance-print-finetune-patch.yml'
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply attendance print fine-tune patch
        run: python scripts/apply_attendance_print_finetune_patch.py
      - name: Commit patched attendance print
        run: |
          if git diff --quiet -- index.html; then
            echo "index.html already patched"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Tune attendance row height columns and text weight"
          git push
# trigger: 2026-09-01 attendance row/column/text tune
