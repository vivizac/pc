name: Validate mobile waitlist update Agent

on:
  pull_request:
    paths:
      - 'apps/mobile/olli-talk-beta.js'
      - 'apps/mobile/tests/team-talk-waitlist-update-agent-bridge.test.cjs'
      - '.github/workflows/validate-mobile-waitlist-update-agent.yml'

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Check mobile Team Chat syntax
        run: node --check apps/mobile/olli-talk-beta.js
      - name: Run mobile waitlist update bridge contracts
        working-directory: apps/mobile
        run: node --test tests/team-talk-waitlist-update-agent-bridge.test.cjs
