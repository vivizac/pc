name: Patch kindergarten two-column cards
on:
  push:
    paths:
      - '.github/workflows/one-shot-kinder-two-column-cards.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Patch kindergarten card columns
        run: |
          python - <<'PY'
          from pathlib import Path

          css_path = Path('pc-timetable.css')
          css = css_path.read_text()
          anchor = "#recordRoomScreen .olliTtClassLane.elementary .olliTtEntries { grid-template-columns: repeat(2, minmax(0, 1fr)); }\n"
          addition = anchor + "#recordRoomScreen .olliTtClassLane.kinder .olliTtEntries { grid-template-columns: repeat(2, minmax(0, 1fr)); }\n"
          if addition not in css:
              if anchor not in css:
                  raise SystemExit('elementary entries anchor not found')
              css = css.replace(anchor, addition, 1)
          css_path.write_text(css)

          index_path = Path('index.html')
          index = index_path.read_text()
          old = 'pc-timetable.css?v=20260905-2'
          new = 'pc-timetable.css?v=20260905-3'
          if new not in index:
              if old not in index:
                  raise SystemExit('timetable css version anchor not found')
              index = index.replace(old, new, 1)
          index_path.write_text(index)

          assert '#recordRoomScreen .olliTtClassLane.kinder .olliTtEntries { grid-template-columns: repeat(2, minmax(0, 1fr)); }' in css
          assert 'pc-timetable.css?v=20260905-3' in index
          PY
      - name: Commit patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add pc-timetable.css index.html
          git diff --cached --check
          if git diff --cached --quiet; then
            echo 'No changes needed'
            exit 0
          fi
          git commit -m "Show kindergarten timetable cards in two columns"
          git push origin main
