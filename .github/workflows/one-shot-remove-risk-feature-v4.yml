name: One-shot remove risk feature v4
on:
  push:
    paths:
      - '.github/workflows/one-shot-remove-risk-feature-v4.yml'
permissions:
  contents: write
jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run corrected v3 cleanup
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          workflow = Path('.github/workflows/one-shot-remove-risk-feature-v3.yml').read_text(encoding='utf-8')
          start_marker = "          python3 - <<'PY'\n"
          end_marker = "          PY\n"
          start = workflow.find(start_marker)
          if start < 0:
              raise RuntimeError('v3 python start marker not found')
          start += len(start_marker)
          end = workflow.find(end_marker, start)
          if end < 0:
              raise RuntimeError('v3 python end marker not found')

          block = workflow[start:end]
          lines = []
          for line in block.splitlines():
              lines.append(line[10:] if line.startswith('          ') else line)
          script = '\n'.join(lines) + '\n'

          old = "s=text.find(marker); b=text.find('{',s); e=balanced_end(text,b)"
          new = "fn_s=text.find(marker); s=fn_s-6 if fn_s>=6 and text[fn_s-6:fn_s]=='async ' else fn_s; b=text.find('{',fn_s); e=balanced_end(text,b)"
          if old not in script:
              raise RuntimeError('v3 remove_function target not found')
          script = script.replace(old, new, 1)
          exec(compile(script, 'risk_cleanup_v4.py', 'exec'), {'__name__': '__main__'})
          PY
      - name: Verify removal
        shell: bash
        run: |
          set -euo pipefail
          node --check observation-memo-core.js
          node --check kinder-feedback.js
          node --check pc-shell.js
          node --check pc-start-page.js
          test ! -f kinder-risk-ui.js
          echo '=== remaining retired-feature refs ==='
          if grep -RInE --exclude-dir=.git --exclude='audit-remove-risk-feature.yml' --exclude='one-shot-remove-risk-feature.yml' --exclude='one-shot-remove-risk-feature-v2.yml' --exclude='one-shot-remove-risk-feature-v3.yml' --exclude='one-shot-remove-risk-feature-v4.yml' 'kinderRisk|RiskMemo|risk_signal|risk_signals|위험신호|recordNotifyBtn|notificationInbox|hasRiskNotifications|sendKinderRiskPush|manager_can_director_note|directorNote|recordDoorDot|kinderMemoBox[1-5]|kinderSceneMemoInput|setKinderCombinedMode|autoResizeKinderMemoBoxes' .; then exit 1; fi
          echo '=== remaining memo1..memo5 refs ==='
          if grep -nE '\bmemo[1-5]\b' index.html observation-memo-core.js; then exit 1; fi
          grep -q 'function openStudentMemoPageById' observation-memo-core.js
          grep -q 'function saveCurrentMemo' observation-memo-core.js
          grep -q 'function openKinderChatFeedbackPage' kinder-feedback.js
          grep -q 'studentMemoScreen' observation-editor-ui.js
          grep -q 'kinderChatFeedbackScreen' kinder-feedback-ui.js
          grep -q 'function showBrowserNotification' observation-memo-core.js
          grep -q 'function showPushToast' observation-memo-core.js
          ! grep -q 'kinder-risk-ui.js' index.html
          node <<'NODE'
          const fs=require('fs'),vm=require('vm');
          const html=fs.readFileSync('index.html','utf8');
          const re=/<script\b([^>]*)>([\s\S]*?)<\/script\s*>/gi;
          let m,n=0;
          while((m=re.exec(html))){
            const a=m[1]||'', b=m[2]||'';
            if(/\bsrc\s*=/.test(a)||/type\s*=\s*["'](?:application\/json|application\/ld\+json)["']/.test(a)) continue;
            try{new vm.Script(b);n++;}catch(e){console.error('inline script syntax failure',n+1,e.message);process.exit(1)}
          }
          console.log('inline scripts checked',n);
          NODE
          echo "index bytes: $(wc -c < index.html)"
      - name: Commit removal
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A index.html observation-memo-core.js kinder-feedback.js pc-shell.js pc-start-page.js OLLI_PC_MODULES.md kinder-risk-ui.js
          git commit -m 'Remove retired risk signal feature'
          git push
