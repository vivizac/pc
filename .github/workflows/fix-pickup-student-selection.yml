name: Fix attendance register editing

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/fix-pickup-student-selection.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply attendance register and timetable attendance fixes
        run: python3 .github/tmp/fix_attendance_register_editing.py
      - name: Validate JavaScript
        run: |
          node --check pc-start-page.js
          node --check pc-timetable-service.js
          node --check pc-timetable-attendance-register.js
          node --check pc-timetable-attendance-day-guard.js
          node --check consultation-survey.js
      - name: Verify attendance behavior
        run: |
          grep -F "color: #000;" pc-start-page.js
          grep -F "background: #000;" pc-start-page.js
          grep -F "setAttendanceRegisterStatus" pc-timetable-service.js
          grep -F "data-tt-attendance-register-cell" pc-timetable-attendance-register.js
          grep -F "ATTENDANCE_REGISTER_STATUS_ORDER = ['blank', 'present', 'absent', 'makeup']" pc-timetable-attendance-register.js
          grep -F "sessionDate === todayKey()" pc-timetable-attendance-day-guard.js
          grep -F "pc-timetable-attendance-day-guard.js" consultation-survey.js
      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add pc-start-page.js pc-timetable-service.js pc-timetable-attendance-register.js pc-timetable-attendance-day-guard.js consultation-survey.js
          if git diff --cached --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          git commit -m "fix: 출석부 수동 편집과 당일 시간표 출석 제한"
          git push
