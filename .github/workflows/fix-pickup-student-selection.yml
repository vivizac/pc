    try {
      await service.setAttendanceRegisterStatus(studentId, sessionDate, nextStatus);
      const rows = (Array.isArray(state.attendanceRows) ? state.attendanceRows : []).filter((row) => !(
        clean(row && row.student_id) === studentId
