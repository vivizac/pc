name: Use shared attendance data
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/use-shared-attendance-data.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Connect PC timetable service to shared attendance data
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          index_path = Path('index.html')
          text = index_path.read_text(encoding='utf-8')
          old = '<script id="olliPcAttendanceTimetableScript" src="olli-attendance-timetable-bridge.js"></script>\n<script src="pc-timetable-service.js"></script>'
          new = '<script id="olliPcAttendanceTimetableScript" src="olli-attendance-timetable-bridge.js"></script>\n<script src="olli-attendance-data.js"></script>\n<script src="pc-timetable-service.js"></script>'
          if text.count(old) != 1: raise SystemExit(f'PC attendance loader anchor count={text.count(old)}')
          text = text.replace(old, new, 1)
          index_path.write_text(text, encoding='utf-8')
          service_path = Path('pc-timetable-service.js')
          service = service_path.read_text(encoding='utf-8')
          p1 = r"  function getCachedAttendanceMonth\(yearMonth\) \{[\s\S]*?\n  \}\n\n  function cacheAttendanceMonth"
          r1 = "  function getCachedAttendanceMonth(yearMonth) {\n    const shared = global.OlliAttendanceData;\n    if (shared && typeof shared.getCachedMonth === 'function') return shared.getCachedMonth(yearMonth);\n    try {\n      const cached = JSON.parse(localStorage.getItem(attendanceMonthCacheKey(yearMonth)) || 'null');\n      return cached && Array.isArray(cached.attendance) ? cached.attendance : null;\n    } catch (_) { return null; }\n  }\n\n  function cacheAttendanceMonth"
          service, n1 = re.subn(p1, lambda m: r1, service, count=1)
          if n1 != 1: raise SystemExit('getCachedAttendanceMonth anchor mismatch')
          p2 = r"  async function toggleAttendance\(options\) \{[\s\S]*?\n  \}\n\n  async function loadAttendanceMonth"
          r2 = "  async function toggleAttendance(options) {\n    const shared = global.OlliAttendanceData;\n    if (shared && typeof shared.toggleAttendance === 'function') return shared.toggleAttendance(options);\n    const result = await executeScheduleAction('toggle_attendance', {\n      student_id: options.studentId,\n      session_date: options.sessionDate,\n      time_slot: Number(options.timeSlot),\n      class_group: options.classGroup || 'A',\n      session_kind: options.sessionKind || 'regular'\n    });\n    invalidateAttendanceMonth(options.sessionDate);\n    return result;\n  }\n\n  async function loadAttendanceMonth"
          service, n2 = re.subn(p2, lambda m: r2, service, count=1)
          if n2 != 1: raise SystemExit('toggleAttendance anchor mismatch')
          p3 = r"  async function loadAttendanceMonth\(yearMonth\) \{[\s\S]*?\n  \}\n\n  async function savePickup"
          r3 = "  async function loadAttendanceMonth(yearMonth) {\n    const shared = global.OlliAttendanceData;\n    if (shared && typeof shared.loadMonth === 'function') return shared.loadMonth(yearMonth);\n    const value = /^\\d{4}-\\d{2}$/.test(clean(yearMonth)) ? `${clean(yearMonth)}-01` : new Date().toISOString().slice(0, 8) + '01';\n    const data = await rpc('olli_schedule_attendance_month', contextPayload({ p_month: value }));\n    const rows = Array.isArray(data.attendance) ? data.attendance : [];\n    cacheAttendanceMonth(value.slice(0, 7), rows);\n    return rows;\n  }\n\n  async function savePickup"
          service, n3 = re.subn(p3, lambda m: r3, service, count=1)
          if n3 != 1: raise SystemExit('loadAttendanceMonth anchor mismatch')
          service_path.write_text(service, encoding='utf-8')
          if text.count('<script src="olli-attendance-data.js"></script>') != 1: raise SystemExit('shared attendance loader count invalid')
          print('PC_INDEX_BYTES', len(text.encode('utf-8')))
          PY
      - name: Validate shared attendance wiring
        run: |
          node --check olli-attendance-data.js
          node --check pc-timetable-service.js
          curl -fsSL https://raw.githubusercontent.com/vivizac/-/main/olli-attendance-data.js -o /tmp/phone-attendance-data.js
          echo "PC=$(git hash-object olli-attendance-data.js) PHONE=$(git hash-object /tmp/phone-attendance-data.js)"
          cmp -s olli-attendance-data.js /tmp/phone-attendance-data.js
      - name: Commit PC attendance data linkage
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add index.html pc-timetable-service.js
          git commit -m "refactor: PC 출석 읽기·쓰기를 공통 데이터 계층으로 연결" || exit 0
          git push
