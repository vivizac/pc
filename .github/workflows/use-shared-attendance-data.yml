name: Use shared attendance data
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/use-shared-attendance-data.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Connect PC timetable service to shared attendance data
        run: |
          python - <<'PY'
          from pathlib import Path

          index_path = Path('index.html')
          text = index_path.read_text(encoding='utf-8')
          old = '<script id="olliPcAttendanceTimetableScript" src="olli-attendance-timetable-bridge.js"></script>\n<script src="pc-timetable-service.js"></script>'
          new = '<script id="olliPcAttendanceTimetableScript" src="olli-attendance-timetable-bridge.js"></script>\n<script src="olli-attendance-data.js"></script>\n<script src="pc-timetable-service.js"></script>'
          if text.count(old) != 1:
            raise SystemExit(f'PC attendance loader anchor count={text.count(old)}')
          text = text.replace(old, new, 1)
          index_path.write_text(text, encoding='utf-8')

          service_path = Path('pc-timetable-service.js')
          service = service_path.read_text(encoding='utf-8')

          old_cached = """  function getCachedAttendanceMonth(yearMonth) {
    try {
      const cached = JSON.parse(localStorage.getItem(attendanceMonthCacheKey(yearMonth)) || 'null');
      return cached && Array.isArray(cached.attendance) ? cached.attendance : null;
    } catch (_) { return null; }
  }
"""
          new_cached = """  function getCachedAttendanceMonth(yearMonth) {
    const shared = global.OlliAttendanceData;
    if (shared && typeof shared.getCachedMonth === 'function') return shared.getCachedMonth(yearMonth);
    try {
      const cached = JSON.parse(localStorage.getItem(attendanceMonthCacheKey(yearMonth)) || 'null');
      return cached && Array.isArray(cached.attendance) ? cached.attendance : null;
    } catch (_) { return null; }
  }
"""
          if service.count(old_cached) != 1: raise SystemExit('getCachedAttendanceMonth anchor mismatch')
          service = service.replace(old_cached, new_cached, 1)

          old_toggle = """  async function toggleAttendance(options) {
    const result = await executeScheduleAction('toggle_attendance', {
      student_id: options.studentId,
      session_date: options.sessionDate,
      time_slot: Number(options.timeSlot),
      class_group: options.classGroup || 'A',
      session_kind: options.sessionKind || 'regular'
    });
    invalidateAttendanceMonth(options.sessionDate);
    return result;
  }
"""
          new_toggle = """  async function toggleAttendance(options) {
    const shared = global.OlliAttendanceData;
    if (shared && typeof shared.toggleAttendance === 'function') return shared.toggleAttendance(options);
    const result = await executeScheduleAction('toggle_attendance', {
      student_id: options.studentId,
      session_date: options.sessionDate,
      time_slot: Number(options.timeSlot),
      class_group: options.classGroup || 'A',
      session_kind: options.sessionKind || 'regular'
    });
    invalidateAttendanceMonth(options.sessionDate);
    return result;
  }
"""
          if service.count(old_toggle) != 1: raise SystemExit('toggleAttendance anchor mismatch')
          service = service.replace(old_toggle, new_toggle, 1)

          old_load = """  async function loadAttendanceMonth(yearMonth) {
    const value = /^\\d{4}-\\d{2}$/.test(clean(yearMonth)) ? `${clean(yearMonth)}-01` : new Date().toISOString().slice(0, 8) + '01';
    const data = await rpc('olli_schedule_attendance_month', contextPayload({ p_month: value }));
    const rows = Array.isArray(data.attendance) ? data.attendance : [];
    cacheAttendanceMonth(value.slice(0, 7), rows);
    return rows;
  }
"""
          new_load = """  async function loadAttendanceMonth(yearMonth) {
    const shared = global.OlliAttendanceData;
    if (shared && typeof shared.loadMonth === 'function') return shared.loadMonth(yearMonth);
    const value = /^\\d{4}-\\d{2}$/.test(clean(yearMonth)) ? `${clean(yearMonth)}-01` : new Date().toISOString().slice(0, 8) + '01';
    const data = await rpc('olli_schedule_attendance_month', contextPayload({ p_month: value }));
    const rows = Array.isArray(data.attendance) ? data.attendance : [];
    cacheAttendanceMonth(value.slice(0, 7), rows);
    return rows;
  }
"""
          if service.count(old_load) != 1: raise SystemExit('loadAttendanceMonth anchor mismatch')
          service = service.replace(old_load, new_load, 1)
          service_path.write_text(service, encoding='utf-8')

          if text.count('<script src="olli-attendance-data.js"></script>') != 1:
            raise SystemExit('shared attendance loader count invalid')
          print('PC_INDEX_BYTES', len(text.encode('utf-8')))
          PY
      - name: Validate shared attendance wiring
        run: |
          node --check olli-attendance-data.js
          node --check pc-timetable-service.js
          curl -fsSL https://raw.githubusercontent.com/vivizac/-/main/olli-attendance-data.js -o /tmp/phone-attendance-data.js
          echo "PC=$(git hash-object olli-attendance-data.js) PHONE=$(git hash-object /tmp/phone-attendance-data.js)"
          cmp -s olli-attendance-data.js /tmp/phone-attendance-data.js
      - name: Commit PC attendance data linkage
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add index.html pc-timetable-service.js
          git commit -m "refactor: PC 출석 읽기·쓰기를 공통 데이터 계층으로 연결" || exit 0
          git push
