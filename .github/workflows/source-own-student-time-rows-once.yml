name: Source-own student time rows once

on:
  push:
    branches:
      - refactor/source-owned-no-overrides-20260912
    paths:
      - .github/workflows/source-own-student-time-rows-once.yml

permissions:
  contents: write

jobs:
  refactor:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refactor/source-owned-no-overrides-20260912
          fetch-depth: 0
      - name: Apply refactor
        run: python tmp_source_own_student_time_rows.py
      - name: Validate source ownership
        shell: bash
        run: |
          node --check olli-record-sort-student-ui.js
          node --check olli-student-schedule-runtime.js
          git diff --check
          for id in elementaryStudentLessonTimeToggleRow studentLessonTimeToggleRow elementaryLessonTimeToggleRow kinderLessonTimeToggleRow; do
            grep -q "$id" olli-record-sort-student-ui.js
          done
          ! grep -q "olliStudentScheduleTimeAndDocImportPatch" index.html
          ! grep -q "oldPatchMarkup\|oldPrepareAdd\|oldGetAdd\|oldPrepareInfo\|oldGetInfo\|studentModalTimesDraft\|kinderInfoTimesDraft\|elementaryInfoTimesDraft\|addAllTimeRows" index.html
          grep -q "olliStudentDocImportPatch" index.html
          grep -q "window.openStudentBulkImportFilePicker" index.html
          grep -q "window.handleStudentBulkImportFileChange" index.html
          python - <<'PY'
          from pathlib import Path
          text = Path('index.html').read_text()
          marker = '<script id="olliStudentDocImportPatch">'
          start = text.index(marker) + len(marker)
          end = text.index('</script>', start)
          Path('/tmp/olli_student_doc_import_patch.js').write_text(text[start:end])
          PY
          node --check /tmp/olli_student_doc_import_patch.js
      - name: Commit and cleanup
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          rm -f tmp_source_own_student_time_rows.py
          rm -f .github/workflows/source-own-student-time-rows-once.yml
          git add -A
          git commit -m "refactor: source-own student schedule time rows"
          git push origin HEAD:refactor/source-owned-no-overrides-20260912
