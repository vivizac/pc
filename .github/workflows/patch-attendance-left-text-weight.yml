name: Patch attendance left text weight

on:
  push:
    branches:
      - tweak/attendance-left-text-weight-20260915

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: tweak/attendance-left-text-weight-20260915
          fetch-depth: 0
      - name: Apply focused attendance text weight patch
        run: python .github/tmp/patch_attendance_left_text_weight.py
      - name: Validate intended changes
        run: |
          git diff --check
          grep -F "font-weight: 700;" pc-timetable.css
          grep -F "font-weight: 500;" pc-timetable.css
      - name: Clean temporary files and commit
        run: |
          rm -f .github/tmp/patch_attendance_left_text_weight.py
          rm -f .github/workflows/patch-attendance-left-text-weight.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add pc-timetable.css .github/tmp/patch_attendance_left_text_weight.py .github/workflows/patch-attendance-left-text-weight.yml
          git commit -m "style: refine attendance left column text weights"
          git push origin HEAD:tweak/attendance-left-text-weight-20260915
