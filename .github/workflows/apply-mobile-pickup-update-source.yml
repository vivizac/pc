name: Apply mobile pickup update source edit

on:
  push:
    branches:
      - work/pickup-update-probe-20261001
    paths:
      - '.github/mobile-pickup-update-trigger'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
      - name: Apply source edit
        run: node .github/apply-mobile-pickup-update.cjs
      - name: Commit source edit and cleanup temporary files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/mobile/olli-talk-beta.js
          git rm -f .github/mobile-pickup-update-trigger
          git rm -f .github/apply-mobile-pickup-update.cjs
          git rm -f .github/pickup-update-mobile-bridge.patch
          git rm -f .github/workflows/apply-pickup-update-mobile-bridge.yml
          git rm -f .github/workflows/apply-mobile-pickup-update-source.yml
          git commit -m "Route mobile pickup updates through Agent"
          git push origin "HEAD:${GITHUB_REF_NAME}"
