name: Refactor observation memo mode menu
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/refactor-observation-memo-mode-menu.yml'
permissions:
  contents: write
jobs:
  refactor:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Move observation memo mode menu to common helper
        run: |
          python - <<'PY'
          from pathlib import Path

          scene_path = Path('olli-record-scene-tools.js')
          common_path = Path('observation-memo-common.js')
          scene = scene_path.read_text(encoding='utf-8')
          common = common_path.read_text(encoding='utf-8')

          listener = "document.addEventListener('click', (event) => { const wrap = document.getElementById('memoModeWrap'); if (wrap && !wrap.contains(event.target)) closeMemoModeMenu(); });"

          start1 = scene.index('function renderMemoModeMenu()')
          end1 = scene.index('function closeGlobalFeedbackModeMenus()', start1)
          block1 = scene[start1:end1].rstrip()

          start2 = scene.index('function openMemoObservationMode(event)')
          end2 = scene.index(listener, start2)
          block2 = scene[start2:end2].rstrip()

          expected = [
              'function renderMemoModeMenu()',
              'function closeMemoModeMenu()',
              'function toggleMemoModeMenu(event)',
              'function openMemoObservationMode(event)',
              'function openMemoFailGrowthMode(event)'
          ]
          for symbol in expected:
              assert scene.count(symbol) == 1, f'unexpected scene count before edit: {symbol}'
              assert symbol not in common, f'already commonized: {symbol}'
          assert scene.count(listener) == 1
          assert 'function closeGlobalFeedbackModeMenus()' in scene
          assert 'function renderGlobalFeedbackModeMenu(active = \'main\')' in scene
          assert 'const SCENE_CARD_OPTIONS = [' in scene

          for chunk in (block1 + '\n', block2 + '\n', listener + '\n'):
              assert chunk in scene
              scene = scene.replace(chunk, '', 1)

          insert_marker = 'function handleMemoPauseAutoSaveBlur(target) {'
          assert common.count(insert_marker) == 1
          insertion = block1 + '\n' + block2 + '\n' + listener + '\n\n'
          common = common.replace(insert_marker, insertion + insert_marker, 1)

          for symbol in expected:
              assert symbol not in scene, f'memo symbol remained in scene: {symbol}'
              assert common.count(symbol) == 1, f'common symbol count failed: {symbol}'
          assert listener not in scene
          assert common.count(listener) == 1
          assert 'function closeGlobalFeedbackModeMenus()' in scene
          assert 'function renderGlobalFeedbackModeMenu(active = \'main\')' in scene
          assert 'function openGlobalObservationMode(event)' in scene
          assert 'function openGlobalFailGrowthMode(event)' in scene
          assert 'const SCENE_CARD_OPTIONS = [' in scene

          scene_path.write_text(scene, encoding='utf-8')
          common_path.write_text(common, encoding='utf-8')
          PY

          node --check olli-record-scene-tools.js
          node --check observation-memo-common.js
          git diff --check

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add olli-record-scene-tools.js observation-memo-common.js
          git commit -m "refactor: PC 관찰노트 모드 메뉴 공통화"
          git push

          rm .github/workflows/refactor-observation-memo-mode-menu.yml
          git add .github/workflows/refactor-observation-memo-mode-menu.yml
          git commit -m "chore: 관찰노트 모드 메뉴 작업 파일 정리"
          git push
