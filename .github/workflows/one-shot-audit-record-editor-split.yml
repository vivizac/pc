name: Audit record editor boundaries

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/one-shot-audit-record-editor-split.yml'

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Print record editor function map
        shell: bash
        run: |
          set -e
          wc -lc olli-record-editor-core.js
          grep -nE '^(async )?function [A-Za-z0-9_]+' olli-record-editor-core.js || true
          echo '=== constants and state ==='
          grep -nE '^(const|let) [A-Za-z0-9_]+' olli-record-editor-core.js || true
          echo '=== index load ==='
          grep -n -B3 -A3 'olli-record-editor-core.js' index.html || true
