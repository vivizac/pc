name: Validate delegated PC consultation access
on:
  pull_request:
    paths:
      - 'supabase/migrations/*_pc_teacher_consultation_record_access.sql'
      - 'tests/pc-teacher-consultation-access*'
      - 'packages/common/olli-settings-members.js'
      - 'apps/pc/consultation-survey-core.js'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  delegated-access:
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: isolated-test-only
          POSTGRES_DB: booking_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d booking_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 15
    env:
      PGHOST: localhost
      PGUSER: postgres
      PGPASSWORD: isolated-test-only
      PGDATABASE: booking_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Syntax and source regression checks
        run: |
          node --check packages/common/olli-settings-members.js
          node --check packages/common/olli-settings-common-core.js
          node --check packages/common/olli-booking-owner-ui.js
          node --check apps/pc/consultation-survey-core.js
          node --check apps/pc/consultation-survey.js
          node --test tests/pc-teacher-consultation-access.test.cjs tests/consultation-booking-stage3-ui.test.cjs
      - name: Verify isolated PostgreSQL permissions
        run: |
          psql -v ON_ERROR_STOP=1 -f tests/consultation-booking-stage1.bootstrap.sql
          psql -v ON_ERROR_STOP=1 -f supabase/migrations/20261025150000_olli_booking_core_stage1.sql
          psql -v ON_ERROR_STOP=1 -f supabase/migrations/20261025183000_olli_booking_parent_stage2.sql
          psql -v ON_ERROR_STOP=1 -f supabase/migrations/20261026103000_olli_booking_staff_stage3.sql
          psql -v ON_ERROR_STOP=1 -f tests/pc-teacher-consultation-access.bootstrap.sql -f "$(find supabase/migrations -name '*_pc_teacher_consultation_record_access.sql')" -f tests/pc-teacher-consultation-access.integration.sql
