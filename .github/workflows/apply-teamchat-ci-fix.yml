name: Apply Team Chat CI fix

on:
  push:
    branches:
      - work/pickup-teamchat-20261001
    paths:
      - '.github/teamchat-ci-fix.patch'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
      - name: Apply focused workflow fix and clean temporary files
        run: |
          git apply --check .github/teamchat-ci-fix.patch
          git apply .github/teamchat-ci-fix.patch
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .github/workflows/validate-team-talk-pickup-agent.yml
          git rm .github/teamchat-ci-fix.patch
          git rm .github/workflows/apply-teamchat-ci-fix.yml
          git commit -m "Fix Team Chat bridge test working directory"
          git push origin "HEAD:${GITHUB_REF_NAME}"
