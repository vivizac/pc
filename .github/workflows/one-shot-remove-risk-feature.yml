name: One-shot remove risk feature
on:
  push:
    paths:
      - '.github/workflows/one-shot-remove-risk-feature.yml'
permissions:
  contents: write
jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Remove retired risk feature
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import re

          def scan_balanced(text, brace_pos, open_ch='{', close_ch='}'):
              depth = 0
              quote = None
              escape = False
              line_comment = False
              block_comment = False
              template = False
              i = brace_pos
              while i < len(text):
                  c = text[i]
                  n = text[i+1] if i + 1 < len(text) else ''
                  if line_comment:
                      if c == '\n': line_comment = False
                  elif block_comment:
                      if c == '*' and n == '/': block_comment = False; i += 1
                  elif quote:
                      if escape: escape = False
                      elif c == '\\': escape = True
                      elif c == quote: quote = None
                  elif template:
                      if escape: escape = False
                      elif c == '\\': escape = True
                      elif c == '`': template = False
                  else:
                      if c == '/' and n == '/': line_comment = True; i += 1
                      elif c == '/' and n == '*': block_comment = True; i += 1
                      elif c in ('"', "'"): quote = c
                      elif c == '`': template = True
                      elif c == open_ch: depth += 1
                      elif c == close_ch:
                          depth -= 1
                          if depth == 0: return i + 1
                  i += 1
              raise RuntimeError('unbalanced block')

          def remove_js_function(text, name, required=False):
              marker = f'function {name}('
              while marker in text:
                  start = text.find(marker)
                  brace = text.find('{', start)
                  if brace < 0: raise RuntimeError(f'function brace not found: {name}')
                  end = scan_balanced(text, brace)
                  while end < len(text) and text[end] in ' \t': end += 1
                  if end < len(text) and text[end] == ';': end += 1
                  if end < len(text) and text[end] == '\n': end += 1
                  text = text[:start] + text[end:]
              if required and marker not in text and name not in text:
                  pass
              return text

          def remove_if_block(text, exact_start):
              while exact_start in text:
                  start = text.find(exact_start)
                  brace = text.find('{', start)
                  if brace < 0: break
                  end = scan_balanced(text, brace)
                  while end < len(text) and text[end] in ' \t': end += 1
                  if end < len(text) and text[end] == '\n': end += 1
                  text = text[:start] + text[end:]
              return text

          def extract_balanced_tag(text, start, tag):
              token_re = re.compile(rf'<{tag}\b[^>]*>|</{tag}\s*>', re.I)
              depth = 0
              for m in token_re.finditer(text, start):
                  token = m.group(0)
                  if token.lower().startswith(f'</{tag}'):
                      depth -= 1
                      if depth == 0: return m.end()
                  else:
                      depth += 1
              raise RuntimeError(f'unbalanced <{tag}>')

          def remove_tag_by_opening_match(text, pattern, tag='div'):
              while True:
                  m = re.search(pattern, text, re.I | re.S)
                  if not m: break
                  end = extract_balanced_tag(text, m.start(), tag)
                  text = text[:m.start()] + text[end:]
              return text

          def remove_button_by_class(text, cls):
              pat = rf'<button\b(?=[^>]*\bclass=["\'][^"\']*\b{re.escape(cls)}\b)[^>]*>'
              while True:
                  m = re.search(pat, text, re.I)
                  if not m: break
                  end = extract_balanced_tag(text, m.start(), 'button')
                  text = text[:m.start()] + text[end:]
              return text

          def remove_container_with_literal(text, literal, container_class):
              pos = text.find(literal)
              while pos >= 0:
                  starts = [m.start() for m in re.finditer(rf'<div\b[^>]*class=["\'][^"\']*\b{re.escape(container_class)}\b[^"\']*["\'][^>]*>', text[:pos], re.I)]
                  if not starts: break
                  start = starts[-1]
                  end = extract_balanced_tag(text, start, 'div')
                  if end < pos:
                      break
                  text = text[:start] + text[end:]
                  pos = text.find(literal)
              return text

          def remove_inline_script_blocks(text, markers):
              pat = re.compile(r'<script\b(?![^>]*\bsrc=)[^>]*>([\s\S]*?)</script\s*>', re.I)
              out = []
              last = 0
              for m in pat.finditer(text):
                  body = m.group(1)
                  if any(marker in body for marker in markers):
                      out.append(text[last:m.start()])
                      last = m.end()
              out.append(text[last:])
              return ''.join(out)

          def remove_style_by_id(text, style_id):
              return re.sub(rf'<style\b[^>]*\bid=["\']{re.escape(style_id)}["\'][^>]*>[\s\S]*?</style\s*>', '', text, flags=re.I)

          def strip_css_comments(css):
              return re.sub(r'/\*[\s\S]*?\*/', lambda m: '' if ('위험신호' in m.group(0) or 'kinderRisk' in m.group(0)) else m.group(0), css)

          CSS_RISK_MARKERS = (
              '#kinderRiskMemoScreen', '.kinderRisk', '.recordNotifyBtn', '.recordDoorDot',
              '.hasRiskNotifications', '.notificationInbox', '.kinderMemoBox'
          )

          def filter_css_block(css):
              css = strip_css_comments(css)
              out = []
              i = 0
              L = len(css)
              while i < L:
                  ws_start = i
                  while i < L and css[i].isspace(): i += 1
                  out.append(css[ws_start:i])
                  if i >= L: break
                  if css.startswith('/*', i):
                      j = css.find('*/', i + 2)
                      if j < 0: break
                      out.append(css[i:j+2]); i = j + 2; continue
                  # locate next top-level { or ;
                  j = i
                  quote = None
                  paren = 0
                  while j < L:
                      c = css[j]
                      if quote:
                          if c == '\\': j += 2; continue
                          if c == quote: quote = None
                      else:
                          if c in ('"', "'"): quote = c
                          elif c == '(': paren += 1
                          elif c == ')': paren = max(0, paren-1)
                          elif paren == 0 and c in '{;': break
                      j += 1
                  if j >= L:
                      out.append(css[i:]); break
                  prelude = css[i:j]
                  if css[j] == ';':
                      if not any(x in prelude for x in CSS_RISK_MARKERS): out.append(css[i:j+1])
                      i = j + 1; continue
                  end = scan_balanced(css, j)
                  inner = css[j+1:end-1]
                  stripped = prelude.strip()
                  if stripped.startswith('@'):
                      if any(x in stripped for x in CSS_RISK_MARKERS):
                          i = end; continue
                      filtered_inner = filter_css_block(inner)
                      if filtered_inner.strip(): out.append(prelude + '{' + filtered_inner + '}')
                  else:
                      selectors = [s for s in prelude.split(',') if s.strip() and not any(x in s for x in CSS_RISK_MARKERS)]
                      if selectors:
                          out.append(','.join(selectors) + '{' + inner + '}')
                  i = end
              return ''.join(out)

          def filter_all_style_tags(text):
              pat = re.compile(r'(<style\b[^>]*>)([\s\S]*?)(</style\s*>)', re.I)
              return pat.sub(lambda m: m.group(1) + filter_css_block(m.group(2)) + m.group(3), text)

          def remove_registry(text, feature):
              needle = f"feature: '{feature}'"
              while needle in text:
                  pos = text.find(needle)
                  start = text.rfind('FeatureRegistry.register({', 0, pos)
                  if start < 0: raise RuntimeError(f'registry start not found for {feature}')
                  paren = text.find('(', start)
                  end_paren = scan_balanced(text, paren, '(', ')')
                  end = end_paren
                  while end < len(text) and text[end] in ' \t': end += 1
                  if end < len(text) and text[end] == ';': end += 1
                  if end < len(text) and text[end] == '\n': end += 1
                  text = text[:start] + text[end:]
              return text

          # ---------- index.html ----------
          p = Path('index.html')
          text = p.read_text(encoding='utf-8')

          # Static risk screen / controls / modals.
          text = re.sub(r'\s*<!-- PAGE: 유치부 관찰노트 -->\s*<script src="kinder-risk-ui\.js"></script>\s*', '\n', text)
          text = re.sub(r'\s*<script src="kinder-risk-ui\.js"></script>\s*', '\n', text)
          text = remove_button_by_class(text, 'recordNotifyBtn')
          text = remove_container_with_literal(text, '<div class="recordUtilityLabel">관찰노트</div>', 'recordUtilityBtn')
          text = remove_tag_by_opening_match(text, r'<div\b(?=[^>]*\bclass=["\'][^"\']*\bkinderRiskInfoPanel\b)[^>]*>', 'div')
          text = remove_tag_by_opening_match(text, r'<div\b(?=[^>]*\bid=["\']notificationInboxOverlay["\'])[^>]*>', 'div')
          text = re.sub(r'^.*elementaryRiskInfoPanel.*\n?', '', text, flags=re.M)
          text = re.sub(r'^.*kinderRiskInfoPanel.*openKinderRiskFromInfoModal.*\n?', '', text, flags=re.M)

          # Dedicated risk functions and duplicate notification patch functions.
          for fn in [
              'getRiskNotificationsStorageKey','hasAnyKinderRiskMemo','updateKinderInfoRiskPanel',
              'updateElementaryInfoRiskPanel','openRiskMemoPageById','openElementaryRiskFromInfoModal',
              'openKinderRiskFromInfoModal','getKinderFilledMemoCount','getSignalLevelByCount',
              'getKinderRiskStageLabel','formatSignalRecordDate','getFocusedKinderSignalIndex',
              'updateKinderRiskStageUI','buildKinderSignalSourceStudent','updateMemoSignalCircle',
              'updateNotificationButtons','openNotificationInbox','closeNotificationInbox',
              'normalizeRiskNotificationMessage','markRiskNotificationHandled','openRiskNotificationTarget'
          ]:
              text = remove_js_function(text, fn)

          # Old combined kinder-risk page patch blocks.
          text = remove_inline_script_blocks(text, [
              'function updateDirectorMemoBlockState',
              'function setupKinderDirectorAccordion',
              'const kinderCombinedSelectedSceneIds',
              'function safeRenderKinderCards',
              'function renderKinderRiskModeMenu',
              'function syncKinderRiskButtonLabel',
              'function getKinderKeyboardOffset'
          ])
          text = remove_style_by_id(text, 'olliKinderRiskUnifiedStyle')

          # Remove risk globals/calls and old screen names.
          for line_pat in [
              r'^\s*window\.sendKinderRiskPush\s*=.*\n?',
              r'^\s*window\.openNotificationInbox\s*=.*\n?',
              r'^\s*window\.closeNotificationInbox\s*=.*\n?',
              r'^\s*window\.openRiskNotificationTarget\s*=.*\n?'
          ]:
              text = re.sub(line_pat, '', text, flags=re.M)
          text = re.sub(r'\btry\s*\{\s*(?:if\s*\(typeof updateNotificationButtons[^\)]*\)\s*)?updateNotificationButtons\(\);?\s*\}\s*catch\s*\([^\)]*\)\s*\{\s*\}', '', text)
          text = re.sub(r'\bif\s*\(typeof updateNotificationButtons[^\)]*\)\s*updateNotificationButtons\(\);?', '', text)
          text = text.replace('updateNotificationButtons();', '')
          text = re.sub(r'\btry\s*\{\s*scheduleNotificationSync\(\);?\s*\}\s*catch\s*\([^\)]*\)\s*\{[^}]*\}', '', text)
          text = text.replace('scheduleNotificationSync();', '')
          text = text.replace("'openKinderRiskMemo','openKinderRiskMemoScreen',", '')
          text = text.replace(",'openKinderRiskMemo','openKinderRiskMemoScreen'", '')
          text = text.replace("'openKinderRiskMemo','openKinderRiskMemoScreen'", '')
          text = text.replace("'kinderRiskMemoScreen',", '')
          text = text.replace(", 'kinderRiskMemoScreen'", '')
          text = text.replace("'kinderRiskStudentName',", '')
          text = text.replace(", 'kinderRiskStudentName'", '')
          text = text.replace("'kinderObservationNoteTitle',", '')
          text = text.replace(", 'kinderObservationNoteTitle'", '')
          text = text.replace("const fromBottom = page.id === 'kinderRiskMemoScreen';", 'const fromBottom = false;')

          # Remove record-room risk-screen transitions.
          text = re.sub(r'^\s*const kinderRiskMemo = document\.getElementById\(["\']kinderRiskMemoScreen["\']\);\s*\n?', '', text, flags=re.M)
          text = re.sub(r'^\s*const kinderRiskMemoVisible = .*?;\s*\n?', '', text, flags=re.M)
          text = re.sub(r"previousScreenBeforeRecordRoom\s*=\s*kinderRiskMemoVisible\s*\?\s*'kinderRiskMemo'\s*:\s*\(memoVisible\s*\?\s*'studentMemo'\s*:\s*\(cardVisible\s*\?\s*'mainPage'\s*:\s*'recordRoom'\)\);", "previousScreenBeforeRecordRoom = memoVisible ? 'studentMemo' : (cardVisible ? 'mainPage' : 'recordRoom');", text)
          text = re.sub(r'^\s*if \(kinderRiskMemo\) kinderRiskMemo\.style\.display = ["\']none["\'];\s*\n?', '', text, flags=re.M)
          text = re.sub(r"\s*\}\s*else if \(previousScreenBeforeRecordRoom === 'kinderRiskMemo'\) \{[\s\S]*?\n\s*\} else \{", '\n  } else {', text, count=1)

          # Remove risk feature persistence registry.
          text = remove_registry(text, 'risk_signal')
          text = remove_registry(text, 'risk_signal_handled')

          # Remove risk from backup/export.
          text = text.replace('[students, feedbacks, summaries, risks, members]', '[students, feedbacks, summaries, members]')
          text = re.sub(r'^\s*supabase\(["\']GET["\'], `risk_signals\?[^\n]*\n?', '', text, flags=re.M)
          text = re.sub(r'^\s*risk_signals:\s*risks,?\s*\n?', '', text, flags=re.M)

          # Neutralize settings copy and remove retired manager director-note permission.
          new_roles = "  roles:{title:'권한 설정',html:function(){return '<div class=\"settingsDetailIntro\"><div class=\"settingsDetailTitle\">역할에 맞는 권한으로<br/>학생 기록을 안전하게 관리합니다.</div></div><div class=\"settingsRoleCard\"><div class=\"settingsRoleTop\"><div class=\"settingsRoleName\">원장</div><span class=\"settingsStatusBadge\">전체 권한</span></div><div class=\"settingsRoleList\"><div class=\"settingsRoleItem\">전체 학생과 모든 피드백 확인</div><div class=\"settingsRoleItem\">백업 / 내보내기 사용 가능</div><div class=\"settingsRoleItem\">선생님 계정과 권한 관리</div></div></div><div class=\"settingsRoleCard\"><div class=\"settingsRoleTop\"><div class=\"settingsRoleName\">관리자</div><span class=\"settingsStatusBadge\">점검 권한</span></div><div class=\"settingsRoleList\"><div class=\"settingsRoleItem\">학생 기록과 피드백 흐름 점검</div><div class=\"settingsRoleItem\">선생님 기록 상태 확인</div><div class=\"settingsRoleItem\">학원 삭제와 원장 양도는 제한</div></div></div><div class=\"settingsRoleCard\"><div class=\"settingsRoleTop\"><div class=\"settingsRoleName\">선생님</div><span class=\"settingsStatusBadge\">기록 권한</span></div><div class=\"settingsRoleList\"><div class=\"settingsRoleItem\">담당 학생 기록 작성</div><div class=\"settingsRoleItem\">피드백 작성과 성장 피드백 입력</div><div class=\"settingsRoleItem\">권한 변경과 데이터 내보내기는 제한</div></div></div>';}},\n"
          new_backup = "  backup:{title:'백업 / 내보내기',html:function(){return '<div class=\"settingsDetailIntro\"><div class=\"settingsDetailTitle\">백업과 내보내기는<br/>원장만 사용할 수 있습니다.</div></div><div class=\"settingsCard\"><div class=\"settingsRow\"><div class=\"settingsRowLeft\"><span class=\"settingsRowTitle\">전체 학생 데이터</span></div><span class=\"settingsBadge\">JSON</span></div><div class=\"settingsRow\"><div class=\"settingsRowLeft\"><span class=\"settingsRowTitle\">피드백 기록</span></div><span class=\"settingsBadge\">JSON</span></div></div><button class=\"settingsExportBtn\" onclick=\"downloadSettingsBackup()\" type=\"button\">전체 데이터 내보내기</button>';}},\n"
          new_privacy = "  privacy:{title:'개인정보 처리방침',html:function(){return '<div class=\"settingsDetailIntro\"><div class=\"settingsDetailTitle\">학생 기록은<br/>안전하게 관리되어야 합니다.</div></div><div class=\"settingsInfoCard\"><div class=\"settingsInfoHead\">수집되는 정보</div><div class=\"settingsInfoList\"><div class=\"settingsInfoItem\">학생 이름, 등록일, 반 정보</div><div class=\"settingsInfoItem\">수업 기록과 피드백 내용</div><div class=\"settingsInfoItem\">선생님 계정 및 작성 기록</div></div></div><div class=\"settingsInfoCard\"><div class=\"settingsInfoHead\">AI 사용 안내</div><div class=\"settingsInfoList\"><div class=\"settingsInfoItem\">AI 생성 문구는 자동 발송되지 않습니다.</div><div class=\"settingsInfoItem\">선생님 또는 원장의 검토 후 사용해야 합니다.</div></div></div>';}},\n"
          lines = text.splitlines(True)
          rebuilt = []
          for line in lines:
              s = line.lstrip()
              if s.startswith("roles:{title:'권한 설정'"): rebuilt.append(new_roles); continue
              if s.startswith("backup:{title:'백업 / 내보내기'"): rebuilt.append(new_backup); continue
              if s.startswith("privacy:{title:'개인정보 처리방침'"): rebuilt.append(new_privacy); continue
              if '관리자는 예외적으로 위험신호' in line or '설정 메뉴 자체는 알림만 허용한다.' in line: continue
              if "elementaryRiskInfoPanel" in line or ("kinderRiskInfoPanel" in line and "openKinderRiskFromInfoModal" in line): continue
              rebuilt.append(line)
          text = ''.join(rebuilt)

          # Replace one-line manager permission helpers/role override if present.
          text = re.sub(r"\s*async function setManagerPermission\(roleKey,value\)\{[^\n]*\}\n?", "\n  async function setManagerPermission(roleKey,value){if(roleKey!=='backup')return;const cached=settingsGetCachedState();const managerPermissions={...(cached.managerPermissions||{}),backup:!!value};settingsSaveCachePatch({managerPermissions});const academyId=settingsGetAcademyId();if(academyId&&isSupabaseConfigured()){try{await supabase('PATCH',`academies?id=eq.${encodeURIComponent(academyId)}`,{manager_can_backup:!!value});if(olliSettingsState&&olliSettingsState.academy)olliSettingsState.academy.manager_can_backup=!!value;}catch(err){console.warn('manager permission save failed:',err);alert('관리자 권한 저장 중 오류가 발생했습니다.\\n'+(err.message||err));}}openSettingsDetail('roles');}\n", text)
          clean_override = "  if(typeof settingsDetailData !== 'undefined' && settingsDetailData.roles){settingsDetailData.roles.html=function(){const backupOn=getManagerPermission('backup')||!!(olliSettingsState.academy&&olliSettingsState.academy.manager_can_backup);return '<div class=\"settingsDetailIntro\"><div class=\"settingsDetailTitle\">관리자 기본 권한 위에<br>필요한 권한만 추가합니다.</div></div><div class=\"settingsRoleCard\"><div class=\"settingsRoleTop\"><div class=\"settingsRoleName\">원장</div><span class=\"settingsStatusBadge\">전체 권한</span></div><div class=\"settingsRoleList\"><div class=\"settingsRoleItem\">전체 설정, 선생님 관리, 학원 삭제/양도</div><div class=\"settingsRoleItem\">백업 / 내보내기 사용 가능</div></div></div><div class=\"settingsRoleCard\"><div class=\"settingsRoleTop\"><div class=\"settingsRoleName\">관리자 기본 권한</div><span class=\"settingsStatusBadge\">기본 권한</span></div><div class=\"settingsRoleList\"><div class=\"settingsRoleItem\">학생 기록과 피드백 흐름 점검 가능</div><div class=\"settingsRoleItem\">선생님 기록 상태 확인 가능</div><div class=\"settingsRoleItem\">학원 삭제, 원장 양도, 권한 부여는 제한</div></div></div><div class=\"settingsRoleCard\"><div class=\"settingsRoleTop\"><div class=\"settingsRoleName\">관리자 추가 권한 부여</div><span class=\"settingsStatusBadge\">선택 권한</span></div><div class=\"settingsPermissionRow\"><div><div class=\"settingsPermissionText\">백업 / 내보내기 사용 가능</div><div class=\"settingsPermissionDesc\">관리자에게 데이터 내보내기 권한을 추가로 부여합니다.</div></div><button class=\"settingsMiniSwitch '+(backupOn?'on':'')+'\" type=\"button\" onclick=\"toggleManagerPermission(\\'backup\\')\"></button></div></div><div class=\"settingsRoleCard\"><div class=\"settingsRoleTop\"><div class=\"settingsRoleName\">선생님</div><span class=\"settingsStatusBadge\">기록 권한</span></div><div class=\"settingsRoleList\"><div class=\"settingsRoleItem\">담당 학생 기록 작성</div><div class=\"settingsRoleItem\">피드백 작성과 성장 피드백 입력</div><div class=\"settingsRoleItem\">권한 변경과 데이터 내보내기는 제한</div></div></div>';};}\n"
          text = re.sub(r"^\s*if\(typeof settingsDetailData !== 'undefined' && settingsDetailData\.roles\)\{settingsDetailData\.roles\.html=function\(\)\{[^\n]*$", clean_override.rstrip('\n'), text, flags=re.M)

          # Legacy student risk memo fields are retired; stop reading/writing them.
          text = text.replace(", memo1: '', memo2: '', memo3: '', memo4: ''", '')
          text = re.sub(r'^\s*memo[1-5]:\s*(?:item\?\.|row\.|student\.|remote\.|mutableValue\()[^\n]*\n?', '', text, flags=re.M)
          text = re.sub(r'^\s*sceneMemo:\s*(?:item\?\.|row\.|student\.|remote\.|mutableValue\()[^\n]*\n?', '', text, flags=re.M)
          text = re.sub(r'^\s*kinderSceneMemo:\s*[^\n]*\n?', '', text, flags=re.M)
          text = re.sub(r"(?:,\s*)?'memo1'\s*,\s*'memo2'\s*,\s*'memo3'", '', text)
          text = re.sub(r"\s*memo1:\s*'',\s*\n\s*memo2:\s*'',\s*\n\s*memo3:\s*'',\s*\n\s*memo4:\s*'',?\s*\n", '', text)
          text = re.sub(r"\s*memo1:\s*'',\s*memo2:\s*'',\s*memo3:\s*'',\s*memo4:\s*'',?", '', text)
          text = re.sub(r",\s*'memo1',\s*'memo2',\s*'memo3'", '', text)

          # Remove any remaining lines that only reference retired risk screen/notifications.
          text = re.sub(r'^.*(?:kinderRiskMemoScreen|recordDoorDot|hasRiskNotifications|manager_can_director_note|directorNote).*\n?', '', text, flags=re.M)

          # CSS: remove risk-only selectors while preserving shared declarations for other selectors.
          text = filter_all_style_tags(text)
          p.write_text(text, encoding='utf-8')

          # ---------- observation-memo-core.js ----------
          p = Path('observation-memo-core.js')
          core = p.read_text(encoding='utf-8')
          marker = "function openStudentMemoPageById(studentId) {\n  const student = findStudentById(studentId);\n  if (!student) return;"
          if marker in core and "student.type === 'kinder'" not in core[core.find(marker):core.find(marker)+400]:
              core = core.replace(marker, marker + "\n  if (student.type === 'kinder') {\n    currentMemoStudent = student;\n    currentMemoType = 'kinder';\n    if (typeof openKinderChatFeedbackPage === 'function') openKinderChatFeedbackPage();\n    return;\n  }", 1)
          core = core.replace("currentMemoType = student.type === 'kinder' ? 'kinder' : 'elementary';", "currentMemoType = 'elementary';")
          core = remove_if_block(core, "  if (currentMemoType === 'kinder') {")
          core = re.sub(r'^\s*const kinderRiskMemoScreenEl = .*?;\s*\n?', '', core, flags=re.M)
          core = re.sub(r'^\s*if \(kinderRiskMemoScreenEl\).*?\n?', '', core, flags=re.M)
          core = re.sub(r'^.*updateMemoSignalCircle\([^\n]*\n?', '', core, flags=re.M)
          core = remove_js_function(core, 'autoResizeKinderMemoBoxes')
          core = re.sub(r"^\s*if \(\['kinderMemoBox1'[^\n]*\n?", '', core, flags=re.M)
          for fn in [
              'getRiskNotifications','setRiskNotifications','normalizeRiskSignalRow','loadRiskNotificationsFromSupabase',
              'saveRiskNotificationToSupabase','saveRiskNotification','updateNotificationButtons','scheduleNotificationSync',
              'normalizeRiskNotificationMessage','openNotificationInbox','closeNotificationInbox','formatNotificationDate',
              'markRiskNotificationHandled','openRiskNotificationTarget','sendKinderRiskPush'
          ]:
              core = remove_js_function(core, fn)
          core = re.sub(r'^.*loadRiskNotificationsFromSupabase\([^\n]*\n?', '', core, flags=re.M)
          core = core.replace("tag: 'olli-risk-signal'", "tag: 'olli-notification'")
          core = re.sub(r'^.*sendKinderRiskPush\(\);.*\n?', '', core, flags=re.M)
          core = re.sub(r'^.*kinderRiskMemoScreen.*\n?', '', core, flags=re.M)
          core = re.sub(r'^.*kinderMemoBox[1-5].*\n?', '', core, flags=re.M)
          core = re.sub(r'^.*kinderSceneMemoInput.*\n?', '', core, flags=re.M)
          p.write_text(core, encoding='utf-8')

          # ---------- kinder-feedback.js ----------
          p = Path('kinder-feedback.js')
          kcf = p.read_text(encoding='utf-8')
          kcf = re.sub(r'^\s*try \{ updateNotificationButtons\(\); \} catch\(e\) \{\}\s*\n?', '', kcf, flags=re.M)
          kcf = re.sub(r'^\s*if \(typeof updateNotificationButtons[^\n]*\n?', '', kcf, flags=re.M)
          p.write_text(kcf, encoding='utf-8')

          # ---------- pc-shell.js ----------
          p = Path('pc-shell.js')
          shell = p.read_text(encoding='utf-8')
          shell = re.sub(r'^\s*if \(typeof global\.updateNotificationButtons[^\n]*\n?', '', shell, flags=re.M)
          shell = shell.replace("'kinderRiskMemoScreen', ", '')
          shell = shell.replace(", 'kinderRiskMemoScreen'", '')
          shell = shell.replace(" || page === 'kinderRiskMemoScreen'", '')
          shell = shell.replace(" || pageId === 'kinderRiskMemoScreen'", '')
          shell = shell.replace("pageId === 'kinderRiskMemoScreen' ? 'kinder' : 'elementary'", "'elementary'")
          shell = shell.replace("pageId === 'kinderChatFeedbackScreen' || pageId === 'kinderRiskMemoScreen'", "pageId === 'kinderChatFeedbackScreen'")
          p.write_text(shell, encoding='utf-8')

          # ---------- pc-start-page.js ----------
          p = Path('pc-start-page.js')
          start = p.read_text(encoding='utf-8')
          start = start.replace("'kinderRiskMemoScreen',", '')
          start = start.replace(",'kinderRiskMemoScreen'", '')
          p.write_text(start, encoding='utf-8')

          # ---------- docs ----------
          p = Path('OLLI_PC_MODULES.md')
          doc = p.read_text(encoding='utf-8')
          doc = re.sub(r'^\| 유치부 위험신호 화면 \|.*\n?', '', doc, flags=re.M)
          doc = re.sub(r'### 유치부 위험신호\n[\s\S]*?(?=### |\Z)', '', doc)
          note = '- 유치부 위험신호 기능은 2026-09-04 기준으로 제거했다. 유치부 수업 기록은 `kinder-feedback-ui.js`, `kinder-feedback.js`의 1분 피드백 흐름을 사용한다.\n'
          if note not in doc:
              anchor = '### 유치부 1분 피드백\n'
              if anchor in doc: doc = doc.replace(anchor, anchor + '\n' + note, 1)
          p.write_text(doc, encoding='utf-8')

          # Dedicated risk UI file is no longer used.
          Path('kinder-risk-ui.js').unlink(missing_ok=True)
          PY
      - name: Verify removal
        shell: bash
        run: |
          set -euo pipefail
          node --check observation-memo-core.js
          node --check kinder-feedback.js
          node --check pc-shell.js
          node --check pc-start-page.js
          test ! -f kinder-risk-ui.js
          ! grep -RInE --exclude-dir=.git --exclude='audit-remove-risk-feature.yml' --exclude='one-shot-remove-risk-feature.yml' 'kinderRisk|RiskMemo|risk_signal|risk_signals|위험신호|recordNotifyBtn|notificationInbox|hasRiskNotifications|sendKinderRiskPush|manager_can_director_note|directorNote|recordDoorDot|kinderMemoBox[1-5]|kinderSceneMemoInput|setKinderCombinedMode|autoResizeKinderMemoBoxes' .
          ! grep -RInE --exclude-dir=.git --exclude='audit-remove-risk-feature.yml' --exclude='one-shot-remove-risk-feature.yml' '\bmemo[1-5]\b' index.html observation-memo-core.js
          grep -q 'function openStudentMemoPageById' observation-memo-core.js
          grep -q 'function saveCurrentMemo' observation-memo-core.js
          grep -q 'function openKinderChatFeedbackPage' kinder-feedback.js
          grep -q 'studentMemoScreen' observation-editor-ui.js
          grep -q 'kinderChatFeedbackScreen' kinder-feedback-ui.js
          grep -q 'function showBrowserNotification' observation-memo-core.js
          grep -q 'function showPushToast' observation-memo-core.js
          ! grep -q 'kinder-risk-ui.js' index.html
          node <<'NODE'
          const fs=require('fs'), vm=require('vm');
          const html=fs.readFileSync('index.html','utf8');
          const re=/<script\b([^>]*)>([\s\S]*?)<\/script\s*>/gi;
          let m, count=0;
          while((m=re.exec(html))){
            const attrs=m[1]||'', body=m[2]||'';
            if(/\bsrc\s*=/.test(attrs) || /type\s*=\s*["'](?:application\/json|application\/ld\+json)["']/.test(attrs)) continue;
            try { new vm.Script(body); count++; }
            catch(e){ console.error('Inline script syntax failure near script', count+1, e.message); process.exit(1); }
          }
          console.log('inline scripts syntax checked:', count);
          NODE
          echo "index bytes: $(wc -c < index.html)"
      - name: Commit removal
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A index.html observation-memo-core.js kinder-feedback.js pc-shell.js pc-start-page.js OLLI_PC_MODULES.md kinder-risk-ui.js
          git commit -m 'Remove retired risk signal feature'
          git push
