name: Fix operations policy boundary
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/fix-operations-policy-boundary.yml'
jobs:
  fix:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Move platform-specific consultation loader back to PC runtime
        run: |
          python - <<'PY'
          from pathlib import Path
          import re, subprocess

          policy_path=Path('olli-operations-consultation-policy.js')
          runtime_path=Path('olli-consultation-runtime.js')
          policy=policy_path.read_text(encoding='utf-8')
          runtime=runtime_path.read_text(encoding='utf-8')
          name='loadOlliConsultationRulesFromServer'

          def function_block(text,name):
            m=re.search(r'(?:async\s+)?function\s+'+re.escape(name)+r'\s*\(',text)
            if not m: raise SystemExit('function not found: '+name)
            start=m.start(); open_paren=text.find('(',m.start()); i=open_paren; pdepth=0; quote=None; esc=False
            while i < len(text):
              ch=text[i]
              if quote:
                if esc: esc=False
                elif ch=='\\': esc=True
                elif ch==quote: quote=None
              else:
                if ch in ('\"',"'"): quote=ch
                elif ch=='(': pdepth+=1
                elif ch==')':
                  pdepth-=1
                  if pdepth==0: break
              i+=1
            brace=text.find('{',i)
            i=brace; depth=0; quote=None; esc=False; line=False; block=False; template=False
            while i < len(text):
              ch=text[i]; nx=text[i+1] if i+1<len(text) else ''
              if line:
                if ch=='\n': line=False
                i+=1; continue
              if block:
                if ch=='*' and nx=='/': block=False; i+=2; continue
                i+=1; continue
              if quote:
                if esc: esc=False
                elif ch=='\\': esc=True
                elif ch==quote: quote=None
                i+=1; continue
              if template:
                if esc: esc=False
                elif ch=='\\': esc=True
                elif ch=='`': template=False
                i+=1; continue
              if ch=='/' and nx=='/': line=True; i+=2; continue
              if ch=='/' and nx=='*': block=True; i+=2; continue
              if ch in ('\"',"'"): quote=ch; i+=1; continue
              if ch=='`': template=True; i+=1; continue
              if ch=='{': depth+=1
              elif ch=='}':
                depth-=1
                if depth==0: return text[start:i+1]
              i+=1
            raise SystemExit('unclosed function: '+name)

          if re.search(r'(?:async\s+)?function\s+'+name+r'\s*\(',runtime):
            raise SystemExit('loader already exists in runtime')
          fb=function_block(policy,name)
          policy=policy.replace(fb,'',1)
          marker='let olliConsultationProgressRefreshPromise = null;'
          if runtime.count(marker)!=1: raise SystemExit('runtime insertion marker mismatch')
          runtime=runtime.replace(marker,fb+'\n\n'+marker,1)
          policy_path.write_text(policy,encoding='utf-8')
          runtime_path.write_text(runtime,encoding='utf-8')
          subprocess.run(['node','--check',str(policy_path)],check=True)
          subprocess.run(['node','--check',str(runtime_path)],check=True)
          if re.search(r'(?:async\s+)?function\s+'+name+r'\s*\(',policy): raise SystemExit('loader remained in common policy')
          if not re.search(r'(?:async\s+)?function\s+'+name+r'\s*\(',runtime): raise SystemExit('loader missing from runtime')
          print('common_policy_bytes',policy_path.stat().st_size)
          print('pc_runtime_bytes',runtime_path.stat().st_size)
          PY
      - name: Commit boundary correction
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add olli-operations-consultation-policy.js olli-consultation-runtime.js
          git commit -m "refactor: 상담 기준 서버 로딩을 PC 런타임으로 분리" || exit 0
          git push
