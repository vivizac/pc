name: Audit settings imports
on:
  push:
    paths:
      - '.github/workflows/audit-settings-imports.yml'
jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Analyze imports
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          p=Path('olli-settings-imports.js')
          t=p.read_text(encoding='utf-8')
          lines=t.splitlines()
          print('BYTES',len(t.encode()))
          print('LINES',len(lines))
          for i,line in enumerate(lines,1):
              s=line.strip()
              m=re.match(r'(?:async\s+)?function\s+([A-Za-z_$][\w$]*)\s*\(',s)
              if m:
                  print(f'{i}: {m.group(1)}')
          print('TAIL_STORAGE')
          sl=Path('olli-settings-storage.js').read_text(encoding='utf-8').splitlines()
          for i,line in enumerate(sl[max(0,len(sl)-80):], max(1,len(sl)-79)):
              print(f'{i}: {line}')
          print('INDEX_SETTINGS_SCRIPTS')
          idx=Path('index.html').read_text(encoding='utf-8')
          for m in re.finditer(r'<script\s+src="(olli-settings-[^"]+\.js)"[^>]*></script>', idx):
              print(m.group(1))
          PY
