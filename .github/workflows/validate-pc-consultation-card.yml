name: Validate PC consultation tenure badge

on:
  pull_request:
    paths:
      - 'apps/pc/pc-student-management.js'
      - 'tests/pc-consultation-tenure-badge.test.cjs'
      - '.github/workflows/validate-pc-consultation-card.yml'
  push:
    branches: [main]
    paths:
      - 'apps/pc/pc-student-management.js'
      - 'tests/pc-consultation-tenure-badge.test.cjs'
      - '.github/workflows/validate-pc-consultation-card.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: node --check apps/pc/pc-student-management.js
      - run: node --test tests/pc-consultation-tenure-badge.test.cjs
