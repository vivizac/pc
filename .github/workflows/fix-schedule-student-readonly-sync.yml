name: Fix schedule student readonly sync

on:
  push:
    paths:
      - '.github/workflows/fix-schedule-student-readonly-sync.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Patch schedule refresh and student lifecycle persistence
        run: |
          python - <<'PY'
          from pathlib import Path

          def replace_once(path, old, new, label):
              p = Path(path)
              text = p.read_text(encoding='utf-8')
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'{label}: expected exactly 1 match, found {count}')
              p.write_text(text.replace(old, new, 1), encoding='utf-8')

          replace_once(
              'pc-timetable.js',
              """  async function refreshStudentsFromServer() {\n    if (typeof global.loadStudentsFromSupabase === 'function') {\n      try { await global.loadStudentsFromSupabase(); } catch (error) { console.warn('담임 학생정보 동기화 실패:', error); }\n    }\n  }""",
              """  async function refreshStudentsFromServer(options = {}) {\n    if (typeof global.loadStudentsFromSupabase === 'function') {\n      try { await global.loadStudentsFromSupabase(options); } catch (error) { console.warn('담임 학생정보 동기화 실패:', error); }\n    }\n  }""",
              'pc refreshStudentsFromServer options'
          )

          replace_once(
              'pc-timetable.js',
              """  async function refreshActiveSchedulePane(realtimeContext) {\n    if (!state.active || state.view !== 'schedule') return false;\n    await refreshStudentsFromServer();""",
              """  async function refreshActiveSchedulePane(realtimeContext) {\n    if (!state.active || state.view !== 'schedule') return false;\n    // 시간표 Realtime/폴링 갱신은 학생 정보를 읽기만 합니다.\n    // 연령/학년 자동 보정 저장은 앱 시작 시 별도 경로에서만 수행합니다.\n    await refreshStudentsFromServer({ skipLifecycleSync: true });""",
              'pc schedule refresh read-only student sync'
          )

          replace_once(
              'olli-data-student-operations.js',
              'async function loadStudentsFromSupabase() {',
              'async function loadStudentsFromSupabase(options = {}) {',
              'student loader options'
          )

          replace_once(
              'olli-data-student-operations.js',
              '    await syncOlliStudentLifecycleAfterLoad();\n    return { changed: beforeSnapshot !== JSON.stringify(getAllStudents()) };',
              """    if (!options.skipLifecycleSync) {\n      await syncOlliStudentLifecycleAfterLoad();\n    }\n    return { changed: beforeSnapshot !== JSON.stringify(getAllStudents()) };""",
              'student lifecycle optional sync'
          )

          replace_once(
              'olli-data-student-operations.js',
              """    const result = await loadStudentsFromSupabase();\n    if (result && result.changed === false) return;""",
              """    // 백그라운드 목록 새로고침은 서버 원본을 읽기만 하고 학생 프로필을 자동 저장하지 않습니다.\n    const result = await loadStudentsFromSupabase({ skipLifecycleSync: true });\n    if (result && result.changed === false) return;""",
              'background student sync read-only'
          )

          old_values = "valueColumns: ['academy_id', 'academy_name', 'academy_region', 'name', 'division', 'enrolled_at', 'kindergarten', 'age', 'lesson_day', 'lesson_time', 'group_no', 'group_months', 'feedback_months', 'personality', 'school', 'grade', 'class_no', 'status', 'withdrawn_at', 'paused_at', 'status_changed_at'],"
          new_values = "valueColumns: ['academy_id', 'academy_name', 'academy_region', 'name', 'division', 'enrolled_at', 'kindergarten', 'age', 'birth_year', 'school_entry_year', 'previous_division', 'division_changed_at', 'lesson_day', 'lesson_time', 'group_no', 'group_months', 'feedback_months', 'personality', 'school', 'grade', 'class_no', 'status', 'withdrawn_at', 'paused_at', 'status_changed_at'],"
          replace_once('olli-storage-core.js', old_values, new_values, 'student_profile valueColumns lifecycle fields')

          old_select = "selectColumns: ['id', 'academy_id', 'academy_name', 'academy_region', 'name', 'division', 'enrolled_at', 'kindergarten', 'age', 'lesson_day', 'lesson_time', 'group_no', 'group_months', 'feedback_months', 'personality', 'school', 'grade', 'class_no', 'status', 'withdrawn_at', 'paused_at', 'status_changed_at', 'updated_at']"
          new_select = "selectColumns: ['id', 'academy_id', 'academy_name', 'academy_region', 'name', 'division', 'enrolled_at', 'kindergarten', 'age', 'birth_year', 'school_entry_year', 'previous_division', 'division_changed_at', 'lesson_day', 'lesson_time', 'group_no', 'group_months', 'feedback_months', 'personality', 'school', 'grade', 'class_no', 'status', 'withdrawn_at', 'paused_at', 'status_changed_at', 'updated_at']"
          replace_once('olli-storage-core.js', old_select, new_select, 'student_profile selectColumns lifecycle fields')

          # Guard against accidental broad changes.
          tt = Path('pc-timetable.js').read_text(encoding='utf-8')
          ops = Path('olli-data-student-operations.js').read_text(encoding='utf-8')
          core = Path('olli-storage-core.js').read_text(encoding='utf-8')
          assert "refreshStudentsFromServer({ skipLifecycleSync: true })" in tt
          assert "loadStudentsFromSupabase({ skipLifecycleSync: true })" in ops
          for field in ['birth_year', 'school_entry_year', 'previous_division', 'division_changed_at']:
              assert field in core
          PY

      - name: Syntax checks
        run: |
          node --check pc-timetable.js
          node --check olli-data-student-operations.js
          node --check olli-storage-core.js

      - name: Realtime regression test
        run: node tests/schedule-realtime.test.cjs

      - name: Commit patch
        run: |
          if git diff --quiet -- pc-timetable.js olli-data-student-operations.js olli-storage-core.js; then
            echo 'No patch changes required.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add pc-timetable.js olli-data-student-operations.js olli-storage-core.js
          git commit -m 'Separate schedule refresh from student lifecycle writes'
          git push origin HEAD:main
