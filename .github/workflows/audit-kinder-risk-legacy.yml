name: Audit kinder risk legacy
on:
  push:
    paths:
      - '.github/workflows/audit-kinder-risk-legacy.yml'
jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Audit focused legacy ranges
        shell: bash
        run: |
          set -e
          show(){ echo; echo "===== $1 ====="; sed -n "$2p" index.html; }
          show 'risk open/info functions' '11340,11445'
          show 'risk screen update helpers' '12470,12540'
          show 'screen transitions' '13950,14040'
          show 'observation standalone open + record room transitions' '14880,15105'
          show 'window exports' '17435,17475'
          show 'settings/standalone links' '18940,18990'
          show 'late kinder risk patches' '28355,28445'
          show 'late kinder risk UI patch' '28740,28825'
          echo; echo '===== observation-memo-core opening/closing ====='
          sed -n '1,125p' observation-memo-core.js
          echo; echo '===== observation-memo-core risk system ====='
          sed -n '400,680p' observation-memo-core.js
          echo; echo '===== kinder-feedback cross navigation ====='
          sed -n '1,110p' kinder-feedback.js
          echo; echo '===== exact callsites ====='
          grep -RInE --exclude-dir=.git --exclude='audit-kinder-risk-legacy.yml' 'openRiskMemoPageById|openKinderRiskFromInfoModal|openKinderRiskFrom|openObservationNoteFromRecord|recordModeToggleBtn|recordStorageToggleBtn' . || true
