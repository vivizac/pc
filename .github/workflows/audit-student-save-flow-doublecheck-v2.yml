name: Audit student save flow doublecheck v2

on:
  push:
    branches:
      - refactor/source-owned-no-overrides-20260912
    paths:
      - .github/workflows/audit-student-save-flow-doublecheck-v2.yml

permissions:
  contents: write

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refactor/source-owned-no-overrides-20260912
          fetch-depth: 0

      - name: Reverse trace with Python
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          groups = {
            'A. PROFILE SAVE CALLERS': re.compile(r'ensureStudentSavedToSupabase|saveStudentInfoCard|saveElementaryInfo|saveKinderInfo'),
            'B. AUTHORITATIVE SCHEDULE WRITE CALLERS': re.compile(r'setAuthoritativeSchedule|setOlliStudentAuthoritativeSchedule|saveOlliStudentScheduleFromInfo|olli_schedule_set_student_weekly_schedule'),
            'C. SCHEDULE PAIR PRODUCERS / EXTRA HOOKS': re.compile(r'olliGetInfoSchedulePairs|olliGetStudentAddSchedulePairs|olliPrepareInfoExtra|olliGetInfoExtra|installAuthoritativeScheduleEditor|olliStudentScheduleAugmentInfoExtra|olliStudentScheduleAugmentStudentAddExtra'),
            'D. NEW STUDENT REGISTRATION ROUTING': re.compile(r'confirmStudent|olliPrepareStudentRegistrationRouting|olliCommitStudentRegistrationRouting|olliReleaseStudentRegistrationRouting|saveOlliStudentScheduleFromInfo'),
            'E. RPC SQL DEFINITIONS / MIGRATIONS': re.compile(r'olli_schedule_set_student_weekly_schedule|student_weekly_schedule|schedule_student_enrollments'),
            'F. CRITICAL FUNCTION ASSIGNMENTS': re.compile(r'(?:window\.|global\.)?(?:saveElementaryInfo|saveKinderInfo|olliPrepareInfoExtra|olliGetInfoExtra|olliPrepareStudentAddExtra|olliGetStudentAddExtra)\s*=')
          }
          skip = {'.git', 'node_modules', 'dist', 'build'}
          files = []
          for p in Path('.').rglob('*'):
            if not p.is_file() or any(part in skip for part in p.parts):
              continue
            if p.suffix.lower() not in {'.js','.html','.sql','.md','.yml','.yaml'}:
              continue
            files.append(p)

          total = 0
          for title, pattern in groups.items():
            print(f'=== {title} ===')
            hits = 0
            for p in sorted(files):
              try:
                lines = p.read_text(errors='ignore').splitlines()
              except Exception:
                continue
              for i, line in enumerate(lines, 1):
                if pattern.search(line):
                  print(f'{p}:{i}:{line.strip()}')
                  hits += 1
            print(f'-- hits: {hits} --')
            total += hits
          print(f'=== TOTAL HITS: {total} ===')
          if total == 0:
            raise SystemExit('audit produced zero hits')
          PY

      - name: Cleanup one-shot audit workflow
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          rm -f .github/workflows/audit-student-save-flow-doublecheck-v2.yml
          git add -A
          git commit -m "chore: remove python student save flow audit" || true
          git push origin HEAD:refactor/source-owned-no-overrides-20260912
