name: refactor-shared-attendance-source-owner

on:
  push:
    branches:
      - refactor/source-owned-no-overrides-20260912

permissions:
  contents: write

jobs:
  refactor:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Move attendance sort and settings hooks into shared owners
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          # '전체' 정렬은 상태 순서 + 이름 한글순만 사용합니다.
          p = Path('olli-data-record-list.js')
          s = p.read_text(encoding='utf-8')
          old_elem = """function compareElementaryByRecordSort(a,b) {
  const criterion = getRecordSortCriteria('elementary');
  let result = 0;
"""
          new_elem = """function compareElementaryByRecordSort(a,b) {
  const criterion = getRecordSortCriteria('elementary');
  if (criterion === 'initial') return compareRecordSortName(a,b);
  let result = 0;
"""
          if s.count(old_elem) != 1:
              raise SystemExit(f'elementary comparator owner block count={s.count(old_elem)}')
          s = s.replace(old_elem, new_elem, 1)
          old_kinder = """function compareKinderByRecordSort(a,b) {
  const criterion = getRecordSortCriteria('kinder');
  let result = 0;
"""
          new_kinder = """function compareKinderByRecordSort(a,b) {
  const criterion = getRecordSortCriteria('kinder');
  if (criterion === 'initial') return compareRecordSortName(a,b);
  let result = 0;
"""
          if s.count(old_kinder) != 1:
              raise SystemExit(f'kinder comparator owner block count={s.count(old_kinder)}')
          p.write_text(s.replace(old_kinder, new_kinder, 1), encoding='utf-8')

          # 출결 설정 기능은 canonical settingsApplyStateToUI가 명시적으로 호출합니다.
          p = Path('olli-settings-base.js')
          s = p.read_text(encoding='utf-8')
          marker = """  if (typeof window.olliApplySettingsAccountEnhancements === 'function') {
    try { window.olliApplySettingsAccountEnhancements(); } catch (err) { console.warn('settings account UI extension skipped:', err); }
  }
"""
          replacement = marker + """  if (typeof window.olliApplyAttendancePolicySettings === 'function') {
    try { window.olliApplyAttendancePolicySettings(); } catch (err) { console.warn('attendance policy settings extension skipped:', err); }
  }
"""
          if s.count(marker) != 1:
              raise SystemExit(f'settings extension marker count={s.count(marker)}')
          p.write_text(s.replace(marker, replacement, 1), encoding='utf-8')
          PY
          node --check olli-data-record-list.js
          node --check olli-settings-base.js
          git diff --check
          grep -Fq "if (criterion === 'initial') return compareRecordSortName(a,b);" olli-data-record-list.js
          test "$(grep -Fc "if (criterion === 'initial') return compareRecordSortName(a,b);" olli-data-record-list.js)" -eq 2
          grep -Fq "typeof window.olliApplyAttendancePolicySettings === 'function'" olli-settings-base.js
      - name: Commit source correction
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet; then exit 0; fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add olli-data-record-list.js olli-settings-base.js
          git commit -m 'refactor: own attendance sort and settings hooks in shared sources'
          git push origin HEAD:refactor/source-owned-no-overrides-20260912
