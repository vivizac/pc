name: refactor-shared-attendance-source-owner

on:
  push:
    branches:
      - refactor/source-owned-no-overrides-20260912

permissions:
  contents: write

jobs:
  refactor:
    if: ${{ github.actor != 'github-actions[bot]' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Apply shared attendance source changes
        run: python3 .github/tmp/refactor_shared_attendance.py
      - name: Validate shared attendance source changes
        shell: bash
        run: |
          set -euo pipefail
          node --check olli-data-record-list.js
          node --check olli-settings-base.js
          git diff --check
          test "$(grep -Fc "if (criterion === 'initial') return compareRecordSortName(a,b);" olli-data-record-list.js)" -eq 2
          grep -Fq "typeof window.olliApplyAttendancePolicySettings === 'function'" olli-settings-base.js
      - name: Commit source changes
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet; then exit 0; fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add olli-data-record-list.js olli-settings-base.js
          git commit -m 'refactor: own attendance sort and settings hooks in shared sources'
          git push origin HEAD:refactor/source-owned-no-overrides-20260912
