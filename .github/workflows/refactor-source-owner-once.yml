name: audit-shared-settings-source-owner

on:
  push:
    branches:
      - refactor/source-owned-no-overrides-20260912

permissions:
  contents: read

jobs:
  audit:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Inspect canonical settings source functions
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          p = Path('olli-settings-base.js')
          lines = p.read_text(encoding='utf-8').splitlines()
          for needle in ['function settingsSetCachedAcademy(', 'function settingsApplyStateToUI(']:
              for i, line in enumerate(lines):
                  if needle in line:
                      start=max(0,i-5); end=min(len(lines),i+90)
                      print(f'\n### {needle} line {i+1}')
                      for n in range(start,end):
                          print(f'{n+1}: {lines[n]}')
                      break
          PY
