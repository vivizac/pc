name: refactor-shared-feedback-policy-source

on:
  push:
    branches:
      - refactor/source-owned-no-overrides-20260912

permissions:
  contents: write

jobs:
  refactor:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Move cleared group behavior into policy source
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          p = Path('olli-operations-feedback-policy.js')
          s = p.read_text(encoding='utf-8')
          old = "function getElementaryGroupFeedbackMonths(group, student = null) {\n  const groupKey = String(group || student?.group || '').trim();\n  const saved = readElementaryGroupFeedbackMonthsMap();\n  if (groupKey && Array.isArray(saved[groupKey]) && saved[groupKey].length) return saved[groupKey];\n  return normalizeElementaryGroupMonths(student?.group_months || student?.feedback_months || student?.feedbackMonths || student?.groupFeedbackMonths || '');\n}\n"
          new = "function getElementaryGroupFeedbackMonths(group, student = null) {\n  const explicitGroup = arguments.length >= 1;\n  const groupKey = String(explicitGroup ? (group || '') : (student?.group || '')).trim();\n  if (explicitGroup && !groupKey) return [];\n  const saved = readElementaryGroupFeedbackMonthsMap();\n  if (groupKey && Array.isArray(saved[groupKey]) && saved[groupKey].length) return saved[groupKey];\n  return normalizeElementaryGroupMonths(student?.group_months || student?.feedback_months || student?.feedbackMonths || student?.groupFeedbackMonths || '');\n}\n"
          if s.count(old) != 1:
              raise SystemExit(f'feedback month source block count={s.count(old)}')
          p.write_text(s.replace(old, new, 1), encoding='utf-8')
          PY
          node --check olli-operations-feedback-policy.js
          git diff --check
          grep -Fq 'if (explicitGroup && !groupKey) return [];' olli-operations-feedback-policy.js
      - name: Commit source correction
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet; then exit 0; fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add olli-operations-feedback-policy.js
          git commit -m 'refactor: own cleared group feedback months in policy source'
          git push origin HEAD:refactor/source-owned-no-overrides-20260912
