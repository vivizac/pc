name: audit-shared-student-schedule-source

on:
  push:
    branches:
      - refactor/source-owned-no-overrides-20260912

permissions:
  contents: read

jobs:
  audit:
    if: ${{ github.actor != 'github-actions[bot]' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Locate shared student schedule source owners
        shell: bash
        run: |
          set -e
          python3 - <<'PY'
          from pathlib import Path
          needles = [
            'getElementaryGroupFeedbackMonths',
            'ELEMENTARY_GROUP_MONTH',
            'mergeStudentInfoPreservingLocal',
            'normalizeLessonTimeDisplay',
            'getElementaryMetaText',
            'getKinderMetaText',
            'olliPatchStudentModalMarkup',
            'olliPrepareInfoExtra',
            'olliGetInfoExtra',
          ]
          for path in sorted(Path('.').rglob('*')):
            if not path.is_file() or path.suffix.lower() not in {'.js','.html','.mjs','.cjs'}:
              continue
            text = path.read_text(encoding='utf-8', errors='replace')
            hits = [(i,line.strip()) for i,line in enumerate(text.splitlines(),1) if any(n in line for n in needles)]
            if hits:
              print(f'\n### {path}')
              for i,line in hits:
                print(f'{i}: {line}')
          PY
