name: refactor-shared-settings-source-owner

on:
  push:
    branches:
      - refactor/source-owned-no-overrides-20260912

permissions:
  contents: write

jobs:
  refactor:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Move phone settings composition into canonical source calls
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          p = Path('olli-settings-base.js')
          s = p.read_text(encoding='utf-8')
          old_cached = "function settingsSetCachedAcademy(academy) {\n  if (!academy) return;\n  localStorage.setItem('olli_current_academy_id', academy.id);\n  localStorage.setItem('olli_current_academy_code', academy.academy_code || '');\n  localStorage.setItem('olli_current_academy_name', academy.academy_name || '');\n}\n"
          new_cached = "function settingsSetCachedAcademy(academy) {\n  if (!academy) return;\n  localStorage.setItem('olli_current_academy_id', academy.id);\n  localStorage.setItem('olli_current_academy_code', academy.academy_code || '');\n  localStorage.setItem('olli_current_academy_name', academy.academy_name || '');\n  if (typeof window.olliOnSettingsCachedAcademy === 'function') {\n    try { window.olliOnSettingsCachedAcademy(academy); } catch (err) { console.warn('settings cached academy extension skipped:', err); }\n  }\n}\n"
          if s.count(old_cached) != 1:
              raise SystemExit(f'settingsSetCachedAcademy block count={s.count(old_cached)}')
          s = s.replace(old_cached, new_cached, 1)
          old_tail = "  updateOlliAcademyAccessSettingUI();\n  applySettingsPermissionUI();\n  updateOlliAcademySwitchUI();\n}\n"
          new_tail = "  updateOlliAcademyAccessSettingUI();\n  applySettingsPermissionUI();\n  updateOlliAcademySwitchUI();\n  if (typeof window.olliApplySettingsAccountEnhancements === 'function') {\n    try { window.olliApplySettingsAccountEnhancements(); } catch (err) { console.warn('settings account UI extension skipped:', err); }\n  }\n  if (typeof window.cacheTeacherOptions === 'function') {\n    try { window.cacheTeacherOptions(); } catch (err) { console.warn('settings teacher cache extension skipped:', err); }\n  }\n  if (typeof window.refreshAllTeacherDropdowns === 'function') {\n    try { window.refreshAllTeacherDropdowns(); } catch (err) { console.warn('settings teacher dropdown extension skipped:', err); }\n  }\n}\n"
          if s.count(old_tail) != 1:
              raise SystemExit(f'settingsApplyStateToUI tail count={s.count(old_tail)}')
          s = s.replace(old_tail, new_tail, 1)
          p.write_text(s, encoding='utf-8')
          PY
          node --check olli-settings-base.js
          git diff --check
          grep -Fq "typeof window.olliOnSettingsCachedAcademy === 'function'" olli-settings-base.js
          grep -Fq "typeof window.olliApplySettingsAccountEnhancements === 'function'" olli-settings-base.js
          grep -Fq "typeof window.cacheTeacherOptions === 'function'" olli-settings-base.js
          grep -Fq "typeof window.refreshAllTeacherDropdowns === 'function'" olli-settings-base.js
      - name: Commit source correction
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet; then exit 0; fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add olli-settings-base.js
          git commit -m 'refactor: compose settings extensions from canonical source'
          git push origin HEAD:refactor/source-owned-no-overrides-20260912
