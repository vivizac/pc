name: Temporary timetable multi memo source fix

on:
  push:
    branches:
      - fix/pc-timetable-multi-memos-20260914-v3

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/pc-timetable-multi-memos-20260914-v3
      - name: Fix patch replacement handling
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('.github/tmp/fix_multi_timetable_memos.py')
          s = p.read_text(encoding='utf-8')
          s = s.replace("re.subn(pattern, replacement, text, count=1, flags=flags)", "re.subn(pattern, lambda _match: replacement, text, count=1, flags=flags)")
          p.write_text(s, encoding='utf-8')
          PY
      - name: Patch original sources
        run: python .github/tmp/fix_multi_timetable_memos.py
      - name: Verify
        run: |
          node --check pc-timetable.js
          node --check pc-timetable-service.js
          grep -q "data-memo-id" pc-timetable.js
          grep -q "olli_schedule_save_cell_memo_v3" pc-timetable-service.js
          test -f supabase/migrations/20260914092601_timetable_multi_cell_memos.sql
          ! grep -q "renderTimetableMemoLines" pc-timetable.js
          git diff --check
      - name: Commit source change
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/tmp-fix-timetable-multi-memos.yml
          git rm -f .github/tmp/fix_multi_timetable_memos.py
          git add pc-timetable.js pc-timetable-service.js pc-timetable.css supabase/migrations/20260914092601_timetable_multi_cell_memos.sql
          git commit -m "feat: allow multiple timetable memo cards"
          git push origin HEAD:fix/pc-timetable-multi-memos-20260914-v3
