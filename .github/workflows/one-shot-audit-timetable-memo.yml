name: Apply timetable memo patch
on:
  push:
    paths:
      - '.github/workflows/one-shot-audit-timetable-memo.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch timetable files
        run: python3 scripts/tmp_patch_timetable_memo.py
      - name: Verify timetable files
        shell: bash
        run: |
          set -e
          node --check pc-timetable.js
          node --check pc-timetable-history.js
          grep -q 'olliTtMergedClassHead' pc-timetable.js
          grep -q 'grid-template-rows: repeat(2, minmax(32px, max-content))' pc-timetable.css
          grep -q 'background: #fff3a6' pc-timetable.css
          grep -q "return '메모 삭제'" pc-timetable-history.js
          grep -q 'olli_schedule_cell_memos' pc-timetable-history.js
      - name: Commit changes and clean temporary files
        shell: bash
        run: |
          set -e
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm -f .github/workflows/one-shot-audit-timetable-memo.yml scripts/tmp_patch_timetable_memo.py
          git add pc-timetable.js pc-timetable.css pc-timetable-history.js
          git commit -m 'Update kindergarten timetable and memo history UI'
          git push
