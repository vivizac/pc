name: Audit timetable memo/class layout
on:
  push:
    paths:
      - '.github/workflows/one-shot-audit-timetable-memo.yml'
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Inspect timetable memo SQL history support
        shell: bash
        run: |
          set -e
          echo '=== CELL MEMO SQL REFERENCES ==='
          grep -nEi 'cell_memo|cell memo|시간표 메모|save_cell_memo|schedule_cell' supabase/migrations/*.sql || true
          echo '=== AUDIT TABLE / TRIGGER EXTENSIONS ==='
          grep -nEi 'olli_schedule_audit_log|olli_schedule_capture_audit|table_name in|create trigger .*audit' supabase/migrations/*.sql | tail -n 260 || true
          echo '=== EXECUTE FUNCTION DEFINITIONS ==='
          grep -n 'create or replace function public.olli_schedule_execute' supabase/migrations/*.sql || true
          echo '=== HISTORY FUNCTION DEFINITIONS ==='
          grep -n 'create or replace function public.olli_schedule_history_list' supabase/migrations/*.sql || true
          grep -n 'create or replace function public.olli_schedule_restore_history' supabase/migrations/*.sql || true
