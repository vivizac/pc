name: tmp teacher single source patch

on:
  push:
    branches:
      - fix/teacher-single-source-20260915

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/teacher-single-source-20260915
          fetch-depth: 0
      - name: Patch original source
        run: python scripts/tmp_teacher_single_source_patch.py
      - name: Validate
        run: |
          node --check pc-student-info-card-runtime.js
          node --test tests/*.test.cjs
      - name: Commit patch if changed
        run: |
          if git diff --quiet -- pc-student-info-card-runtime.js tests/student-info-teacher-single-source.test.cjs; then
            echo "No patch changes to commit"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add pc-student-info-card-runtime.js tests/student-info-teacher-single-source.test.cjs
          git commit -m "[teacher-single-source-done] remove duplicate student teacher lookup"
          git push origin HEAD:fix/teacher-single-source-20260915
