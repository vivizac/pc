name: P0 feedback idempotent retry bridge

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/p0-feedback-retry-bridge.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch feedback retry bridge
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          policy = Path('olli-operations-feedback-policy.js')
          text = policy.read_text()

          marker = "  function rememberPending(tableName, payload, label) {"
          assert text.count(marker) == 1, f'policy rememberPending marker count={text.count(marker)}'
          helpers = r'''  function feedbackQueueCore() {
    const core = global.OlliStorageCore;
    return core && core.SyncQueue ? core : null;
  }

  function tableNameFromFeedbackItem(item) {
    const direct = clean(item && (item.feedback_table || item.tableName || item.table_name));
    if (TARGETS[direct]) return direct;
    const feature = clean(item && item.feature);
    return Object.keys(TARGETS).find(tableName => TARGETS[tableName].feature === feature) || '';
  }

  function feedbackQueueItem(academyId, mutationId) {
    const core = feedbackQueueCore();
    if (!core || !academyId || !mutationId) return null;
    try {
      return core.SyncQueue.read(academyId).find(item =>
        clean(item && item.client_mutation_id) === clean(mutationId)
        && !!tableNameFromFeedbackItem(item)
      ) || null;
    } catch (_) {
      return null;
    }
  }

  function mirrorPendingToSyncQueue(entry, payload, status, errorMessage) {
    if (!entry || !entry.academyId || !entry.mutationId || !entry.tableName) return;
    const core = feedbackQueueCore();
    if (!core) return;
    const spec = TARGETS[entry.tableName];
    if (!spec) return;
    const serverPayload = {
      ...(payload || entry.payload || {}),
      academy_id: entry.academyId,
      client_mutation_id: entry.mutationId
    };
    const patch = {
      feature: spec.feature,
      operation: 'create',
      academy_id: entry.academyId,
      student_id: clean(serverPayload.student_id) || null,
      client_mutation_id: entry.mutationId,
      feedback_table: entry.tableName,
      payload: serverPayload,
      status: status || entry.status || 'pending',
      error_code: null,
      error_message: clean(errorMessage || entry.lastError) || null
    };
    try {
      const existing = feedbackQueueItem(entry.academyId, entry.mutationId);
      if (existing) {
        core.SyncQueue.update(entry.academyId, existing.queue_id, patch);
      } else {
        core.SyncQueue.enqueue(patch, { coalesce: false });
      }
    } catch (error) {
      console.warn('피드백 공통 재전송 대기열 연결 실패:', error?.message || error);
    }
  }

  function removeFeedbackFromSyncQueue(entry) {
    if (!entry || !entry.academyId || !entry.mutationId) return;
    const core = feedbackQueueCore();
    if (!core) return;
    try {
      core.SyncQueue.read(entry.academyId)
        .filter(item => clean(item && item.client_mutation_id) === clean(entry.mutationId))
        .filter(item => !!tableNameFromFeedbackItem(item))
        .forEach(item => core.SyncQueue.remove(entry.academyId, item.queue_id));
    } catch (error) {
      console.warn('피드백 공통 재전송 대기열 정리 실패:', error?.message || error);
    }
  }

'''
          text = text.replace(marker, helpers + marker, 1)

          old = """      writePending(academyId, list);\n      return existing;"""
          new = """      writePending(academyId, list);\n      mirrorPendingToSyncQueue(existing, { ...(existing.payload || payload || {}), client_mutation_id: existing.mutationId }, existing.status || 'pending', existing.lastError || '');\n      return existing;"""
          assert text.count(old) == 1, f'existing pending block count={text.count(old)}'
          text = text.replace(old, new, 1)

          old = """    list.unshift(entry);\n    writePending(academyId, list);\n    return entry;"""
          new = """    list.unshift(entry);\n    writePending(academyId, list);\n    mirrorPendingToSyncQueue(entry, { ...entry.payload, client_mutation_id: entry.mutationId }, 'pending', '');\n    return entry;"""
          assert text.count(old) == 1, f'new pending block count={text.count(old)}'
          text = text.replace(old, new, 1)

          old = """  function updatePending(entry, patch) {\n    if (!entry || !entry.academyId || !entry.mutationId) return;\n    const list = readPending(entry.academyId);\n    const index = list.findIndex(item => item.mutationId === entry.mutationId);\n    if (index < 0) return;\n    list[index] = { ...list[index], ...(patch || {}), updatedAt: new Date().toISOString() };\n    writePending(entry.academyId, list);\n  }\n\n  function clearPending(entry) {\n    if (!entry || !entry.academyId || !entry.mutationId) return;\n    const list = readPending(entry.academyId)\n      .filter(item => item.mutationId !== entry.mutationId);\n    writePending(entry.academyId, list);\n  }"""
          new = """  function updatePending(entry, patch) {\n    if (!entry || !entry.academyId || !entry.mutationId) return;\n    const list = readPending(entry.academyId);\n    const index = list.findIndex(item => item.mutationId === entry.mutationId);\n    let nextEntry = { ...entry, ...(patch || {}), updatedAt: new Date().toISOString() };\n    if (index >= 0) {\n      list[index] = { ...list[index], ...(patch || {}), updatedAt: nextEntry.updatedAt };\n      nextEntry = list[index];\n      writePending(entry.academyId, list);\n    }\n    mirrorPendingToSyncQueue(nextEntry, { ...(nextEntry.payload || {}), client_mutation_id: nextEntry.mutationId }, nextEntry.status || 'pending', nextEntry.lastError || '');\n  }\n\n  function clearPending(entry) {\n    if (!entry || !entry.academyId || !entry.mutationId) return;\n    const list = readPending(entry.academyId)\n      .filter(item => item.mutationId !== entry.mutationId);\n    writePending(entry.academyId, list);\n    removeFeedbackFromSyncQueue(entry);\n  }"""
          assert text.count(old) == 1, f'update/clear pending block count={text.count(old)}'
          text = text.replace(old, new, 1)

          marker = "  function install() {"
          assert text.count(marker) == 1, f'policy install marker count={text.count(marker)}'
          retry_impl = r'''  async function retryPendingFeedbackIdempotentWrite(item = {}) {
    const tableName = tableNameFromFeedbackItem(item);
    const spec = TARGETS[tableName];
    const academyId = clean(item.academy_id || item.academyId || (item.payload && item.payload.academy_id));
    const mutationId = clean(item.client_mutation_id || item.mutationId || (item.payload && item.payload.client_mutation_id));
    if (!spec || !academyId || !mutationId) {
      const error = new Error('피드백 재전송 식별값을 확인할 수 없습니다.');
      error.code = 'FEEDBACK_RETRY_IDENTITY_MISSING';
      throw error;
    }
    if (typeof global.supabase !== 'function') {
      const error = new Error('피드백 서버 연결 함수가 준비되지 않았습니다.');
      error.code = 'SERVER_UNAVAILABLE';
      throw error;
    }

    const payload = {
      ...((item && item.payload) || {}),
      academy_id: academyId,
      client_mutation_id: mutationId
    };
    const entry = {
      tableName,
      academyId,
      mutationId,
      payload,
      label: String(item.label || spec.label || '피드백 저장'),
      status: 'pending',
      lastError: ''
    };
    mirrorPendingToSyncQueue(entry, payload, 'pending', '');
    writeFeedbackLocal(tableName, payload, mutationId, 'pending', null);

    let lastError = null;
    const retryDelays = [0, 260, 720];
    for (let attempt = 0; attempt < retryDelays.length; attempt += 1) {
      if (retryDelays[attempt]) await delay(retryDelays[attempt]);
      try {
        const rows = await global.supabase('POST', `rpc/${spec.rpc}`, { p_payload: payload });
        const row = Array.isArray(rows) ? rows[0] : rows;
        const verified = verifyReturnedRow(tableName, row, payload, mutationId, entry.label);
        clearPending(entry);
        writeFeedbackLocal(tableName, payload, mutationId, 'synced', verified);
        return { ok: true, serverSaved: true, row: verified, clientMutationId: mutationId };
      } catch (error) {
        lastError = error;
        const retryable = isRetryableError(error);
        updatePending(entry, {
          status: retryable ? 'pending' : 'blocked',
          lastError: String(error && (error.message || error) || '')
        });
        if (!retryable || attempt === retryDelays.length - 1) break;
      }
    }
    throw lastError || new Error(`${entry.label} 재전송에 실패했습니다.`);
  }

'''
          text = text.replace(marker, retry_impl + marker, 1)

          old = """    global.getPendingFeedbackIdempotentWrites = function getPendingFeedbackIdempotentWrites() {\n      const academyId = currentAcademyId({});\n      return academyId ? readPending(academyId).map(item => ({ ...item })) : [];\n    };\n    return true;"""
          new = """    global.getPendingFeedbackIdempotentWrites = function getPendingFeedbackIdempotentWrites() {\n      const academyId = currentAcademyId({});\n      return academyId ? readPending(academyId).map(item => ({ ...item })) : [];\n    };\n    global.retryPendingFeedbackIdempotentWrite = retryPendingFeedbackIdempotentWrite;\n    global.isFeedbackIdempotentQueueItem = function isFeedbackIdempotentQueueItem(item) {\n      return !!tableNameFromFeedbackItem(item);\n    };\n    return true;"""
          assert text.count(old) == 1, f'export block count={text.count(old)}'
          text = text.replace(old, new, 1)
          policy.write_text(text)

          settings = Path('olli-settings-storage.js')
          text = settings.read_text()
          old = """      let result;\n      if (operation === 'delete' || operation === 'soft_delete') {\n        result = await deleteOlliData(feature, Object.assign({}, request, {\n          deleteMode: (item.payload && item.payload.deleteMode) || 'soft',\n          reason: (item.payload && item.payload.reason) || 'retry'\n        }));\n      } else {\n        result = await saveOlliData(feature, request);\n      }"""
          new = """      let result;\n      const isFeedbackCreate = operation === 'create' && ['general_feedback', 'growth_feedback', 'summary_feedback'].includes(feature);\n      if (isFeedbackCreate) {\n        if (typeof window.retryPendingFeedbackIdempotentWrite !== 'function') {\n          const error = new Error('피드백 멱등 재전송 모듈이 아직 준비되지 않았습니다.');\n          error.code = 'FEEDBACK_RETRY_MODULE_NOT_READY';\n          throw error;\n        }\n        result = await window.retryPendingFeedbackIdempotentWrite(item);\n      } else if (operation === 'delete' || operation === 'soft_delete') {\n        result = await deleteOlliData(feature, Object.assign({}, request, {\n          deleteMode: (item.payload && item.payload.deleteMode) || 'soft',\n          reason: (item.payload && item.payload.reason) || 'retry'\n        }));\n      } else {\n        result = await saveOlliData(feature, request);\n      }"""
          assert text.count(old) == 1, f'settings retry dispatch block count={text.count(old)}'
          text = text.replace(old, new, 1)
          settings.write_text(text)
          PY

          node --check olli-operations-feedback-policy.js
          node --check olli-settings-storage.js

      - name: Commit patch
        shell: bash
        run: |
          set -euo pipefail
          git add olli-operations-feedback-policy.js olli-settings-storage.js
          git diff --cached --check
          if git diff --cached --quiet; then
            echo 'No patch needed.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'fix: keep feedback mutation id through retry queue'
          git push
