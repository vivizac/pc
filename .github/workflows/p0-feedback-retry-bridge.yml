name: P0 feedback idempotent retry bridge

'on':
  push:
    branches:
      - main
    paths:
      - '.github/workflows/p0-feedback-retry-bridge.yml'
      - '.github/scripts/p0_feedback_retry_test.js'

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate JavaScript
        run: |
          node --check olli-operations-feedback-policy.js
          node --check olli-settings-storage.js
          node --check .github/scripts/p0_feedback_retry_test.js
      - name: Verify retry mutation safety
        run: node .github/scripts/p0_feedback_retry_test.js
