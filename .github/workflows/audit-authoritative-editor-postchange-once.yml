name: Audit authoritative editor postchange once

on:
  push:
    branches:
      - refactor/source-owned-no-overrides-20260912
    paths:
      - .github/workflows/audit-authoritative-editor-postchange-once.yml

permissions:
  contents: write

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refactor/source-owned-no-overrides-20260912
          fetch-depth: 0

      - name: Independent reverse audit
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          files=[p for p in Path('.').rglob('*') if p.is_file() and '.git' not in p.parts and p.suffix.lower() in {'.js','.html','.sql'}]
          jshtml=[p for p in files if p.suffix.lower() in {'.js','.html'}]

          # Reverse audit 1: find every assignment of the old wrapper-owned globals.
          names=['olliPrepareStudentAddExtra','olliGetStudentAddExtra','olliPrepareInfoExtra','olliGetInfoExtra','olliGetStudentAddSchedulePairs','olliGetInfoSchedulePairs']
          assignments={name:[] for name in names}
          for p in jshtml:
            for i,line in enumerate(p.read_text(errors='ignore').splitlines(),1):
              for name in names:
                if re.search(rf'(?:window|global)\.{re.escape(name)}\s*=(?!=)',line):
                  assignments[name].append(f'{p}:{i}')
          print('=== ASSIGNMENTS ===')
          for name,locs in assignments.items(): print(name,locs)
          expected_owners={
            'olliPrepareStudentAddExtra':'olli-record-sort-student-ui.js',
            'olliGetStudentAddExtra':'olli-record-sort-student-ui.js',
            'olliPrepareInfoExtra':'olli-record-sort-student-ui.js',
            'olliGetInfoExtra':'olli-record-sort-student-ui.js',
            'olliGetStudentAddSchedulePairs':'pc-student-info-card-runtime.js',
            'olliGetInfoSchedulePairs':'pc-student-info-card-runtime.js',
          }
          for name,owner in expected_owners.items():
            locs=assignments[name]
            if len(locs)!=1 or not locs[0].startswith(owner+':'):
              raise SystemExit(f'{name} owner mismatch: {locs}')

          # Reverse audit 2: hook providers must each be single-source.
          hooks={
            'olliPcAuthoritativeScheduleAfterPrepareStudentAdd':'pc-student-info-card-runtime.js',
            'olliPcAuthoritativeScheduleAugmentStudentAddExtra':'pc-student-info-card-runtime.js',
            'olliPcAuthoritativeScheduleAfterPrepareInfo':'pc-student-info-card-runtime.js',
            'olliPcAuthoritativeScheduleAugmentInfoExtra':'pc-student-info-card-runtime.js',
            'olliPcClassRoutingAfterPrepareStudentAdd':'pc-student-class-routing.js',
            'olliPcClassRoutingFinalizeStudentAddExtra':'pc-student-class-routing.js',
            'olliTimetableAfterPrepareStudentInfo':'pc-timetable.js',
          }
          print('=== HOOK PROVIDERS ===')
          for hook,owner in hooks.items():
            locs=[]
            pat=re.compile(rf'(?:window|global)\.{re.escape(hook)}\s*=(?!=)')
            for p in jshtml:
              for i,line in enumerate(p.read_text(errors='ignore').splitlines(),1):
                if pat.search(line): locs.append(f'{p}:{i}')
            print(hook,locs)
            if len(locs)!=1 or not locs[0].startswith(owner+':'):
              raise SystemExit(f'{hook} provider mismatch: {locs}')

          # No captured-base wrapper patterns should remain in the two high-risk modules.
          card=Path('pc-student-info-card-runtime.js').read_text()
          routing=Path('pc-student-class-routing.js').read_text()
          legacy=[
            'const basePrepareAdd = global.olliPrepareStudentAddExtra',
            'const baseGetAdd = global.olliGetStudentAddExtra',
            'const basePrepareInfo = global.olliPrepareInfoExtra',
            'const baseGetInfo = global.olliGetInfoExtra',
            'const basePrepare = global.olliPrepareStudentAddExtra',
            'const baseGetExtra = global.olliGetStudentAddExtra',
          ]
          for token in legacy:
            if token in card or token in routing:
              raise SystemExit(f'legacy captured wrapper remains: {token}')

          # Save paths: exactly the intended schedule-write paths remain.
          rpc='olli_schedule_set_student_weekly_schedule'
          rpc_locs=[]
          for p in jshtml:
            for i,line in enumerate(p.read_text(errors='ignore').splitlines(),1):
              if rpc in line: rpc_locs.append(f'{p}:{i}:{line.strip()}')
          print('=== SCHEDULE RPC JS REFERENCES ===')
          for loc in rpc_locs: print(loc)
          rpc_files={loc.split(':',1)[0] for loc in rpc_locs}
          expected_rpc_files={'pc-student-class-routing.js','pc-student-info-card-runtime.js'}
          if rpc_files != expected_rpc_files:
            raise SystemExit(f'unexpected schedule RPC JS files: {rpc_files}')

          memo=Path('olli-record-memo-storage.js').read_text()
          if memo.count('const savedStudent = await ensureStudentSavedToSupabase(newStudent);') != 1:
            raise SystemExit('new-student profile save count changed')
          if memo.count('if (registrationRouting?.handled === true') != 1:
            raise SystemExit('new-student handled routing count changed')
          if memo.count("else if (typeof window.saveOlliStudentScheduleFromInfo === 'function')") != 1:
            raise SystemExit('new-student fallback schedule path count changed')
          if card.count('const savedStudent = await global.ensureStudentSavedToSupabase(profile);') != 1:
            raise SystemExit('existing-student profile save count changed')
          if card.count('await setAuthoritativeSchedule(savedStudent.id, pairs);') != 1:
            raise SystemExit('existing-student authoritative schedule save count changed')

          # Migration audit: report, do not mutate DB/repo here.
          sql_hits=[]
          for p in [x for x in files if x.suffix.lower()=='.sql']:
            if rpc in p.read_text(errors='ignore'):
              sql_hits.append(str(p))
          print('=== MIGRATION SQL HITS ===',sql_hits)
          print('POSTCHANGE_AUDIT_OK')
          PY

      - name: Cleanup audit workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          rm -f .github/workflows/audit-authoritative-editor-postchange-once.yml
          git add -A
          git commit -m "chore: remove authoritative editor post-change audit" || true
          git push origin HEAD:refactor/source-owned-no-overrides-20260912
