name: Temp timetable division segmented style

on:
  push:
    branches: [style/timetable-division-segmented-20260915]
    paths:
      - '.github/workflows/fix-pc-attendance-green-split-divider.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply timetable header style reuse
        run: python3 .github/tmp/apply_timetable_division_segment_style.py
      - name: Validate JavaScript
        run: node --check pc-timetable.js
      - name: Verify intended class reuse
        run: |
          grep -F 'class="olliTtDivisionTabs olliTtAttendanceDivisionTabs" role="tablist" aria-label="시간표 반 선택"' pc-timetable.js
      - name: Commit target change
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add pc-timetable.js
          if git diff --cached --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          git commit -m "style: 시간표 부서 버튼을 출석부 스타일과 통일"
          git push
