name: Temporary observation note save timing patch

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/tmp-p0-observation-save-timing.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Patch observation note local-first save timing
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          common = Path('observation-memo-common.js')
          text = common.read_text()
          old = '''function scheduleMemoAutoSave() {
  if (!currentMemoStudent) return;
  if (isObservationMemoAutoSaveBlocked()) return;

  setMemoSaveStatus('작성 중...');
  if (window.__olliObservationMemoAutoSaveTimer) {
    clearTimeout(window.__olliObservationMemoAutoSaveTimer);
  }

  window.__olliObservationMemoAutoSaveTimer = setTimeout(() => {
    window.__olliObservationMemoAutoSaveTimer = null;
    saveCurrentMemo({ silent: true, status: true });
    markObservationMemoEditorClean();
  }, MEMO_AUTOSAVE_DELAY);
}

function getMemoInputTypeFromTarget(target) {
  if (!target || !target.id) return '';
  return target.id === 'memoEditor' ? 'elementary' : '';
}

function handleMemoPauseAutoSaveInput(target) {
  const inputType = getMemoInputTypeFromTarget(target);
  if (!inputType || !currentMemoStudent || currentMemoType !== inputType) return;
  if (isObservationMemoAutoSaveBlocked()) return;
  markObservationMemoEditorDirty(target);
  scheduleMemoAutoSave();
}

function flushMemoAutoSave() {
  if (!currentMemoStudent) return false;
  if (window.__olliObservationMemoAutoSaveTimer) {
    clearTimeout(window.__olliObservationMemoAutoSaveTimer);
    window.__olliObservationMemoAutoSaveTimer = null;
    saveCurrentMemo({ silent: true, status: true });
    markObservationMemoEditorClean();
    return true;
  }
  return false;
}

function prepareObservationMemoPageClose() {
  const flushed = flushMemoAutoSave();
  if (!flushed && hasObservationMemoDirtyChanges()) {
    saveCurrentMemo({ silent: true });
    markObservationMemoEditorClean();
  }
}
'''
          new = '''const OLLI_MEMO_SERVER_AUTOSAVE_DELAY = 1500;

function getMemoInputTypeFromTarget(target) {
  if (!target || !target.id) return '';
  return target.id === 'memoEditor' ? 'elementary' : '';
}

function persistObservationMemoInputLocally(target) {
  const inputType = getMemoInputTypeFromTarget(target);
  if (!inputType || !currentMemoStudent || currentMemoType !== inputType) return false;
  if (isObservationMemoAutoSaveBlocked()) return false;

  const content = String(target.value || '');
  const updatedAt = new Date().toISOString();
  const state = getObservationMemoEditState();
  const noteType = String(state?.noteType || 'elementary_observation');

  if (typeof window.protectObservationMemoLocalDraft === 'function') {
    const protectedLocally = window.protectObservationMemoLocalDraft(
      currentMemoStudent,
      noteType,
      content,
      updatedAt
    );
    if (protectedLocally) return true;
  }

  try {
    const previous = typeof getMemoEntryByStudent === 'function'
      ? (getMemoEntryByStudent(currentMemoStudent) || {})
      : {};
    if (typeof setMemoByStudent === 'function') {
      setMemoByStudent(currentMemoStudent, content, {
        updatedAt,
        lastSyncedAt: previous.lastSyncedAt || '',
        syncStatus: 'pending',
        revision: previous.revision || 0,
        mutationId: previous.mutationId || '',
        conflict: previous.conflict || null
      });
      return true;
    }
  } catch (error) {
    console.warn('관찰노트 즉시 로컬 저장 실패:', error?.message || error);
  }
  return false;
}

async function saveObservationMemoServerSnapshot(options = {}) {
  if (!currentMemoStudent || currentMemoType !== 'elementary') return null;
  const editor = document.getElementById('memoEditor');
  if (!editor) return null;

  const studentId = String(currentMemoStudent.id || '');
  const textAtStart = String(editor.value || '');
  try {
    const result = await saveCurrentMemo({
      silent: true,
      status: options.status === true
    });
    const stillSameDraft =
      currentMemoStudent &&
      String(currentMemoStudent.id || '') === studentId &&
      String(document.getElementById('memoEditor')?.value || '') === textAtStart;
    if (
      stillSameDraft &&
      result &&
      (result.state === 'synced' || result.state === 'cleared') &&
      result.superseded !== true
    ) {
      markObservationMemoEditorClean();
    }
    return result;
  } catch (error) {
    console.warn('관찰노트 서버 자동저장 실패:', error?.message || error);
    return null;
  }
}

function scheduleMemoAutoSave() {
  if (!currentMemoStudent) return;
  if (isObservationMemoAutoSaveBlocked()) return;

  setMemoSaveStatus('작성 중...');
  if (window.__olliObservationMemoAutoSaveTimer) {
    clearTimeout(window.__olliObservationMemoAutoSaveTimer);
  }

  window.__olliObservationMemoAutoSaveTimer = setTimeout(() => {
    window.__olliObservationMemoAutoSaveTimer = null;
    void saveObservationMemoServerSnapshot({ status: true });
  }, OLLI_MEMO_SERVER_AUTOSAVE_DELAY);
}

function handleMemoPauseAutoSaveInput(target) {
  const inputType = getMemoInputTypeFromTarget(target);
  if (!inputType || !currentMemoStudent || currentMemoType !== inputType) return;
  if (isObservationMemoAutoSaveBlocked()) return;
  persistObservationMemoInputLocally(target);
  markObservationMemoEditorDirty(target);
  scheduleMemoAutoSave();
}

function flushMemoAutoSave() {
  if (!currentMemoStudent) return false;
  if (window.__olliObservationMemoAutoSaveTimer) {
    clearTimeout(window.__olliObservationMemoAutoSaveTimer);
    window.__olliObservationMemoAutoSaveTimer = null;
    void saveObservationMemoServerSnapshot({ status: true });
    return true;
  }
  return false;
}

function prepareObservationMemoPageClose() {
  const flushed = flushMemoAutoSave();
  if (!flushed && hasObservationMemoDirtyChanges()) {
    void saveObservationMemoServerSnapshot({ status: false });
  }
}
'''
          if text.count(old) != 1:
              raise SystemExit(f'observation-memo-common expected block count={text.count(old)}')
          common.write_text(text.replace(old, new, 1))

          guard = Path('observation-memo-request-guard-common.js')
          guard_text = guard.read_text()
          marker = '''  global.persistObservationMemoDraft = guardedPersistObservationMemoDraft;\n'''
          insert = '''  function protectObservationMemoLocalDraft(student, noteType = '', content = '', updatedAt = '') {
    if (!student) return false;
    const type = noteTypeFor(student, noteType);
    const key = requestKey(student, type);
    if (!key) return false;
    const before = localEntry(student);
    const request = {
      sequence: ++sequence,
      student: { ...student },
      noteType: type,
      content: String(content == null ? '' : content),
      expectedRevision: revision(before.revision),
      mutationId: newMutationId(),
      updatedAt: updatedAt || new Date().toISOString(),
      options: { localOnly: true }
    };
    latestRequests.set(key, request);
    writePending(request, request.expectedRevision);
    return true;
  }

  global.protectObservationMemoLocalDraft = protectObservationMemoLocalDraft;
  global.persistObservationMemoDraft = guardedPersistObservationMemoDraft;
'''
          if guard_text.count(marker) != 1:
              raise SystemExit(f'observation request guard marker count={guard_text.count(marker)}')
          guard.write_text(guard_text.replace(marker, insert, 1))
          PY

          node --check observation-memo-common.js
          node --check observation-memo-request-guard-common.js

          grep -Fq 'const OLLI_MEMO_SERVER_AUTOSAVE_DELAY = 1500;' observation-memo-common.js
          grep -Fq 'protectObservationMemoLocalDraft' observation-memo-request-guard-common.js
          if grep -Fq 'saveCurrentMemo({ silent: true, status: true });' observation-memo-common.js; then
            echo 'Old fire-and-clean autosave path remains.'
            exit 1
          fi

      - name: Commit patched source
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add observation-memo-common.js observation-memo-request-guard-common.js
          if git diff --cached --quiet; then
            echo 'Already patched.'
            exit 0
          fi
          git commit -m 'fix: protect observation drafts locally before server autosave'
          git push
