name: One-shot remove risk feature v5
on:
  push:
    paths:
      - '.github/workflows/one-shot-remove-risk-feature-v5.yml'
permissions:
  contents: write
jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply base risk cleanup
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          workflow = Path('.github/workflows/one-shot-remove-risk-feature-v3.yml').read_text(encoding='utf-8')
          sm = "          python3 - <<'PY'\n"; em = "          PY\n"
          s = workflow.find(sm) + len(sm); e = workflow.find(em, s)
          block = workflow[s:e]
          script='\n'.join(line[10:] if line.startswith('          ') else line for line in block.splitlines())+'\n'
          old="s=text.find(marker); b=text.find('{',s); e=balanced_end(text,b)"
          new="fn_s=text.find(marker); s=fn_s-6 if fn_s>=6 and text[fn_s-6:fn_s]=='async ' else fn_s; b=text.find('{',fn_s); e=balanced_end(text,b)"
          if old not in script: raise RuntimeError('base helper target missing')
          script=script.replace(old,new,1)
          exec(compile(script,'risk_cleanup_base.py','exec'),{'__name__':'__main__'})
          PY
      - name: Remove residual risk helpers and copy
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import re

          def balanced_end(text,pos):
              d=0; q=None; esc=False; line=False; block=False; template=False; i=pos
              while i<len(text):
                  c=text[i]; n=text[i+1] if i+1<len(text) else ''
                  if line:
                      if c=='\n': line=False
                  elif block:
                      if c=='*' and n=='/': block=False; i+=1
                  elif q:
                      if esc: esc=False
                      elif c=='\\': esc=True
                      elif c==q: q=None
                  elif template:
                      if esc: esc=False
                      elif c=='\\': esc=True
                      elif c=='`': template=False
                  else:
                      if c=='/' and n=='/': line=True; i+=1
                      elif c=='/' and n=='*': block=True; i+=1
                      elif c in ('"',"'"): q=c
                      elif c=='`': template=True
                      elif c=='{': d+=1
                      elif c=='}':
                          d-=1
                          if d==0:return i+1
                  i+=1
              raise RuntimeError('unbalanced function')

          def remove_function(text,name):
              marker=f'function {name}('
              while marker in text:
                  fn=text.find(marker)
                  s=fn-6 if fn>=6 and text[fn-6:fn]=='async ' else fn
                  b=text.find('{',fn); e=balanced_end(text,b)
                  while e<len(text) and text[e] in ' \t':e+=1
                  if e<len(text) and text[e]==';':e+=1
                  if e<len(text) and text[e]=='\n':e+=1
                  text=text[:s]+text[e:]
              return text

          p=Path('index.html'); text=p.read_text(encoding='utf-8')
          for fn in [
              'getKinderRiskRank','getCurrentKinderDraftFilledCount','getSignalClassByCount',
              'getKinderDraftStudentFromInputs','setSignalCircleLevelClass'
          ]:
              text=remove_function(text,fn)

          # Retired permission comments.
          text=text.replace('  // 관리자는 예외적으로 위험신호의 원장 확인 메모 권한을 갖지만,\n','')
          text=text.replace('  // 설정 메뉴 자체는 알림만 허용한다.\n','')

          clean_roles = "  roles:{title:'권한 설정',html:function(){return '<div class=\"settingsDetailIntro\"><div class=\"settingsDetailTitle\">역할에 맞는 권한으로<br/>학생 기록을 안전하게 관리합니다.</div></div><div class=\"settingsRoleCard\"><div class=\"settingsRoleTop\"><div class=\"settingsRoleName\">원장</div><span class=\"settingsStatusBadge\">전체 권한</span></div><div class=\"settingsRoleList\"><div class=\"settingsRoleItem\">전체 학생과 모든 피드백 확인</div><div class=\"settingsRoleItem\">백업 / 내보내기 사용 가능</div><div class=\"settingsRoleItem\">선생님 계정과 권한 관리</div></div></div><div class=\"settingsRoleCard\"><div class=\"settingsRoleTop\"><div class=\"settingsRoleName\">관리자</div><span class=\"settingsStatusBadge\">점검 권한</span></div><div class=\"settingsRoleList\"><div class=\"settingsRoleItem\">학생 기록과 피드백 흐름 점검</div><div class=\"settingsRoleItem\">선생님 기록 상태 확인</div><div class=\"settingsRoleItem\">백업/내보내기와 운영 판단은 제한</div></div></div><div class=\"settingsRoleCard\"><div class=\"settingsRoleTop\"><div class=\"settingsRoleName\">선생님</div><span class=\"settingsStatusBadge\">기록 권한</span></div><div class=\"settingsRoleList\"><div class=\"settingsRoleItem\">담당 학생 기록 작성</div><div class=\"settingsRoleItem\">피드백 작성과 성장 피드백 입력</div><div class=\"settingsRoleItem\">권한 변경과 데이터 내보내기는 제한</div></div></div>';}},\n"
          clean_backup = "  backup:{title:'백업 / 내보내기',html:function(){return '<div class=\"settingsDetailIntro\"><div class=\"settingsDetailTitle\">백업과 내보내기는<br/>원장만 사용할 수 있습니다.</div></div><div class=\"settingsCard\"><div class=\"settingsRow\"><div class=\"settingsRowLeft\"><span class=\"settingsRowTitle\">전체 학생 데이터</span></div><span class=\"settingsBadge\">JSON</span></div><div class=\"settingsRow\"><div class=\"settingsRowLeft\"><span class=\"settingsRowTitle\">피드백 기록</span></div><span class=\"settingsBadge\">JSON</span></div></div><button class=\"settingsExportBtn\" onclick=\"downloadSettingsBackup()\" type=\"button\">전체 데이터 내보내기</button>';}},\n"
          lines=[]
          for line in text.splitlines(True):
              stripped=line.lstrip()
              if stripped.startswith("roles:{title:'권한 설정'"):
                  lines.append(clean_roles); continue
              if stripped.startswith("backup:{title:'백업 / 내보내기'"):
                  lines.append(clean_backup); continue
              lines.append(line)
          text=''.join(lines)

          # Shared scroll reset: remove selectors that belonged only to the retired screen.
          text=text.replace("    '.kinderRiskMemoPageInner', '.kinderRiskMemoBody', '.kinderMemoWrap',\n",'')
          text=text.replace(", '#kinderSceneMemoInput'",'')
          text=text.replace("'#kinderSceneMemoInput', ",'')

          # Remove any remaining obsolete signal helper calls/names.
          text=re.sub(r'^.*\b(?:getKinderRiskRank|getCurrentKinderDraftFilledCount|getSignalClassByCount|getKinderDraftStudentFromInputs|setSignalCircleLevelClass|getSignalLevelByCount|getKinderFilledMemoCount)\b.*\n?','',text,flags=re.M)
          p.write_text(text,encoding='utf-8')

          # Documentation should describe only the active flow, not the retired feature.
          p=Path('OLLI_PC_MODULES.md'); doc=p.read_text(encoding='utf-8')
          doc=doc.replace(' 별도 초등 관찰노트 진입 버튼은 제거한다. 유치부 위험신호 기능도 제거되어 유치부 기록은 1분 피드백을 사용한다.',' 별도 초등 관찰노트 진입 버튼은 제거한다. 유치부 기록은 1분 피드백을 사용한다.')
          p.write_text(doc,encoding='utf-8')
          PY
      - name: Verify complete removal
        shell: bash
        run: |
          set -euo pipefail
          node --check observation-memo-core.js
          node --check kinder-feedback.js
          node --check pc-shell.js
          node --check pc-start-page.js
          test ! -f kinder-risk-ui.js
          echo '=== retired feature references ==='
          if grep -RInE --exclude-dir=.git --exclude='audit-remove-risk-feature.yml' --exclude='one-shot-remove-risk-feature.yml' --exclude='one-shot-remove-risk-feature-v2.yml' --exclude='one-shot-remove-risk-feature-v3.yml' --exclude='one-shot-remove-risk-feature-v4.yml' --exclude='one-shot-remove-risk-feature-v5.yml' 'kinderRisk|RiskMemo|risk_signal|risk_signals|위험신호|recordNotifyBtn|notificationInbox|hasRiskNotifications|sendKinderRiskPush|manager_can_director_note|directorNote|recordDoorDot|kinderMemoBox[1-5]|kinderSceneMemoInput|setKinderCombinedMode|autoResizeKinderMemoBoxes|getKinderRiskRank|getCurrentKinderDraftFilledCount|getSignalClassByCount|getKinderDraftStudentFromInputs|setSignalCircleLevelClass|getSignalLevelByCount|getKinderFilledMemoCount' .; then exit 1; fi
          echo '=== legacy risk memo fields ==='
          if grep -nE '\bmemo[1-5]\b' index.html observation-memo-core.js; then exit 1; fi
          grep -q 'function openStudentMemoPageById' observation-memo-core.js
          grep -q 'function saveCurrentMemo' observation-memo-core.js
          grep -q 'function openKinderChatFeedbackPage' kinder-feedback.js
          grep -q 'studentMemoScreen' observation-editor-ui.js
          grep -q 'kinderChatFeedbackScreen' kinder-feedback-ui.js
          grep -q 'function showBrowserNotification' observation-memo-core.js
          grep -q 'function showPushToast' observation-memo-core.js
          ! grep -q 'kinder-risk-ui.js' index.html
          node <<'NODE'
          const fs=require('fs'),vm=require('vm');
          const html=fs.readFileSync('index.html','utf8');
          const re=/<script\b([^>]*)>([\s\S]*?)<\/script\s*>/gi;
          let m,n=0;
          while((m=re.exec(html))){
            const a=m[1]||'', b=m[2]||'';
            if(/\bsrc\s*=/.test(a)||/type\s*=\s*["'](?:application\/json|application\/ld\+json)["']/.test(a)) continue;
            try{new vm.Script(b);n++;}catch(e){console.error('inline script syntax failure',n+1,e.message);process.exit(1)}
          }
          console.log('inline scripts checked',n);
          NODE
          echo "index bytes: $(wc -c < index.html)"
      - name: Commit removal
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A index.html observation-memo-core.js kinder-feedback.js pc-shell.js pc-start-page.js OLLI_PC_MODULES.md kinder-risk-ui.js
          git commit -m 'Remove retired risk signal feature'
          git push
