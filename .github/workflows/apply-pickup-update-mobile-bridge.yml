name: Apply mobile pickup update Agent bridge

on:
  push:
    branches:
      - work/pickup-update-probe-20261001
    paths:
      - '.github/pickup-update-mobile-bridge.patch'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
      - name: Apply focused mobile bridge patch
        run: |
          git apply --check .github/pickup-update-mobile-bridge.patch
          git apply .github/pickup-update-mobile-bridge.patch
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/mobile/olli-talk-beta.js
          git rm .github/pickup-update-mobile-bridge.patch
          git rm .github/workflows/apply-pickup-update-mobile-bridge.yml
          git commit -m "Route mobile pickup updates through Agent"
          git push origin "HEAD:${GITHUB_REF_NAME}"
