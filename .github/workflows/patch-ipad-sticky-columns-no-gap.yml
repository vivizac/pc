name: Patch iPad sticky columns no gap

on:
  push:
    branches:
      - fix/ipad-sticky-columns-no-gap-20260915
    paths:
      - '.github/workflows/patch-ipad-sticky-columns-no-gap.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply focused CSS patch
        run: python3 .github/tmp/patch_ipad_sticky_columns_no_gap.py
      - name: Validate sticky column geometry
        run: |
          python3 - <<'PY'
          from pathlib import Path
          css = Path('pc-timetable.css').read_text(encoding='utf-8')
          assert 'col.nameCol { width: 88px !important; }' in css
          assert 'col.schoolGradeCol { width: 96px !important; }' in css
          assert 'col.personalityCol { width: 56px !important; }' in css
          assert 'border-collapse: collapse !important;' in css
          assert 'border-spacing: 0 !important;' in css
          assert 'left: 88px;' in css
          assert 'left: 184px;' in css
          PY
      - name: Clean temporary patch files and commit
        run: |
          rm -f .github/tmp/patch_ipad_sticky_columns_no_gap.py
          rm -f .github/workflows/patch-ipad-sticky-columns-no-gap.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "fix: keep iPad sticky roster columns contiguous"
          git push origin HEAD:${GITHUB_REF_NAME}
