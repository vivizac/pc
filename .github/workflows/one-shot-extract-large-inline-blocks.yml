name: Extract large inline blocks

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/one-shot-extract-large-inline-blocks.yml'

permissions:
  contents: write

jobs:
  extract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Extract large inline blocks
        run: python3 scripts/tmp_extract_large_inline_blocks.py
      - name: Verify extracted files and inline remainder
        shell: bash
        run: |
          set -e
          for f in \
            olli-settings-account-runtime.js \
            olli-record-sort-student-ui.js \
            olli-feedback-registration-runtime.js \
            olli-student-bulk-edit-runtime.js \
            olli-student-schedule-runtime.js \
            olli-attendance-policy-runtime.js \
            olli-attendance-timetable-bridge.js; do
            node --check "$f"
          done
          python3 - <<'PY'
          from pathlib import Path
          import re, subprocess, tempfile
          html = Path('index.html').read_text(encoding='utf-8')
          expected = [
            'olli-base.css','olli-common-components.css','olli-responsive.css',
            'olli-settings-account-runtime.js','olli-record-sort-student-ui.js',
            'olli-feedback-registration-runtime.js','olli-student-bulk-edit-runtime.js',
            'olli-student-schedule-runtime.js','olli-attendance-policy-runtime.js',
            'olli-attendance-timetable-bridge.js'
          ]
          for name in expected:
              if name not in html:
                  raise SystemExit(f'{name} not linked from index')
              if not Path(name).exists() or Path(name).stat().st_size == 0:
                  raise SystemExit(f'{name} missing or empty')
          if len(html.encode('utf-8')) >= 300000:
              raise SystemExit(f'index still unexpectedly large: {len(html.encode("utf-8"))}')
          scripts = list(re.finditer(r'<script\b(?![^>]*\bsrc=)[^>]*>(.*?)</script>', html, re.I | re.S))
          styles = list(re.finditer(r'<style\b[^>]*>(.*?)</style>', html, re.I | re.S))
          max_script = max((len(m.group(1).encode('utf-8')) for m in scripts), default=0)
          max_style = max((len(m.group(1).encode('utf-8')) for m in styles), default=0)
          if max_script >= 15000:
              raise SystemExit(f'large inline script remains: {max_script}')
          if max_style >= 15000:
              raise SystemExit(f'large inline style remains: {max_style}')
          for idx, match in enumerate(scripts):
              body = match.group(1)
              if not body.strip():
                  continue
              temp = Path(f'/tmp/olli-inline-{idx}.js')
              temp.write_text(body, encoding='utf-8')
              result = subprocess.run(['node','--check',str(temp)], capture_output=True, text=True)
              if result.returncode:
                  raise SystemExit(f'inline script {idx} parse failed: {result.stderr}')
          print('index bytes', len(html.encode('utf-8')))
          print('remaining inline scripts', len(scripts), 'max bytes', max_script)
          print('remaining inline styles', len(styles), 'max bytes', max_style)
          PY
      - name: Commit extraction and remove temporary audit files
        shell: bash
        run: |
          set -e
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm -f .github/workflows/one-shot-extract-large-inline-blocks.yml
          git rm -f .github/workflows/one-shot-final-module-audit.yml
          git rm -f scripts/tmp_extract_large_inline_blocks.py
          git add index.html OLLI_PC_MODULES.md \
            olli-base.css olli-common-components.css olli-responsive.css \
            olli-settings-account-runtime.js olli-record-sort-student-ui.js \
            olli-feedback-registration-runtime.js olli-student-bulk-edit-runtime.js \
            olli-student-schedule-runtime.js olli-attendance-policy-runtime.js \
            olli-attendance-timetable-bridge.js
          git commit -m 'Extract large inline PC runtime blocks'
          git push
