name: Fix Realtime retry loop

on:
  push:
    paths:
      - '.github/workflows/fix-realtime-retry-loop.yml'
      - '.github/scripts/fix-realtime-retry-loop.py'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Patch Realtime retry behavior
        run: python .github/scripts/fix-realtime-retry-loop.py

      - name: Syntax checks
        run: |
          node --check olli-realtime-common.js
          node --check pc-timetable.js

      - name: Realtime regression tests
        run: node --test tests/schedule-realtime.test.cjs

      - name: Commit patch
        run: |
          if git diff --quiet -- olli-realtime-common.js pc-timetable.js tests/schedule-realtime.test.cjs; then
            echo 'No patch changes required.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add olli-realtime-common.js pc-timetable.js tests/schedule-realtime.test.cjs
          git commit -m 'Fix Realtime non-signal retry loop'
          git push origin HEAD:main
