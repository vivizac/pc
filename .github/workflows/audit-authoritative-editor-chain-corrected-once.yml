name: Audit authoritative editor chain corrected once

on:
  push:
    branches:
      - refactor/source-owned-no-overrides-20260912
    paths:
      - .github/workflows/audit-authoritative-editor-chain-corrected-once.yml

permissions:
  contents: write

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refactor/source-owned-no-overrides-20260912
          fetch-depth: 0
      - name: Corrected chain audit
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          files = [p for p in Path('.').rglob('*') if p.is_file() and p.suffix.lower() in {'.js','.html','.json'} and '.git' not in p.parts]

          print('=== MODULE REFERENCE LOCATIONS ===')
          for needle in ['pc-student-class-routing.js','pc-student-info-card-runtime.js','installAuthoritativeScheduleEditor','installRegistrationRouting']:
            hits=[]
            for p in sorted(files):
              for i,line in enumerate(p.read_text(errors='ignore').splitlines(),1):
                if needle in line:
                  hits.append(f'{p}:{i}:{line.strip()}')
            print(f'-- {needle}: {len(hits)} hit(s)')
            for hit in hits: print(hit)

          names = [
            'olliPrepareStudentAddExtra','olliGetStudentAddExtra',
            'olliPrepareInfoExtra','olliGetInfoExtra',
            'olliGetInfoSchedulePairs','olliGetStudentAddSchedulePairs'
          ]
          print('=== TRUE GLOBAL ASSIGNMENTS ONLY ===')
          totals={name:0 for name in names}
          for p in sorted(files):
            if p.suffix.lower() not in {'.js','.html'}: continue
            lines=p.read_text(errors='ignore').splitlines()
            for i,line in enumerate(lines,1):
              for name in names:
                pat=re.compile(rf'(?:window|global)\.{re.escape(name)}\s*=(?!=)')
                if pat.search(line):
                  print(f'{name}: {p}:{i}:{line.strip()}')
                  totals[name]+=1
          print('=== TOTALS ===')
          for name,count in totals.items(): print(f'{name}={count}')

          print('=== SCRIPT SRC ORDER IN HTML FILES ===')
          src_re=re.compile(r'<script[^>]+src=["\']([^"\']+)["\']', re.I)
          for p in sorted([x for x in files if x.suffix.lower()=='.html']):
            text=p.read_text(errors='ignore')
            refs=[]
            for m in src_re.finditer(text):
              src=m.group(1)
              if any(token in src for token in ['student','schedule','timetable','pc-runtime','pc-']):
                refs.append((text.count('\n',0,m.start())+1,src))
            if refs:
              print(f'-- {p}')
              for line,src in refs: print(f'{line}: {src}')

          if totals['olliPrepareInfoExtra'] < 2 or totals['olliGetInfoExtra'] < 2:
            raise SystemExit('expected canonical + authoritative assignments not found')
          PY
      - name: Cleanup audit workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          rm -f .github/workflows/audit-authoritative-editor-chain-corrected-once.yml
          git add -A
          git commit -m "chore: remove corrected authoritative editor audit" || true
          git push origin HEAD:refactor/source-owned-no-overrides-20260912
