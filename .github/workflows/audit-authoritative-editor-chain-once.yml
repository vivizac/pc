name: Audit authoritative editor chain once

on:
  push:
    branches:
      - refactor/source-owned-no-overrides-20260912
    paths:
      - .github/workflows/audit-authoritative-editor-chain-once.yml

permissions:
  contents: write

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refactor/source-owned-no-overrides-20260912
          fetch-depth: 0
      - name: Audit load and override chain
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          index = Path('index.html').read_text(errors='ignore')
          needles = [
            'olli-record-sort-student-ui.js',
            'olliStudentDocImportPatch',
            'olli-student-schedule-runtime.js',
            'pc-student-class-routing.js',
            'pc-student-info-card-runtime.js',
            'pc-timetable.js'
          ]
          print('=== INDEX LOAD ORDER ===')
          for needle in needles:
            pos = index.find(needle)
            line = index.count('\n', 0, pos) + 1 if pos >= 0 else -1
            print(f'{needle}: line={line}, pos={pos}')

          patterns = {
            'prepare_add_assign': re.compile(r'(?:window|global)\.olliPrepareStudentAddExtra\s*='),
            'get_add_assign': re.compile(r'(?:window|global)\.olliGetStudentAddExtra\s*='),
            'prepare_info_assign': re.compile(r'(?:window|global)\.olliPrepareInfoExtra\s*='),
            'get_info_assign': re.compile(r'(?:window|global)\.olliGetInfoExtra\s*='),
            'info_pairs_assign': re.compile(r'(?:window|global)\.olliGetInfoSchedulePairs\s*='),
            'add_pairs_assign': re.compile(r'(?:window|global)\.olliGetStudentAddSchedulePairs\s*=')
          }
          print('=== ASSIGNMENTS ===')
          files = [p for p in Path('.').rglob('*') if p.is_file() and p.suffix in {'.js','.html'} and '.git' not in p.parts]
          totals = {k:0 for k in patterns}
          for p in sorted(files):
            lines = p.read_text(errors='ignore').splitlines()
            for i, line in enumerate(lines, 1):
              for key, pat in patterns.items():
                if pat.search(line):
                  print(f'{key}: {p}:{i}: {line.strip()}')
                  totals[key] += 1
          print('=== TOTALS ===')
          for key, value in totals.items(): print(f'{key}={value}')
          if totals['prepare_info_assign'] < 2 or totals['get_info_assign'] < 2:
            raise SystemExit('expected wrapper chain not found')
          PY
      - name: Cleanup audit workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          rm -f .github/workflows/audit-authoritative-editor-chain-once.yml
          git add -A
          git commit -m "chore: remove authoritative editor audit" || true
          git push origin HEAD:refactor/source-owned-no-overrides-20260912
