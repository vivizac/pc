name: Fix KCF card tools and elementary memo load
on:
  push:
    paths:
      - '.github/workflows/one-shot-kcf-card-tools-elementary-load-fix.yml'
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply fix
        run: python3 .github/scripts/one_shot_kcf_card_tools_elementary_load_fix.py
      - name: Verify fix
        run: |
          set -e
          for f in kinder-feedback-ui.js kinder-feedback.js olli-record-editor-core.js observation-memo-core.js pc-attendance.js olli-app-startup.js; do
            node --check "$f"
          done

          grep -F 'class=\"kcfCardTools\"' kinder-feedback-ui.js
          grep -F 'openSceneCardsFromAnyPage()' kinder-feedback-ui.js
          grep -F 'openKinderChatFeedbackInbox()' kinder-feedback-ui.js
          grep -F '.kcfCardTools' kinder-feedback.css
          grep -F 'function formatMemoUpdatedDate(value)' olli-record-editor-core.js
          grep -F "loadStudentNoteDraftFromSupabase(student, 'elementary_observation')" observation-memo-core.js
          grep -F 'function getMemoEntryByStudent' olli-record-editor-core.js

          forbidden=(
            kcfHeader kcfHeaderCenter kcfTopFadeLayer kcfRecordBtn kcfRoundBtn
            kcfModeToggle kcfModeTitle kcfModeSub kcfModeMenu kcfModeOption
            toggleKinderChatFeedbackModeMenu closeKinderChatFeedbackModeMenu switchKinderChatFeedbackMode
            formatMemoFeedbackArchiveDate
          )
          for term in "${forbidden[@]}"; do
            if grep -RIF --include='*.js' --include='*.css' --include='*.html' \
              --exclude='one_shot_kcf_card_tools_elementary_load_fix.py' \
              --exclude-dir='.git' "$term" . >/dev/null; then
              echo "forbidden legacy term remains: $term"
              grep -RInF --include='*.js' --include='*.css' --include='*.html' \
                --exclude='one_shot_kcf_card_tools_elementary_load_fix.py' \
                --exclude-dir='.git' "$term" . || true
              exit 1
            fi
          done

          python3 - <<'PY'
          from pathlib import Path
          css=Path('pc-attendance.css').read_text(encoding='utf-8')
          assert '.pcAttendanceSharedEditorHost>#studentMemoScreen .memoHeader,' in css
          assert '.pcAttendanceSharedEditorHost>#studentMemoScreen .memoTopFadeLayer{' in css
          assert 'display:none!important;' in css
          assert '.pcAttendanceSharedEditorHost>#kinderChatFeedbackScreen .kcfCardTools{' in css
          core=Path('olli-record-editor-core.js').read_text(encoding='utf-8')
          assert "const dateText = formatMemoUpdatedDate(dateSource || '');" in core
          ui=Path('kinder-feedback-ui.js').read_text(encoding='utf-8')
          assert ui.count('id=\\"kcfInboxBadge\\"') == 1
          assert ui.count('openSceneCardsFromAnyPage()') == 1
          assert ui.count('openKinderChatFeedbackInbox()') == 1
          print('embedded tools and memo load guards OK')
          PY

          echo 'SIZES'
          wc -c index.html kinder-feedback-ui.js kinder-feedback.css kinder-feedback.js pc-attendance.css olli-record-editor-core.js observation-memo-core.js
      - name: Commit fix
        run: |
          set -e
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm -f \
            .github/workflows/audit-kcf-topbar-elementary-memo.yml \
            .github/workflows/one-shot-kcf-card-tools-elementary-load-fix.yml \
            .github/scripts/one_shot_kcf_card_tools_elementary_load_fix.py
          git add index.html OLLI_PC_MODULES.md \
            kinder-feedback-ui.js kinder-feedback.css kinder-feedback.js \
            pc-attendance.css olli-record-editor-core.js
          git commit -m 'Fix feedback card tools and elementary memo loading'
          git push
