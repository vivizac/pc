name: Temporary attendance screen redesign

on:
  push:
    branches:
      - fix/pc-attendance-screen-redesign-20260914

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/pc-attendance-screen-redesign-20260914
      - name: Patch original sources
        run: python .github/tmp/attendance_screen_redesign_patch.py
      - name: Verify
        run: |
          node --check pc-timetable-attendance-register.js
          grep -q "attendanceBlankMark" pc-timetable-attendance-register.js
          grep -q "attendanceDateWeek" pc-timetable-attendance-register.js
          grep -q "olliTtAttendanceTable" pc-timetable-attendance-register.js
          ! grep -q "같은 날 수업이 두 번 이상이면 각 수업 시간별로 나누어 출결을 기록합니다" pc-timetable-attendance-register.js
          grep -q "화면 출석부 전용 디자인 - 출력/PDF와 분리" pc-timetable.css
          git diff --check
      - name: Commit source change
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm -f .github/workflows/tmp-attendance-screen-redesign.yml .github/tmp/attendance_screen_redesign_patch.py
          git add pc-timetable-attendance-register.js pc-timetable.css
          git commit -m "style: redesign attendance register screen"
          git push origin HEAD:fix/pc-attendance-screen-redesign-20260914
