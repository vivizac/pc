name: refactor-student-registration-owner-once

on:
  push:
    branches:
      - refactor/source-owned-no-overrides-20260912

permissions:
  contents: write

jobs:
  refactor:
    if: ${{ github.actor != 'github-actions[bot]' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Source-own student registration and class routing
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import re

          def replace_once(path, old, new, label):
              p = Path(path)
              text = p.read_text(encoding='utf-8')
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'{label}: expected 1 match, found {count}')
              p.write_text(text.replace(old, new, 1), encoding='utf-8')

          # A) Canonical student registration calls explicit routing hooks rather than being wrapped.
          memo = Path('olli-record-memo-storage.js')
          text = memo.read_text(encoding='utf-8')

          anchor = """  const selectedGroup = type === 'elementary' ? (extraInfo.group || '') : '';\n  const selectedGroupMonths = type === 'elementary' ? elementaryGroupMonthsToText(extraInfo.group_months || extraInfo.feedback_months || getElementaryGroupFeedbackMonths(selectedGroup)) : '';\n\n  const newStudent = {\n"""
          replacement = """  const selectedGroup = type === 'elementary' ? (extraInfo.group || '') : '';\n  const selectedGroupMonths = type === 'elementary' ? elementaryGroupMonthsToText(extraInfo.group_months || extraInfo.feedback_months || getElementaryGroupFeedbackMonths(selectedGroup)) : '';\n\n  let registrationRouting = null;\n  if (typeof window.olliPrepareStudentRegistrationRouting === 'function') {\n    try {\n      registrationRouting = await window.olliPrepareStudentRegistrationRouting(type);\n    } catch (error) {\n      alert(error?.message || error || '선택한 수업 클래스를 확인하지 못했습니다.');\n      return;\n    }\n  }\n\n  const newStudent = {\n"""
          if text.count(anchor) != 1:
              raise SystemExit(f'confirmStudent routing prepare anchor count={text.count(anchor)}')
          text = text.replace(anchor, replacement, 1)

          old_schedule = """    // 신규 학생의 시간표 연결도 원본 등록 함수가 직접 책임집니다.\n    // 학생 저장 성공 뒤에만 시간표를 저장해 기존 저장 순서를 유지합니다.\n    if (typeof window.saveOlliStudentScheduleFromInfo === 'function') {\n      try {\n        const schedulePairs = typeof window.olliGetStudentAddSchedulePairs === 'function'\n          ? window.olliGetStudentAddSchedulePairs()\n          : null;\n        await window.saveOlliStudentScheduleFromInfo(\n          savedStudent.id,\n          selectedLessonDay,\n          selectedLessonTime,\n          Array.isArray(schedulePairs) ? { pairs: schedulePairs } : undefined\n        );\n        if (typeof window.loadStudentsFromSupabase === 'function') {\n          await window.loadStudentsFromSupabase({ skipLifecycleSync: true });\n        }\n        if (window.OlliPcAttendance && typeof window.OlliPcAttendance.renderList === 'function') {\n          window.OlliPcAttendance.renderList();\n        }\n      } catch (error) {\n        alert(`학생은 등록되었지만 시간표 반영에 실패했어요.\\n\\n${error.message || error}\\n\\n학생정보에서 다시 저장하거나 시간표에서 확인해 주세요.`);\n      }\n    }\n  } catch (err) {\n    alert(`학생 저장에 실패했어요.\\n\\n${err.message || err}`);\n  }\n}\n"""
          new_schedule = """    // PC 클래스 라우팅이 활성화되어 있으면 그 경로가 시간표의 단일 원본입니다.\n    // 그렇지 않은 화면에서는 기존 요일/시간 기반 저장을 하위 호환 경로로 유지합니다.\n    if (registrationRouting?.handled === true && typeof window.olliCommitStudentRegistrationRouting === 'function') {\n      try {\n        await window.olliCommitStudentRegistrationRouting(savedStudent, registrationRouting);\n      } catch (error) {\n        alert(`학생은 등록되었지만 수업 클래스 저장에 실패했어요.\\n\\n${error.message || error}\\n\\n시간표에서 해당 학생의 수업을 확인해 주세요.`);\n      }\n    } else if (typeof window.saveOlliStudentScheduleFromInfo === 'function') {\n      try {\n        const schedulePairs = typeof window.olliGetStudentAddSchedulePairs === 'function'\n          ? window.olliGetStudentAddSchedulePairs()\n          : null;\n        await window.saveOlliStudentScheduleFromInfo(\n          savedStudent.id,\n          selectedLessonDay,\n          selectedLessonTime,\n          Array.isArray(schedulePairs) ? { pairs: schedulePairs } : undefined\n        );\n        if (typeof window.loadStudentsFromSupabase === 'function') {\n          await window.loadStudentsFromSupabase({ skipLifecycleSync: true });\n        }\n        if (window.OlliPcAttendance && typeof window.OlliPcAttendance.renderList === 'function') {\n          window.OlliPcAttendance.renderList();\n        }\n        if (typeof window.olliTtRefreshSchedule === 'function') {\n          await window.olliTtRefreshSchedule();\n        }\n      } catch (error) {\n        alert(`학생은 등록되었지만 시간표 반영에 실패했어요.\\n\\n${error.message || error}\\n\\n학생정보에서 다시 저장하거나 시간표에서 확인해 주세요.`);\n      }\n    }\n  } catch (err) {\n    alert(`학생 저장에 실패했어요.\\n\\n${err.message || err}`);\n  } finally {\n    if (registrationRouting?.handled === true && typeof window.olliReleaseStudentRegistrationRouting === 'function') {\n      window.olliReleaseStudentRegistrationRouting();\n    }\n  }\n}\n"""
          if text.count(old_schedule) != 1:
              raise SystemExit(f'confirmStudent schedule block count={text.count(old_schedule)}')
          memo.write_text(text.replace(old_schedule, new_schedule, 1), encoding='utf-8')

          # B) Class-routing module exposes explicit hooks and no longer wraps confirmStudent.
          routing = Path('pc-student-class-routing.js')
          text = routing.read_text(encoding='utf-8')
          wrapper_pattern = re.compile(r"\n    const originalConfirm = global\.confirmStudent;.*?\n    }\n\n    let dateTimer = 0;", re.S)
          hook_block = """
    global.olliPrepareStudentRegistrationRouting = async function(type) {
      if (registration.saving) throw new Error('학생 등록을 저장하고 있습니다.');
      registration.saving = true;
      registration.division = type === 'kinder' ? 'kinder' : 'elementary';
      const effectiveDate = registrationDate();
      const pairs = registration.selected.map((row) => ({
        weekday: row.weekday,
        time_slot: row.time_slot,
        class_group: row.class_group
      }));
      try {
        if (pairs.length) await validateRegistrationSelection();
        return { handled: true, effectiveDate, pairs };
      } catch (error) {
        registration.saving = false;
        renderRegistrationPicker();
        throw error;
      }
    };

    global.olliCommitStudentRegistrationRouting = async function(savedStudent, context) {
      const studentId = clean(savedStudent && savedStudent.id);
      if (!studentId) throw new Error('등록된 학생 ID를 확인하지 못했습니다.');
      const effectiveDate = clean(context && context.effectiveDate) || registrationDate();
      const pairs = Array.isArray(context && context.pairs) ? context.pairs : [];
      if (!pairs.length) return;
      await setRegistrationSchedule(studentId, pairs, effectiveDate);
      if (typeof global.loadStudentsFromSupabase === 'function') {
        await global.loadStudentsFromSupabase({ skipLifecycleSync: true });
      }
      if (global.OlliPcAttendance && typeof global.OlliPcAttendance.renderList === 'function') {
        global.OlliPcAttendance.renderList();
      }
      if (typeof global.olliTtRefreshSchedule === 'function') {
        await global.olliTtRefreshSchedule();
      }
      notify('학생 등록과 수업 클래스를 저장했어요.');
    };

    global.olliReleaseStudentRegistrationRouting = function() {
      registration.saving = false;
    };

    let dateTimer = 0;"""
          text, count = wrapper_pattern.subn(hook_block, text, count=1)
          if count != 1:
              raise SystemExit(f'class-routing confirm wrapper block count={count}')

          wait_old = """  function installWhenReady(attempt) {\n    const linked = typeof global.confirmStudent === 'function' && global.confirmStudent.__olliScheduleLinked;\n    if (!linked || typeof global.olliPrepareStudentAddExtra !== 'function') {\n      if ((attempt || 0) < 100) setTimeout(() => installWhenReady((attempt || 0) + 1), 80);\n      return;\n    }\n"""
          wait_new = """  function installWhenReady(attempt) {\n    if (typeof global.confirmStudent !== 'function' || typeof global.olliPrepareStudentAddExtra !== 'function') {\n      if ((attempt || 0) < 100) setTimeout(() => installWhenReady((attempt || 0) + 1), 80);\n      return;\n    }\n"""
          if text.count(wait_old) != 1:
              raise SystemExit(f'class-routing install readiness anchor count={text.count(wait_old)}')
          routing.write_text(text.replace(wait_old, wait_new, 1), encoding='utf-8')

          # C) PC shell no longer wraps registration or re-bootstrap all legacy schedules after one student save.
          shell = Path('pc-shell.js')
          text = shell.read_text(encoding='utf-8')
          shell_pattern = re.compile(r"\n  function installStudentScheduleSync\(\) \{.*?\n  \}\n\n  function isEditorEmbedded", re.S)
          text, count = shell_pattern.subn("\n  function isEditorEmbedded", text, count=1)
          if count != 1:
              raise SystemExit(f'pc-shell schedule wrapper block count={count}')
          call = '    installStudentScheduleSync();\n'
          if text.count(call) != 1:
              raise SystemExit(f'pc-shell schedule wrapper call count={text.count(call)}')
          shell.write_text(text.replace(call, '', 1), encoding='utf-8')
          PY

          node --check olli-record-memo-storage.js
          node --check pc-student-class-routing.js
          node --check pc-shell.js
          git diff --check

          grep -Fq "olliPrepareStudentRegistrationRouting" olli-record-memo-storage.js
          grep -Fq "olliCommitStudentRegistrationRouting" olli-record-memo-storage.js
          grep -Fq "global.olliPrepareStudentRegistrationRouting" pc-student-class-routing.js
          grep -Fq "global.olliCommitStudentRegistrationRouting" pc-student-class-routing.js
          grep -Fq "global.olliReleaseStudentRegistrationRouting" pc-student-class-routing.js
          ! grep -Fq "confirmStudentWithClassRouting" pc-student-class-routing.js
          ! grep -Fq "originalConfirm = global.confirmStudent" pc-student-class-routing.js
          ! grep -Fq "function installStudentScheduleSync" pc-shell.js
          ! grep -Fq "syncLegacyStudents();" pc-shell.js

      - name: Commit and remove one-time workflow
        shell: bash
        run: |
          set -euo pipefail
          git rm -f .github/workflows/refactor-student-registration-owner-once.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add olli-record-memo-storage.js pc-student-class-routing.js pc-shell.js
          git diff --cached --check
          git commit -m 'refactor: source-own student registration class routing'
          git push origin HEAD:refactor/source-owned-no-overrides-20260912
