name: Split observation memo common
on:
  push:
    paths:
      - '.github/workflows/split-observation-memo-common.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  split:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Extract safe shared memo helpers
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          src_path=Path('observation-memo-core.js')
          index_path=Path('index.html')
          guide_path=Path('OLLI_PC_MODULES.md')
          shared_path=Path('observation-memo-common.js')
          if shared_path.exists(): raise SystemExit('shared memo common already exists')
          text=src_path.read_text(encoding='utf-8')
          names=['autoResizeTextarea','flushMemoAutoSave','handleMemoPauseAutoSaveBlur','setupMemoPauseAutoSaveBindings','bindPauseAutoSaveForMemoInput','setMemoSaveStatus','showMemoSaveCheck','handleMemoHeaderAction','showPushToast','openMoreMenuPlaceholder']

          def scan_balanced(text,start,open_ch,close_ch):
            i=start; depth=0; quote=None; esc=False; line=False; block=False; template=0
            while i<len(text):
              ch=text[i]; nxt=text[i+1] if i+1<len(text) else ''
              if line:
                if ch=='\n': line=False
              elif block:
                if ch=='*' and nxt=='/': block=False; i+=1
              elif quote:
                if esc: esc=False
                elif ch=='\\': esc=True
                elif quote=='`' and ch=='$' and nxt=='{': template+=1; i+=1
                elif quote=='`' and template:
                  if ch=='{': template+=1
                  elif ch=='}': template-=1
                elif ch==quote and (quote!='`' or template==0): quote=None
              else:
                if ch=='/' and nxt=='/': line=True; i+=1
                elif ch=='/' and nxt=='*': block=True; i+=1
                elif ch in "'\"`": quote=ch
                elif ch==open_ch: depth+=1
                elif ch==close_ch:
                  depth-=1
                  if depth==0:return i
              i+=1
            return -1

          def function_block(text,name):
            m=re.search(r'(?m)^(?:async\s+)?function\s+'+re.escape(name)+r'\s*\(',text)
            if not m: raise SystemExit('function missing: '+name)
            op=text.find('(',m.start()); cp=scan_balanced(text,op,'(',')')
            if cp<0: raise SystemExit('param boundary failed: '+name)
            ob=text.find('{',cp+1); cb=scan_balanced(text,ob,'{','}')
            if ob<0 or cb<0: raise SystemExit('body boundary failed: '+name)
            return m.start(),cb+1,text[m.start():cb+1]

          common=[]; removal=[]
          for name in names:
            s,e,body=function_block(text,name)
            common.append(body.rstrip()); removal.append((s,e,name))
          if 'function showBrowserNotification' not in text: raise SystemExit('PC notification helper unexpectedly missing')
          common_text='/* PC/Phone common observation memo helpers. Notification behavior intentionally excluded. */\n\n'+'\n\n'.join(common)+'\n'
          for s,e,name in sorted(removal,reverse=True): text=text[:s]+text[e:]
          src_path.write_text(text,encoding='utf-8')
          shared_path.write_text(common_text,encoding='utf-8')

          index=index_path.read_text(encoding='utf-8')
          m=re.search(r'<script\b[^>]*\bsrc=["\']observation-memo-core\.js["\'][^>]*></script>',index)
          if not m: raise SystemExit('observation memo core loader missing')
          index=index[:m.start()]+'<script src="observation-memo-common.js"></script>\n'+index[m.start():]
          index_path.write_text(index,encoding='utf-8')

          if guide_path.exists():
            g=guide_path.read_text(encoding='utf-8')
            g += '\n- PC·폰 공통 관찰노트 메모 헬퍼: `observation-memo-common.js` (일반 알림은 공통화 보류)\n'
            guide_path.write_text(g,encoding='utf-8')
          print('COMMON_BYTES',len(common_text.encode('utf-8')))
          print('PC_CORE_BYTES',len(text.encode('utf-8')))
          PY
      - name: Validate PC memo common split
        run: |
          node --check observation-memo-common.js
          node --check observation-memo-core.js
          python - <<'PY'
          from pathlib import Path
          common=Path('observation-memo-common.js').read_text(encoding='utf-8')
          core=Path('observation-memo-core.js').read_text(encoding='utf-8')
          names=['autoResizeTextarea','flushMemoAutoSave','handleMemoPauseAutoSaveBlur','setupMemoPauseAutoSaveBindings','bindPauseAutoSaveForMemoInput','setMemoSaveStatus','showMemoSaveCheck','handleMemoHeaderAction','showPushToast','openMoreMenuPlaceholder']
          for n in names:
            if ('function '+n) not in common: raise SystemExit('common function missing: '+n)
            if ('function '+n) in core: raise SystemExit('common function still in PC core: '+n)
          if 'showBrowserNotification' in common: raise SystemExit('notification must not be commonized')
          if 'function showBrowserNotification' not in core: raise SystemExit('PC notification helper must remain local')
          index=Path('index.html').read_text(encoding='utf-8')
          a=index.find('observation-memo-common.js'); b=index.find('observation-memo-core.js')
          if a<0 or b<0 or a>b: raise SystemExit('PC memo common load order mismatch')
          print('PC_COMMON_OK',len(common.encode('utf-8')))
          PY
      - name: Commit PC memo common split
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m "refactor: PC 관찰노트 공통 메모 헬퍼 분리" || exit 0
          git push