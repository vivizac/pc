name: Split shared operations policy core
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/split-operations-policy-core.yml'
jobs:
  split:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Extract PC canonical operations policies
        run: |
          python - <<'PY'
          from pathlib import Path
          import re, subprocess

          students_path=Path('olli-data-students.js')
          consult_path=Path('olli-consultation-runtime.js')
          index_path=Path('index.html')
          guide_path=Path('OLLI_PC_MODULES.md')
          students=students_path.read_text(encoding='utf-8')
          consult=consult_path.read_text(encoding='utf-8')
          index=index_path.read_text(encoding='utf-8')

          def between(text,start,end):
            a=text.index(start); b=text.index(end,a); return text[a:b]

          def function_block(text,name):
            m=re.search(r'(?:async\s+)?function\s+'+re.escape(name)+r'\s*\(',text)
            if not m: raise SystemExit('function not found: '+name)
            start=m.start(); open_paren=text.find('(',m.start()); i=open_paren; pdepth=0; quote=None; esc=False
            while i < len(text):
              ch=text[i]
              if quote:
                if esc: esc=False
                elif ch=='\\': esc=True
                elif ch==quote: quote=None
              else:
                if ch in ('\"',"'"): quote=ch
                elif ch=='(': pdepth+=1
                elif ch==')':
                  pdepth-=1
                  if pdepth==0: break
              i+=1
            brace=text.find('{',i)
            i=brace; depth=0; quote=None; esc=False; line=False; block=False; template=False
            while i < len(text):
              ch=text[i]; nx=text[i+1] if i+1<len(text) else ''
              if line:
                if ch=='\n': line=False
                i+=1; continue
              if block:
                if ch=='*' and nx=='/': block=False; i+=2; continue
                i+=1; continue
              if quote:
                if esc: esc=False
                elif ch=='\\': esc=True
                elif ch==quote: quote=None
                i+=1; continue
              if template:
                if esc: esc=False
                elif ch=='\\': esc=True
                elif ch=='`': template=False
                i+=1; continue
              if ch=='/' and nx=='/': line=True; i+=2; continue
              if ch=='/' and nx=='*': block=True; i+=2; continue
              if ch in ('\"',"'"): quote=ch; i+=1; continue
              if ch=='`': template=True; i+=1; continue
              if ch=='{': depth+=1
              elif ch=='}':
                depth-=1
                if depth==0: return text[start:i+1]
              i+=1
            raise SystemExit('unclosed function: '+name)

          # 1) elementary group feedback months policy
          gs="const ELEMENTARY_GROUP_FEEDBACK_MONTHS_KEY = 'olli_elementary_group_feedback_months_v1';"
          ge='function migrateStudentStorageIfNeeded() {'
          feedback_policy=between(students,gs,ge).rstrip()+'\n'
          students=students.replace(between(students,gs,ge),'',1)
          Path('olli-operations-feedback-policy.js').write_text(feedback_policy,encoding='utf-8')

          # 2) consultation policy foundation + exact shared functions + due calculation block
          cs="const OLLI_CONSULTATION_RULES_KEY = 'olli_consultation_rules_v1';"
          cb='async function loadOlliSharedSettingsFromServer() {'
          header=between(consult,cs,cb)
          consult=consult.replace(header,'',1)

          function_names=[
            'saveOlliSharedSettingToServer','scheduleOlliSharedSettingSave',
            'getOlliConsultationAcademyId','getOlliEffectiveStorageRole','ensureOlliConsultationContext',
            'migrateOlliConsultationRulesOnce','getOlliConsultationRules','getOlliConsultationRulesMap',
            'refreshOlliConsultationViews','saveOlliConsultationRulesShared','saveOlliConsultationRules',
            'loadOlliConsultationRulesFromServer'
          ]
          pieces=[header.rstrip()]
          for name in function_names[:2]:
            fb=function_block(consult,name); pieces.append(fb); consult=consult.replace(fb,'',1)

          refresh_vars="let olliConsultationRefreshPromise = null;\nlet olliConsultationLastRefreshAt = 0;\nlet olliConsultationAutoSyncTimer = null;"
          if consult.count(refresh_vars)!=1: raise SystemExit('consult refresh vars mismatch')
          pieces.append(refresh_vars)
          consult=consult.replace(refresh_vars,'',1)

          for name in function_names[2:]:
            fb=function_block(consult,name); pieces.append(fb); consult=consult.replace(fb,'',1)

          ds='function getOlliConsultationRuleLabel(key){'
          de='async function toggleAcademyConsultationCompleted(studentRef, event){'
          due_policy=between(consult,ds,de)
          pieces.append(due_policy.rstrip())
          consult=consult.replace(due_policy,'',1)
          consultation_policy='\n\n'.join(piece.rstrip() for piece in pieces if piece.strip())+'\n'
          Path('olli-operations-consultation-policy.js').write_text(consultation_policy,encoding='utf-8')

          students_path.write_text(students,encoding='utf-8')
          consult_path.write_text(consult,encoding='utf-8')

          data_loader='<script src="olli-data-students.js"></script>'
          if index.count(data_loader)!=1: raise SystemExit('data students loader mismatch')
          index=index.replace(data_loader,'<script src="olli-operations-feedback-policy.js"></script>\n'+data_loader,1)
          consult_loader='<script src="olli-consultation-runtime.js"></script>'
          if index.count(consult_loader)!=1: raise SystemExit('consult runtime loader mismatch')
          index=index.replace(consult_loader,'<script src="olli-operations-consultation-policy.js"></script>\n'+consult_loader,1)
          index_path.write_text(index,encoding='utf-8')

          guide=guide_path.read_text(encoding='utf-8')
          row='| 상담 기준·상담 시점 계산·초등 그룹별 피드백 발송월 공통 운영 정책 | `olli-operations-consultation-policy.js`, `olli-operations-feedback-policy.js` | - |\n'
          anchor='| 상담 기준·상담 진행 상태·학생관리 대시보드·기록 목록 로드 | `olli-consultation-runtime.js` | 현재 공통 스타일 |'
          if row.strip() not in guide:
            guide=guide.replace(anchor,row+'| 상담 진행 상태·학생관리 대시보드·기록 목록 로드 | `olli-consultation-runtime.js` | 현재 공통 스타일 |',1)
          guide_path.write_text(guide,encoding='utf-8')

          # validations
          for name in ['olli-operations-feedback-policy.js','olli-operations-consultation-policy.js','olli-data-students.js','olli-consultation-runtime.js']:
            subprocess.run(['node','--check',name],check=True)
          updated=index_path.read_text(encoding='utf-8')
          for name in ['olli-operations-feedback-policy.js','olli-operations-consultation-policy.js']:
            if updated.count(f'<script src="{name}"></script>')!=1: raise SystemExit(name+' loader invalid')
          if gs in students_path.read_text(encoding='utf-8'): raise SystemExit('feedback policy remained in students')
          if cs in consult_path.read_text(encoding='utf-8'): raise SystemExit('consult header remained in runtime')
          if ds in consult_path.read_text(encoding='utf-8'): raise SystemExit('due policy remained in runtime')
          print('feedback_policy_bytes',Path('olli-operations-feedback-policy.js').stat().st_size)
          print('consultation_policy_bytes',Path('olli-operations-consultation-policy.js').stat().st_size)
          PY
      - name: Commit PC operations policy core
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add index.html OLLI_PC_MODULES.md olli-data-students.js olli-consultation-runtime.js olli-operations-feedback-policy.js olli-operations-consultation-policy.js
          git commit -m "refactor: PC 상담·피드백 발송 기준을 공통 운영 정책으로 분리" || exit 0
          git push
