name: Apply guest timetable feature

on:
  push:
    branches: [main]
    paths:
      - 'scripts/apply_guest_timetable_feature.py'
      - '.github/workflows/apply-guest-timetable-feature.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Apply direct source edits
        run: python scripts/apply_guest_timetable_feature.py
      - name: Validate JavaScript
        run: |
          node --check pc-timetable-service.js
          node --check pc-timetable.js
      - name: Verify intended feature markers
        run: |
          grep -q "data-tt-add-type=\"guest_wait\"" pc-timetable.js
          grep -q "data-tt-add-type=\"trial\"" pc-timetable.js
          grep -q "olli_schedule_add_guest_entry" pc-timetable-service.js
          grep -q "olliTtStudent.trial" pc-timetable.css
      - name: Commit source changes
        run: |
          git config user.name "vivizac"
          git config user.email "ipro721@gmail.com"
          git add pc-timetable.js pc-timetable-service.js pc-timetable.css
          if git diff --cached --quiet; then
            echo "No source changes produced"
            exit 1
          fi
          git commit -m "feat: add non-enrolled waitlist and trial timetable entries"
          git push origin main
