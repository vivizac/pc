name: One-shot PC start page v2

on:
  push:
    paths:
      - '.github/workflows/one-shot-pc-start-page-v2.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Add PC start page controller to index
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('index.html')
          text = path.read_text(encoding='utf-8')
          tag = '<script src="pc-start-page.js"></script>'
          if tag not in text:
              marker = '</body>'
              if marker not in text:
                  raise SystemExit('index.html has no </body> marker')
              text = text.replace(marker, tag + '\n' + marker, 1)
              path.write_text(text, encoding='utf-8')
          PY

      - name: Verify patch
        shell: bash
        run: |
          grep -q '<script src="pc-start-page.js"></script>' index.html
          test -f pc-start-page.js
          node --check pc-start-page.js

      - name: Commit patch
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          if git diff --cached --quiet; then
            echo 'No index changes to commit.'
            exit 0
          fi
          git commit -m 'Connect PC start page controller'
          git push
