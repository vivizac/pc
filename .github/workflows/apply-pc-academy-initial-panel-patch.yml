name: Apply PC academy initial panel patch
on:
  push:
    paths:
      - '.github/workflows/apply-pc-academy-initial-panel-patch.yml'
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply PC academy initial panel patch
        run: python scripts/apply_pc_academy_initial_panel_patch.py
      - name: Commit patched index
        run: |
          if git diff --quiet -- index.html; then
            echo "index.html already patched"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Show academy consultation panel on first load"
          git push
