name: One-shot extract kinder feedback

on:
  push:
    paths:
      - '.github/workflows/one-shot-extract-kinder-feedback.yml'

permissions:
  contents: write

jobs:
  extract:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Extract kinder feedback module
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          index = Path('index.html')
          text = index.read_text(encoding='utf-8')

          style_open = '<style id="kinderChatFeedbackPageStyle">'
          style_start = text.find(style_open)
          if style_start < 0:
              raise SystemExit('kinderChatFeedbackPageStyle not found')
          style_content_start = style_start + len(style_open)
          style_end = text.find('</style>', style_content_start)
          if style_end < 0:
              raise SystemExit('kinderChatFeedbackPageStyle closing tag not found')
          css = text[style_content_start:style_end].strip() + '\n'
          text = text[:style_start] + '<link rel="stylesheet" href="kinder-feedback.css">' + text[style_end + len('</style>'):]

          script_open = '<script id="kinderChatFeedbackPageScript">'
          script_start = text.find(script_open)
          if script_start < 0:
              raise SystemExit('kinderChatFeedbackPageScript not found')
          script_content_start = script_start + len(script_open)
          script_end = text.find('</script>', script_content_start)
          if script_end < 0:
              raise SystemExit('kinderChatFeedbackPageScript closing tag not found')
          js = text[script_content_start:script_end].strip() + '\n'
          text = text[:script_start] + '<script src="kinder-feedback.js"></script>' + text[script_end + len('</script>'):]

          Path('kinder-feedback.css').write_text(css, encoding='utf-8')
          Path('kinder-feedback.js').write_text(js, encoding='utf-8')
          index.write_text(text, encoding='utf-8')
          PY

      - name: Verify extraction
        shell: bash
        run: |
          test -s kinder-feedback.css
          test -s kinder-feedback.js
          node --check kinder-feedback.js
          grep -q '<link rel="stylesheet" href="kinder-feedback.css">' index.html
          grep -q '<script src="kinder-feedback.js"></script>' index.html
          ! grep -q 'id="kinderChatFeedbackPageStyle"' index.html
          ! grep -q 'id="kinderChatFeedbackPageScript"' index.html

      - name: Commit extraction
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html kinder-feedback.css kinder-feedback.js
          git commit -m 'Extract kinder feedback module'
          git push
