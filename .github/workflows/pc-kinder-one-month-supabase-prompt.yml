name: Connect PC kinder one-month feedback to Supabase prompt

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/pc-kinder-one-month-supabase-prompt.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Route kinder one-month summary to shared Supabase prompt
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          foundation_path = Path('olli-data-foundation.js')
          summary_path = Path('olli-data-consultation-summary.js')
          foundation = foundation_path.read_text(encoding='utf-8')
          summary = summary_path.read_text(encoding='utf-8')
          foundation, c1 = re.subn(r"\n*const KINDER_ONE_MONTH_CONSULTATION_PROMPT\s*=\s*`.*?`;\s*", "\n", foundation, count=1, flags=re.S)
          if c1 != 1: raise RuntimeError(f'KINDER prompt removal count={c1}')
          p1 = r"function buildConsultationFeedbackMessages\(student, months, userText\) \{.*?\n\}(?=\n\nasync function fetchConsultationFeedbackByPromptType)"
          r1 = "function buildConsultationFeedbackMessages(student, months, userText) {\n  return [{ role: 'user', content: userText }];\n}"
          summary, c2 = re.subn(p1, r1, summary, count=1, flags=re.S)
          if c2 != 1: raise RuntimeError(f'consultation messages replacement count={c2}')
          p2 = r"  let \{ res, data \} = await fetchConsultationFeedbackByPromptType\(promptType, messages\);\n\n  if \(!res\.ok && promptType === KINDER_ONE_MONTH_PROMPT_TYPE && res\.status === 400\) \{\n    \(\{ res, data \} = await fetchConsultationFeedbackByPromptType\('summary', messages\)\);\n  \}\n\n  if \(!res\.ok\) throw new Error\(getApiErrorMessage\(res\.status, data\)\);"
          r2 = "  const { res, data } = await fetchConsultationFeedbackByPromptType(promptType, messages);\n\n  if (!res.ok) throw new Error(getApiErrorMessage(res.status, data));"
          summary, c3 = re.subn(p2, r2, summary, count=1, flags=re.S)
          if c3 != 1: raise RuntimeError(f'consultation fallback replacement count={c3}')
          if "const KINDER_ONE_MONTH_PROMPT_TYPE = 'kinder_one_month';" not in foundation: raise RuntimeError('kinder_one_month prompt type missing')
          if "if (type === 'kinder' && safeMonths === 1) return KINDER_ONE_MONTH_PROMPT_TYPE;" not in summary: raise RuntimeError('kinder one-month routing condition missing')
          if 'KINDER_ONE_MONTH_CONSULTATION_PROMPT' in foundation or 'KINDER_ONE_MONTH_CONSULTATION_PROMPT' in summary: raise RuntimeError('local kinder one-month prompt remains')
          foundation_path.write_text(foundation, encoding='utf-8')
          summary_path.write_text(summary, encoding='utf-8')
          print('PC kinder one-month summary uses Supabase kinder_one_month prompt only.')
          PY

      - name: Commit changes
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add olli-data-foundation.js olli-data-consultation-summary.js
          git commit -m "feat: PC 유치부 1개월 종합피드백을 Supabase 프롬프트로 연결"
          git push
