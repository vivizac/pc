name: Connect PC kinder one-month feedback to Supabase prompt

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/pc-kinder-one-month-supabase-prompt.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Route kinder one-month summary to shared Supabase prompt
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          foundation_path = Path('olli-data-foundation.js')
          summary_path = Path('olli-data-consultation-summary.js')
          foundation = foundation_path.read_text(encoding='utf-8')
          summary = summary_path.read_text(encoding='utf-8')

          # 1) PC 클라이언트에 남아 있던 유치부 1개월 프롬프트 본문 제거
          foundation, removed = re.subn(
              r"\n*const KINDER_ONE_MONTH_CONSULTATION_PROMPT\s*=\s*`.*?`;\s*",
              "\n",
              foundation,
              count=1,
              flags=re.S,
          )
          if removed != 1:
              raise RuntimeError(f'KINDER_ONE_MONTH_CONSULTATION_PROMPT removal count={removed}')

          # 2) PC는 promptType만 전달하고 system prompt 본문은 서버/Supabase가 주입
          old_messages = """function buildConsultationFeedbackMessages(student, months, userText) {
  const promptType = getConsultationFeedbackPromptType(student, months);
  if (promptType === KINDER_ONE_MONTH_PROMPT_TYPE) {
    return [
      { role: 'system', content: KINDER_ONE_MONTH_CONSULTATION_PROMPT },
      { role: 'user', content: userText }
    ];
  }
  return [{ role: 'user', content: userText }];
}"""
          new_messages = """function buildConsultationFeedbackMessages(student, months, userText) {
  return [{ role: 'user', content: userText }];
}"""
          if old_messages not in summary:
              raise RuntimeError('buildConsultationFeedbackMessages target block not found')
          summary = summary.replace(old_messages, new_messages, 1)

          # 3) 유치부 1개월이 실패해도 summary 프롬프트로 몰래 변경하지 않음
          old_fallback = """  let { res, data } = await fetchConsultationFeedbackByPromptType(promptType, messages);

  if (!res.ok && promptType === KINDER_ONE_MONTH_PROMPT_TYPE && res.status === 400) {
    ({ res, data } = await fetchConsultationFeedbackByPromptType('summary', messages));
  }

  if (!res.ok) throw new Error(getApiErrorMessage(res.status, data));"""
          new_fallback = """  const { res, data } = await fetchConsultationFeedbackByPromptType(promptType, messages);

  if (!res.ok) throw new Error(getApiErrorMessage(res.status, data));"""
          if old_fallback not in summary:
              raise RuntimeError('consultation fallback target block not found')
          summary = summary.replace(old_fallback, new_fallback, 1)

          # 4) 연결 검증: 1개월 유치부는 kinder_one_month 키, 메시지는 user-only
          if "const KINDER_ONE_MONTH_PROMPT_TYPE = 'kinder_one_month';" not in foundation:
              raise RuntimeError('kinder_one_month prompt type constant missing')
          if "if (type === 'kinder' && safeMonths === 1) return KINDER_ONE_MONTH_PROMPT_TYPE;" not in summary:
              raise RuntimeError('kinder one-month routing condition missing')
          if 'KINDER_ONE_MONTH_CONSULTATION_PROMPT' in foundation or 'KINDER_ONE_MONTH_CONSULTATION_PROMPT' in summary:
              raise RuntimeError('local kinder one-month prompt still remains')
          if "{ role: 'system'" in summary:
              raise RuntimeError('client system prompt message still remains in consultation summary module')

          foundation_path.write_text(foundation, encoding='utf-8')
          summary_path.write_text(summary, encoding='utf-8')
          print('PC kinder one-month summary now uses shared Supabase kinder_one_month prompt only.')
          PY

      - name: Commit changes
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add olli-data-foundation.js olli-data-consultation-summary.js
          git commit -m "feat: PC 유치부 1개월 종합피드백을 Supabase 프롬프트로 연결"
          git push
