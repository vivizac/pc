name: Split record editor by domain

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/one-shot-split-record-editor.yml'

permissions:
  contents: write

jobs:
  split:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Split record editor
        run: python3 scripts/tmp_split_record_editor.py
      - name: Verify split
        shell: bash
        run: |
          set -e
          for f in \
            olli-record-student-picker.js \
            olli-record-scene-tools.js \
            olli-record-search-controls.js \
            olli-record-feedback-generation.js \
            olli-record-room-navigation.js \
            olli-record-memo-storage.js; do
            node --check "$f"
          done
          python3 - <<'PY'
          from pathlib import Path
          html = Path('index.html').read_text(encoding='utf-8')
          order = [
            'olli-record-student-picker.js',
            'olli-record-scene-tools.js',
            'olli-record-search-controls.js',
            'olli-record-feedback-generation.js',
            'olli-record-room-navigation.js',
            'olli-record-memo-storage.js',
            'observation-memo-core.js'
          ]
          pos = [html.index(name) for name in order]
          if pos != sorted(pos):
              raise SystemExit(f'bad record editor load order: {pos}')
          if 'olli-record-editor-core.js' in html:
              raise SystemExit('old record editor script tag remains')
          checks = {
            'olli-record-student-picker.js': ['renderMemoStudentSelectPopup', 'memoStudentPickerManageMode'],
            'olli-record-scene-tools.js': ['SCENE_CARD_OPTIONS', 'openSceneCardModal'],
            'olli-record-search-controls.js': ['searchRecords', 'toggleRecordAddMenu'],
            'olli-record-feedback-generation.js': ['requestSceneCardFeedbackFromElementary', 'autoSaveMemoFeedback'],
            'olli-record-room-navigation.js': ['toggleRecordViewMode', 'showRecordRoom'],
            'olli-record-memo-storage.js': ['saveStudentNoteDraftToSupabase', 'confirmStudent']
          }
          for file, needles in checks.items():
              text = Path(file).read_text(encoding='utf-8')
              for needle in needles:
                  if needle not in text:
                      raise SystemExit(f'{needle} missing from {file}')
          total = sum(Path(name).stat().st_size for name in checks)
          old_size = Path('olli-record-editor-core.js').stat().st_size
          if total != old_size:
              raise SystemExit(f'byte-preserving split mismatch: {total} != {old_size}')
          print('record editor split verification passed', total)
          PY
      - name: Commit split and remove temporary files
        shell: bash
        run: |
          set -e
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm -f olli-record-editor-core.js
          git rm -f .github/workflows/one-shot-split-record-editor.yml
          git rm -f .github/workflows/one-shot-audit-record-editor-split.yml
          git rm -f scripts/tmp_split_record_editor.py
          git add index.html OLLI_PC_MODULES.md \
            olli-record-student-picker.js \
            olli-record-scene-tools.js \
            olli-record-search-controls.js \
            olli-record-feedback-generation.js \
            olli-record-room-navigation.js \
            olli-record-memo-storage.js
          git commit -m 'Split record editor by responsibility'
          git push
