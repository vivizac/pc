name: Validate PC personality view prefs

on:
  pull_request:
    paths:
      - 'apps/pc/pc-attendance.js'
      - 'apps/pc/pc-attendance.css'
      - 'apps/pc/olli-data-attendance-feedback.js'
      - 'apps/pc/tests/pc-personality-feedback-archive-legacy.test.cjs'
      - 'apps/pc/index.html'
      - 'apps/pc/tests/pc-record-unification.test.cjs'
      - '.github/workflows/validate-pc-personality-view-prefs.yml'
  push:
    branches: [main]
    paths:
      - 'apps/pc/pc-attendance.js'
      - 'apps/pc/pc-attendance.css'
      - 'apps/pc/olli-data-attendance-feedback.js'
      - 'apps/pc/tests/pc-personality-feedback-archive-legacy.test.cjs'
      - 'apps/pc/index.html'
      - 'apps/pc/tests/pc-record-unification.test.cjs'
      - '.github/workflows/validate-pc-personality-view-prefs.yml'

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Check PC attendance syntax
        run: node --check apps/pc/pc-attendance.js
      - name: Validate PC record view preferences
        working-directory: apps/pc
        run: node tests/pc-record-unification.test.cjs
      - name: Check PC feedback data syntax
        run: node --check apps/pc/olli-data-attendance-feedback.js
      - name: Validate imported feedback archive dates and safe caching
        working-directory: apps/pc
        run: node --test tests/pc-personality-feedback-archive-legacy.test.cjs
