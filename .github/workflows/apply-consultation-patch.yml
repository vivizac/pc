name: Apply consultation survey patch
on:
  push:
    paths:
      - '.github/workflows/apply-consultation-patch.yml'
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply consultation survey integration
        run: python scripts/apply_consultation_patch.py
      - name: Commit patched index
        run: |
          if git diff --quiet -- index.html; then
            echo "index.html already patched"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Add consultation survey page to OLLI PC"
          git push
