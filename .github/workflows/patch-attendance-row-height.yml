name: Patch attendance row height
on:
  push:
    branches:
      - tweak/attendance-row-height-20260915
jobs:
  patch:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: tweak/attendance-row-height-20260915
      - name: Apply focused row-height patch
        run: python .github/tmp/patch_attendance_row_height.py
      - name: Validate intended CSS
        run: |
          grep -F '#recordRoomScreen .olliTtAttendanceTable tbody tr:not(.attendanceTableFooterRow) > td {' pc-timetable.css
          grep -F 'height: 32px !important;' pc-timetable.css
          git diff --check
      - name: Clean temporary files and commit
        run: |
          rm -f .github/tmp/patch_attendance_row_height.py .github/workflows/patch-attendance-row-height.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add pc-timetable.css .github
          git commit -m 'style: 출석부 학생 행 높이 소폭 확대'
          git push origin HEAD:tweak/attendance-row-height-20260915
