name: One-shot kindergarten split and memo edit
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/one-shot-kinder-split-memo-edit.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Apply patch
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          js_path = Path('pc-timetable.js')
          css_path = Path('pc-timetable.css')
          index_path = Path('index.html')
          js = js_path.read_text()
          css = css_path.read_text()
          index = index_path.read_text()

          replacements = [
            ("query: '', note: existingMemo, originalNote: existingMemo, addType: 'wait', targetClassGroup, pendingKinderMerge: false",
             "query: '', note: existingMemo, originalNote: existingMemo, addType: 'wait', targetClassGroup, pendingKinderMerge: false, pendingKinderSplit: false"),
            ("state.dialog = { kind: 'memoManage', division, date, time, memo };",
             "state.dialog = { kind: 'memoManage', division, date, time, memo, originalMemo: memo };") ,
            ("const pendingKinderMerge = Boolean(state.dialog && state.dialog.kind === 'add' && state.dialog.division === 'kinder' && state.dialog.pendingKinderMerge);",
             "const pendingKinderMerge = Boolean(state.dialog && state.dialog.kind === 'add' && state.dialog.division === 'kinder' && state.dialog.pendingKinderMerge);\n    const pendingKinderSplit = Boolean(state.dialog && state.dialog.kind === 'add' && state.dialog.division === 'kinder' && state.dialog.pendingKinderSplit);"),
            ("'<button type=\"button\" class=\"olliTtSplitClassBtn\" data-tt-split-kinder-class>클래스 분반</button></div>';",
             "`<button type=\"button\" class=\"olliTtSplitClassBtn ${pendingKinderSplit ? 'active' : ''}\" data-tt-split-kinder-class>${pendingKinderSplit ? '클래스 분반 선택됨' : '클래스 분반'}</button></div>`;"),
            ("const canRegister = Boolean(selected || note || hadMemo || dialog.pendingKinderMerge);",
             "const canRegister = Boolean(selected || note || hadMemo || dialog.pendingKinderMerge || dialog.pendingKinderSplit);"),
            ("const primaryLabel = dialog.pendingKinderMerge ? '등록' : (selected ? '등록' : (note ? '메모 저장' : (hadMemo ? '메모 삭제' : '등록')));",
             "const primaryLabel = (dialog.pendingKinderMerge || dialog.pendingKinderSplit) ? '등록' : (selected ? '등록' : (note ? '메모 저장' : (hadMemo ? '메모 삭제' : '등록')));"),
            ("return dialogHead('📝', '메모 삭제', `${koreanDate(date, true)} ${day}요일 · ${timeLabel(dialog.time)}`)\n      + '<div class=\"olliTtDialogBody\">'\n      + `<div class=\"olliTtMemoDeletePreview\"><span>현재 메모</span><div>${esc(dialog.memo)}</div></div>`\n      + '<div class=\"olliTtStatusNotice\">메모를 삭제하면 이 시간의 수업 설정 팝업에 저장된 메모 내용도 함께 지워집니다.</div>'\n      + '<div class=\"olliTtDialogActions\"><button type=\"button\" class=\"olliTtDialogCancel\" data-tt-dialog-close>취소</button><button type=\"button\" class=\"olliTtDialogPrimary danger\" data-tt-delete-memo>메모 삭제</button></div></div>';",
             "return dialogHead('📝', '메모 관리', `${koreanDate(date, true)} ${day}요일 · ${timeLabel(dialog.time)}`)\n      + '<div class=\"olliTtDialogBody\">'\n      + `<label class=\"olliTtAddMemo\"><span>메모</span><textarea data-tt-memo-edit maxlength=\"500\" placeholder=\"메모를 입력하세요\">${esc(dialog.memo)}</textarea></label>`\n      + '<div class=\"olliTtStatusNotice\">메모 내용을 수정한 뒤 저장하거나, 더 이상 필요하지 않으면 삭제할 수 있습니다.</div>'\n      + '<div class=\"olliTtDialogActions\"><button type=\"button\" class=\"olliTtDialogCancel\" data-tt-save-memo>저장</button><button type=\"button\" class=\"olliTtDialogPrimary danger\" data-tt-delete-memo>메모 삭제</button></div></div>';"),
            ("dialog.querySelectorAll('[data-tt-target-class]').forEach((button) => button.addEventListener('click', () => { state.dialog.targetClassGroup = button.dataset.ttTargetClass; if (state.dialog.kind === 'add') state.dialog.pendingKinderMerge = false; renderDialog(); }));",
             "dialog.querySelectorAll('[data-tt-target-class]').forEach((button) => button.addEventListener('click', () => { state.dialog.targetClassGroup = button.dataset.ttTargetClass; if (state.dialog.kind === 'add') { state.dialog.pendingKinderMerge = false; state.dialog.pendingKinderSplit = false; } renderDialog(); }));"),
            ("const pendingKinderMerge = Boolean(state.dialog.pendingKinderMerge);\n        saveButton.disabled = !(hasSelectedStudent || hasNote || hadMemo || pendingKinderMerge);\n        saveButton.textContent = pendingKinderMerge ? '등록' : (hasSelectedStudent ? '등록' : (hasNote ? '메모 저장' : (hadMemo ? '메모 삭제' : '등록')));",
             "const pendingKinderMerge = Boolean(state.dialog.pendingKinderMerge);\n        const pendingKinderSplit = Boolean(state.dialog.pendingKinderSplit);\n        saveButton.disabled = !(hasSelectedStudent || hasNote || hadMemo || pendingKinderMerge || pendingKinderSplit);\n        saveButton.textContent = (pendingKinderMerge || pendingKinderSplit) ? '등록' : (hasSelectedStudent ? '등록' : (hasNote ? '메모 저장' : (hadMemo ? '메모 삭제' : '등록')));"),
            ("const deleteMemoButton = dialog.querySelector('[data-tt-delete-memo]');\n    if (deleteMemoButton) deleteMemoButton.addEventListener('click', deleteCellMemo);",
             "const memoEdit = dialog.querySelector('[data-tt-memo-edit]');\n    if (memoEdit) memoEdit.addEventListener('input', () => { if (state.dialog && state.dialog.kind === 'memoManage') state.dialog.memo = memoEdit.value; });\n    const saveMemoButton = dialog.querySelector('[data-tt-save-memo]');\n    if (saveMemoButton) saveMemoButton.addEventListener('click', saveManagedMemo);\n    const deleteMemoButton = dialog.querySelector('[data-tt-delete-memo]');\n    if (deleteMemoButton) deleteMemoButton.addEventListener('click', deleteCellMemo);"),
            ("async function splitKinderClass() {\n    const dialog = state.dialog;\n    if (!dialog || dialog.kind !== 'add' || dialog.division !== 'kinder') return;\n    if (!confirm(`${weekdayLabel(dialog.weekday)}요일 ${timeLabel(dialog.time)} 유치부 수업을 A반·B반으로 다시 분반할까요?`)) return;\n    dialog.targetClassGroup = 'A';\n    const result = await withOpenDialogSaving(() => service.splitKinderClass(dialog.weekday, dialog.time));\n    if (result) notify(`${weekdayLabel(dialog.weekday)}요일 ${timeLabel(dialog.time)} 유치부 수업을 A반·B반으로 분반했어요.`);\n  }",
             "async function splitKinderClass() {\n    const dialog = state.dialog;\n    if (!dialog || dialog.kind !== 'add' || dialog.division !== 'kinder') return;\n    dialog.targetClassGroup = 'A';\n    dialog.pendingKinderMerge = false;\n    dialog.pendingKinderSplit = true;\n    renderDialog();\n  }"),
            ("dialog.targetClassGroup = 'A';\n    dialog.pendingKinderMerge = true;\n    renderDialog();",
             "dialog.targetClassGroup = 'A';\n    dialog.pendingKinderSplit = false;\n    dialog.pendingKinderMerge = true;\n    renderDialog();"),
            ("async function deleteCellMemo() {",
             "async function saveManagedMemo() {\n    const dialog = state.dialog;\n    if (!dialog || dialog.kind !== 'memoManage') return;\n    const memo = clean(dialog.memo);\n    if (!memo) {\n      alert('메모 내용을 입력해 주세요. 삭제하려면 메모 삭제 버튼을 이용해 주세요.');\n      return;\n    }\n    const result = await withSaving(() => saveCellMemoText(dialog.division, dialog.date, dialog.time, dialog.memo));\n    if (result) notify(memo === clean(dialog.originalMemo) ? '메모를 저장했어요.' : '메모 수정 내용을 저장했어요.');\n  }\n\n  async function deleteCellMemo() {"),
            ("const pendingKinderMerge = Boolean(dialog.pendingKinderMerge && dialog.division === 'kinder');\n    if (!hasStudent && !note && !hadMemo && !pendingKinderMerge) return;",
             "const pendingKinderMerge = Boolean(dialog.pendingKinderMerge && dialog.division === 'kinder');\n    const pendingKinderSplit = Boolean(dialog.pendingKinderSplit && dialog.division === 'kinder');\n    if (!hasStudent && !note && !hadMemo && !pendingKinderMerge && !pendingKinderSplit) return;"),
            ("if (pendingKinderMerge) await service.mergeKinderClass(dialog.weekday, dialog.time);\n        if (note || hadMemo) await persistDialogCellMemo(dialog);\n        return { merged: pendingKinderMerge, memoChanged: note || hadMemo };",
             "if (pendingKinderMerge) await service.mergeKinderClass(dialog.weekday, dialog.time);\n        if (pendingKinderSplit) await service.splitKinderClass(dialog.weekday, dialog.time);\n        if (note || hadMemo) await persistDialogCellMemo(dialog);\n        return { merged: pendingKinderMerge, split: pendingKinderSplit, memoChanged: note || hadMemo };"),
            ("if (pendingKinderMerge) notify(`${weekdayLabel(dialog.weekday)}요일 ${timeLabel(dialog.time)} 유치부 수업을 합반했어요.`);\n        else notify(note ? '시간표 메모를 저장했어요.' : '시간표 메모를 삭제했어요.');",
             "if (pendingKinderMerge) notify(`${weekdayLabel(dialog.weekday)}요일 ${timeLabel(dialog.time)} 유치부 수업을 합반했어요.`);\n        else if (pendingKinderSplit) notify(`${weekdayLabel(dialog.weekday)}요일 ${timeLabel(dialog.time)} 유치부 수업을 A반·B반으로 분반했어요.`);\n        else notify(note ? '시간표 메모를 저장했어요.' : '시간표 메모를 삭제했어요.');"),
            ("if (pendingKinderMerge) await service.mergeKinderClass(dialog.weekday, dialog.time);\n      const actionResult = dialog.addType === 'makeup'",
             "if (pendingKinderMerge) await service.mergeKinderClass(dialog.weekday, dialog.time);\n      if (pendingKinderSplit) await service.splitKinderClass(dialog.weekday, dialog.time);\n      const actionResult = dialog.addType === 'makeup'")
          ]

          for old, new in replacements:
              count = js.count(old)
              if count != 1:
                  raise SystemExit(f'JS replacement expected once, found {count}: {old[:100]}')
              js = js.replace(old, new, 1)

          css_replacements = [
            ("border: 1px solid #e2cb63;", "border: 1px solid #bfdcf3;"),
            ("color: #544918;\n  background: #fff3a6;", "color: #35566f;\n  background: #eaf5ff;"),
            ("box-shadow: 0 2px 5px rgba(112,91,14,.10);", "box-shadow: 0 2px 5px rgba(68,121,160,.10);"),
            ("#recordRoomScreen .olliTtCellMemoCard:hover { border-color: #d4b83f; background: #ffed85; box-shadow: 0 3px 8px rgba(112,91,14,.16); }", "#recordRoomScreen .olliTtCellMemoCard:hover { border-color: #a9cfea; background: #dff0ff; box-shadow: 0 3px 8px rgba(68,121,160,.16); }"),
            ("#recordRoomScreen .olliTtStudent.regular.elementary { border-color: #f0dd8b; background: #fff3c6; }", "#recordRoomScreen .olliTtStudent.regular.elementary { border-color: #bfdcf3; background: #eaf5ff; }")
          ]
          for old, new in css_replacements:
              count = css.count(old)
              if count != 1:
                  raise SystemExit(f'CSS replacement expected once, found {count}: {old[:100]}')
              css = css.replace(old, new, 1)

          old_cache = 'pc-timetable.css?v=20260905-5'
          new_cache = 'pc-timetable.css?v=20260905-6'
          if index.count(old_cache) != 1:
              raise SystemExit(f'index cache token expected once, found {index.count(old_cache)}')
          index = index.replace(old_cache, new_cache, 1)

          js_path.write_text(js)
          css_path.write_text(css)
          index_path.write_text(index)
          PY
      - name: Validate
        run: |
          node --check pc-timetable.js
          git diff --check
          grep -q 'pendingKinderSplit' pc-timetable.js
          grep -q 'data-tt-save-memo' pc-timetable.js
          grep -q 'pc-timetable.css?v=20260905-6' index.html
      - name: Commit patch and remove workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/one-shot-kinder-split-memo-edit.yml
          git add pc-timetable.js pc-timetable.css index.html
          git commit -m "Stage kindergarten split and enable memo editing"
          git push origin main
