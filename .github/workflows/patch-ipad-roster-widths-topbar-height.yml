name: Patch iPad roster widths and topbar height

on:
  push:
    branches:
      - fix/ipad-attendance-horizontal-scroll-20260915
    paths:
      - '.github/workflows/patch-ipad-roster-widths-topbar-height.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply focused CSS patch
        run: python3 .github/tmp/patch_ipad_roster_widths_topbar_height.py
      - name: Validate CSS changes
        run: |
          python3 - <<'PY'
          from pathlib import Path
          css = Path('pc-timetable.css').read_text(encoding='utf-8')
          assert 'height:40px;\n  box-sizing:border-box;' in css
          assert 'height:100%;\n  box-sizing:border-box;' in css
          assert css.count('width: 1600px !important;') >= 2
          assert 'left: 88px;' in css
          assert 'left: 184px;' in css
          assert 'width: 88px !important;' in css
          assert 'width: 96px !important;' in css
          assert 'width: 56px !important;' in css
          PY
      - name: Clean temporary patch files and commit
        run: |
          rm -f .github/tmp/patch_ipad_roster_widths_topbar_height.py
          rm -f .github/workflows/patch-ipad-roster-widths-topbar-height.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "fix: widen iPad roster columns and align attendance tabs height"
          git push origin HEAD:${GITHUB_REF_NAME}
