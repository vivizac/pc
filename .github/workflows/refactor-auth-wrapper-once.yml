name: refactor-auth-wrapper-once

on:
  push:
    branches:
      - refactor/source-owned-no-overrides-20260912

permissions:
  contents: write

jobs:
  refactor:
    if: ${{ github.actor != 'github-actions[bot]' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Move auth reset behavior into canonical auth module
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import re

          auth_path = Path('olli-auth-entry-ui.js')
          auth = auth_path.read_text(encoding='utf-8')

          helper_anchor = """function getOlliAuthAccessToken() {\n  // 계정 기반 로그인에서는 Supabase RPC가 세션 토큰을 직접 검증합니다.\n  return '';\n}\n\n"""
          helpers = """function getOlliAuthAccessToken() {\n  // 계정 기반 로그인에서는 Supabase RPC가 세션 토큰을 직접 검증합니다.\n  return '';\n}\n\nconst OLLI_ACCOUNT_AUTH_INPUT_IDS = [\n  'olliOwnerAcademyCodeInput',\n  'olliOwnerPasswordInput',\n  'olliAccountCreateLoginIdInput',\n  'olliAccountCreateNameInput',\n  'olliAccountCreatePasswordInput',\n  'olliAccountCreatePasswordConfirmInput'\n];\n\nfunction resetOlliAccountAuthInputs(target) {\n  const resetAll = !target || target === 'all';\n  const loginIds = ['olliOwnerAcademyCodeInput', 'olliOwnerPasswordInput'];\n  const createIds = [\n    'olliAccountCreateLoginIdInput',\n    'olliAccountCreateNameInput',\n    'olliAccountCreatePasswordInput',\n    'olliAccountCreatePasswordConfirmInput'\n  ];\n  const ids = resetAll ? OLLI_ACCOUNT_AUTH_INPUT_IDS : (target === 'login' ? loginIds : createIds);\n  ids.forEach(id => {\n    const el = document.getElementById(id);\n    if (!el) return;\n    el.value = '';\n    el.defaultValue = '';\n    el.setAttribute('autocomplete', 'off');\n    el.setAttribute('autocapitalize', 'none');\n    el.setAttribute('autocorrect', 'off');\n    el.setAttribute('spellcheck', 'false');\n    if (!el.getAttribute('name')) el.setAttribute('name', id + '_' + Date.now());\n  });\n  const resultBox = document.getElementById('olliAccountCreateResult');\n  if (resultBox && (resetAll || target === 'create')) {\n    resultBox.style.display = 'none';\n    resultBox.innerHTML = '';\n  }\n}\n\nfunction prepareOlliAccountAuthInputs() {\n  OLLI_ACCOUNT_AUTH_INPUT_IDS.forEach(id => {\n    const el = document.getElementById(id);\n    if (!el) return;\n    el.setAttribute('autocomplete', 'off');\n    el.setAttribute('autocapitalize', 'none');\n    el.setAttribute('autocorrect', 'off');\n    el.setAttribute('spellcheck', 'false');\n    el.setAttribute('name', id + '_fresh');\n  });\n}\n\nwindow.resetOlliAccountAuthInputs = resetOlliAccountAuthInputs;\nif (document.readyState === 'loading') {\n  document.addEventListener('DOMContentLoaded', prepareOlliAccountAuthInputs, { once: true });\n} else {\n  prepareOlliAccountAuthInputs();\n}\n\n"""
          if auth.count(helper_anchor) != 1:
              raise SystemExit(f'auth helper anchor count={auth.count(helper_anchor)}')
          auth = auth.replace(helper_anchor, helpers, 1)

          login_old = """  showOlliLoginScreenById('olliLoginEntryScreen');\n  if (typeof window.olliAfterShowLoginEntry === 'function') window.olliAfterShowLoginEntry();\n}\n"""
          login_new = """  showOlliLoginScreenById('olliLoginEntryScreen');\n  if (typeof window.olliAfterShowLoginEntry === 'function') window.olliAfterShowLoginEntry();\n  resetOlliAccountAuthInputs('all');\n}\n"""
          if auth.count(login_old) != 1:
              raise SystemExit(f'showOlliLoginEntry anchor count={auth.count(login_old)}')
          auth = auth.replace(login_old, login_new, 1)

          owner_old = """  const loginId = document.getElementById('olliOwnerAcademyCodeInput');\n  if (loginId && !loginId.value) loginId.value = localStorage.getItem(OLLI_ACCOUNT_LOGIN_ID_KEY) || '';\n  if (typeof window.olliAfterShowOwnerLogin === 'function') window.olliAfterShowOwnerLogin();\n}\n"""
          owner_new = """  const loginId = document.getElementById('olliOwnerAcademyCodeInput');\n  if (loginId && !loginId.value) loginId.value = localStorage.getItem(OLLI_ACCOUNT_LOGIN_ID_KEY) || '';\n  if (typeof window.olliAfterShowOwnerLogin === 'function') window.olliAfterShowOwnerLogin();\n  resetOlliAccountAuthInputs('login');\n  if (loginId) loginId.focus();\n}\n"""
          if auth.count(owner_old) != 1:
              raise SystemExit(f'showOlliOwnerLogin anchor count={auth.count(owner_old)}')
          auth = auth.replace(owner_old, owner_new, 1)

          create_old = """  const loginId = document.getElementById('olliAccountCreateLoginIdInput');\n  if (loginId && !loginId.value) loginId.focus();\n  if (typeof window.olliAfterShowAccountCreate === 'function') window.olliAfterShowAccountCreate();\n}\n"""
          create_new = """  const loginId = document.getElementById('olliAccountCreateLoginIdInput');\n  if (loginId && !loginId.value) loginId.focus();\n  if (typeof window.olliAfterShowAccountCreate === 'function') window.olliAfterShowAccountCreate();\n  resetOlliAccountAuthInputs('create');\n  if (loginId) loginId.focus();\n}\n"""
          if auth.count(create_old) != 1:
              raise SystemExit(f'showOlliAccountCreate anchor count={auth.count(create_old)}')
          auth = auth.replace(create_old, create_new, 1)
          auth_path.write_text(auth, encoding='utf-8')

          index_path = Path('index.html')
          index = index_path.read_text(encoding='utf-8')
          auth_patch_pattern = re.compile(
              r"\n  const ACCOUNT_AUTH_INPUT_IDS = \[.*?\n  async function doOlliAccountSoftDelete\(\) \{",
              re.S
          )
          index, count = auth_patch_pattern.subn("\n  async function doOlliAccountSoftDelete() {", index, count=1)
          if count != 1:
              raise SystemExit(f'auth wrapper patch block count={count}')
          prepare_call = "    prepareOlliAccountAuthInputs();\n"
          if index.count(prepare_call) != 1:
              raise SystemExit(f'legacy prepare auth call count={index.count(prepare_call)}')
          index = index.replace(prepare_call, '', 1)
          index_path.write_text(index, encoding='utf-8')
          PY

          node --check olli-auth-entry-ui.js
          git diff --check
          ! grep -Fq "previousShowOlliLoginEntry" index.html
          ! grep -Fq "previousShowOlliOwnerLogin" index.html
          ! grep -Fq "previousShowOlliAccountCreate" index.html
          grep -Fq "function resetOlliAccountAuthInputs" olli-auth-entry-ui.js
          grep -Fq "resetOlliAccountAuthInputs('all')" olli-auth-entry-ui.js
          grep -Fq "resetOlliAccountAuthInputs('login')" olli-auth-entry-ui.js
          grep -Fq "resetOlliAccountAuthInputs('create')" olli-auth-entry-ui.js

      - name: Commit changes and remove one-time workflow
        shell: bash
        run: |
          set -euo pipefail
          git rm -f .github/workflows/refactor-auth-wrapper-once.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add olli-auth-entry-ui.js index.html
          git diff --cached --check
          git commit -m 'refactor: move auth reset wrappers into source owner'
          git push origin HEAD:refactor/source-owned-no-overrides-20260912
