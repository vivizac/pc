name: Add temporary timetable sync debug logs

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/add-timetable-sync-debug.yml'

permissions:
  contents: write

jobs:
  patch:
    if: github.event.head_commit.message == 'chore: add temporary timetable sync debug patch workflow'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Add source-specific timetable sync diagnostics
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('pc-timetable.js')
          text = path.read_text(encoding='utf-8')

          replacements = [
              (
                  "  const LIVE_SYNC_INTERVAL_MS = 3000;\n",
                  "  const LIVE_SYNC_INTERVAL_MS = 3000;\n\n"
                  "  function logScheduleSyncDebug(source, stage, details) {\n"
                  "    try {\n"
                  "      console.info(`[OLLI SYNC][${source}] ${stage}`, details || {});\n"
                  "    } catch (_) {}\n"
                  "  }\n"
              ),
              (
                  "  async function checkLiveScheduleSync(forceRefresh, realtimeContext) {\n",
                  "  async function checkLiveScheduleSync(forceRefresh, realtimeContext, debugSource) {\n"
              ),
              (
                  "      if (shouldRefresh && await refreshActiveSchedulePane({ isCurrent }) === false) return false;\n",
                  "      if (shouldRefresh) {\n"
                  "        if (debugSource) logScheduleSyncDebug(debugSource, '변경 감지 → 시간표 재조회', { previous, version, academyId, week, pane });\n"
                  "        if (await refreshActiveSchedulePane({ isCurrent }) === false) return false;\n"
                  "        if (debugSource) logScheduleSyncDebug(debugSource, '시간표 화면 반영 완료', { version, academyId, week, pane });\n"
                  "      }\n"
              ),
              (
                  "    global.setInterval(() => { checkLiveScheduleSync(false); }, LIVE_SYNC_INTERVAL_MS);\n",
                  "    global.setInterval(() => { checkLiveScheduleSync(false, null, 'POLLING'); }, LIVE_SYNC_INTERVAL_MS);\n"
              ),
              (
                  "    global.OlliRealtime.watchDomain('schedule', (context) => {\n      // Stage 2 covers the timetable. The attendance register keeps its existing polling.\n      if (!state.active || state.view !== 'schedule' || state.pane !== 'schedule') return false;\n      return checkLiveScheduleSync(true, context);\n    });\n",
                  "    global.OlliRealtime.watchDomain('schedule', (context) => {\n"
                  "      // Temporary production diagnostic: distinguish Realtime from the legacy 3-second poller.\n"
                  "      const realtimeStatus = typeof global.OlliRealtime?.getStatus === 'function' ? global.OlliRealtime.getStatus() : null;\n"
                  "      logScheduleSyncDebug('REALTIME', 'schedule 신호 수신', {\n"
                  "        connected: !!realtimeStatus?.connected,\n"
                  "        status: realtimeStatus?.status || '',\n"
                  "        lastSignalAt: realtimeStatus?.lastSignalAt || 0,\n"
                  "        academyId: currentSyncAcademyId()\n"
                  "      });\n"
                  "      // Stage 2 covers the timetable. The attendance register keeps its existing polling.\n"
                  "      if (!state.active || state.view !== 'schedule' || state.pane !== 'schedule') return false;\n"
                  "      return checkLiveScheduleSync(true, context, 'REALTIME');\n"
                  "    });\n"
              )
          ]

          for old, new in replacements:
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'Expected exactly one match, found {count}: {old[:90]!r}')
              text = text.replace(old, new, 1)

          path.write_text(text, encoding='utf-8')
          PY

          node --check pc-timetable.js
          node --test tests/schedule-realtime.test.cjs

      - name: Commit diagnostics
        shell: bash
        run: |
          if git diff --quiet -- pc-timetable.js; then
            echo 'No timetable debug changes to commit.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add pc-timetable.js
          git commit -m 'chore: add temporary timetable sync source logs'
          git push origin main
