name: Split shared login CSS
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/split-shared-login-css.yml'
jobs:
  split:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Extract canonical login CSS
        run: |
          python - <<'PY'
          from pathlib import Path
          import hashlib
          p=Path('index.html')
          text=p.read_text(encoding='utf-8')
          marker='.olliLoginScreen'
          pos=text.index(marker)
          s=text.rfind('<style',0,pos)
          if s < 0: raise SystemExit('login style start not found')
          open_end=text.index('>',s)+1
          close_start=text.index('</style>',pos)
          e=close_start+len('</style>')
          block=text[s:e]
          body=text[open_end:close_start]
          if len(block.encode()) != 1683: raise SystemExit(f'unexpected login style size {len(block.encode())}')
          Path('olli-login.css').write_text(body.strip()+'\n',encoding='utf-8')
          text=text[:s]+'<link rel="stylesheet" href="olli-login.css">'+text[e:]
          p.write_text(text,encoding='utf-8')
          guide_path=Path('OLLI_PC_MODULES.md')
          guide=guide_path.read_text(encoding='utf-8')
          guide=guide.replace('| 로그인 진입 화면·계정/학원 연결 화면 전환 | `olli-auth-entry-ui.js` | 현재 공통 스타일 |','| 로그인 진입 화면·계정/학원 연결 화면 전환 | `olli-auth-entry-ui.js` | `olli-login.css` |',1)
          guide=guide.replace('- `olli-login-ui.js`: PC·폰 공통 로그인 화면 DOM. PC 기준 로그인 화면을 공통 컴포넌트로 사용한다.','- `olli-login-ui.js`: PC·폰 공통 로그인 화면 DOM. PC 기준 로그인 화면을 공통 컴포넌트로 사용한다.\n- `olli-login.css`: PC·폰 공통 로그인 화면 스타일. 두 플랫폼에서 동일 파일을 유지한다.',1)
          guide_path.write_text(guide,encoding='utf-8')
          updated=p.read_text(encoding='utf-8')
          if updated.count('<link rel="stylesheet" href="olli-login.css">') != 1: raise SystemExit('login css loader invalid')
          if marker in updated: raise SystemExit('inline login css remained')
          print('login_css_bytes',Path('olli-login.css').stat().st_size)
          print('login_css_md5',hashlib.md5(Path('olli-login.css').read_bytes()).hexdigest())
          print('index_bytes',len(updated.encode()))
          PY
      - name: Commit shared login CSS
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add index.html OLLI_PC_MODULES.md olli-login.css
          git commit -m "refactor: PC 로그인 CSS를 폰과 공통 모듈로 분리" || exit 0
          git push
