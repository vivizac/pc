name: Temporary attendance blank class cleanup

on:
  push:
    branches:
      - fix/pc-attendance-screen-redesign-20260914

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/pc-attendance-screen-redesign-20260914
      - name: Patch original source
        run: python .github/tmp/fix_attendance_blank_class_cleanup.py
      - name: Verify
        run: |
          node --check pc-timetable-attendance-register.js
          grep -q "remove('attendanceBlankMark', 'attendanceLinkedMark'" pc-timetable-attendance-register.js
          git diff --check
      - name: Commit source change
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm -f .github/workflows/tmp-fix-attendance-blank-class-cleanup.yml .github/tmp/fix_attendance_blank_class_cleanup.py
          git add pc-timetable-attendance-register.js
          git commit -m "fix: clean attendance blank status class"
          git push origin HEAD:fix/pc-attendance-screen-redesign-20260914
