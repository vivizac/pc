name: Validate timetable read and guest waitlist Agent

on:
  pull_request:
    paths:
      - 'packages/common/olli-command-router-common.js'
      - 'apps/mobile/api/_lib/olli-agent/waitlist-guest-privacy.cjs'
      - 'apps/mobile/api/_lib/olli-agent/runtime.cjs'
      - 'apps/mobile/api/_lib/olli-agent/tools/waitlist-add-prepare-tools.cjs'
      - 'apps/mobile/api/_lib/olli-agent/tools/waitlist-update-prepare-tools.cjs'
      - 'apps/mobile/api/_lib/olli-agent/tools/waitlist-cancel-prepare-tools.cjs'
      - 'apps/mobile/api/_lib/olli-agent/tools/timetable-read-tools.cjs'
      - 'apps/mobile/api/_lib/olli-agent/tools/schedule-tools.cjs'
      - 'apps/mobile/api/_lib/olli-agent/tools/attendance-tools.cjs'
      - 'apps/mobile/api/_lib/olli-agent/tools/pickup-tools.cjs'
      - 'apps/mobile/api/olli-agent.js'
      - 'apps/pc/pc-team-talk.js'
      - 'apps/mobile/olli-talk-beta.js'
      - 'apps/mobile/tests/olli-agent-guest-waitlist-contract.test.cjs'
      - 'apps/mobile/tests/olli-agent-timetable-read-production-contract.test.cjs'
      - 'apps/pc/tests/team-talk-timetable-read-agent-bridge.test.cjs'
      - 'apps/mobile/tests/team-talk-timetable-read-agent-bridge.test.cjs'
      - '.github/workflows/validate-timetable-read-guest-waitlist-agent.yml'

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Check syntax
        run: |
          node --check packages/common/olli-command-router-common.js
          node --check apps/mobile/api/_lib/olli-agent/waitlist-guest-privacy.cjs
          node --check apps/mobile/api/_lib/olli-agent/runtime.cjs
          node --check apps/mobile/api/_lib/olli-agent/tools/waitlist-add-prepare-tools.cjs
          node --check apps/mobile/api/_lib/olli-agent/tools/waitlist-update-prepare-tools.cjs
          node --check apps/mobile/api/_lib/olli-agent/tools/waitlist-cancel-prepare-tools.cjs
          node --check apps/mobile/api/_lib/olli-agent/tools/timetable-read-tools.cjs
          node --check apps/mobile/api/_lib/olli-agent/tools/schedule-tools.cjs
          node --check apps/mobile/api/_lib/olli-agent/tools/attendance-tools.cjs
          node --check apps/mobile/api/_lib/olli-agent/tools/pickup-tools.cjs
          node --check apps/mobile/api/olli-agent.js
          node --check apps/pc/pc-team-talk.js
          node --check apps/mobile/olli-talk-beta.js
      - name: Validate guest waitlist
        working-directory: apps/mobile
        run: |
          node --test tests/olli-agent-guest-waitlist-contract.test.cjs
          node --test tests/olli-agent-waitlist-add-prepare-tool.test.cjs
          node --test tests/olli-agent-waitlist-update-prepare-tool.test.cjs
      - name: Validate timetable read server
        working-directory: apps/mobile
        run: node --test tests/olli-agent-timetable-read-production-contract.test.cjs
      - name: Validate timetable read PC bridge
        working-directory: apps/pc
        run: node --test tests/team-talk-timetable-read-agent-bridge.test.cjs
      - name: Validate timetable read Mobile bridge
        working-directory: apps/mobile
        run: node --test tests/team-talk-timetable-read-agent-bridge.test.cjs
