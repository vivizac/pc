name: Patch iPad attendance horizontal scroll
# retry after EOF formatting fix

on:
  push:
    branches:
      - fix/ipad-attendance-horizontal-scroll-20260915
    paths:
      - '.github/workflows/patch-ipad-attendance-horizontal-scroll.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply focused iPad attendance CSS patch
        run: python3 .github/tmp/patch_ipad_attendance_horizontal_scroll.py
      - name: Validate intended CSS structure
        run: |
          python3 - <<'PY'
          from pathlib import Path
          css = Path('pc-timetable.css').read_text(encoding='utf-8')
          assert '/* iPad 출석부: 고정 학생정보 3열 + 날짜 가로 스크롤 */' in css
          assert '@media (min-width:700px) and (max-width:1400px) and (hover:none) and (pointer:coarse)' in css
          assert 'width: 1500px !important;' in css
          assert 'left: 64px;' in css
          assert 'left: 115px;' in css
          assert 'overflow-x: auto !important;' in css
          PY
      - name: Clean temporary patch files and commit
        run: |
          rm -f .github/tmp/patch_ipad_attendance_horizontal_scroll.py
          rm -f .github/workflows/patch-ipad-attendance-horizontal-scroll.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "fix: add iPad attendance horizontal scrolling with sticky roster columns"
          git push origin HEAD:${GITHUB_REF_NAME}
