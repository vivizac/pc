name: Audit elementary archive and scene card
on:
  push:
    paths:
      - '.github/workflows/audit-elementary-archive-scene-card.yml'
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Audit archive storage hooks
        run: |
          set -e
          for term in student_note_archive student_note_archives saveStudentNoteArchiveToSupabase MEMO_FEEDBACK_ARCHIVE_PREFIX ELEMENTARY_RECORDS_PREFIX memoFeedbackArchive memoRecordsDropup viewingArchivedElementaryRecord archiveCurrentElementaryMemoRecord addMemoFeedbackArchiveItem loadMemoFeedbackArchiveItemsFromSupabase; do
            echo "===== $term ====="
            grep -RInF --exclude='audit-elementary-archive-scene-card.yml' --exclude-dir='.git' "$term" . || true
          done
