name: Student schedule runtime regression final once

on:
  push:
    branches:
      - refactor/source-owned-no-overrides-20260912
    paths:
      - .github/workflows/student-schedule-runtime-regression-final-once.yml

permissions:
  contents: write

jobs:
  regression:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refactor/source-owned-no-overrides-20260912
          fetch-depth: 0

      - name: Static regression gate
        shell: bash
        run: |
          node --check olli-record-sort-student-ui.js
          node --check olli-record-memo-storage.js
          node --check pc-student-info-card-runtime.js
          node --check pc-student-class-routing.js
          node --check pc-timetable.js
          git diff --check
          python - <<'PY'
          from pathlib import Path
          import re
          files=[p for p in Path('.').rglob('*') if p.is_file() and p.suffix.lower() in {'.js','.html'} and '.git' not in p.parts]
          expected={
            'olliPrepareStudentAddExtra':'olli-record-sort-student-ui.js',
            'olliGetStudentAddExtra':'olli-record-sort-student-ui.js',
            'olliPrepareInfoExtra':'olli-record-sort-student-ui.js',
            'olliGetInfoExtra':'olli-record-sort-student-ui.js',
            'olliGetStudentAddSchedulePairs':'pc-student-info-card-runtime.js',
            'olliGetInfoSchedulePairs':'pc-student-info-card-runtime.js',
          }
          for name,owner in expected.items():
            locs=[]
            pat=re.compile(rf'(?:window|global)\.{re.escape(name)}\s*=(?!=)')
            for p in files:
              for i,line in enumerate(p.read_text(errors='ignore').splitlines(),1):
                if pat.search(line): locs.append(f'{p}:{i}')
            if len(locs)!=1 or not locs[0].startswith(owner+':'):
              raise SystemExit(f'owner mismatch {name}: {locs}')
          memo=Path('olli-record-memo-storage.js').read_text()
          card=Path('pc-student-info-card-runtime.js').read_text()
          p=memo.index('const savedStudent = await ensureStudentSavedToSupabase(newStudent);')
          c=memo.index("if (registrationRouting?.handled === true && typeof window.olliCommitStudentRegistrationRouting === 'function')",p)
          f=memo.index("else if (typeof window.saveOlliStudentScheduleFromInfo === 'function')",c)
          r=memo.index("if (registrationRouting?.handled === true && typeof window.olliReleaseStudentRegistrationRouting === 'function')",f)
          if not p<c<f<r: raise SystemExit('new student save order changed')
          ep=card.index('const savedStudent = await global.ensureStudentSavedToSupabase(profile);')
          es=card.index('await setAuthoritativeSchedule(savedStudent.id, pairs);',ep)
          if not ep<es: raise SystemExit('existing student save order changed')
          save_block=card[card.index('async function saveStudentInfoCard'):card.index('function isStudentInfoEditEvent')]
          if "className: ''" in save_block: raise SystemExit('existing save clears className')
          print('STATIC_REGRESSION_PASS')
          PY

      - name: Build isolated browser test page
        shell: bash
        run: |
          cat > /tmp/runtime-regression.js <<'JSEOF'
          (function(){
          'use strict';
          const R={checks:[],errors:[]};
          const sleep=(ms)=>new Promise(r=>setTimeout(r,ms));
          const check=(ok,msg,detail)=>{if(!ok)throw new Error(msg+(detail?` :: ${JSON.stringify(detail)}`:''));R.checks.push(msg);};
          const value=(id,v)=>{const el=document.getElementById(id);check(!!el,`DOM #${id}`);el.value=String(v);el.dispatchEvent(new Event('input',{bubbles:true}));};
          async function waitFor(fn,label){for(let i=0;i<200;i++){try{if(fn())return;}catch(_){}await sleep(50);}throw new Error(`대기 실패: ${label}`);}
          function finish(ok){const pre=document.createElement('pre');pre.id='runtimeRegressionResult';pre.textContent=`${ok?'REGRESSION_PASS':'REGRESSION_FAIL'}\n${JSON.stringify(R,null,2)}`;document.body.appendChild(pre);}
          async function loadScript(src){if(Array.from(document.scripts).some(s=>(s.getAttribute('src')||'').split('?')[0].endsWith(src)))return;await new Promise((res,rej)=>{const s=document.createElement('script');s.src=src;s.onload=res;s.onerror=()=>rej(new Error(`load fail ${src}`));document.head.appendChild(s);});}
          async function core(){
            await waitFor(()=>typeof window.confirmStudent==='function'&&typeof window.olliPrepareStudentAddExtra==='function','canonical student functions');
            if(typeof window.olliPcAuthoritativeScheduleAfterPrepareStudentAdd!=='function')await loadScript('pc-student-info-card-runtime.js');
            if(typeof window.olliPcClassRoutingAfterPrepareStudentAdd!=='function')await loadScript('pc-student-class-routing.js');
            await waitFor(()=>typeof window.olliGetStudentAddSchedulePairs==='function'&&typeof window.saveOlliPcStudentInfoCard==='function'&&typeof window.olliPrepareStudentRegistrationRouting==='function','PC schedule hooks');
          }
          function ensurePanel(){
            let shell=document.getElementById('olliPcShell');
            if(!shell){shell=document.createElement('div');shell.id='olliPcShell';document.body.appendChild(shell);}
            shell.dataset.pcSection='attendance';
            let panel=document.getElementById('pcAttendanceDetailPanel');
            if(!panel){panel=document.createElement('div');panel.id='pcAttendanceDetailPanel';shell.appendChild(panel);}
            return panel;
          }
          async function testNewModalOwnership(){
            if(typeof window.olliPatchStudentModalMarkup==='function')window.olliPatchStudentModalMarkup();
            ['studentLessonTimeToggleRow','elementaryStudentLessonTimeToggleRow'].forEach(id=>check(!!document.getElementById(id),`신규학생 시간 UI ${id}`));
            window.olliPrepareStudentAddExtra('elementary');
            window.toggleStudentModalDay('월');
            window.toggleStudentModalTime('1시');
            const pairs=window.olliGetStudentAddSchedulePairs();
            check(pairs.some(p=>p.weekday===1&&p.time_slot===1),'신규 authoritative 시간 상태',pairs);
            const extra=window.olliGetStudentAddExtra('elementary');
            check(extra.lesson_day===''&&extra.lesson_time===''&&extra.class_time==='','class-routing 최종값이 legacy 시간을 비움',extra);
          }
          async function selectDivision(type){
            if(typeof window.pcSetStudentAddDivision==='function') window.pcSetStudentAddDivision(type);
            else {
              try{(0,eval)(`currentRecordView=${JSON.stringify(type)};currentObservationView=${JSON.stringify(type)};`);}catch(_){window.currentRecordView=type;window.currentObservationView=type;}
              window.olliPrepareStudentAddExtra(type);
            }
            await sleep(30);
          }
          async function testNew(type,commitFails){
            await selectDivision(type);
            window.openStudentModal();
            await sleep(80);
            value('studentNameInput',type==='kinder'?'회귀유치':'회귀초등');
            value('studentYearBadge',2026);value('studentMonthInput',9);value('studentDayInput',type==='kinder'?15:14);
            if(type==='kinder'){value('studentKindergartenInput','테스트유치원');value('studentAgeInput',6);}else{value('studentSchoolInput','테스트초');value('studentGradeInput',1);}
            const C={profile:0,commit:0,release:0,fallback:0,saved:null,alerts:[]};
            window.getStudentsByType=()=>[];
            window.ensureStudentSavedToSupabase=async p=>{C.profile++;C.saved=JSON.parse(JSON.stringify(p));return Object.assign({},p,{id:`new-${type}`});};
            window.loadRecords=async()=>{};window.showPushToast=()=>{};window.closeStudentModal=()=>{};
            const oldAlert=window.alert;window.alert=m=>C.alerts.push(String(m));
            const oldPrepare=window.olliPrepareStudentRegistrationRouting;
            const oldCommit=window.olliCommitStudentRegistrationRouting;
            const oldRelease=window.olliReleaseStudentRegistrationRouting;
            const oldFallback=window.saveOlliStudentScheduleFromInfo;
            window.olliPrepareStudentRegistrationRouting=async()=>({handled:true,effectiveDate:'2026-09-13',pairs:[]});
            window.olliCommitStudentRegistrationRouting=async()=>{C.commit++;if(commitFails)throw new Error('mock class save failure');};
            window.olliReleaseStudentRegistrationRouting=()=>{C.release++;};
            window.saveOlliStudentScheduleFromInfo=async()=>{C.fallback++;};
            await window.confirmStudent();
            window.olliPrepareStudentRegistrationRouting=oldPrepare;window.olliCommitStudentRegistrationRouting=oldCommit;window.olliReleaseStudentRegistrationRouting=oldRelease;window.saveOlliStudentScheduleFromInfo=oldFallback;window.alert=oldAlert;
            check(C.profile===1,`${type} 신규 프로필 1회`,C);
            check(C.commit===1&&C.release===1&&C.fallback===0,`${type} 신규 routing 단일경로`,C);
            check(C.saved&&C.saved.type===type,`${type} 신규 division`,C.saved);
            check(!C.saved.lesson_day&&!C.saved.lesson_time&&!C.saved.class_time,`${type} 신규 legacy 시간 공란`,C.saved);
            if(commitFails) check(C.alerts.some(x=>x.includes('학생은 등록되었지만 수업 클래스 저장에 실패')),`${type} 시간표 실패시 학생 보존 안내`,C.alerts);
            else check(C.alerts.length===0,`${type} 정상 등록 경고 없음`,C.alerts);
          }
          async function testRealClassCommit(){
            localStorage.setItem('olli_current_academy_id','mock-academy');localStorage.setItem('olli_account_session_token_v1','mock-session');
            const calls=[];
            const oldSupabase=window.supabase,oldLoad=window.loadStudentsFromSupabase,oldAttendance=window.OlliPcAttendance,oldRefresh=window.olliTtRefreshSchedule,oldToast=window.showPushToast;
            window.supabase=async(method,path,payload)=>{calls.push({method,path,payload});return {ok:true};};
            window.loadStudentsFromSupabase=async()=>{};window.OlliPcAttendance={renderList(){},unmountEditor(){}};window.olliTtRefreshSchedule=async()=>{};window.showPushToast=()=>{};
            await window.olliCommitStudentRegistrationRouting({id:'route-1'},{handled:true,effectiveDate:'2026-09-13',pairs:[{weekday:1,time_slot:2,class_group:'A'}]});
            const rpc=calls.find(c=>c.path==='rpc/olli_schedule_set_student_weekly_schedule');
            check(!!rpc,'class-routing weekly RPC');
            check(rpc.payload.p_student_id==='route-1'&&rpc.payload.p_effective_date==='2026-09-13','class-routing RPC id/date',rpc.payload);
            check(rpc.payload.p_pairs.length===1&&rpc.payload.p_pairs[0].weekday===1&&rpc.payload.p_pairs[0].time_slot===2,'class-routing RPC pairs',rpc.payload);
            window.supabase=oldSupabase;window.loadStudentsFromSupabase=oldLoad;window.OlliPcAttendance=oldAttendance;window.olliTtRefreshSchedule=oldRefresh;window.showPushToast=oldToast;
          }
          async function testExisting(type,changed){
            ensurePanel().innerHTML='';
            const kinder=type==='kinder';
            const s={id:`ex-${type}-${changed}`,type,name:kinder?'유치기존':'초등기존',year:2026,month:'9',day:'1',enrolled_at:'2026-09-01',kindergarten:kinder?'기존유치원':'',age:kinder?'6':'8',school:kinder?'':'기존초',grade:kinder?'':'1',group:kinder?'':'1',personality:'테스트',teacher:'기존T',homeroom_teacher:'기존T',className:'LEGACY-KEEP',lesson_day:kinder?'목':'월',lesson_time:kinder?'목 4시':'월 1시',class_time:kinder?'목 4시':'월 1시',status:'active'};
            const base=kinder?{weekday:4,time_slot:4,class_group:'A',teacher_name:'기존T'}:{weekday:1,time_slot:1,class_group:'A',teacher_name:'기존T'};
            const order=[],rpc=[],profiles=[],alerts=[];
            const oldAlert=window.alert;window.alert=m=>alerts.push(String(m));
            window.findStudentById=id=>id===s.id?s:null;window.getStudentsByType=()=>[s];window.loadStudentsFromSupabase=async()=>{};window.pcSelectAttendanceStudent=async()=>{};window.pcOpenSection=async()=>{};window.OlliPcAttendance={renderList(){},unmountEditor(){}};window.showPushToast=()=>{};
            window.supabase=async(method,path,payload)=>{if(path==='rpc/olli_schedule_student_enrollments')return {enrollments:[base],pickups:[]};if(path==='rpc/olli_schedule_class_teacher_context')return {assignments:[]};if(path==='rpc/olli_schedule_set_student_weekly_schedule'){order.push('schedule');rpc.push(payload);return {ok:true};}return {ok:true};};
            window.ensureStudentSavedToSupabase=async p=>{order.push('profile');profiles.push(JSON.parse(JSON.stringify(p)));return Object.assign({},p,{id:s.id});};
            await window.openOlliPcStudentInfoCard(s.id);await sleep(50);
            check(!!document.querySelector('.pcStudentInfoCard'),`${type} 기존 카드 렌더`);
            const row=kinder?'kinderLessonTimeToggleRow':'elementaryLessonTimeToggleRow';
            check(!!document.getElementById(row),`${type} 기존 시간 UI ${row}`);
            if(changed){if(kinder)window.toggleKinderInfoTime('5시');else window.toggleElementaryInfoTime('2시');}
            await window.saveOlliPcStudentInfoCard();
            window.alert=oldAlert;
            check(profiles.length===1,`${type} 기존 프로필 1회`,profiles);
            check(profiles[0].className==='LEGACY-KEEP',`${type} className 보존`,profiles[0]);
            check(order[0]==='profile',`${type} profile 먼저`,order);
            if(changed) check(rpc.length===1&&order.join('>')==='profile>schedule',`${type} 변경시 profile→schedule`,order);
            else check(rpc.length===0&&order.join('>')==='profile',`${type} 미변경시 schedule 미호출`,order);
            check(alerts.length===0,`${type} 기존 저장 경고 없음`,alerts);
          }
          async function run(){
            await core();
            await testNewModalOwnership();
            await testNew('elementary',false);
            await testNew('kinder',false);
            await testNew('elementary',true);
            await testRealClassCommit();
            await testExisting('elementary',true);
            await testExisting('elementary',false);
            await testExisting('kinder',true);
            await testExisting('kinder',false);
            finish(true);
          }
          const start=()=>run().catch(e=>{R.errors.push(e.stack||e.message||String(e));finish(false);});
          if(document.readyState==='loading')document.addEventListener('DOMContentLoaded',()=>setTimeout(start,400),{once:true});else setTimeout(start,400);
          })();
          JSEOF
          cp /tmp/runtime-regression.js runtime-regression.js
          python - <<'PY'
          from pathlib import Path
          src=Path('index.html').read_text()
          marker='</body>'
          if marker not in src: raise SystemExit('body end missing')
          Path('regression-runtime.html').write_text(src.replace(marker,'\n<script src="runtime-regression.js"></script>\n'+marker,1))
          PY

      - name: Browser runtime regression with mocked writes
        shell: bash
        run: |
          CHROME="$(command -v google-chrome-stable || command -v google-chrome || command -v chromium || true)"
          test -n "$CHROME"
          python3 -m http.server 8765 >/tmp/olli-regression-server.log 2>&1 &
          SERVER_PID=$!
          trap 'kill $SERVER_PID 2>/dev/null || true' EXIT
          sleep 1
          "$CHROME" --headless=new --no-sandbox --disable-gpu --disable-dev-shm-usage --user-data-dir=/tmp/olli-regression-profile --virtual-time-budget=45000 --dump-dom http://127.0.0.1:8765/regression-runtime.html >/tmp/olli-regression-dom.txt 2>/tmp/olli-regression-chrome.err || true
          echo '--- regression result ---'
          grep -n -A200 -B2 'REGRESSION_' /tmp/olli-regression-dom.txt || true
          if ! grep -q 'REGRESSION_PASS' /tmp/olli-regression-dom.txt; then
            echo 'Runtime regression failed'
            tail -80 /tmp/olli-regression-chrome.err || true
            exit 1
          fi

      - name: Cleanup temporary workflow
        if: always()
        shell: bash
        run: |
          rm -f runtime-regression.js regression-runtime.html
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          rm -f .github/workflows/student-schedule-runtime-regression-final-once.yml
          git add -A
          git commit -m "chore: remove final student schedule regression workflow" || true
          git push origin HEAD:refactor/source-owned-no-overrides-20260912
