      - 'tests/consultation-booking-stage1*'
      - '.github/workflows/validate-consultation-booking-stage1.yml'
  workflow_dispatch:

permissions:
  contents: read
jobs:
  contract:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: booking-stage1-local-only
          POSTGRES_DB: booking_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d booking_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 15
    env:
      PGHOST: localhost
      PGPORT: '5432'
      PGUSER: postgres
      PGPASSWORD: booking-stage1-local-only
      PGDATABASE: booking_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Test slot policy and schema contract
        run: node --test tests/consultation-booking-stage1.test.cjs
      - name: Install PostgreSQL client
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq postgresql-client
      - name: Bootstrap isolated Postgres
        run: psql -v ON_ERROR_STOP=1 -f tests/consultation-booking-stage1.bootstrap.sql
      - name: Apply migration to isolated Postgres (never production)
        run: psql -v ON_ERROR_STOP=1 -f supabase/migrations/20261025150000_olli_booking_core_stage1.sql
      - name: Integration tests — tenant safety, schedules, overlap, retry
        run: psql -v ON_ERROR_STOP=1 -f tests/consultation-booking-stage1.integration.sql
      - name: Apply stage 2 to isolated Postgres
        run: psql -v ON_ERROR_STOP=1 -f supabase/migrations/20261025183000_olli_booking_parent_stage2.sql
      - name: Test guardian API and schema contract
        run: node --test tests/consultation-booking-stage2.test.cjs
      - name: Test guardian scoped mutations and revocation
        run: psql -v ON_ERROR_STOP=1 -f tests/consultation-booking-stage2.integration.sql
      - name: Test true concurrent booking collision
        run: bash tests/consultation-booking-stage2.concurrent.sh
      - name: Apply staff management migration in isolated PostgreSQL
        run: psql -v ON_ERROR_STOP=1 -f supabase/migrations/20261026103000_olli_booking_staff_stage3.sql
      - name: Staff operations and permission integration
        run: psql -v ON_ERROR_STOP=1 -f tests/consultation-booking-stage3.integration.sql
      - name: Apply and validate manual appointment RPC in isolated PostgreSQL
        run: |
          psql -v ON_ERROR_STOP=1 -f supabase/migrations/20261102152500_olli_booking_staff_manual_create.sql
          psql -v ON_ERROR_STOP=1 -f supabase/migrations/20261102174500_olli_booking_owner_manual_slots_search.sql
          psql -v ON_ERROR_STOP=1 -f tests/consultation-booking-manual-create.integration.sql
          node --test tests/consultation-booking-manual-create.test.cjs
      - name: Apply owner-only evening appointment hours in isolated PostgreSQL
        run: |
          psql -v ON_ERROR_STOP=1 -f supabase/migrations/20261102180000_olli_booking_owner_manual_evening_slots.sql
          psql -v ON_ERROR_STOP=1 -f tests/consultation-booking-manual-evening.integration.sql
          node --test tests/consultation-booking-manual-evening.test.cjs
      - name: Validate owner reschedule availability, retry and overlap in isolated PostgreSQL
        run: |
          psql -v ON_ERROR_STOP=1 -f supabase/migrations/20261103150000_olli_booking_staff_reschedule_owner_slots.sql
          psql -v ON_ERROR_STOP=1 -f tests/consultation-booking-reschedule.integration.sql
      - name: Apply and verify staff intake and trial migration in isolated PostgreSQL
        run: |
          psql -v ON_ERROR_STOP=1 -f supabase/migrations/20261106081947_olli_booking_staff_intake_trial.sql
          psql -v ON_ERROR_STOP=1 -f tests/consultation-booking-intake-trial.integration.sql
          node --test tests/consultation-booking-intake-trial.test.cjs
      - name: Validate scheduled consultation reminder in isolated PostgreSQL
        run: |
          psql -v ON_ERROR_STOP=1 -f tests/consultation-reminder.bootstrap.sql
          psql -v ON_ERROR_STOP=1 -f supabase/migrations/20261102194500_olli_consultation_daily_reminder.sql
          psql -v ON_ERROR_STOP=1 -f tests/consultation-reminder.integration.sql
          node --test tests/consultation-reminder-notification.test.cjs
      - name: Validate booking-trigger Realtime broadcast in isolated PostgreSQL
        run: |
          psql -v ON_ERROR_STOP=1 -f tests/consultation-booking-realtime.bootstrap.sql
          psql -v ON_ERROR_STOP=1 -f supabase/migrations/20261103125500_olli_booking_realtime_notification.sql
          psql -v ON_ERROR_STOP=1 -f tests/consultation-booking-realtime.integration.sql
      - name: PC and mobile booking UI checks
        run: |
          node --check packages/common/olli-booking-owner-ui.js
          node --check apps/pc/pc-shell.js
          node --test tests/consultation-booking-stage3-ui.test.cjs
          node --test tests/pc-consultation-calendar-cards.test.cjs
          node --test apps/mobile/tests/phone-booking-card-style.test.cjs
          node --test tests/mobile-booking-shortcut-local-first.test.cjs
          node --test tests/observation-roster-weekend-meta.test.cjs
      - name: Apply academy-wide booking link and verification migration (isolated DB)
        run: psql -v ON_ERROR_STOP=1 -f supabase/migrations/20261026140000_olli_booking_public_academy_stage4.sql
      - name: Verify name-and-guardian-phone-only matching and OTP safety
        run: psql -v ON_ERROR_STOP=1 -f tests/consultation-booking-stage4.integration.sql
      - name: Apply read-only existing booking lookup support (isolated DB)
        run: psql -v ON_ERROR_STOP=1 -f supabase/migrations/20261026173000_olli_booking_revisit_stage5.sql
      - name: Verify existing booking identity and security (isolated DB)
        run: psql -v ON_ERROR_STOP=1 -f tests/consultation-booking-stage5.integration.sql
      - name: Apply staged Sunday-first booking week migration (isolated CI database only)
        run: psql -v ON_ERROR_STOP=1 -f supabase/migrations/20261027081500_olli_booking_sunday_first_week_numbering.sql
      - name: Validate Sunday-first SQL schema in isolated CI database
        run: psql -v ON_ERROR_STOP=1 -f tests/consultation-booking-sunday-week.integration.sql
      - name: Verify combined PC consultation panel and copy button behavior
        run: node --test tests/consultation-copy-button-height.test.cjs tests/pc-consultation-tenure-badge.test.cjs tests/pc-consultation-existing-record-needed.test.cjs
      - name: Validate consultation records tabs
        run: |
          node --check apps/pc/consultation-survey-core.js
          node --check apps/pc/pc-shell.js
          node --test tests/consultation-booking-stage3-ui.test.cjs
      - name: Check academy-wide public booking API and screens
        run: |
          node --check packages/common/api/_lib/olli-booking-public-handler.cjs
          node --check packages/common/olli-booking-guardian.js
          node --check packages/common/olli-booking-owner-ui.js
          node --test tests/consultation-booking-stage4.test.cjs
          node --test tests/consultation-booking-stage4-info-diagnostics.test.cjs
          node --test tests/consultation-booking-sunday-week.test.cjs
          node --test apps/pc/tests/olli-guardian-month-slots.test.cjs
          node --test tests/consultation-manual-copy-booking-link.test.cjs

  guardian-browser:
    name: Mock-only guardian browser E2E (no live DB or SMS)
    # Playwright 1.56.1 Chromium is not supported on Ubuntu 26.04,
    # which ubuntu-latest may now resolve to. Keep browser QA enabled.
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Install isolated Playwright
        run: npm install --no-save --no-package-lock --prefix tests/consultation-messages playwright@1.56.1
      - name: Install headless Chromium
        run: tests/consultation-messages/node_modules/.bin/playwright install --with-deps chromium
      - name: Exercise PC and mobile width in headless browser with all API calls mocked
        run: NODE_PATH=$PWD/tests/consultation-messages/node_modules node --test tests/consultation-booking-browser.test.cjs
      - name: Verify PC consultation tabs physically occupy the top white bar
        run: NODE_PATH=$PWD/tests/consultation-messages/node_modules node --test tests/consultation-topbar-browser.test.cjs
      - name: Verify PC booking stats, toolbar and calendar at desktop viewports
        run: NODE_PATH=$PWD/tests/consultation-messages/node_modules node --test tests/pc-consultation-compact-toolbar-browser.test.cjs
      - name: Verify owner manual booking modal controls on PC and mobile
        run: NODE_PATH=$PWD/tests/consultation-messages/node_modules node --test tests/consultation-booking-modal-dismiss-browser.test.cjs
      - name: Verify new consultation and trial radio form on PC (mock browser)
        run: NODE_PATH=$PWD/tests/consultation-messages/node_modules node --test tests/consultation-booking-intake-trial-browser.test.cjs
      - name: Verify owner reschedule dialog, time lookup and mobile date width
        run: NODE_PATH=$PWD/tests/consultation-messages/node_modules node --test tests/consultation-booking-reschedule-browser.test.cjs
      - name: Verify mobile consultation header, pills and academy-style stat cards
        run: NODE_PATH=$PWD/tests/consultation-messages/node_modules node --test tests/mobile-consultation-layout-browser.test.cjs
      - name: Verify mobile local-first loading, realtime updates and tenant safety
        run: NODE_PATH=$PWD/tests/consultation-messages/node_modules node --test tests/mobile-consultation-local-realtime-browser.test.cjs
