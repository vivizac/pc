      - 'packages/common/api/_lib/olli-booking-handler.cjs'
      - 'supabase/migrations/*_olli_booking_parent_stage2.sql'
      - 'tests/consultation-booking-stage2*'
      - 'packages/common/*-runtime-manifest.json'
