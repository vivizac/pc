name: One-shot extract observation memo core

on:
  push:
    paths:
      - '.github/workflows/one-shot-extract-observation-memo-core.yml'

permissions:
  contents: write

jobs:
  extract:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Extract observation memo core
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          index = Path('index.html')
          text = index.read_text(encoding='utf-8')

          start_marker = '/* v-fix: 선생님/관리자 계정에서도 초등부 관찰노트 상단·하단 버튼 강제 복구 */'
          end_marker = 'const recordStatusSectionOpenState = {'

          start = text.find(start_marker)
          end = text.find(end_marker, start)
          if start < 0 or end < 0 or end <= start:
              raise SystemExit('Observation memo core extraction markers not found in expected order')

          chunk = text[start:end].rstrip() + '\n'
          required = [
              'function openStudentMemoPageById(studentId)',
              'async function saveCurrentMemo(options = {})',
              'async function requestElementaryFeedback()',
              'async function sendKinderRiskPush()'
          ]
          for item in required:
              if item not in chunk:
                  raise SystemExit('Required memo core function missing: ' + item)
          if end_marker in chunk:
              raise SystemExit('Attendance status code leaked into memo core extraction')

          replacement = "</script>\n<script src=\"observation-memo-core.js\"></script>\n<script>\n"
          text = text[:start] + replacement + text[end:]

          Path('observation-memo-core.js').write_text(chunk, encoding='utf-8')
          index.write_text(text, encoding='utf-8')
          PY

      - name: Verify extraction
        shell: bash
        run: |
          test -s observation-memo-core.js
          node --check observation-memo-core.js
          grep -q '<script src="observation-memo-core.js"></script>' index.html
          ! grep -q 'function openStudentMemoPageById(studentId)' index.html
          grep -q 'function openStudentMemoPageById(studentId)' observation-memo-core.js
          grep -q 'async function saveCurrentMemo(options = {})' observation-memo-core.js
          grep -q 'async function requestElementaryFeedback()' observation-memo-core.js
          grep -q 'const recordStatusSectionOpenState = {' index.html

      - name: Commit extraction
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html observation-memo-core.js
          git commit -m 'Extract observation memo core module'
          git push
