name: Sync settings account runtime common policy
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/sync-settings-account-runtime.yml'
permissions:
  contents: write
jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Align PC settings account runtime with phone shared policy
        run: |
          python - <<'PY'
          from pathlib import Path
          import re, subprocess

          path = Path('olli-settings-account-runtime.js')
          text = path.read_text(encoding='utf-8')
          if text.startswith('\n'):
            text = text[1:]

          manager_line = "  async function setManagerPermission(roleKey,value){const cached=settingsGetCachedState();const managerPermissions={...(cached.managerPermissions||{}),[roleKey]:!!value};settingsSaveCachePatch({managerPermissions});const academyId=settingsGetAcademyId();if(academyId&&isSupabaseConfigured()){const payload={};if(roleKey==='backup')payload.manager_can_backup=!!value;if(roleKey==='directorNote')payload.manager_can_director_note=!!value;if(Object.keys(payload).length){try{await supabase('PATCH',`academies?id=eq.${encodeURIComponent(academyId)}`,payload);if(olliSettingsState&&olliSettingsState.academy){if(Object.prototype.hasOwnProperty.call(payload,'manager_can_backup'))olliSettingsState.academy.manager_can_backup=!!payload.manager_can_backup;if(Object.prototype.hasOwnProperty.call(payload,'manager_can_director_note'))olliSettingsState.academy.manager_can_director_note=!!payload.manager_can_director_note;}}catch(err){console.warn('manager permission save failed:',err);alert('관리자 권한 저장 중 오류가 발생했습니다.\\n' + (err.message || err));}}}openSettingsDetail('roles');}\n"
          text, n1 = re.subn(r"(?m)^  async function setManagerPermission\(roleKey,value\)\{.*$", manager_line.rstrip('\n'), text, count=1)
          if n1 != 1:
            raise SystemExit(f'setManagerPermission replacement count: {n1}')

          roles_line = "  if(typeof settingsDetailData !== 'undefined' && settingsDetailData.roles){settingsDetailData.roles.html=function(){const backupOn=getManagerPermission('backup')||!!(olliSettingsState.academy&&olliSettingsState.academy.manager_can_backup);const noteOn=getManagerPermission('directorNote')||!!(olliSettingsState.academy&&olliSettingsState.academy.manager_can_director_note);return '<div class=\"settingsDetailIntro\"><div class=\"settingsDetailTitle\">관리자 기본 권한 위에<br>필요한 권한만 추가합니다.</div></div><div class=\"settingsRoleCard\"><div class=\"settingsRoleTop\"><div class=\"settingsRoleName\">원장</div><span class=\"settingsStatusBadge\">전체 권한</span></div><div class=\"settingsRoleList\"><div class=\"settingsRoleItem\">전체 설정, 선생님 관리, 학원 삭제/양도</div><div class=\"settingsRoleItem\">백업 / 내보내기 사용 가능</div><div class=\"settingsRoleItem\">위험신호 원장 확인 메모 작성</div></div></div><div class=\"settingsRoleCard\"><div class=\"settingsRoleTop\"><div class=\"settingsRoleName\">관리자 기본 권한</div><span class=\"settingsStatusBadge\">기본 권한</span></div><div class=\"settingsRoleList\"><div class=\"settingsRoleItem\">전체 위험신호 확인 가능</div><div class=\"settingsRoleItem\">학생 기록과 피드백 흐름 점검 가능</div><div class=\"settingsRoleItem\">선생님 기록 상태 확인 가능</div><div class=\"settingsRoleItem\">알림 설정 사용 가능</div><div class=\"settingsRoleItem\">학원 삭제, 원장 양도, 권한 부여는 제한</div></div></div><div class=\"settingsRoleCard\"><div class=\"settingsRoleTop\"><div class=\"settingsRoleName\">관리자 추가 권한 부여</div><span class=\"settingsStatusBadge\">선택 권한</span></div><div class=\"settingsPermissionRow\"><div><div class=\"settingsPermissionText\">백업 / 내보내기 사용 가능</div><div class=\"settingsPermissionDesc\">관리자에게 데이터 내보내기 권한을 추가로 부여합니다.</div></div><button class=\"settingsMiniSwitch '+(backupOn?'on':'')+'\" type=\"button\" onclick=\"toggleManagerPermission(\\'backup\\')\"></button></div><div class=\"settingsPermissionRow\"><div><div class=\"settingsPermissionText\">위험신호 원장 확인 메모 작성</div><div class=\"settingsPermissionDesc\">관리자가 위험신호 대응 메모를 남길 수 있게 추가로 부여합니다.</div></div><button class=\"settingsMiniSwitch '+(noteOn?'on':'')+'\" type=\"button\" onclick=\"toggleManagerPermission(\\'directorNote\\')\"></button></div></div><div class=\"settingsRoleCard\"><div class=\"settingsRoleTop\"><div class=\"settingsRoleName\">선생님</div><span class=\"settingsStatusBadge\">기록 권한</span></div><div class=\"settingsRoleList\"><div class=\"settingsRoleItem\">담당 학생 기록 작성</div><div class=\"settingsRoleItem\">피드백 작성과 성장 피드백 입력</div><div class=\"settingsRoleItem\">권한 변경과 데이터 내보내기는 제한</div></div></div>';};}\n"
          text, n2 = re.subn(r"(?m)^  if\(typeof settingsDetailData !== 'undefined' && settingsDetailData\.roles\)\{settingsDetailData\.roles\.html=function\(\)\{.*$", roles_line.rstrip('\n'), text, count=1)
          if n2 != 1:
            raise SystemExit(f'roles html replacement count: {n2}')

          path.write_text(text, encoding='utf-8')
          subprocess.run(['node','--check',str(path)], check=True)
          updated = path.read_text(encoding='utf-8')
          for token in ["roleKey==='directorNote'", 'manager_can_director_note', "getManagerPermission('directorNote')", '위험신호 원장 확인 메모 작성']:
            if token not in updated:
              raise SystemExit(f'missing shared policy token: {token}')
          print('pc_account_runtime_bytes', path.stat().st_size)
          PY
      - name: Commit shared settings account runtime
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add olli-settings-account-runtime.js
          git commit -m "refactor: 설정 계정 런타임을 폰 최신 공통 정책으로 통합" || exit 0
          git push
