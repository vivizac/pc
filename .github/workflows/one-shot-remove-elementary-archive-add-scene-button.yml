name: Remove elementary archive and expose scene cards
on:
  push:
    paths:
      - '.github/workflows/one-shot-remove-elementary-archive-add-scene-button.yml'
permissions:
  contents: write
jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply cleanup
        run: |
          python3 - <<'PY'
          from pathlib import Path

          def read(path): return Path(path).read_text(encoding='utf-8')
          def write(path, text): Path(path).write_text(text, encoding='utf-8')
          def replace_once(text, old, new, label):
              if text.count(old) != 1:
                  raise SystemExit(f'{label}: expected 1 match, got {text.count(old)}')
              return text.replace(old, new, 1)
          def cut_between(text, start, end, label, keep_end=True):
              a=text.find(start)
              if a < 0: raise SystemExit(f'{label}: start not found')
              b=text.find(end, a+len(start))
              if b < 0: raise SystemExit(f'{label}: end not found')
              return text[:a] + (text[b:] if keep_end else text[b+len(end):])

