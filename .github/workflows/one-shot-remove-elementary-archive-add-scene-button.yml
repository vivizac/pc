name: Remove elementary archive and expose scene cards
on:
  push:
    paths:
      - '.github/workflows/one-shot-remove-elementary-archive-add-scene-button.yml'
permissions:
  contents: write
jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply cleanup
        run: python3 .github/scripts/one_shot_archive_cleanup.py
      - name: Verify cleanup
        run: |
          set -e
          files=(
            olli-record-editor-core.js observation-memo-core.js elementary-analysis.js
            olli-data-foundation.js olli-data-attendance-feedback.js olli-storage-core.js
            olli-settings-import-test-tools.js observation-editor-ui.js kinder-feedback-ui.js
            olli-app-startup.js olli-feedback-runtime.js
          )
          for f in "${files[@]}"; do node --check "$f"; done
          grep -F 'openSceneCardsFromAnyPage()' kinder-feedback-ui.js
          grep -F '.kcfSceneCardBtn' kinder-feedback.css
          grep -F 'window.openSceneCardsFromAnyPage = openSceneCardsFromAnyPage;' olli-app-startup.js
          forbidden=(
            memoRecordsBtn elementaryRecordsDropup memoFeedbackArchive
            toggleElementaryRecordsMenu renderElementaryRecordsMenu closeElementaryRecordsMenu
            openArchivedElementaryMemoRecord openCurrentElementaryMemoRecord viewingArchivedElementaryRecord
            archiveCurrentElementaryMemoRecord saveStudentNoteArchiveToSupabase
            ELEMENTARY_RECORDS_PREFIX MEMO_FEEDBACK_ARCHIVE_PREFIX
            saveElementaryFeedbackDirectlyToArchive openElementaryArchiveAfterDirectSave
            addMemoFeedbackArchiveItem loadMemoFeedbackArchiveItemsFromSupabase
          )
          for term in "${forbidden[@]}"; do
            if grep -RIF --include='*.js' --include='*.css' --include='*.html' \
              --exclude='olli-record-room-core.js' \
              --exclude='one_shot_archive_cleanup.py' \
              --exclude-dir='.git' "$term" . >/dev/null; then
              echo "forbidden term remains: $term"
              grep -RInF --include='*.js' --include='*.css' --include='*.html' \
                --exclude='olli-record-room-core.js' \
                --exclude='one_shot_archive_cleanup.py' \
                --exclude-dir='.git' "$term" . || true
              exit 1
            fi
          done
          if grep -RIF --include='*.js' --include='*.html' \
            --exclude='olli-record-room-core.js' \
            --exclude='one_shot_archive_cleanup.py' \
            --exclude-dir='.git' 'student_note_archive' . >/dev/null; then
            echo 'student_note_archive runtime reference remains'
            grep -RInF --include='*.js' --include='*.html' \
              --exclude='olli-record-room-core.js' \
              --exclude='one_shot_archive_cleanup.py' \
              --exclude-dir='.git' 'student_note_archive' . || true
            exit 1
          fi
          echo 'SIZES'
          wc -c index.html olli-record-editor-core.js elementary-analysis.js observation-memo-core.js
      - name: Commit cleanup
        run: |
          set -e
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm -f olli-record-room-core.js \
            .github/workflows/audit-elementary-archive-scene-card.yml \
            .github/workflows/one-shot-remove-elementary-archive-add-scene-button.yml \
            .github/scripts/one_shot_archive_cleanup.py
          git add index.html OLLI_PC_MODULES.md \
            olli-record-editor-core.js observation-memo-core.js elementary-analysis.js \
            olli-data-foundation.js olli-data-attendance-feedback.js olli-storage-core.js \
            olli-settings-import-test-tools.js observation-editor-ui.js observation-editor.css \
            pc-attendance.css kinder-feedback-ui.js kinder-feedback.css olli-app-startup.js \
            olli-feedback-runtime.js
          git commit -m 'Remove elementary archive and expose scene cards'
          git push
