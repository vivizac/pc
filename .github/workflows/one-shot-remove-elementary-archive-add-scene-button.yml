          text=text.replace('- `observation-memo-core.js`: 학생 전환, 메모 자동저장, Supabase 동기화, 보관함, 피드백 생성 연결.','- `observation-memo-core.js`: 학생 전환, 메모 자동저장, Supabase 동기화, 피드백 생성 연결.')
          heading='## 관찰기록·피드백 모듈 경계\n'
          note='## 초등부 PC 보관함 정책\n\n- PC 초등부 관찰기록에서는 별도 피드백 보관함과 과거 관찰노트 보관 기능을 사용하지 않는다. 생성된 피드백은 서버 기록실/성향기록부에서 확인한다.\n- `student_note_archives` 저장 기능과 초등 보관함 버튼·드롭업·편집 UI는 PC 런타임에서 제거했다.\n- 유치부 1분 피드백의 `임시 보관함`은 현재 작성 흐름에 필요한 별도 기능이므로 유지한다.\n- 1분 피드백 상단의 `장면카드` 버튼은 기존 장면카드 모달을 검토하기 위한 진입점이다. 장면카드 유지 여부가 확정될 때까지 관련 장면카드 엔진은 삭제하지 않는다.\n\n'
          if note not in text:
              if heading not in text: raise SystemExit('doc observation heading not found')
              text=text.replace(heading,note+heading,1)
          write(p,text)
          PY

      - name: Verify cleanup
        run: |
          set -e
          for f in olli-record-editor-core.js observation-memo-core.js elementary-analysis.js olli-data-foundation.js olli-data-attendance-feedback.js olli-storage-core.js olli-settings-import-test-tools.js observation-editor-ui.js kinder-feedback-ui.js olli-app-startup.js; do node --check "$f"; done
          grep -F 'onclick=\\"openSceneCardsFromAnyPage()\\"' kinder-feedback-ui.js
          grep -F '.kcfSceneCardBtn' kinder-feedback.css
          grep -F 'window.openSceneCardsFromAnyPage = openSceneCardsFromAnyPage;' olli-app-startup.js
          test -f olli-record-room-core.js
          forbidden=(memoRecordsBtn elementaryRecordsDropup memoFeedbackArchive toggleElementaryRecordsMenu renderElementaryRecordsMenu closeElementaryRecordsMenu openArchivedElementaryMemoRecord openCurrentElementaryMemoRecord viewingArchivedElementaryRecord archiveCurrentElementaryMemoRecord saveStudentNoteArchiveToSupabase ELEMENTARY_RECORDS_PREFIX MEMO_FEEDBACK_ARCHIVE_PREFIX student_note_archive student_note_archives saveElementaryFeedbackDirectlyToArchive openElementaryArchiveAfterDirectSave addMemoFeedbackArchiveItem loadMemoFeedbackArchiveItemsFromSupabase)
          for term in "${forbidden[@]}"; do
            if grep -RIF --exclude='olli-record-room-core.js' --exclude='audit-elementary-archive-scene-card.yml' --exclude='one-shot-remove-elementary-archive-add-scene-button.yml' --exclude-dir='.git' "$term" . >/dev/null; then
              echo "forbidden term remains: $term"
              grep -RInF --exclude='olli-record-room-core.js' --exclude='audit-elementary-archive-scene-card.yml' --exclude='one-shot-remove-elementary-archive-add-scene-button.yml' --exclude-dir='.git' "$term" . || true
              exit 1
            fi
          done
          echo 'SIZES'
          wc -c index.html olli-record-editor-core.js elementary-analysis.js observation-memo-core.js

      - name: Commit cleanup
        run: |
          set -e
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm -f olli-record-room-core.js .github/workflows/audit-elementary-archive-scene-card.yml .github/workflows/one-shot-remove-elementary-archive-add-scene-button.yml
          git add index.html OLLI_PC_MODULES.md olli-record-editor-core.js observation-memo-core.js elementary-analysis.js olli-data-foundation.js olli-data-attendance-feedback.js olli-storage-core.js olli-settings-import-test-tools.js observation-editor-ui.js observation-editor.css pc-attendance.css kinder-feedback-ui.js kinder-feedback.css olli-app-startup.js
          git commit -m 'Remove elementary archive and expose scene cards'
          git push
