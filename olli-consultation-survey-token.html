<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#079eb3">
<meta name="robots" content="noindex,nofollow,noarchive">
<title>상담 전 설문</title>
<link href="https://cdn.jsdelivr.net/npm/pretendard@1.3.9/dist/web/static/pretendard.css" rel="stylesheet">
<style>
:root{--mint:#079eb3;--mint-dark:#087f91;--mint-soft:#e7f5f7;--page:#eef5f6;--text:#17191c;--muted:#747d83;--line:#dce6e8;--card:#fff}
*{box-sizing:border-box;margin:0;padding:0}
html,body{width:100%;min-width:0;min-height:100%;background:var(--page);color:var(--text)}
html{font-family:'Pretendard',-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;-webkit-text-size-adjust:100%}
body{min-height:100dvh;overflow-x:hidden;padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left)}
button,input{font:inherit}
.surveyHeader{background:#fff;border-bottom:1px solid #e6ecee}
.surveyHeaderInner{width:min(760px,calc(100% - 32px));margin:0 auto;padding:28px 0 25px}
.academyName{font-size:clamp(22px,4vw,31px);font-weight:900;letter-spacing:-.055em;line-height:1.25;color:#17191c;min-height:1.25em}
.brandLine{margin-top:8px;color:var(--mint);font-size:clamp(13px,2.2vw,17px);font-weight:850;letter-spacing:-.025em}
.surveyHero{background:var(--mint);color:#fff}
.surveyHeroInner{width:min(760px,calc(100% - 32px));margin:0 auto;padding:clamp(34px,6vw,56px) 0 clamp(38px,7vw,64px)}
.heroKicker{font-size:12.5px;font-weight:800;letter-spacing:-.015em;opacity:.84}
.title{margin-top:15px;font-size:clamp(38px,7vw,58px);font-weight:900;letter-spacing:-.065em;line-height:1.05}
.intro{max-width:650px;margin-top:20px;color:rgba(255,255,255,.9);font-size:clamp(14px,2.4vw,17px);line-height:1.72;font-weight:560;letter-spacing:-.02em}
.surveyWrap{width:min(760px,calc(100% - 32px));margin:0 auto;padding:clamp(24px,4vw,36px) 0 clamp(52px,8vw,82px)}
.card{width:100%;background:var(--card);border:1px solid var(--line);border-radius:28px;box-shadow:0 10px 28px rgba(33,66,73,.045)}
#formCard{background:transparent;border:0;border-radius:0;box-shadow:none}
.infoGrid{display:grid;grid-template-columns:minmax(0,1.25fr) minmax(0,.8fr) minmax(0,.9fr);gap:11px;padding:24px;background:#fff;border:1px solid var(--line);border-radius:26px;box-shadow:0 9px 25px rgba(33,66,73,.04)}
.infoGrid:before{content:'기본 정보';grid-column:1/-1;margin:0 0 2px 2px;color:var(--mint-dark);font-size:14px;font-weight:900;letter-spacing:-.02em}
.field{min-width:0}
.field label{display:block;margin:0 0 8px 3px;font-size:11.5px;font-weight:800;color:#838d93}
.textInput{width:100%;min-width:0;height:50px;border:1px solid #dbe3e5;border-radius:14px;background:#fbfdfd;padding:0 14px;font-size:15px;outline:none;color:#17191c;transition:border-color .16s ease,box-shadow .16s ease,background .16s ease}
.textInput::placeholder{color:#a6adb2}
.textInput:focus{border-color:#72cbd5;background:#fff;box-shadow:0 0 0 3px rgba(7,158,179,.09)}
.questions{margin-top:18px;display:grid;gap:12px}
.question{padding:19px 18px;border:1px solid var(--line);border-radius:22px;background:#fff;box-shadow:0 8px 22px rgba(33,66,73,.035)}
.questionText{font-size:14.5px;font-weight:800;line-height:1.55;letter-spacing:-.025em;color:#24282b}
.options{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;margin-top:14px}
.option{position:relative;min-width:0}
.option input{position:absolute;opacity:0;pointer-events:none}
.option span{width:100%;height:42px;min-width:0;padding:0 8px;border:1px solid #d8e2e4;border-radius:14px;background:#f9fbfb;color:#566067;font-size:13px;font-weight:760;display:flex;align-items:center;justify-content:center;cursor:pointer;white-space:nowrap;transition:background .16s ease,border-color .16s ease,color .16s ease,box-shadow .16s ease}
.option input:focus-visible+span{outline:2px solid var(--mint);outline-offset:2px}
.option input:checked+span{background:var(--mint);color:#fff;border-color:var(--mint);box-shadow:0 6px 14px rgba(7,158,179,.16)}
.consent{margin-top:18px;padding:17px 18px;border:1px solid var(--line);border-radius:20px;background:#fff;box-shadow:0 8px 22px rgba(33,66,73,.03);display:flex;align-items:flex-start;gap:11px;font-size:12.5px;line-height:1.55;color:#606a70;cursor:pointer}
.consent input{margin-top:2px;width:19px;height:19px;flex:0 0 auto;accent-color:var(--mint)}
.submitBtn{width:100%;height:56px;margin-top:14px;border:0;border-radius:18px;background:var(--mint);color:#fff;font-size:15px;font-weight:900;cursor:pointer;box-shadow:0 10px 20px rgba(7,158,179,.16)}
.submitBtn:disabled{opacity:.45;cursor:default;box-shadow:none}
.foot{margin-top:15px;text-align:center;font-size:11.5px;color:#90999e;line-height:1.55}
.complete{display:none;text-align:center;padding:70px 24px}
.complete.show{display:block}
.completeIcon{width:58px;height:58px;margin:0 auto 18px;border-radius:50%;background:var(--mint);color:#fff;display:grid;place-items:center;font-size:24px;font-weight:900}
.completeTitle{font-size:23px;font-weight:900;letter-spacing:-.05em}
.completeText{margin-top:10px;font-size:14px;line-height:1.65;color:#7d868b}
.errorCard{display:none;margin-bottom:14px;padding:13px 15px;border-radius:15px;background:#fff1f1;color:#b14444;font-size:13px;line-height:1.5}
.errorCard.show{display:block}
#loadingCard{overflow:hidden}
.loadingCard{padding:60px 24px;text-align:center;color:#7d878c;font-size:14px;line-height:1.6}
.hidden{display:none!important}
@media(max-width:760px){
  .surveyHeaderInner,.surveyHeroInner,.surveyWrap{width:min(100% - 28px,620px)}
  .surveyHeaderInner{padding:22px 0 20px}
  .academyName{font-size:24px}
  .brandLine{margin-top:6px;font-size:14px}
  .surveyHeroInner{padding:31px 0 37px}
  .heroKicker{font-size:11.5px}
  .title{margin-top:12px;font-size:40px}
  .intro{margin-top:16px;font-size:14px;line-height:1.68}
  .surveyWrap{padding-top:20px;padding-bottom:54px}
  .infoGrid{grid-template-columns:1fr;gap:13px;padding:20px 17px;border-radius:22px}
  .questions{gap:11px;margin-top:14px}
  .question{padding:17px 14px;border-radius:20px}
  .questionText{font-size:14px}
  .options{gap:6px;margin-top:12px}
  .option span{height:41px;font-size:12.5px;border-radius:13px}
  .consent{padding:15px 14px;border-radius:18px;font-size:12px}
  .submitBtn{height:54px;border-radius:16px}
  .card{border-radius:24px}
}
@media(max-width:360px){
  .surveyHeaderInner,.surveyHeroInner,.surveyWrap{width:calc(100% - 20px)}
  .academyName{font-size:21px}
  .title{font-size:36px}
  .options{gap:5px}
  .option span{font-size:12px;padding:0 4px}
}
</style>
</head>
<body>
<header class="surveyHeader">
  <div class="surveyHeaderInner">
    <div class="academyName" id="academyName"></div>
    <div class="brandLine">성향 상담 · 수업 관찰 설문</div>
  </div>
</header>
<section class="surveyHero">
  <div class="surveyHeroInner">
    <div class="heroKicker">아이를 더 잘 이해하기 위한 첫 번째 기록</div>
    <h1 class="title">상담 전 설문</h1>
    <p class="intro">가정에서 평소 보이는 아이의 모습을 편안하게 알려주세요. 설문 답변은 체험수업에서 아이를 관찰하고, 아이에게 맞는 상담 방향을 잡는 데 활용됩니다.</p>
  </div>
</section>
<main class="surveyWrap">
  <section class="card" id="loadingCard"><div class="loadingCard">학원 전용 설문 링크를 확인하고 있습니다.</div></section>
  <section class="card hidden" id="formCard">
    <div class="errorCard" id="errorCard" role="alert"></div>
    <form id="surveyForm">
      <div class="infoGrid">
        <div class="field"><label for="studentName">학생 이름</label><input class="textInput" id="studentName" maxlength="20" required autocomplete="name" placeholder="예: 김민지"></div>
        <div class="field"><label for="studentAge">나이 또는 학년</label><input class="textInput" id="studentAge" maxlength="12" required autocomplete="off" placeholder="예: 7세 / 초1"></div>
        <div class="field"><label for="phone4">학부모 연락처 뒤 4자리</label><input class="textInput" id="phone4" inputmode="numeric" pattern="[0-9]{4}" maxlength="4" required autocomplete="off" placeholder="1234"></div>
      </div>
      <div class="questions" id="questions"></div>
      <label class="consent"><input id="consent" type="checkbox" required><span>상담 및 수업 관찰을 위해 학생 이름, 나이/학년, 연락처 일부와 설문 응답을 수집·이용하는 데 동의합니다.</span></label>
      <button class="submitBtn" id="submitBtn" type="submit">설문 제출하기</button>
    </form>
    <div class="foot" id="footText">상담 자료는 상담과 수업 지도 목적으로만 사용합니다.</div>
  </section>
  <section class="card complete" id="completeCard" aria-live="polite">
    <div class="completeIcon">✓</div><div class="completeTitle">설문이 제출되었습니다.</div><div class="completeText">소중한 답변 감사합니다.<br>아이의 실제 수업 모습을 함께 관찰한 뒤 상담에서 자세히 안내드리겠습니다.</div>
  </section>
</main>
<script>
(function(){
'use strict';
const SUPABASE_URL='https://fvkxipjwgeyosgnfhdnx.supabase.co';
const SUPABASE_KEY='eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImZ2a3hpcGp3Z2V5b3NnbmZoZG54Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzU1MzAxMDUsImV4cCI6MjA5MTEwNjEwNX0.dqP0V2RIKBLWqXWfwJgCgufpO6gQ_lAZDQ_prOhlNI8';
const SURVEY_VERSION='SURVEY_2026_09';
const QUESTIONS=[
{id:'Q1',text:'아이는 집에서 만들기, 그리기 등의 미술활동을 자주 하나요?',mid:'가끔'},
{id:'Q2',text:'아이는 미술활동을 할 때 관심을 유지하며 오래 몰두하나요?',mid:'보통'},
{id:'Q3',text:'아이는 시작한 미술활동이나 학습활동 등을 끝까지 마무리하려고 하나요?',mid:'보통'},
{id:'Q4',text:'아이는 미술활동이 자신이 원하는 대로 되지 않아 속상해하거나 불편해한 적이 있나요?',mid:'가끔'},
{id:'Q5',text:'아이는 다른 아이의 그림을 따라 그리거나 부러워하는 모습을 보이나요?',mid:'가끔'},
{id:'Q6',text:'아이는 그리고 싶은 것이 있을 때 부모에게 자주 그려달라고 요청하나요?',mid:'가끔'},
{id:'Q7',text:'아이는 게임이나 경쟁 상황에서 졌을 때 속상함을 크게 보이는 편인가요?',mid:'보통'},
{id:'Q8',text:'아이는 새롭거나 어려운 일을 혼자 시도하기보다 부모에게 도움을 요청하는 편인가요?',mid:'보통'},
{id:'Q9',text:'아이는 색·모양·디자인의 차이에 관심을 보이며 자신의 선호를 분명히 표현하는 편인가요?',mid:'보통'},
{id:'Q10',text:'아이는 새로운 환경을 접했을 때 호기심이 많은 편인가요?',mid:'보통'},
{id:'Q11',text:'아이는 새로운 선생님이나 친구, 환경에 적응하는 데 시간이 걸리는 편인가요?',mid:'보통'},
{id:'Q12',text:'아이는 혼자 책을 보거나 부모에게 읽어달라고 요청하는 등 책을 자주 찾는 편인가요?',mid:'가끔'},
{id:'Q13',text:'아이는 책을 읽은 뒤 부모에게 그 책에 관해 이야기하거나 질문하는 편인가요?',mid:'가끔'},
{id:'Q14',text:'아이는 자신이 궁금한 점이나 생각·경험을 질문이나 이야기로 자주 표현하는 편인가요?',mid:'가끔'}];
function esc(v){return String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}
function surveyToken(){return String(new URLSearchParams(location.search).get('survey')||'').trim();}
function createId(){return crypto?.randomUUID?crypto.randomUUID():'survey_'+Date.now()+'_'+Math.random().toString(36).slice(2,10);}
function showError(message){const el=document.getElementById('errorCard');el.textContent=message||'';el.classList.toggle('show',!!message);if(message)el.scrollIntoView({behavior:'smooth',block:'center'});}
async function rpc(name,payload){const res=await fetch(`${SUPABASE_URL}/rest/v1/rpc/${name}`,{method:'POST',headers:{'Content-Type':'application/json','apikey':SUPABASE_KEY,'Authorization':`Bearer ${SUPABASE_KEY}`},body:JSON.stringify(payload||{})});const text=await res.text();let data=null;try{data=text?JSON.parse(text):null}catch(_){data=text}if(!res.ok){const detail=data&&typeof data==='object'?[data.message,data.details,data.hint,data.code].filter(Boolean).join(' / '):String(data||'');throw new Error(detail||`서버 요청 실패 (${res.status})`)}return data;}
function renderQuestions(){document.getElementById('questions').innerHTML=QUESTIONS.map((q,i)=>`<div class="question"><div class="questionText">${i+1}. ${esc(q.text)}</div><div class="options"><label class="option"><input type="radio" name="${q.id}" value="YES" required><span>그렇다</span></label><label class="option"><input type="radio" name="${q.id}" value="MID" required><span>${esc(q.mid)}</span></label><label class="option"><input type="radio" name="${q.id}" value="NO" required><span>아니다</span></label></div></div>`).join('');}
async function initialize(){
  const token=surveyToken();
  if(!/^VZ_[A-Za-z0-9_-]{32,120}$/.test(token)){document.getElementById('loadingCard').innerHTML='<div class="loadingCard">유효하지 않은 상담 설문 링크입니다.<br>학원에 새 링크를 요청해주세요.</div>';return;}
  try{
    const result=await rpc('olli_resolve_consultation_survey_link',{p_survey_token:token});
    if(!result||result.ok!==true)throw new Error(result?.message||'유효하지 않은 상담 설문 링크입니다.');
    const academyName=String(result.academy_name||'').trim();
    document.getElementById('academyName').textContent=academyName;
    if(academyName){document.title=`${academyName} 상담 전 설문`;document.getElementById('footText').textContent=`${academyName} · 상담 자료는 상담과 수업 지도 목적으로만 사용합니다.`;}
    document.getElementById('loadingCard').classList.add('hidden');document.getElementById('formCard').classList.remove('hidden');
  }catch(err){document.getElementById('loadingCard').innerHTML=`<div class="loadingCard">${esc(err?.message||'설문 링크를 확인하지 못했습니다.')}<br>학원에 새 링크를 요청해주세요.</div>`;}
}
document.getElementById('phone4').addEventListener('input',e=>{e.target.value=e.target.value.replace(/\D/g,'').slice(0,4)});
document.getElementById('surveyForm').addEventListener('submit',async e=>{
  e.preventDefault();showError('');const form=e.currentTarget;if(!form.reportValidity())return;
  const token=surveyToken();const answers={};for(const q of QUESTIONS){const checked=form.querySelector(`input[name="${q.id}"]:checked`);if(!checked){showError(`${q.id.slice(1)}번 문항에 답해주세요.`);return}answers[q.id]=checked.value}
  const btn=document.getElementById('submitBtn');btn.disabled=true;btn.textContent='제출 중...';
  try{
    const result=await rpc('olli_submit_consultation_survey_by_token',{p_survey_token:token,p_student_name:document.getElementById('studentName').value.trim(),p_student_age:document.getElementById('studentAge').value.trim(),p_parent_phone4:document.getElementById('phone4').value.trim(),p_survey_version:SURVEY_VERSION,p_answers:answers,p_request_id:createId()});
    if(!result||result.ok!==true)throw new Error(result?.message||'설문을 저장하지 못했습니다.');
    document.getElementById('formCard').classList.add('hidden');document.getElementById('completeCard').classList.add('show');window.scrollTo({top:0,behavior:'smooth'});
  }catch(err){btn.disabled=false;btn.textContent='설문 제출하기';showError(err?.message||'설문을 저장하지 못했습니다. 잠시 후 다시 시도해주세요.');}
});
renderQuestions();initialize();
})();
</script>
</body>
</html>
