<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#f5f6f8">
<meta name="robots" content="noindex,nofollow,noarchive">
<title>상담 전 설문</title>
<link href="https://cdn.jsdelivr.net/npm/pretendard@1.3.9/dist/web/static/pretendard.css" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0}html,body{width:100%;min-width:0;min-height:100%;background:#f5f6f8;color:#17181a}html{font-family:'Pretendard',-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;-webkit-text-size-adjust:100%}body{min-height:100dvh;overflow-x:hidden;padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left)}button,input{font:inherit}.surveyWrap{width:min(760px,calc(100% - 32px));margin:0 auto;padding:clamp(24px,5vw,48px) 0 clamp(48px,8vw,80px)}.brand{font-size:17px;font-weight:850;letter-spacing:.18em;color:#111;margin:0 2px 14px}.academyName{margin:0 2px 12px;color:#777d85;font-size:12px;font-weight:750}.card{width:100%;background:#fff;border:1px solid #e4e6e9;border-radius:28px;padding:clamp(22px,4vw,34px);box-shadow:0 12px 34px rgba(20,24,30,.05)}.title{font-size:clamp(24px,4vw,28px);font-weight:850;letter-spacing:-.055em;line-height:1.28}.intro{margin-top:10px;color:#7f848c;font-size:14px;line-height:1.65}.infoGrid{display:grid;grid-template-columns:minmax(0,1.25fr) minmax(0,.8fr) minmax(0,.9fr);gap:10px;margin-top:26px}.field{min-width:0}.field label{display:block;margin:0 0 7px 3px;font-size:11.5px;font-weight:800;color:#8c9199}.textInput{width:100%;min-width:0;height:48px;border:1px solid #dfe2e6;border-radius:14px;background:#fff;padding:0 14px;font-size:16px;outline:none;color:#111}.textInput:focus{border-color:#a8cff8;box-shadow:0 0 0 3px rgba(22,135,255,.08)}.questions{margin-top:28px;display:grid;gap:14px}.question{padding:18px;border:1px solid #eceef1;border-radius:20px;background:#fff}.questionText{font-size:15px;font-weight:750;line-height:1.55;letter-spacing:-.025em}.options{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;margin-top:13px}.option{position:relative;min-width:0}.option input{position:absolute;opacity:0;pointer-events:none}.option span{width:100%;height:40px;min-width:0;padding:0 8px;border:1px solid #e0e3e7;border-radius:14px;background:#fff;color:#555b63;font-size:13px;font-weight:750;display:flex;align-items:center;justify-content:center;cursor:pointer;white-space:nowrap}.option input:checked+span{background:#111;color:#fff;border-color:#111}.consent{margin-top:22px;padding:16px;border-radius:18px;background:#f7f7f8;display:flex;align-items:flex-start;gap:10px;font-size:12.5px;line-height:1.55;color:#646970;cursor:pointer}.consent input{margin-top:2px;width:18px;height:18px;flex:0 0 auto;accent-color:#111}.submitBtn{width:100%;height:54px;margin-top:18px;border:0;border-radius:17px;background:#111;color:#fff;font-size:15px;font-weight:800;cursor:pointer}.submitBtn:disabled{opacity:.45;cursor:default}.foot{margin-top:14px;text-align:center;font-size:11.5px;color:#a0a4ab;line-height:1.55}.complete{display:none;text-align:center;padding:70px 24px}.complete.show{display:block}.completeIcon{width:56px;height:56px;margin:0 auto 18px;border-radius:50%;background:#111;color:#fff;display:grid;place-items:center;font-size:24px;font-weight:800}.completeTitle{font-size:23px;font-weight:850;letter-spacing:-.05em}.completeText{margin-top:10px;font-size:14px;line-height:1.65;color:#858a92}.errorCard{display:none;margin-bottom:14px;padding:13px 15px;border-radius:15px;background:#fff1f1;color:#b14444;font-size:13px;line-height:1.5}.errorCard.show{display:block}.loadingCard{padding:60px 24px;text-align:center;color:#858a92;font-size:14px;line-height:1.6}.hidden{display:none!important}@media(max-width:760px){.surveyWrap{width:min(100% - 24px,620px);padding-top:22px;padding-bottom:54px}.brand{font-size:15px;margin-bottom:10px}.card{padding:22px 18px;border-radius:24px}.infoGrid{grid-template-columns:1fr;gap:13px;margin-top:22px}.questions{gap:12px;margin-top:22px}.question{padding:16px 14px;border-radius:18px}.questionText{font-size:14.5px}.options{gap:6px}.option span{font-size:12.5px}.consent{padding:14px;font-size:12px}.submitBtn{height:52px}}
</style>
</head>
<body>
<main class="surveyWrap">
  <div class="brand">OLLI</div>
  <div class="academyName" id="academyName"></div>
  <section class="card" id="loadingCard"><div class="loadingCard">학원 전용 설문 링크를 확인하고 있습니다.</div></section>
  <section class="card hidden" id="formCard">
    <h1 class="title">아이를 더 잘 이해하기 위한<br>상담 전 설문</h1>
    <p class="intro">평소 가정에서 보이는 아이의 모습을 편안하게 선택해주세요. 답변은 체험수업에서 아이를 관찰하고 상담 방향을 잡는 데 활용됩니다.</p>
    <div class="errorCard" id="errorCard" role="alert"></div>
    <form id="surveyForm">
      <div class="infoGrid">
        <div class="field"><label for="studentName">학생 이름</label><input class="textInput" id="studentName" maxlength="20" required autocomplete="name" placeholder="예: 김민지"></div>
        <div class="field"><label for="studentAge">나이 또는 학년</label><input class="textInput" id="studentAge" maxlength="12" required autocomplete="off" placeholder="예: 7세 / 초1"></div>
        <div class="field"><label for="phone4">학부모 연락처 뒤 4자리</label><input class="textInput" id="phone4" inputmode="numeric" pattern="[0-9]{4}" maxlength="4" required autocomplete="off" placeholder="1234"></div>
      </div>
      <div class="questions" id="questions"></div>
      <label class="consent"><input id="consent" type="checkbox" required><span>상담 및 수업 관찰을 위해 학생 이름, 나이/학년, 연락처 일부와 설문 응답을 수집·이용하는 데 동의합니다.</span></label>
      <button class="submitBtn" id="submitBtn" type="submit">설문 제출하기</button>
    </form>
    <div class="foot" id="footText">상담 자료는 상담과 수업 지도 목적으로만 사용합니다.</div>
  </section>
  <section class="card complete" id="completeCard" aria-live="polite">
    <div class="completeIcon">✓</div><div class="completeTitle">설문이 제출되었습니다.</div><div class="completeText">소중한 답변 감사합니다.<br>아이의 실제 수업 모습을 함께 관찰한 뒤 상담에서 자세히 안내드리겠습니다.</div>
  </section>
</main>
<script>
(function(){
'use strict';
const SUPABASE_URL='https://fvkxipjwgeyosgnfhdnx.supabase.co';
const SUPABASE_KEY='eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImZ2a3hpcGp3Z2V5b3NnbmZoZG54Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzU1MzAxMDUsImV4cCI6MjA5MTEwNjEwNX0.dqP0V2RIKBLWqXWfwJgCgufpO6gQ_lAZDQ_prOhlNI8';
const SURVEY_VERSION='SURVEY_2026_09';
const QUESTIONS=[
{id:'Q1',text:'아이는 집에서 만들기, 그리기 등의 미술활동을 자주 하나요?',mid:'가끔'},
{id:'Q2',text:'아이는 미술활동을 할 때 관심을 유지하며 오래 몰두하나요?',mid:'보통'},
{id:'Q3',text:'아이는 시작한 미술활동이나 학습활동 등을 끝까지 마무리하려고 하나요?',mid:'보통'},
{id:'Q4',text:'아이는 미술활동이 자신이 원하는 대로 되지 않아 속상해하거나 불편해한 적이 있나요?',mid:'가끔'},
{id:'Q5',text:'아이는 다른 아이의 그림을 따라 그리거나 부러워하는 모습을 보이나요?',mid:'가끔'},
{id:'Q6',text:'아이는 그리고 싶은 것이 있을 때 부모에게 자주 그려달라고 요청하나요?',mid:'가끔'},
{id:'Q7',text:'아이는 게임이나 경쟁 상황에서 졌을 때 속상함을 크게 보이는 편인가요?',mid:'보통'},
{id:'Q8',text:'아이는 새롭거나 어려운 일을 혼자 시도하기보다 부모에게 도움을 요청하는 편인가요?',mid:'보통'},
{id:'Q9',text:'아이는 색·모양·디자인의 차이에 관심을 보이며 자신의 선호를 분명히 표현하는 편인가요?',mid:'보통'},
{id:'Q10',text:'아이는 새로운 환경을 접했을 때 호기심이 많은 편인가요?',mid:'보통'},
{id:'Q11',text:'아이는 새로운 선생님이나 친구, 환경에 적응하는 데 시간이 걸리는 편인가요?',mid:'보통'},
{id:'Q12',text:'아이는 혼자 책을 보거나 부모에게 읽어달라고 요청하는 등 책을 자주 찾는 편인가요?',mid:'가끔'},
{id:'Q13',text:'아이는 책을 읽은 뒤 부모에게 그 책에 관해 이야기하거나 질문하는 편인가요?',mid:'가끔'},
{id:'Q14',text:'아이는 자신이 궁금한 점이나 생각·경험을 질문이나 이야기로 자주 표현하는 편인가요?',mid:'가끔'}];
function esc(v){return String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}
function surveyToken(){return String(new URLSearchParams(location.search).get('survey')||'').trim();}
function createId(){return crypto?.randomUUID?crypto.randomUUID():'survey_'+Date.now()+'_'+Math.random().toString(36).slice(2,10);}
function showError(message){const el=document.getElementById('errorCard');el.textContent=message||'';el.classList.toggle('show',!!message);if(message)el.scrollIntoView({behavior:'smooth',block:'center'});}
async function rpc(name,payload){const res=await fetch(`${SUPABASE_URL}/rest/v1/rpc/${name}`,{method:'POST',headers:{'Content-Type':'application/json','apikey':SUPABASE_KEY,'Authorization':`Bearer ${SUPABASE_KEY}`},body:JSON.stringify(payload||{})});const text=await res.text();let data=null;try{data=text?JSON.parse(text):null}catch(_){data=text}if(!res.ok){const detail=data&&typeof data==='object'?[data.message,data.details,data.hint,data.code].filter(Boolean).join(' / '):String(data||'');throw new Error(detail||`서버 요청 실패 (${res.status})`)}return data;}
function renderQuestions(){document.getElementById('questions').innerHTML=QUESTIONS.map((q,i)=>`<div class="question"><div class="questionText">${i+1}. ${esc(q.text)}</div><div class="options"><label class="option"><input type="radio" name="${q.id}" value="YES" required><span>그렇다</span></label><label class="option"><input type="radio" name="${q.id}" value="MID" required><span>${esc(q.mid)}</span></label><label class="option"><input type="radio" name="${q.id}" value="NO" required><span>아니다</span></label></div></div>`).join('');}
async function initialize(){
  const token=surveyToken();
  if(!/^VZ_[A-Za-z0-9_-]{32,120}$/.test(token)){document.getElementById('loadingCard').innerHTML='<div class="loadingCard">유효하지 않은 상담 설문 링크입니다.<br>학원에 새 링크를 요청해주세요.</div>';return;}
  try{
    const result=await rpc('olli_resolve_consultation_survey_link',{p_survey_token:token});
    if(!result||result.ok!==true)throw new Error(result?.message||'유효하지 않은 상담 설문 링크입니다.');
    const academyName=String(result.academy_name||'').trim();
    document.getElementById('academyName').textContent=academyName;
    if(academyName){document.title=`${academyName} 상담 전 설문`;document.getElementById('footText').textContent=`${academyName} · 상담 자료는 상담과 수업 지도 목적으로만 사용합니다.`;}
    document.getElementById('loadingCard').classList.add('hidden');document.getElementById('formCard').classList.remove('hidden');
  }catch(err){document.getElementById('loadingCard').innerHTML=`<div class="loadingCard">${esc(err?.message||'설문 링크를 확인하지 못했습니다.')}<br>학원에 새 링크를 요청해주세요.</div>`;}
}
document.getElementById('phone4').addEventListener('input',e=>{e.target.value=e.target.value.replace(/\D/g,'').slice(0,4)});
document.getElementById('surveyForm').addEventListener('submit',async e=>{
  e.preventDefault();showError('');const form=e.currentTarget;if(!form.reportValidity())return;
  const token=surveyToken();const answers={};for(const q of QUESTIONS){const checked=form.querySelector(`input[name="${q.id}"]:checked`);if(!checked){showError(`${q.id.slice(1)}번 문항에 답해주세요.`);return}answers[q.id]=checked.value}
  const btn=document.getElementById('submitBtn');btn.disabled=true;btn.textContent='제출 중...';
  try{
    const result=await rpc('olli_submit_consultation_survey_by_token',{p_survey_token:token,p_student_name:document.getElementById('studentName').value.trim(),p_student_age:document.getElementById('studentAge').value.trim(),p_parent_phone4:document.getElementById('phone4').value.trim(),p_survey_version:SURVEY_VERSION,p_answers:answers,p_request_id:createId()});
    if(!result||result.ok!==true)throw new Error(result?.message||'설문을 저장하지 못했습니다.');
    document.getElementById('formCard').classList.add('hidden');document.getElementById('completeCard').classList.add('show');window.scrollTo({top:0,behavior:'smooth'});
  }catch(err){btn.disabled=false;btn.textContent='설문 제출하기';showError(err?.message||'설문을 저장하지 못했습니다. 잠시 후 다시 시도해주세요.');}
});
renderQuestions();initialize();
})();
</script>
</body>
</html>
