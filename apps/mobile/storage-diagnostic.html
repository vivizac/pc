<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>올리 저장공간 진단</title><style>body{font-family:-apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#151515;margin:0;padding:24px;padding-top:max(24px,env(safe-area-inset-top))}main{max-width:560px;margin:auto}h1{font-size:22px}p{color:#666;line-height:1.6}pre{background:#f3f5f6;border-radius:14px;padding:16px;white-space:pre-wrap;overflow-wrap:anywhere;font-size:13px;line-height:1.7}button{background:#171717;color:white;border:0;border-radius:12px;padding:14px 20px;font-size:15px}</style></head><body><main><h1>올리 저장공간 진단</h1><p>이 페이지는 현재 브라우저의 저장공간을 읽기 전용으로 측정합니다. 데이터 삭제나 변경은 하지 않습니다. Safari와 설치형 올리 앱의 저장공간은 다를 수 있습니다.</p><pre id="result">측정 중...</pre><button id="copy">결과 복사</button></main><script>(async function(){var lines=[],items=[],size=function(v){return new Blob([String(v)]).size},kib=function(n){return (n/1024).toFixed(1)+' KiB'};try{for(var i=0;i<localStorage.length;i++){var k=localStorage.key(i);if(k===null)continue;var v=localStorage.getItem(k)||'';var c=/feedback|kcf|kinder|live_session/i.test(k)?'피드백':/schedule|attendance|roster|student/i.test(k)?'출석·학생':/chat|talk|message/i.test(k)?'채팅':/cache|photo|image/i.test(k)?'캐시·이미지':/setting|config|pref/i.test(k)?'설정':'기타';items.push({category:c,bytes:size(k)+size(v)});}}catch(e){lines.push('저장공간 읽기 오류: '+(e.name||'알 수 없음'));}var groups={},total=0;items.forEach(function(x){total+=x.bytes;groups[x.category]=(groups[x.category]||0)+x.bytes;});lines.unshift('localStorage 항목 수: '+items.length,'localStorage 사용량: '+kib(total));try{if(navigator.storage&&navigator.storage.estimate){var e=await navigator.storage.estimate();lines.push('웹 저장공간 추정: '+kib(e.usage||0)+' / 할당량 '+kib(e.quota||0));}else lines.push('웹 저장공간 추정: 지원하지 않음');}catch(e){lines.push('웹 저장공간 추정: 조회 실패');}lines.push('분류별 사용량:');Object.entries(groups).sort(function(a,b){return b[1]-a[1]}).forEach(function(x){lines.push('  '+x[0]+': '+kib(x[1]));});lines.push('용량 상위 10개 항목 (이름·내용 비공개):');items.sort(function(a,b){return b.bytes-a.bytes}).slice(0,10).forEach(function(x,i){lines.push('  '+(i+1)+'. '+x.category+' '+kib(x.bytes));});lines.push('※ 이 결과는 이 페이지를 연 브라우저의 저장공간입니다.');var result=document.getElementById('result');result.textContent=lines.join('\n');document.getElementById('copy').onclick=async function(){try{await navigator.clipboard.writeText(result.textContent);this.textContent='복사 완료';}catch(e){var t=document.createElement('textarea');t.value=result.textContent;document.body.appendChild(t);t.select();document.execCommand('copy');t.remove();this.textContent='복사 시도 완료';}};})();</script></body></html>
