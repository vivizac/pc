name: Fix live schedule sync

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/fix-pickup-student-selection.yml'
      - '.github/tmp/fix_schedule_live_sync.py'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply live schedule sync patch
        run: python3 .github/tmp/fix_schedule_live_sync.py
      - name: Validate JavaScript
        run: |
          node --check pc-timetable-service.js
          node --check pc-timetable.js
      - name: Verify live sync behavior
        run: |
          grep -F "async function loadSyncRevision()" pc-timetable-service.js
          grep -F "const LIVE_SYNC_INTERVAL_MS = 3000;" pc-timetable.js
          grep -F "checkLiveScheduleSync(true)" pc-timetable.js
          grep -F "await syncBeforeScheduleMutation();" pc-timetable.js
      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add pc-timetable-service.js pc-timetable.js
          if git diff --cached --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          git commit -m "fix: 시간표·출석부 다중 PC 자동 동기화"
          git push
