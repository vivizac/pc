name: Remove observation memo polling

on:
  push:
    paths:
      - '.github/workflows/remove-observation-polling.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Remove observation polling
        run: |
          python - <<'PY'
          from pathlib import Path

          p = Path('observation-memo-common.js')
          text = p.read_text(encoding='utf-8')

          text = text.replace("\nconst OLLI_OBSERVATION_MEMO_REMOTE_REFRESH_INTERVAL = 2000;\n", "\n", 1)

          old = """\n  if (!window.__olliObservationMemoRemoteRefreshTimer) {\n    window.__olliObservationMemoRemoteRefreshTimer = setInterval(() => {\n      if (document.hidden) return;\n      if (!isObservationMemoScreenActive()) return;\n      if (hasObservationMemoDirtyChanges()) return;\n      if (isObservationMemoAutoSaveBlocked()) return;\n      requestObservationMemoCrossDeviceRefresh();\n    }, OLLI_OBSERVATION_MEMO_REMOTE_REFRESH_INTERVAL);\n  }\n"""
          if old not in text:
              raise SystemExit('observation polling block not found')
          text = text.replace(old, '\n', 1)

          # Safety assertions: realtime/focus recovery must remain, polling must be gone.
          assert "window.addEventListener('olli:realtime-change'" in text
          assert "event?.detail?.domain !== 'observation'" in text
          assert "window.addEventListener('focus', requestObservationMemoCrossDeviceRefresh)" in text
          assert "window.addEventListener('online', requestObservationMemoCrossDeviceRefresh)" in text
          assert "document.addEventListener('visibilitychange'" in text
          assert 'OLLI_OBSERVATION_MEMO_REMOTE_REFRESH_INTERVAL' not in text
          assert '__olliObservationMemoRemoteRefreshTimer' not in text

          p.write_text(text, encoding='utf-8')

          status = Path('OLLI_REALTIME_STATUS.md')
          s = status.read_text(encoding='utf-8')
          old_note = "사용자가 PC·Phone 동작 확인 완료를 보고했다. 이번 시간표 작업에서는 관찰노트 저장 코어, Phone 관찰노트 adapter, CAS, 세션 복구, 2초 polling을 변경하지 않았다. 이 기록은 사용자 확인이며 이번 작업의 실기기 재시험을 뜻하지 않는다."
          new_note = "사용자가 PC·Phone Realtime 동작 확인을 완료한 뒤 관찰노트의 기존 2초 polling을 제거했다. 관찰노트는 observation Realtime 신호를 기준으로 최신 서버 원본을 다시 읽고, focus·online·visibility 복귀 시 1회 재확인한다. 저장 코어, CAS, 세션 복구는 유지한다."
          if old_note in s:
              s = s.replace(old_note, new_note, 1)
          status.write_text(s, encoding='utf-8')
          PY

      - name: Syntax check
        run: node --check observation-memo-common.js

      - name: Verify realtime remains and polling is removed
        run: |
          grep -q "olli:realtime-change" observation-memo-common.js
          grep -q "domain !== 'observation'" observation-memo-common.js
          if grep -q "__olliObservationMemoRemoteRefreshTimer\|OLLI_OBSERVATION_MEMO_REMOTE_REFRESH_INTERVAL" observation-memo-common.js; then
            echo 'Observation polling still present'
            exit 1
          fi

      - name: Commit change
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add observation-memo-common.js OLLI_REALTIME_STATUS.md
          if git diff --cached --quiet; then
            echo 'No changes to commit'
            exit 0
          fi
          git commit -m 'Remove observation memo polling and rely on Realtime'
          git push origin HEAD:main
